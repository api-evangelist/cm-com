openapi: 3.2.0
info:
  title: Channels Verified Sms API
  description: Check channel availability and manage onboarding for SMS, WhatsApp, RCS, and other supported channels.
  version: v1
  license:
    name: Proprietary
    url: https://www.cm.com
servers:
- url: https://api.cm.com
  description: Production Server
security:
- ProductToken: []
tags:
- name: VerifiedSms
paths:
  /channels/v1/accounts/{accountId}/vsms/{channelRequestId}/account:
    get:
      tags:
      - VerifiedSms
      summary: Gets the account asynchronous
      operationId: VerifiedSms_GetVSmsAccountAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.vSms.ApiVSmsAccount'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.vSms.ApiVSmsAccount'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.vSms.ApiVSmsAccount'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.vSms.ApiVSmsAccount'
  /channels/v1/accounts/{accountId}/vsms/{channelRequestId}/account/forminput:
    get:
      tags:
      - VerifiedSms
      summary: Gets the account form input asynchronous
      operationId: VerifiedSms_GetVSmsAccountFormInputAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiChannelRequestFormInputResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiChannelRequestFormInputResponse'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiChannelRequestFormInputResponse'
            multipart/form-data:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiChannelRequestFormInputResponse'
  /channels/v1/accounts/{accountId}/vsms/{channelRequestId}/account/{vSmsAccountId}/forminput:
    put:
      tags:
      - VerifiedSms
      summary: Adds the account form input asynchronous
      operationId: VerifiedSms_AddVSmsAccountFormInputAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: vSmsAccountId
        in: path
        description: The v SMS account identifier.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        $ref: '#/components/requestBodies/CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequestArray'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.vSms.ApiVSmsAccount'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.vSms.ApiVSmsAccount'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.vSms.ApiVSmsAccount'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.vSms.ApiVSmsAccount'
components:
  requestBodies:
    CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequestArray:
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequest'
        text/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequest'
        text/xml:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequest'
        multipart/form-data:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequest'
        application/x-www-form-urlencoded:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequest'
      description: The form input.
      required: true
  schemas:
    CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequest:
      type: object
      properties:
        formElementId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        inputValue:
          type: string
    CM.Platform.Channels.Models.ChannelTypes.vSms.ApiVSmsAccount:
      required:
      - id
      - accountId
      - channelRequestId
      - isPending
      - createdOnUtc
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        accountId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        channelRequestId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        isPending:
          type: boolean
        cancelledOnUtc:
          format: date-time
          type: string
        fulfilledOnUtc:
          format: date-time
          type: string
        createdOnUtc:
          format: date-time
          type: string
    CM.Platform.Channels.Models.RequestForms.ApiChannelRequestFormInputResponse:
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        channelCategoryRequestID:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        formElementId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        inputValue:
          type: string
        createdOnUtc:
          format: date-time
          type: string
  securitySchemes:
    ProductToken:
      type: apiKey
      description: Product token for authentication. Obtain from your CM.com dashboard under Messaging > Product Tokens.
      name: producttoken
      in: header
