openapi: 3.2.0
info:
  title: Payments Gateway Checkout API
  description: Common payments API
  version: 1.27.22
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: /api/v1
security:
- oAuth2ClientCredentials: []
tags:
- name: Checkout
  description: Checkout endpoints for using the CM hosted checkout.
  externalDocs:
    url: https://developers.cm.com/payments-platform
paths:
  /paymentmethods/checkout/v1/transactions:
    post:
      operationId: createCheckout
      description: Create a new checkout. After receiving a HTTP status 201 you have to redirect the consumer to the url given in **action.redirect.url**. The **id** field in the response can be used in future calls as **transactionId** to reference this transaction (for instance in a refund).
      tags:
      - Checkout
      summary: Create checkout
      requestBody:
        description: Create checkout
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckout'
            examples:
              standardCheckout:
                $ref: '#/components/examples/standardCheckout'
              checkoutSinglePaymentmethod:
                $ref: '#/components/examples/checkoutSinglePaymentmethod'
              checkoutWithWebhook:
                $ref: '#/components/examples/standardCheckoutWithWebhook'
              klarnaCheckout:
                $ref: '#/components/examples/klarnaCheckout'
      responses:
        '201':
          description: The iDEAL transaction was created successfully. The response contains the transaction details and a redirect URL to complete the payment.
          headers:
            Digest:
              $ref: '#/components/headers/Digest'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCheckout-2'
              examples:
                standardCheckout:
                  $ref: '#/components/examples/standardCheckout-2'
                standardCheckoutWithWebhook:
                  $ref: '#/components/examples/standardCheckoutWithWebhook-2'
                klarnaCheckout:
                  $ref: '#/components/examples/klarnaCheckout-2'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/checkout/v1/transactions/{transactionId}:
    get:
      operationId: getCheckout
      description: Retrieve details for an existing Checkout transaction. This endpoint must be used to obtain the status for a transaction.
      tags:
      - Checkout
      summary: Fetch payment
      parameters:
      - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: The Checkout was created successfully. The response contains the transaction details and a redirect URL to load checkout.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CreateCheckout-2'
                - $ref: '#/components/schemas/CheckoutPayments'
              examples:
                open:
                  $ref: '#/components/examples/standardCheckout-2'
                multipleAttempts:
                  $ref: '#/components/examples/standardCheckoutMultipleAttempts'
                klarnaSuccess:
                  $ref: '#/components/examples/klarnaSuccessCheckout'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/checkout/v1/transactions/{transactionId}/refunds:
    post:
      operationId: createCheckoutRefund
      description: Create a refund for a previous made Credit Card transaction. A payment must be fully processed, captured and there shouldn't exist a chargeback to be able to refund them.
      tags:
      - Checkout
      summary: Refund payment
      parameters:
      - $ref: '#/components/parameters/TransactionId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refund'
      responses:
        '201':
          description: The Checkout refund was created successfully.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CreateCheckout-2'
                - $ref: '#/components/schemas/CheckoutPayments'
              examples:
                refund:
                  $ref: '#/components/examples/refundCheckout'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
    get:
      operationId: getCheckoutRefund
      tags:
      - Checkout
      summary: Fetch checkout refund
      description: Retrieve refunds for a Checkout transaction.
      parameters:
      - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          $ref: '#/components/responses/RefundsResponse'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/checkout/v1/transactions/{transactionId}/chargebacks:
    get:
      operationId: getCheckoutChargebacks
      description: Retrieve chargebacks for an existing Checkout transaction.
      tags:
      - Checkout
      summary: Fetch chargebacks
      parameters:
      - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          $ref: '#/components/responses/ChargebacksResponse'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    TransactionWithoutOrderIdLanguageRefundsAndExpiresAt:
      allOf:
      - $ref: '#/components/schemas/TransactionWithoutOrderIdLanguageRefundsCreatedAtAndExpiresAt'
      - type: object
        required:
        - createdAt
        properties:
          createdAt:
            $ref: '#/components/schemas/Datetime'
            description: ISO 8601 date and time when the transaction was created.
    TransactionWebhook:
      allOf:
      - $ref: '#/components/schemas/BaseWebhook'
      - type: object
        properties:
          events:
            items:
              description: '* `STATUS_CHANGE` - Triggered when the status of a transaction changes.

                * `REFUND_STATUS` - Triggered when a transaction receives an update on one of its requested refunds.

                * `FINALSTATUS` - This value is deprecated and shouldn''t be used anymore. Use `STATUS_CHANGE` instead.

                '
              oneOf:
              - $ref: '#/components/schemas/StatusChangeEvent'
              - $ref: '#/components/schemas/RefundStatusEvent'
              - $ref: '#/components/schemas/FinalStatusEvent'
              example: STATUS_CHANGE
    KlarnaDescription:
      maxLength: 100
    Reference:
      description: The clients identifier. This value will be sent in the webhook payload alongside the ID you receive as part of the response of a transaction.
      type: string
      minLength: 1
      maxLength: 255
      example: '20210623130413'
    CheckoutConsumer:
      allOf:
      - $ref: '#/components/schemas/Consumer'
      - type: object
        properties:
          givenName:
            type: string
            maxLength: 35
            description: First name of the consumer.
          middleName:
            type: string
            maxLength: 35
            description: Middle name of the consumer.
          familyName:
            type: string
            maxLength: 35
            description: Last name of the consumer.
          address:
            $ref: '#/components/schemas/AddressWithStateAndAdditionalData'
    Country:
      description: Country of the consumer (ISO-3166)
      type: string
      example: NL
      minLength: 2
      maxLength: 2
    ChargebacksList:
      description: Details of all chargebacks belonging to a transaction.
      type: object
      required:
      - chargebacks
      properties:
        chargebacks:
          type: array
          items:
            $ref: '#/components/schemas/ChargebackDetails'
    CreateCheckout-2:
      allOf:
      - $ref: '#/components/schemas/TransactionWithoutOrderId'
      - type: object
        required:
        - status
        - action
        - expiresAt
        - merchantOrderReference
        properties:
          merchantOrderReference:
            $ref: '#/components/schemas/MerchantOrderReference'
          consumer:
            $ref: '#/components/schemas/CheckoutConsumer'
          status:
            description: The status of the transaction.
            oneOf:
            - $ref: '#/components/schemas/StatusOpen'
            - $ref: '#/components/schemas/StatusSuccess'
            - $ref: '#/components/schemas/StatusCancelled'
            - $ref: '#/components/schemas/StatusExpired'
            - $ref: '#/components/schemas/StatusFailure'
            - $ref: '#/components/schemas/StatusAuthorized'
            - $ref: '#/components/schemas/StatusPending'
          action:
            type: object
            description: Next action to be performed by merchant (or consumer) to complete the payment.
            properties:
              redirect:
                $ref: '#/components/schemas/RedirectAction'
              qrcode:
                $ref: '#/components/schemas/CheckoutQRCodeAction'
          paymentMethods:
            $ref: '#/components/schemas/PaymentMethods'
          orderItems:
            $ref: '#/components/schemas/OrderItems'
          maxRetries:
            $ref: '#/components/schemas/MaxRetries'
          refunds:
            $ref: '#/components/schemas/Refunds'
    GenderlessConsumer:
      type: object
      properties:
        email:
          $ref: '#/components/schemas/Email'
        phone:
          $ref: '#/components/schemas/Phone'
        dateOfBirth:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: '1990-05-23'
          description: Date of birth in ISO 8601 format (YYYY-MM-DD).
    CheckoutQRCodeAction:
      type: object
      required:
      - url
      description: Action to be performed by the consumer to complete the payment by scanning a QR code that leads to the same hosted checkout session as the redirect action.
      properties:
        url:
          description: URL to a QR code image encoding the hosted checkout session URL, to be scanned by the consumer. Append a `.png`, `.jpg`, or `.svg` extension to select the image output format; if omitted or unrecognized, `png` is returned.
          type: string
          format: url
          example: https://checkout.gateway.acceptance.cmpayments.nl/checkout/qr/1da50859-59ad-4d7d-a6ac-8554a2f981bc
    ChargebackStatus:
      description: '* `CHARGED` - The transaction has been charged back by the issuing bank.

        '
      type: string
      enum:
      - CHARGED
      example: CHARGED
    StatusSuccess:
      description: The transaction has been successfully paid.
      type: string
      format: enum
      enum:
      - SUCCESS
      example: SUCCESS
    ReturnUrls:
      type: object
      description: 'URLs where the Consumer is redirected to after completing the transaction at its issuing bank or at the chosen payment method.


        With this object we can redirect consumer to a dedicated page per payment result status. Either this object or the returnUrl field is mandatory.'
      required:
      - success
      - cancelled
      - expired
      - failed
      properties:
        success:
          type: string
          format: url
          maxLength: 2000
          example: https://yourdomain.tld/order/payment-success.html
        cancelled:
          type: string
          format: url
          maxLength: 2000
          example: https://yourdomain.tld/order/payment-cancelled.html
        expired:
          type: string
          format: url
          maxLength: 2000
          example: https://yourdomain.tld/order/payment-expired.html
        failed:
          type: string
          format: url
          maxLength: 2000
          example: https://yourdomain.tld/order/payment-failed.html
    ItemName:
      description: A human readable name of the item.
      type: string
      maxLength: 50
      example: Kingston microSD 32GB
    StatusFailure:
      description: The transaction has failed.
      type: string
      format: enum
      enum:
      - FAILURE
      example: FAILURE
    Refund:
      description: Refund an already successfully processed payment.
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
          description: 'Denomination in the smallest currency subunit, as for example euro cents. If empty, the refund amount will be the remaining available amount of the transaction (i.e., total payment amount minus already refunded amounts minus the amounts of the pending refund requests).

            '
        reason:
          $ref: '#/components/schemas/RefundReason'
    PaymentWithoutDescriptionExpiresAtLanguageAndWebhooks:
      allOf:
      - $ref: '#/components/schemas/ReturnURLOneOf'
      - type: object
        required:
        - reference
        - amount
        properties:
          reference:
            $ref: '#/components/schemas/Reference'
          amount:
            $ref: '#/components/schemas/Amount'
          currency:
            $ref: '#/components/schemas/Currency'
    RefundStatusEvent:
      description: '* `REFUND_STATUS` - Triggered when a transaction receives an update on one of its requested refunds.

        '
      type: string
      enum:
      - REFUND_STATUS
      example: REFUND_STATUS
    CreateCheckout:
      allOf:
      - $ref: '#/components/schemas/Payment'
      - type: object
        required:
        - description
        - merchantOrderReference
        - language
        properties:
          expiresAt:
            allOf:
            - $ref: '#/components/schemas/Datetime'
            - description: ISO 8601 date and time. If a transaction is not finalized before this time the status becomes EXPIRED. If left empty, the value defaults to 30 mins.
          amount:
            description: 'Denomination in the smallest currency subunit, as for example eurocents.

              Ignored (although required) for requests that include items (e.g. Klarna). In this cases the total amount is calculated internally using item prices.'
          merchantOrderReference:
            $ref: '#/components/schemas/MerchantOrderReference'
          consumer:
            $ref: '#/components/schemas/CheckoutConsumer'
          maxRetries:
            $ref: '#/components/schemas/MaxRetries'
          paymentMethods:
            $ref: '#/components/schemas/PaymentMethods'
          orderItems:
            $ref: '#/components/schemas/OrderItems'
          webhooks:
            $ref: '#/components/schemas/TransactionWebhooksWithChargeback'
          description:
            maxLength: 35
    TransactionWithoutOrderId:
      allOf:
      - $ref: '#/components/schemas/TransactionWithoutOrderIdLanguageRefundsAndExpiresAt'
      - type: object
        required:
        - language
        - expiresAt
        properties:
          language:
            $ref: '#/components/schemas/Language'
          expiresAt:
            $ref: '#/components/schemas/Datetime'
            description: ISO 8601 date and time. If a transaction is not finalized before this time the status becomes **EXPIRED**.
          refunds:
            $ref: '#/components/schemas/Refunds'
    ReturnURLOneOf:
      oneOf:
      - type: object
        required:
        - returnUrls
        properties:
          returnUrls:
            $ref: '#/components/schemas/ReturnUrls'
      - type: object
        required:
        - returnUrl
        properties:
          returnUrl:
            $ref: '#/components/schemas/ReturnUrl'
    CheckoutPayments:
      type: object
      properties:
        payments:
          type: array
          description: List of payments created for this checkout.
          items:
            type: object
            description: Payment details. Multiple payment attempts will be returned.
            required:
            - id
            - type
            - status
            - createdAt
            properties:
              id:
                $ref: '#/components/schemas/TransactionId'
              type:
                type: string
                description: The payment method used for this payment attempt.
                enum:
                - apple_pay
                - bancontact
                - bank_transfer
                - creditcard
                - google_pay
                - ideal
                - klarna
                - paypal
                - in3
              status:
                description: The status of the payment attempt.
                oneOf:
                - $ref: '#/components/schemas/StatusOpen'
                - $ref: '#/components/schemas/StatusSuccess'
                - $ref: '#/components/schemas/StatusCancelled'
                - $ref: '#/components/schemas/StatusExpired'
                - $ref: '#/components/schemas/StatusFailure'
                - $ref: '#/components/schemas/StatusAuthorized'
                - $ref: '#/components/schemas/StatusPending'
              createdAt:
                $ref: '#/components/schemas/Datetime'
    Phone:
      description: The phonenumber of the consumer (E.164 format).
      type: string
      maxLength: 16
      example: '+31695613259'
    Item:
      description: 'Item object that can be used to provide details of the items in the order.

        This is only used by payment methods that support it, like Klarna and Riverty.'
      type: object
      required:
      - code
      - unitPrice
      - quantity
      - vatAmount
      - vatRate
      properties:
        code:
          description: Merchant Product identification. Each item code must be unique per transaction.
          type: string
          minLength: 1
          maxLength: 50
          example: SDC4/32GB-2ADP
        description:
          description: A human readable description of the item.
          $ref: '#/components/schemas/Description'
        unitPrice:
          description: Unit price (including VAT) of the item, specified in the smallest currency subunit, as for example euro cents.
          $ref: '#/components/schemas/Amount'
        quantity:
          description: The number of items of this type.
          type: integer
          minimum: 1
          maximum: 1000000000
          example: 2
        vatAmount:
          description: 'Total VAT amount of the orderline, specified in the smallest currency subunit as for example euro cents.

            '
          $ref: '#/components/schemas/Amount'
        vatRate:
          description: 'Percentage of VAT applied.

            Only the first decimal value will be taken into account, the rest will be ignored.

            '
          type: number
          minimum: 0
          maximum: 99.9
          example: 20
          multipleOf: 0.1
    Items:
      description: 'Items included in the order. We request both values ''vatAmount'' and ''vatRate'' to prevent errors.

        '
      type: array
      minItems: 1
      maxItems: 512
      items:
        allOf:
        - $ref: '#/components/schemas/Item'
        - type: object
          properties:
            name:
              $ref: '#/components/schemas/ItemName'
            description:
              $ref: '#/components/schemas/KlarnaDescription'
            type:
              description: 'The type of order line item. Used by Klarna to classify the order line.

                '
              type: string
              format: enum
              enum:
              - PHYSICAL
              - DIGITAL
              - DISCOUNT
              - GIFT_CARD
              - STORE_CREDIT
              - SHIPPING_FEE
              - SALES_TAX
              - SURCHARGE
              example: PHYSICAL
    RefundStatus:
      description: '* `SUCCESS`    - Refund has succeeded.

        * `PENDING`    - Refund is waiting to be processed.

        * `FAILURE`    - Refund has failed.

        * `CANCELLED`  - Refund has been cancelled.

        '
      type: string
      enum:
      - SUCCESS
      - PENDING
      - FAILURE
      - CANCELLED
      example: SUCCESS
    StatusCancelled:
      description: The transaction has been cancelled by the consumer.
      type: string
      format: enum
      enum:
      - CANCELLED
      example: CANCELLED
    ChargebackDetails:
      description: Details of a chargeback.
      type: object
      required:
      - id
      - transactionId
      - amount
      - currency
      - status
      - chargebackDate
      - created
      - updated
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        transactionId:
          $ref: '#/components/schemas/Uuid'
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        reason:
          description: The reason for the chargeback as reported by the issuing bank.
          type: string
          example: Fraudulent transaction
        status:
          $ref: '#/components/schemas/ChargebackStatus'
        chargebackDate:
          $ref: '#/components/schemas/Datetime'
          description: Date and time when the chargeback was registered by the issuing bank.
        created:
          $ref: '#/components/schemas/Datetime'
        updated:
          $ref: '#/components/schemas/Datetime'
    TransactionWebhookWithChargeback:
      allOf:
      - $ref: '#/components/schemas/BaseWebhook'
      - type: object
        properties:
          events:
            items:
              description: '* `STATUS_CHANGE` - Triggered when the status of a transaction changes.

                * `REFUND_STATUS` - Triggered when a transaction receives an update on one of its requested refunds.

                * `CHARGEBACK_STATUS` - Triggered when a transaction receives an update on one of its chargebacks.

                * `FINALSTATUS` - This value is deprecated and shouldn''t be used anymore. Use `STATUS_CHANGE` instead.

                '
              oneOf:
              - $ref: '#/components/schemas/StatusChangeEvent'
              - $ref: '#/components/schemas/RefundStatusEvent'
              - $ref: '#/components/schemas/ChargebackStatusEvent'
              - $ref: '#/components/schemas/FinalStatusEvent'
              example: STATUS_CHANGE
    Language:
      description: Preferred language for the user interface as ISO 639-1 code. If the provided language is not supported the default will be used. Commonly supported languages are Dutch (nl) and English (en).
      type: string
      default: nl
      example: nl
      minLength: 2
      maxLength: 2
    PaymentMethods:
      type: array
      description: List of payment methods used in the checkout. If not provided all available payment methods will be shown.
      items:
        type: string
        enum:
        - apple_pay
        - bancontact
        - bank_transfer
        - creditcard
        - google_pay
        - ideal
        - klarna
        - paypal
        - in3
    AddressWithStateAndAdditionalData:
      allOf:
      - $ref: '#/components/schemas/AddressWithoutMandatoryCountry'
      - type: object
        properties:
          state:
            description: The state or province of the consumer's billing address associated with the card used for this purchase. The value must be the country subdivision code (e.g., 'NH') or the official state/province name (e.g., 'Noord Holland') as defined in ISO 3166-2.
            type: string
            maxLength: 40
            example: Noord-Holland
          additionalData:
            description: The consumers house number addition.
            type: string
            maxLength: 35
            example: Right-hand portal
    Payment:
      allOf:
      - $ref: '#/components/schemas/PaymentWithoutDescriptionAndExpiresAt'
      - type: object
        required:
        - description
        properties:
          description:
            $ref: '#/components/schemas/Description'
          expiresAt:
            $ref: '#/components/schemas/Datetime'
            description: ISO 8601 date and time. If a transaction is not finalized before this time the status becomes **EXPIRED**.
    Amount:
      description: Denomination in the smallest currency subunit, as for example euro cents.
      type: integer
      minimum: 1
      maximum: 99999999
      example: 1200
    ReturnUrl:
      description: 'URL where the Consumer is redirected to after completing the transaction at its issuing bank or at the chosen payment method.


        With this implementation you are responsible to fetch the payment status and incorporated into your site.'
      type: string
      format: url
      maxLength: 2000
      example: https://yourdomain.tld/order/return?orderID=order123
    ChargebackStatusEvent:
      description: '* `CHARGEBACK_STATUS` - Triggered when a transaction receives an update on one of its chargebacks.

        '
      type: string
      enum:
      - CHARGEBACK_STATUS
      example: CHARGEBACK_STATUS
    Description:
      description: Description of the underlying value or reason of the payment.
      type: string
      maxLength: 255
      example: Order at yourdomain.tld
    StatusExpired:
      description: The transaction has expired.
      type: string
      format: enum
      enum:
      - EXPIRED
      example: EXPIRED
    AddressWithoutMandatoryCountry:
      type: object
      description: The consumers address.
      properties:
        street:
          description: The consumers street name.
          type: string
          maxLength: 100
          example: Rustenburgerlaan
        houseNumber:
          description: The consumers house number.
          type: string
          maxLength: 35
          example: '25'
        postalCode:
          description: The consumers postal code.
          type: string
          maxLength: 35
          example: 2012AL
        city:
          description: The consumers city.
          type: string
          maxLength: 35
          example: Haarlem
        countryCode:
          $ref: '#/components/schemas/Country'
    PaymentWithoutDescriptionAndExpiresAt:
      allOf:
      - $ref: '#/components/schemas/PaymentWithoutDescriptionExpiresAtAndWebhooks'
      - type: object
        properties:
          webhooks:
            $ref: '#/components/schemas/TransactionWebhooks'
    BaseWebhook:
      type: object
      description: A single webhook object consists out of an URL to which we need to send the occurred event together with the event that needs to trigger the webhook call.
      required:
      - url
      - events
      properties:
        url:
          description: The URL the request must be send to.
          type: string
          format: url
          example: https://yourdomain.tld/webhooks?purchaseId=order123
        events:
          description: Type of events that will trigger a webhook.
          type: array
          minItems: 1
          items:
            type: string
    MaxRetries:
      description: 'Maximum number of payment attempts allowed for this checkout order.

        **Values:**

        - **null or omitted**: Defaults to 0 (no retry limit, skip UI with single payment method)

        - **0**: No retry limit enforcement. When combined with a single payment method, the hosted checkout will skip the payment method selection screen and redirect the customer directly to the payment method (e.g., iDEAL, PayPal). Useful for external integrations that have their own checkout UI.

        - **1-255**: Enforces retry limit. After exceeding this number of failed payment attempts, the checkout will be locked out with status `LOCKED_OUT`. The payment method selection screen will be shown normally, even with a single payment method.


        **Use Cases:**

        - **External integrations**: Set to 0 to enable seamless redirect from external checkout to payment provider

        - **Fraud prevention**: Set to 3-5 to limit retry attempts and prevent abuse

        - **Standard checkout**: Set to 10-255 for generous retry limits with fraud protection


        **Important**: `maxRetries=0` does NOT mean "lock out immediately". It means "allow unlimited retries without lockout enforcement".

        '
      type: integer
      minimum: 0
      maximum: 255
      example: 10
    TransactionWithoutOrderIdLanguageRefundsCreatedAtAndExpiresAt:
      allOf:
      - $ref: '#/components/schemas/ReturnURLOneOf'
      - type: object
        required:
        - id
        - reference
        - amount
        - currency
        - status
        - description
        properties:
          id:
            $ref: '#/components/schemas/TransactionId'
          reference:
            $ref: '#/components/schemas/Reference'
          amount:
            $ref: '#/components/schemas/Amount'
          currency:
            $ref: '#/components/schemas/Currency'
          webhooks:
            $ref: '#/components/schemas/TransactionWebhooks'
          description:
            $ref: '#/components/schemas/Description'
    RefundReason:
      description: 'The description for the refund for administrative purpose only. This reason will be visible in the portal.

        '
      type: string
      example: Refund required by consumer.
      maxLength: 255
    RefundsList:
      description: Details of all refunds belonging to a transaction.
      type: object
      required:
      - refunds
      properties:
        refunds:
          type: array
          items:
            $ref: '#/components/schemas/RefundDetails'
    TransactionId:
      description: ID received in the POST transaction response root object, which can be used in up following calls like refunds or cancellations as transactionId.
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      example: 8db1e7fa-ba8a-4189-92fd-67a20217443d
    StatusPending:
      description: The transaction is pending, meaning it could not be completed yet; waiting for something.
      type: string
      format: enum
      enum:
      - PENDING
      example: PENDING
    StatusChangeEvent:
      description: '* `STATUS_CHANGE` - Triggered when the status of a transaction changes.

        '
      type: string
      enum:
      - STATUS_CHANGE
      example: STATUS_CHANGE
    RefundDetails:
      description: Details of a refund.
      type: object
      required:
      - id
      - transactionId
      - amount
      - reason
      - status
      - created
      - updated
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        transactionId:
          $ref: '#/components/schemas/Uuid'
        amount:
          $ref: '#/components/schemas/Amount'
        reason:
          $ref: '#/components/schemas/RefundReason'
        status:
          $ref: '#/components/schemas/RefundStatus'
        created:
          $ref: '#/components/schemas/Datetime'
        updated:
          $ref: '#/components/schemas/Datetime'
    OrderItems:
      $ref: '#/components/schemas/Items'
      description: 'Items included in the order. Required field for the following payment methods: Klarna, Riverty. We request both values ''vatAmount'' and ''vatRate'' to prevent errors.'
    Uuid:
      description: Unique identifier
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      example: 8db1e7fa-ba8a-4189-92fd-67a20217443d
    PaymentWithoutDescriptionExpiresAtAndWebhooks:
      allOf:
      - $ref: '#/components/schemas/PaymentWithoutDescriptionExpiresAtLanguageAndWebhooks'
      - type: object
        properties:
          language:
            $ref: '#/components/schemas/Language'
    FinalStatusEvent:
      description: '* `FINALSTATUS` - This value is deprecated and shouldn''t be used anymore. Use `STATUS_CHANGE` instead.

        '
      type: string
      enum:
      - FINALSTATUS
      example: FINALSTATUS
    Gender:
      description: The consumers gender.
      type: string
      format: enum
      enum:
      - m
      - f
      - 'null'
      default: null
    TransactionWebhooksWithChargeback:
      description: 'Array of webhooks that enables receiving a web request once a given event occurs. We won''t do preventive rate-limiting in order to have the highest throughput possible. However, we will honor 429 (Too-many-requests) responses per callback. We use the Retry-After header to retry after a certain period. If the header was not set we use our default exponential delay implementation.

        '
      type: array
      items:
        $ref: '#/components/schemas/TransactionWebhookWithChargeback'
      example:
      - url: https://yourdomain.tld/payment-webhooks?purchaseId=order123
        events:
        - STATUS_CHANGE
    RedirectAction:
      description: URL where consumer should be redirected to by the merchant to perform the payment.
      type: object
      required:
      - url
      properties:
        url:
          description: URL where consumer should be redirected to by the merchant to perform the payment.
          type: string
          format: url
          example: https://issuer.tld/ideal/start?trxid=213981209381209390821&random=wreq0dq90vgq0ew923123
    StatusOpen:
      description: The transaction is open and can be paid.
      type: string
      format: enum
      enum:
      - OPEN
      example: OPEN
    StatusAuthorized:
      description: The transaction has been authorized.
      type: string
      format: enum
      enum:
      - AUTHORIZED
      example: AUTHORIZED
    Currency:
      description: ISO 4217 currency code.
      type: string
      minLength: 3
      maxLength: 3
      default: EUR
      example: EUR
    Datetime:
      type: string
      format: date-time
      minLength: 20
      example: '2006-01-02T15:04:05Z'
      description: ISO 8601 date and time.
    TransactionWebhooks:
      description: 'Array of webhooks that enables receiving a web request once a given event occurs. We won''t do preventive rate-limiting in order to have the highest throughput possible. However, we will honor 429 (Too-many-requests) responses per callback. We use the Retry-After header to retry after a certain period. If the header was not set we use our default exponential delay implementation.

        '
      type: array
      items:
        $ref: '#/components/schemas/TransactionWebhook'
      example:
      - url: https://yourdomain.tld/payment-webhooks?purchaseId=order123
        events:
        - STATUS_CHANGE
    Email:
      description: The email address of the consumer.
      type: string
      format: email
      example: john.doe@email.tld
    Consumer:
      allOf:
      - $ref: '#/components/schemas/GenderlessConsumer'
      - type: object
        properties:
          gender:
            $ref: '#/components/schemas/Gender'
    MerchantOrderReference:
      type: string
      maxLength: 35
      description: Unique identifier, as known by the merchant. This value will end up in the payments portal.
    Refunds:
      description: Details of refunds for a transaction
      type: object
      required:
      - refundedAmount
      - refundedPendingAmount
      properties:
        refundedAmount:
          description: Amount in the smallest currency subunit, as for example euro cents, that has already been refunded.
          type: integer
          minimum: 0
          maximum: 99999999
          example: 300
        refundedPendingAmount:
          description: Amount in the smallest currency subunit, as for example euro cents, that has been requested to be refunded.
          type: integer
          minimum: 1
          maximum: 99999999
          example: 100
  responses:
    UserError:
      description: The user input was incorrect or something illegal was attempted (eg. using a service without having that service configured for the user, or not being authorized)
      content:
        application/json:
          schema:
            type: object
            required:
            - id
            - message
            properties:
              id:
                $ref: '#/components/schemas/Uuid'
              message:
                type: string
                example: no authorization methods provided
    ChargebacksResponse:
      description: Details of all chargebacks belonging to a transaction.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChargebacksList'
    InternalError:
      description: Internal server error. This can be caused by an unresponsive backend
      content:
        application/json:
          schema:
            type: object
            required:
            - id
            - message
            properties:
              id:
                $ref: '#/components/schemas/Uuid'
              message:
                type: string
                example: Service Unavailable
    RefundsResponse:
      description: Details of all refunds belonging to a transaction.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefundsList'
