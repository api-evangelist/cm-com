      tags:
      - ChannelConfiguration
      summary: Gets all configurations for a channel
      operationId: ChannelConfiguration_GetChannelConfigurationsAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelId
        in: path
        description: The channel identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.Channels.ChannelConfiguration.ApiChannelConfigurations'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.Channels.ChannelConfiguration.ApiChannelConfigurations'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.Channels.ChannelConfiguration.ApiChannelConfigurations'
