  description: User authentication and session management
paths:
  /entrance/v1.0/login:
    post:
      operationId: AuthController_login_v1.0
      parameters:
      - name: X-ENMA-APP-NAME
        required: true
        in: header
        schema:
          type: string
      - name: X-ENMA-DEVICE-ID
        required: true
        in: header
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Login to user account, provide optional organisationUuid or entrancePlanUuid to login directly to this entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      summary: Login to user account
      tags:
      - Authentication
    servers:
    - url: https://api.cm.com
  /entrance/v1.0/login/verify-username:
    post:
      operationId: AuthController_verifyUsername_v1.0
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUsernameDto'
      responses:
        '200':
          description: ''
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      summary: Verify username for login
      tags:
      - Authentication
    servers:
    - url: https://api.cm.com
