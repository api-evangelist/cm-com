openapi: 3.2.0
info:
  title: Channels Rich Content Services API
  description: Check channel availability and manage onboarding for SMS, WhatsApp, RCS, and other supported channels.
  version: v1
  license:
    name: Proprietary
    url: https://www.cm.com
servers:
- url: https://api.cm.com
  description: Production Server
security:
- ProductToken: []
tags:
- name: RichContentServices
paths:
  /channels/v1/accounts/{accountId}/rcs/{channelRequestId}/account:
    get:
      tags:
      - RichContentServices
      summary: Get an RCS account
      operationId: RichContentServices_GetRcsAccountAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Rcs.ApiRcsAccount'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Rcs.ApiRcsAccount'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Rcs.ApiRcsAccount'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Rcs.ApiRcsAccount'
    post:
      tags:
      - RichContentServices
      summary: Add an RCS account
      operationId: RichContentServices_AddRcsAccountAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Created
  /channels/v1/accounts/{accountId}/rcs/{channelRequestId}/account/forminput:
    get:
      tags:
      - RichContentServices
      summary: Get an RCS account's form input
      operationId: RichContentServices_GetRcsAccountFormInputAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiChannelRequestFormInputResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiChannelRequestFormInputResponse'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiChannelRequestFormInputResponse'
            multipart/form-data:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiChannelRequestFormInputResponse'
  /channels/v1/accounts/{accountId}/rcs/{channelRequestId}/account/{rcsAccountId}/forminput:
    put:
      tags:
      - RichContentServices
      summary: Add an RCS account's form input
      operationId: RichContentServices_AddRcsAccountFormInputAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: rcsAccountId
        in: path
        description: The RCS account identifier.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        $ref: '#/components/requestBodies/CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequestArray'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Rcs.ApiRcsAccount'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Rcs.ApiRcsAccount'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Rcs.ApiRcsAccount'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Rcs.ApiRcsAccount'
  /channels/v1/accounts/{accountId}/rcs/{channelRequestId}/profiles:
    get:
      tags:
      - RichContentServices
      summary: Gets the profiles asynchronous
      operationId: RichContentServices_GetRcsProfilesAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: q
        in: query
        description: The q.
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: The status.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - ACTIVE
            - PENDING
            - ELIGIBLE
            - NOT_VALIDATED
            - CUSTOMER_ACTION_REQUIRED
            - EXPIRED
            - REJECTED
            - CANCELLED
            - DELETED
      - name: skip
        in: query
        description: The skip.
        required: false
        schema:
          type: integer
          format: int32
      - name: take
        in: query
        description: The take.
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Rcs.ApiRcsProfileBase'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Rcs.ApiRcsProfileBase'
    post:
      tags:
      - RichContentServices
      summary: Adds the profile asynchronous
      operationId: RichContentServices_AddRcsProfileAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: simulate
        in: query
        description: if set to true [simulate].
        required: false
        schema:
          type: boolean
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Rcs.ApiRcsProfile'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Rcs.ApiRcsProfile'
  /channels/v1/accounts/{accountId}/rcs/{channelRequestId}/profiles/{profileId}:
    get:
      tags:
      - RichContentServices
      summary: Gets the profile asynchronous
      operationId: RichContentServices_GetRcsProfileAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: profileId
        in: path
        description: The profile identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Rcs.ApiRcsProfile'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Rcs.ApiRcsProfile'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Rcs.ApiRcsProfile'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Rcs.ApiRcsProfile'
  /channels/v1/accounts/{accountId}/rcs/{channelRequestId}/profiles/{profileId}/forminput:
    get:
      tags:
      - RichContentServices
      summary: Gets the profile form input asynchronous
      operationId: RichContentServices_GetRcsProfileFormInputAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: profileId
        in: path
        description: The profile identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiChannelRequestFormInputResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiChannelRequestFormInputResponse'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiChannelRequestFormInputResponse'
            multipart/form-data:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiChannelRequestFormInputResponse'
    put:
      tags:
      - RichContentServices
      summary: Adds the profile form input asynchronous
      operationId: RichContentServices_AddRcsProfileFormInputAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: profileId
        in: path
        description: The profile identifier.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        $ref: '#/components/requestBodies/CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequestArray'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Rcs.ApiRcsProfile'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Rcs.ApiRcsProfile'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Rcs.ApiRcsProfile'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Rcs.ApiRcsProfile'
components:
  requestBodies:
    CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequestArray:
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequest'
        text/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequest'
        text/xml:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequest'
        multipart/form-data:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequest'
        application/x-www-form-urlencoded:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequest'
      description: The form input.
      required: true
  schemas:
    CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequest:
      type: object
      properties:
        formElementId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        inputValue:
          type: string
    CM.Platform.Channels.Models.RequestForms.ApiChannelRequestFormInputResponse:
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        channelCategoryRequestID:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        formElementId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        inputValue:
          type: string
        createdOnUtc:
          format: date-time
          type: string
    CM.Platform.Channels.Models.ChannelTypes.Rcs.ApiRcsProfileBase:
      required:
      - id
      - channelRequestId
      - accountId
      - isActive
      - isPending
      - createdOnUtc
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        channelRequestId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        accountId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        name:
          type: string
        heroImage:
          type: string
        logoImage:
          type: string
        isActive:
          type: boolean
        isPending:
          type: boolean
        createdOnUtc:
          format: date-time
          type: string
        rejectedOnUtc:
          format: date-time
          type: string
        cancelledOnUtc:
          format: date-time
          type: string
        entityStatus:
          enum:
          - ACTIVE
          - PENDING
          - ELIGIBLE
          - NOT_VALIDATED
          - CUSTOMER_ACTION_REQUIRED
          - EXPIRED
          - REJECTED
          - CANCELLED
          - DELETED
          type: string
    CM.Platform.Channels.Models.ChannelTypes.Rcs.ApiRcsAccount:
      required:
      - id
      - accountId
      - channelRequestId
      - isPending
      - createdOnUtc
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        accountId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        channelRequestId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        isPending:
          type: boolean
        cancelledOnUtc:
          format: date-time
          type: string
        fulfilledOnUtc:
          format: date-time
          type: string
        createdOnUtc:
          format: date-time
          type: string
    CM.Platform.Channels.Models.ChannelTypes.Rcs.ApiRcsProfile:
      required:
      - id
      - channelRequestId
      - accountId
      - isActive
      - isPending
      - createdOnUtc
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        channelRequestId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        channelId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        accountId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        name:
          type: string
        heroImage:
          type: string
        logoImage:
          type: string
        isActive:
          type: boolean
        isPending:
          type: boolean
        fulfilledOnUtc:
          format: date-time
          type: string
        createdOnUtc:
          format: date-time
          type: string
        rejectionReason:
          type: string
        rejectedOnUtc:
          format: date-time
          type: string
        cancelledOnUtc:
          format: date-time
          type: string
        entityStatus:
          enum:
          - ACTIVE
          - PENDING
          - ELIGIBLE
          - NOT_VALIDATED
          - CUSTOMER_ACTION_REQUIRED
          - EXPIRED
          - REJECTED
          - CANCELLED
          - DELETED
          type: string
  securitySchemes:
    ProductToken:
      type: apiKey
      description: Product token for authentication. Obtain from your CM.com dashboard under Messaging > Product Tokens.
      name: producttoken
      in: header
