  /entrance/v1.0/organisations/{organisationUuid}/analytics/logs:
    get:
      operationId: AnalyticsController_getScanLogsByOrganisation_v1.0
      parameters:
      - name: order
        required: false
        in: query
        schema:
          default: ASC
          type: string
          enum:
          - ASC
          - DESC
      - name: page
        required: false
        in: query
        schema:
          minimum: 1
          default: 1
          type: number
      - name: take
        required: false
        in: query
        schema:
          minimum: 1
          maximum: 5000
          default: 25
          type: number
      - name: search
        required: false
        in: query
        description: Returns only records that match the search query. Searches in most common fields such as name, description and for tickets all visitor data.
        schema:
          minLength: 1
          maxLength: 255
          type: string
      - name: statusCodes
        required: false
        in: query
        description: Comma separated values for scan status codes
        schema:
          example: 200,401
          type: string
      - name: entrancePlanIds
        required: false
        in: query
        description: Comma separated values for entrance plan uuids
        schema:
          example: 00000000-0000-0000-0000-000000000000,00000000-0000-0000-0000-000000000000
          type: string
      - name: deviceIds
        required: false
        in: query
        description: Comma separated values for device ids
        schema:
          example: 872HA,AH84A
          type: string
      - name: ticketIds
        required: false
        in: query
        description: Comma separated values for ticket ids
        schema:
          example: 00000000-0000-0000-0000-000000000000,00000000-0000-0000-0000-000000000000
          type: string
      - name: orderIds
        required: false
        in: query
        description: Comma separated values for order ids
        schema:
          example: CM12345678,CM0000001
          type: string
      - name: productIds
        required: false
        in: query
        description: Comma separated values for product ids
        schema:
          example: 00000000-0000-0000-0000-000000000000,00000000-0000-0000-0000-000000000000
          type: string
      - name: eventIds
        required: false
        in: query
        description: Comma separated values for event ids
        schema:
          example: 00000000-0000-0000-0000-000000000000,00000000-0000-0000-0000-000000000000
          type: string
      - name: scannedAtStart
        required: true
        in: query
        description: scannedAt start date (ISO format)
        schema:
          format: date-time
          example: '2024-12-03T12:00:00.000Z'
          type: string
      - name: scannedAtEnd
        required: true
        in: query
        description: scannedAt end date (ISO format)
        schema:
          format: date-time
          example: '2024-12-03T23:00:00.000Z'
          type: string
      - name: includeRelatedEntrancePlans
        required: false
        in: query
        description: When true, include scan logs from the entire entrance plan collection the requested plan belongs to (its related plans across the collection) instead of only the requested entrance plan. Only affects entrance-plan-scoped requests; ignored for organisation-scoped requests.
        schema:
          example: true
          type: boolean
      - name: organisationUuid
        required: true
        in: path
        schema: {}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageDto'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ScanLog'
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - cookie: []
      summary: List scan logs for organisation
      tags:
      - Analytics
    servers:
    - url: https://api.cm.com
