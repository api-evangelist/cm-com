openapi: 3.2.0
info:
  title: Cm Com Analytics API
  version: '1.0'
  description: 'Operations tagged Analytics across 3 of this provider''s published API definitions: cm-com-halo-analytics-v1-openapi.yml, cm-com-live-entrance-management-v1-openapi.yml, cm-com-live-entrance-management-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /halo
- url: https://api.cm.com
tags:
- name: Analytics
paths:
  /analytics/v1/accounts/{account_id}/logging/feedback-scores:
    post:
      tags:
      - Analytics
      description: 'Create a feedback score for a conversation interaction.


        Required permission: `HALO.Analytics_Logging_FeedbackScores`'
      operationId: create_feedback_score_external
      parameters:
      - name: account_id
        in: path
        description: The account ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeedbackScoreRequest'
        required: true
      responses:
        '200':
          description: Feedback score created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackScoreResponse'
        '400':
          description: Bad request - invalid input
        '404':
          description: Account not found
      security:
      - X-CM-SSO-ACCOUNTGUID: []
      - {}
      summary: Create feedback score external
      x-summary-source: derived
    servers:
    - url: /halo
  /analytics/v1/accounts/{account_id}/metrics:
    get:
      tags:
      - Analytics
      description: 'Get conversation metrics for an account.


        Required permission: `HALO.Analytics_API`'
      operationId: get_metrics
      parameters:
      - name: account_id
        in: path
        description: The account ID
        required: true
        schema:
          type: string
          format: uuid
      - name: from_date
        in: query
        description: Start date for metrics calculation (ISO 8601 format, UTC expected). Defaults to 30 days ago.
        required: false
        schema:
          type: string
          format: date-time
      - name: until_date
        in: query
        description: End date for metrics calculation (ISO 8601 format, UTC expected). Defaults to now.
        required: false
        schema:
          type: string
          format: date-time
      - name: profile_id
        in: query
        description: Optional profile ID to filter metrics
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsData'
        '400':
          description: Bad request - invalid query parameters
        '404':
          description: Account not found
        '422':
          description: Validation error - invalid date range
      security:
      - X-CM-SSO-ACCOUNTGUID: []
      - {}
      summary: Get metrics
      x-summary-source: derived
    servers:
    - url: /halo
  /entrance/v1.0/organisations/{organisationUuid}/analytics/scan-progress:
    get:
      operationId: AnalyticsController_getScanProgress_v1.0
      parameters:
      - name: startAt
        required: true
        in: query
        description: Start date of filter period. Must be in the past
        schema:
          format: date-time
          type: string
      - name: endAt
        required: true
        in: query
        description: End date of filter period. Defaults to current datetime (also if set in the future)
        schema:
          format: date-time
          type: string
      - name: entrancePlanIds
        required: false
        in: query
        description: Comma separated values for entrance plan uuids
        schema:
          example: 00000000-0000-0000-0000-000000000000,00000000-0000-0000-0000-000000000000
          type: string
      - name: products
        required: false
        in: query
        description: Comma separated values for product externalId
        schema:
          example: 00000000-0000-0000-0000-000000000000
          type: string
      - name: events
        required: false
        in: query
        description: Comma separated values for event externalId
        schema:
          example: 00000000-0000-0000-0000-000000000000
          type: string
      - name: filterTimeslots
        required: false
        in: query
        description: If true will consider tickets that have their timeslot within the filter's date range. Default is false.
        schema:
          example: true
          type: boolean
      - name: includeClickerScans
        required: false
        in: query
        description: If true, clicker scans (ticketless arrivals/departures) are kept when filtering on products, product types, events or sale origins. Without such filters they are always included. Default is false.
        schema:
          example: true
          type: boolean
      - name: productTypes
        required: false
        in: query
        description: Comma separated values for product types
        schema:
          example: REGULAR,GUEST_LIST
          type: string
      - name: saleOrigins
        required: false
        in: query
        description: Comma separated values for ticket sale origins
        schema:
          example: SHOP,GUEST_LIST
          type: string
      - name: organisationUuid
        required: true
        in: path
        schema: {}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanProgressResponseDto'
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - cookie: []
      summary: Get scan progress data
      tags:
      - Analytics
    servers:
    - url: https://api.cm.com
