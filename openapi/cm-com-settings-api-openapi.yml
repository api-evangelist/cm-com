openapi: 3.2.0
info:
  title: Cm Com Settings API
  contact: {}
  license:
    name: Proprietary
    url: https://www.cm.com
  version: '1.0'
  description: 'Operations tagged Settings across 2 of this provider''s published API definitions: cm-com-live-entrance-management-v1-openapi.yml, cm-com-live-entrance-management-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.cm.com
security:
- cookie: []
tags:
- name: Settings
  description: System and organisation settings
paths:
  /entrance/v1.0/organisations/{organisationUuid}/tools/cdp/sync:
    post:
      operationId: ToolsController_syncCdpData_v1.0
      parameters:
      - name: organisationUuid
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncCdpDataDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponseDto'
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - cookie: []
      summary: Sync CDP data with filters
      tags:
      - Settings
    servers:
    - url: https://api.cm.com
  /entrance/v2.0/organisations/{organisationUuid}/tools/cdp/sync:
    post:
      operationId: ToolsController_syncCdpData_v2.0
      parameters:
      - name: organisationUuid
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncCdpDataDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponseDto'
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - cookie: []
      summary: Sync CDP data with filters
      tags:
      - Settings
    servers:
    - url: https://api.cm.com
components:
  schemas:
    ErrorDto:
      type: object
      properties:
        errorCode:
          type: number
          example: 400100
          description: Error code specific to the error, consisting of a three digit http status code and a digit application specific code.
        description:
          type: string
          maxLength: 255
          example: Description of the error.
        httpStatus:
          type: number
          enum:
          - 100
          - 101
          - 102
          - 103
          - 200
          - 201
          - 202
          - 203
          - 204
          - 205
          - 206
          - 207
          - 208
          - 210
          - 300
          - 301
          - 302
          - 303
          - 304
          - 307
          - 308
          - 400
          - 401
          - 402
          - 403
          - 404
          - 405
          - 406
          - 407
          - 408
          - 409
          - 410
          - 411
          - 412
          - 413
          - 414
          - 415
          - 416
          - 417
          - 418
          - 421
          - 422
          - 423
          - 424
          - 428
          - 429
          - 456
          - 500
          - 501
          - 502
          - 503
          - 504
          - 505
          - 507
          - 508
          example: 400
      required:
      - errorCode
      - description
      - httpStatus
    SyncCdpDataDto:
      type: object
      properties:
        entrancePlanIds:
          type: string
          example: 00000000-0000-0000-0000-000000000000,00000000-0000-0000-0000-000000000000
          description: Comma separated values for entrance plan uuids
        syncFromDate:
          format: date-time
          type: string
          description: Start date of sync
        syncUntilDate:
          format: date-time
          type: string
          description: End date of sync
      required:
      - syncFromDate
      - syncUntilDate
    GenericResponseDto:
      type: object
      properties:
        message:
          type: string
          readOnly: true
          example: Successfully uploaded file.
        details:
          type: array
          items:
            type: object
          example:
          - file: filename.csv
      required:
      - message
      - details
  securitySchemes:
    cookie:
      type: apiKey
      in: cookie
      name: connect.sid
x-refined-from:
- cm-com-live-entrance-management-v1-openapi.yml
- cm-com-live-entrance-management-v2-openapi.yml
