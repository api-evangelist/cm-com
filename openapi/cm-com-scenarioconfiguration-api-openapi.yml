          type: string
        message:
          type: string
        tariff:
          format: int32
          type: integer
        customGrouping:
          type: string
        customGrouping2:
          type: string
        customGrouping3:
          type: string
        allowedChannels:
          type: array
          items:
            type: string
    CM.Platform.Channels.ExternalModels.ApiClients.TextCore.WebhookConfiguration.MoHandlerV2PlatformLocation:
