      properties:
        id:
          format: int32
          type: integer
        name:
          type: string
    CM.Platform.Channels.Models.EventLogging.ApiChannelsMoHandlerEventAdmin:
      required:
      - id
      - moHandlerId
      - eventType
      - entityState
      - createdOnUtc
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        moHandlerId:
          format: int32
          type: integer
        accountId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        ssoAccountId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        eventType:
          type: string
        eventSubType:
          type: string
