openapi: 3.2.0
info:
  title: Channels Scenario Configuration API
  description: Check channel availability and manage onboarding for SMS, WhatsApp, RCS, and other supported channels.
  version: v1
  license:
    name: Proprietary
    url: https://www.cm.com
servers:
- url: https://api.cm.com
  description: Production Server
security:
- ProductToken: []
tags:
- name: ScenarioConfiguration
paths:
  /channels/v1/administration/scenarioconfiguration/scenarios:
    get:
      tags:
      - ScenarioConfiguration
      summary: Get scenario configuration scenarios
      operationId: ScenarioConfiguration_GetScenarioConfigScenariosAdministrationAsync
      parameters:
      - name: q
        in: query
        description: The input.
        required: false
        schema:
          type: string
      - name: activeOnly
        in: query
        description: The active only.
        required: false
        schema:
          type: boolean
      - name: countryCode
        in: query
        description: The country code.
        required: false
        schema:
          type: string
      - name: shortcode
        in: query
        description: The shortcode.
        required: false
        schema:
          type: string
      - name: alias
        in: query
        description: The alias.
        required: false
        schema:
          type: string
      - name: medium
        in: query
        description: The medium (use string value 'null' to search for scenarios with medium null).
        required: false
        schema:
          type: string
      - name: customer
        in: query
        description: The customer.
        required: false
        schema:
          type: integer
          format: int32
      - name: skip
        in: query
        description: The skip.
        required: false
        schema:
          type: integer
          format: int32
      - name: take
        in: query
        description: The take.
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.ExternalModels.ApiClients.TextCore.WebhookConfiguration.ScenarioV2'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.ExternalModels.ApiClients.TextCore.WebhookConfiguration.ScenarioV2'
    post:
      tags:
      - ScenarioConfiguration
      summary: Add a scenario configuration scenario
      operationId: ScenarioConfiguration_AddScenarioConfigScenarioAdministrationAsync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CM.Platform.Channels.ExternalModels.ApiClients.TextCore.WebhookConfiguration.ScenarioV2Base'
          text/json:
            schema:
              $ref: '#/components/schemas/CM.Platform.Channels.ExternalModels.ApiClients.TextCore.WebhookConfiguration.ScenarioV2Base'
          text/xml:
            schema:
              $ref: '#/components/schemas/CM.Platform.Channels.ExternalModels.ApiClients.TextCore.WebhookConfiguration.ScenarioV2Base'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CM.Platform.Channels.ExternalModels.ApiClients.TextCore.WebhookConfiguration.ScenarioV2Base'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CM.Platform.Channels.ExternalModels.ApiClients.TextCore.WebhookConfiguration.ScenarioV2Base'
        description: The scenario.
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.ExternalModels.ApiClients.TextCore.WebhookConfiguration.ScenarioV2'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.ExternalModels.ApiClients.TextCore.WebhookConfiguration.ScenarioV2'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.ExternalModels.ApiClients.TextCore.WebhookConfiguration.ScenarioV2'
