openapi: 3.2.0
info:
  title: Email Gateway Email Alerts API
  version: '1.0'
  description: Send transactional and marketing emails, manage domains, suppressions, webhooks, and more.
servers:
- url: https://api.cm.com
  description: Production
tags:
- name: EmailAlerts
paths:
  /email/configuration/v1/account/{logicalAccount}/alerts/list:
    get:
      summary: List usage alerts
      tags:
      - EmailAlerts
      parameters:
      - name: logicalAccount
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Configuration_EmailAlertListControllerResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration_EmailAlertListControllerResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/Configuration_EmailAlertListControllerResponse'
      operationId: op_4
      security:
      - ProductToken: []
  /email/configuration/v1/account/{logicalAccount}/alerts/create:
    post:
      summary: Create usage alert
      tags:
      - EmailAlerts
      parameters:
      - name: logicalAccount
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/Configuration_EmailAlertDto'
          application/json:
            schema:
              $ref: '#/components/schemas/Configuration_EmailAlertDto'
          text/json:
            schema:
              $ref: '#/components/schemas/Configuration_EmailAlertDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Configuration_EmailAlertDto'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Configuration_Int32ControllerResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration_Int32ControllerResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/Configuration_Int32ControllerResponse'
      operationId: op_5
      security:
      - ProductToken: []
  /email/configuration/v1/account/{logicalAccount}/alerts/update/{id}:
    put:
      summary: Update usage alert
      tags:
      - EmailAlerts
      parameters:
      - name: logicalAccount
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/Configuration_EmailAlertDto'
          application/json:
            schema:
              $ref: '#/components/schemas/Configuration_EmailAlertDto'
          text/json:
            schema:
              $ref: '#/components/schemas/Configuration_EmailAlertDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Configuration_EmailAlertDto'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Configuration_Int32ControllerResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration_Int32ControllerResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/Configuration_Int32ControllerResponse'
      operationId: op_6
      security:
      - ProductToken: []
  /email/configuration/v1/account/{logicalAccount}/alerts/delete/{id}:
    delete:
      summary: Delete usage alert
      tags:
      - EmailAlerts
      parameters:
      - name: logicalAccount
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Configuration_Int32ControllerResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration_Int32ControllerResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/Configuration_Int32ControllerResponse'
      operationId: op_7
      security:
      - ProductToken: []
components:
  schemas:
    Configuration_StatusCode:
      enum:
      - 200
      - 400
      - 401
      - 403
      - 404
      - 409
      - 429
      - 500
      - 999
      type: integer
      format: int32
    Configuration_EmailAlertDto:
      type: object
      properties:
        alertName:
          type:
          - string
          - 'null'
        metric:
          type:
          - string
          - 'null'
        threshold:
          type:
          - string
          - 'null'
        recipient:
          type:
          - string
          - 'null'
      additionalProperties: false
    Configuration_EmailAlert:
      type: object
      properties:
        id:
          type: integer
          format: int32
        logicalAccountId:
          type: string
          format: uuid
        alertName:
          type:
          - string
          - 'null'
        metric:
          type:
          - string
          - 'null'
        threshold:
          type:
          - string
          - 'null'
        recipient:
          type:
          - string
          - 'null'
        createdDate:
          type: string
          format: date-time
        updatedDate:
          type: string
          format: date-time
      additionalProperties: false
    Configuration_EmailAlertListControllerResponse:
      type: object
      properties:
        success:
          type: boolean
        status:
          $ref: '#/components/schemas/Configuration_StatusCode'
        message:
          type:
          - string
          - 'null'
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Configuration_EmailAlert'
      additionalProperties: false
    Configuration_Int32ControllerResponse:
      type: object
      properties:
        success:
          type: boolean
        status:
          $ref: '#/components/schemas/Configuration_StatusCode'
        message:
          type:
          - string
          - 'null'
        data:
          type: integer
          format: int32
      additionalProperties: false
  securitySchemes:
    ProductToken:
      type: apiKey
      in: header
      name: X-CM-PRODUCTTOKEN
      description: Your CM.com product token. Find it in the Email Gateway App → Settings → Integration.
