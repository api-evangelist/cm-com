openapi: 3.2.0
info:
  title: Email Gateway Send Email API
  version: '1.0'
  description: Send transactional and marketing emails, manage domains, suppressions, webhooks, and more.
servers:
- url: https://api.cm.com
  description: Production
tags:
- name: Send Email
paths:
  /email/gateway/v1/marketing:
    post:
      summary: Send marketing email
      tags:
      - Send Email
      parameters:
      - name: X-CM-PRODUCTTOKEN
        in: header
        schema:
          type: string
      - name: Sandbox-Mode
        in: header
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/Gateway_GatewayRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/Gateway_GatewayRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/Gateway_GatewayRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Gateway_GatewayRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gateway_EmailResponseDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gateway_ProblemDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gateway_ProblemDetails'
      operationId: op_1
      security:
      - ProductToken: []
  /email/gateway/v1/transactional:
    post:
      summary: Send transactional email
      tags:
      - Send Email
      parameters:
      - name: X-CM-PRODUCTTOKEN
        in: header
        schema:
          type: string
      - name: priority
        in: query
        required: true
        schema:
          type: string
      - name: Sandbox-Mode
        in: header
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/Gateway_GatewayRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/Gateway_GatewayRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/Gateway_GatewayRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Gateway_GatewayRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gateway_EmailResponseDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gateway_ProblemDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gateway_ProblemDetails'
      operationId: op_2
      security:
      - ProductToken: []
components:
  schemas:
    Gateway_ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    Gateway_EmailAttachment:
      type: object
      properties:
        fileName:
          type:
          - string
          - 'null'
        content:
          type:
          - string
          - 'null'
        contentType:
          type:
          - string
          - 'null'
        contentId:
          type:
          - string
          - 'null'
      additionalProperties: false
    Gateway_EmailResponseDto:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type:
          - string
          - 'null'
        success:
          type: boolean
        messageId:
          type:
          - string
          - 'null'
        batchId:
          type:
          - string
          - 'null'
      additionalProperties: false
    Gateway_EmailAddress:
      required:
      - email
      type: object
      properties:
        email:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
      additionalProperties: false
    Gateway_GatewayRequest:
      required:
      - subject
      type: object
      properties:
        from:
          $ref: '#/components/schemas/Gateway_EmailAddress'
        replyTo:
          $ref: '#/components/schemas/Gateway_EmailAddress'
        to:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Gateway_EmailAddress'
        cc:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Gateway_EmailAddress'
        bcc:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Gateway_EmailAddress'
        subject:
          type:
          - string
          - 'null'
        html:
          type:
          - string
          - 'null'
        text:
          type:
          - string
          - 'null'
        attachments:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Gateway_EmailAttachment'
        customerReference:
          type:
          - string
          - 'null'
        scheduledAt:
          type:
          - string
          - 'null'
        inReplyTo:
          type:
          - string
          - 'null'
        references:
          type:
          - string
          - 'null'
        headers:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
      additionalProperties: false
  securitySchemes:
    ProductToken:
      type: apiKey
      in: header
      name: X-CM-PRODUCTTOKEN
      description: Your CM.com product token. Find it in the Email Gateway App → Settings → Integration.
