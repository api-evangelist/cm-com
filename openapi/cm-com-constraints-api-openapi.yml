components:
  schemas:
    ErrorDto:
      type: object
      properties:
        errorCode:
          type: number
          example: 400100
          description: Error code specific to the error, consisting of a three digit http status code and a digit application specific code.
        description:
          type: string
          maxLength: 255
          example: Description of the error.
        httpStatus:
          type: number
          enum:
          - 100
          - 101
          - 102
          - 103
          - 200
          - 201
          - 202
          - 203
          - 204
          - 205
          - 206
          - 207
          - 208
          - 210
          - 300
          - 301
          - 302
          - 303
          - 304
          - 307
          - 308
          - 400
          - 401
          - 402
          - 403
          - 404
          - 405
          - 406
          - 407
          - 408
          - 409
          - 410
          - 411
          - 412
          - 413
          - 414
          - 415
          - 416
          - 417
          - 418
          - 421
          - 422
          - 423
          - 424
          - 428
          - 429
          - 456
          - 500
          - 501
          - 502
          - 503
          - 504
          - 505
          - 507
          - 508
          example: 400
      required:
      - errorCode
      - description
      - httpStatus
    UpdateConstraintDto:
      type: object
      properties:
        externalId:
          type: string
          maxLength: 255
          example: 00000000-0000-0000-0000-000000000000
        name:
          type: string
          maxLength: 255
          example: Special access group
    PageDto:
      type: object
      properties:
        data:
          type: array
          items: {}
        meta:
          $ref: '#/components/schemas/PageMetaDto'
      required:
      - data
      - meta
    PageMetaDto:
      type: object
      properties:
        page:
          type: number
        take:
          type: number
        skip:
          type: number
        itemCount:
          type: number
        pageCount:
          type: number
        hasPreviousPage:
          type: boolean
        hasNextPage:
          type: boolean
      required:
      - page
      - take
      - skip
      - itemCount
      - pageCount
      - hasPreviousPage
      - hasNextPage
    CreateConstraintDto:
      type: object
      properties:
        externalId:
          type: string
          maxLength: 255
          example: 00000000-0000-0000-0000-000000000000
        name:
          type: string
          maxLength: 255
          example: Special access group
      required:
      - externalId
      - name
    Constraint:
      type: object
      properties:
        uuid:
          type: string
          maxLength: 36
          example: 00000000-0000-0000-0000-000000000000
        externalId:
          type: string
          maxLength: 255
          example: 00000000-0000-0000-0000-000000000000
        name:
          type: string
          maxLength: 255
          example: Special access group
      required:
      - uuid
      - externalId
      - name
  securitySchemes:
    cookie:
      type: apiKey
      in: cookie
      name: connect.sid
