openapi: 3.2.0
info:
  title: Scan Set Barcode Status API
  version: '1.0'
  description: Every operation is a `POST` request with an `application/x-www-form-urlencoded` body. Every request includes your public `apiKey` and an `HMACKey`. The `HMACKey` is calculated from the input fields; the calculation is listed on each operation as `Base64 encode - SHA256(...)`, where the fields between the brackets are concatenated. Only include optional parameters in the HMAC if you are using those parameters. A `*` after a field marks it as optional.
servers:
- url: https://globalticket.com/webservices/scanapi
security:
- {}
tags:
- name: SetBarcodeStatus
paths:
  /setBarcodeStatus:
    post:
      summary: /setBarcodeStatus
      description: 'This function allows you to set the barcode (ticket) status to “checked in”.


        **HMACKey:** `Base64 encode - SHA256(apiKey + barcodeNumber)`'
      operationId: setbarcodestatus
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - apiKey
              - HMACKey
              - barcodeNumber
              properties:
                apiKey:
                  type: string
                  description: Your public apiKey needs to be included in every request
                HMACKey:
                  type: string
                  description: The HMACKey is calculated based on the input fields. Base64 encode - SHA256(apiKey + barcodeNumber).
                barcodeNumber:
                  type: string
                  description: The barcode number of the ticket for which the status is to be set
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    success: true
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    default: true
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value:
                    success: true
                    errorCode: 1
                    errorMessage: contactInfo add was successfully.
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    default: true
                  errorCode:
                    type: integer
                    example: 1
                    default: 0
                  errorMessage:
                    type: string
                    example: contactInfo add was successfully.
      deprecated: false
      tags:
      - SetBarcodeStatus
