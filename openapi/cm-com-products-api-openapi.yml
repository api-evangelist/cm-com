      operationId: ProductsController_create_v1.0
      parameters:
      - name: organisationUuid
        required: true
        in: path
        schema: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - cookie: []
      summary: Create a product
      tags:
      - Products
    get:
      operationId: ProductsController_findAllByOrganisation_v1.0
      parameters:
      - name: order
        required: false
        in: query
        schema:
          default: ASC
          type: string
          enum:
          - ASC
          - DESC
      - name: page
        required: false
        in: query
        schema:
          minimum: 1
          default: 1
          type: number
      - name: take
        required: false
        in: query
        schema:
          minimum: 1
          maximum: 5000
          default: 25
          type: number
      - name: search
        required: false
        in: query
        description: Returns only records that match the search query. Searches in most common fields such as name, description and for tickets all visitor data.
        schema:
          minLength: 1
          maxLength: 255
          type: string
      - name: events
        required: false
        in: query
        description: Comma separated values for event externalId
        schema:
          example: 00000000-0000-0000-0000-000000000000
          type: string
      - name: productTypes
        required: false
        in: query
        description: Comma separated values for product type
        schema:
          example: REGULAR
          type: string
      - name: includeProductsWithoutEvent
        required: false
        in: query
        description: If true will include products without event in the result, even if event filter params are provided. Default is false.
        schema:
          example: true
          type: boolean
      - name: organisationUuid
        required: true
        in: path
        schema: {}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageDto'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Product'
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - cookie: []
      summary: List all products for an organisation
      tags:
      - Products
    servers:
    - url: https://api.cm.com
