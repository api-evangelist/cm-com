openapi: 3.2.0
info:
  title: Cm Com Products API
  license:
    name: Proprietary
    url: https://www.cm.com
  version: '1.0'
  description: 'Operations tagged Products across 3 of this provider''s published API definitions: cm-com-live-entrance-management-v1-openapi.yml, cm-com-live-entrance-management-v2-openapi.yml, cm-com-live-event-ticketing-v1-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.cm.com
- url: /ticketing/v1
tags:
- name: Products
  description: Products management and configuration
paths:
  /entrance/v1.0/organisations/{organisationUuid}/products:
