      parameters:
      - name: productUuid
        required: true
        in: path
        schema:
          type: string
      - name: organisationUuid
        required: true
        in: path
        schema: {}
      responses:
        '204':
          description: ''
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - cookie: []
      summary: Delete a product
      tags:
      - Products
    servers:
    - url: https://api.cm.com
