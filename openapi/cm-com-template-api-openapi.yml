          type: string
          format: uuid
      - name: skip
        in: query
        description: ''
        required: false
        schema:
          type: integer
          format: int32
      - name: take
        in: query
        description: ''
        required: false
        schema:
          type: integer
          format: int32
      - name: includeHtmlBody
        in: query
        description: ''
        required: false
        schema:
          type: boolean
      - name: includeTextBody
        in: query
        description: ''
        required: false
        schema:
          type: boolean
      - name: includeJson
        in: query
        description: ''
        required: false
        schema:
          type: boolean
      - name: filter
        in: query
        description: ''
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Tooling.BulkEmail.Api.Models.ApiTemplate'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Tooling.BulkEmail.Api.Models.ApiTemplate'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Tooling.BulkEmail.Api.Models.ApiTemplate'
    post:
      tags:
      - Template
      summary: Create a template
      operationId: Template_AddTemplateAsync
      parameters:
      - name: accountID
        in: path
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        $ref: '#/components/requestBodies/CM.Tooling.BulkEmail.Api.Models.ApiTemplate'
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Tooling.BulkEmail.Api.Models.ApiTemplate'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Tooling.BulkEmail.Api.Models.ApiTemplate'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Tooling.BulkEmail.Api.Models.ApiTemplate'
    servers:
    - url: http://api.cm.com
  /bulkemail/v1.0/accounts/{accountID}/templates/{templateID}:
    get:
      tags:
