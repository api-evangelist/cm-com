openapi: 3.2.0
info:
  title: Cm Com Template API
  version: '1.0'
  description: 'Operations tagged Template across 2 of this provider''s published API definitions: cm-com-mobile-marketing-cloud-email-campaigns-v1-openapi.yml, cm-com-sign-v1-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://api.cm.com
- url: https://api.cm.com/sign/v1
- url: https://api.cm.com/sign-sandbox/v1
tags:
- name: Template
paths:
