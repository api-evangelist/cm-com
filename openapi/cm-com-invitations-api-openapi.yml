openapi: 3.2.0
info:
  title: Cm Com Invitations API
  contact: {}
  license:
    name: Proprietary
    url: https://www.cm.com
  version: '1.0'
  description: 'Operations tagged Invitations across 2 of this provider''s published API definitions: cm-com-live-entrance-management-v1-openapi.yml, cm-com-live-entrance-management-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.cm.com
security:
- cookie: []
tags:
- name: Invitations
  description: User invitation lifecycle
paths:
  /entrance/v1.0/invitations/{invitationId}:
    get:
      operationId: InvitationsController_getInvitation_v1.0
      parameters:
      - name: invitationId
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationsService'
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      summary: Get invitation details
      tags:
      - Invitations
    post:
      operationId: InvitationsController_acceptInvitation_v1.0
      parameters:
      - name: invitationId
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserDto'
      responses:
        '201':
          description: ''
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      summary: Accept an invitation
      tags:
      - Invitations
    servers:
    - url: https://api.cm.com
