openapi: 3.2.0
info:
  title: Channels API Settings API
  description: Check channel availability and manage onboarding for SMS, WhatsApp, RCS, and other supported channels.
  version: v1
  license:
    name: Proprietary
    url: https://www.cm.com
servers:
- url: https://api.cm.com
  description: Production Server
security:
- ProductToken: []
tags:
- name: ApiSettings
paths:
  /channels/v1/accounts/{accountId}/apisettings/authentication/httpproducttokens:
    get:
      tags:
      - ApiSettings
      summary: Gets the gateway product tokens asynchronous
      operationId: ApiSettings_GetHttpProductTokensAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: '#/components/schemas/CM.Platform.Channels.Models.ApiSettings.ApiSmssAccountHttp'
            text/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: '#/components/schemas/CM.Platform.Channels.Models.ApiSettings.ApiSmssAccountHttp'
            text/xml:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: '#/components/schemas/CM.Platform.Channels.Models.ApiSettings.ApiSmssAccountHttp'
            multipart/form-data:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: '#/components/schemas/CM.Platform.Channels.Models.ApiSettings.ApiSmssAccountHttp'
  /channels/v1/accounts/{accountId}/apisettings/authentication/apikeys:
    get:
      tags:
      - ApiSettings
      summary: Get the API keys for the logical account asynchronous
      operationId: ApiSettings_GetApiKeysAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.ApiSettings.ApiKey'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.ApiSettings.ApiKey'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.ApiSettings.ApiKey'
            multipart/form-data:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.ApiSettings.ApiKey'
  /channels/v1/accounts/{accountId}/apisettings/businessmessaging/access:
    get:
      tags:
      - ApiSettings
      summary: Determines if the Account ID has Messaging Capability asynchronous
      operationId: ApiSettings_AccountHasMessagingCapabilityAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: boolean
            text/json:
              schema:
                type: boolean
            text/xml:
              schema:
                type: boolean
            multipart/form-data:
              schema:
                type: boolean
  /channels/v1/accounts/{accountId}/apisettings/businessmessaging/testmessage/whitelist:
    get:
      tags:
      - ApiSettings
      summary: Get whitelisted numbers linked to logical account, if null, no whitelist is…
      operationId: ApiSettings_GetTestMessageNumberWhitelistAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
