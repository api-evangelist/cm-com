  /channels/v1/accounts/{accountId}/apisettings/businessmessaging/testmessage:
    post:
      tags:
      - ApiSettings
      summary: Send test message
      operationId: ApiSettings_SendTestMessageAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: productToken
        in: query
        description: The product token to use in the Business Messaging API
        required: true
        schema:
          type: string
          format: uuid
      - name: recipient
        in: query
        description: The recipient of the test message
        required: true
        schema:
          type: string
      - name: messageContent
        in: query
        description: The Message content to send to the recipient
        required: true
        schema:
          type: string
      responses:
        '204':
          description: NoContent
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/System.Void'
  /channels/v1/accounts/{accountId}/apisettings/businessmessaging/events/{entityType}:
    get:
      tags:
      - ApiSettings
      summary: Gets the business messaging entity events asynchronous
      operationId: ApiSettings_GetBusinessMessagingEntityEventsAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: entityType
        in: path
        description: Type of the entity.
        required: true
        schema:
          type: string
          enum:
          - MT_RECIPIENT_COUNTRY_FILTER
          - SR_CONFIGURATION
          - IP_RESTRICTION_CONFIGURATION
          - RATE_LIMITING_CONFIGURATION
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.EventLogging.ApiBusinessMessagingEntityEvent'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.EventLogging.ApiBusinessMessagingEntityEvent'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.EventLogging.ApiBusinessMessagingEntityEvent'
            multipart/form-data:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.EventLogging.ApiBusinessMessagingEntityEvent'
