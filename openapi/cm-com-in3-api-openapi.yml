openapi: 3.2.0
info:
  title: Payments Gateway In3 API
  description: Common payments API
  version: 1.27.22
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: /api/v1
security:
- oAuth2ClientCredentials: []
tags:
- name: in3
  description: in3 is a Dutch BNPL method where customers pay in 3 installments, at no extra cost and without having to register with the Bureau Krediet Registratie (BKR). in3 guarantees settlement after receiving the first installment.
  externalDocs:
    url: https://payin3.eu/
paths:
  /paymentmethods/in3/v1/transactions:
    post:
      operationId: createIn3Transaction
      description: Create a new in3 payment transaction. After receiving a HTTP status 201 you have to redirect the consumer to the url given in **action.redirect.url**. The **id** field in the response can be used in future calls as **transactionId** to reference this transaction (for instance in a refund).
      tags:
      - in3
      summary: Create payment
      requestBody:
        description: Create in3 Transaction
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/In3Payment'
            examples:
              basicTransaction:
                $ref: '#/components/examples/BasicTransaction'
              basicTransactionNoItems:
                $ref: '#/components/examples/BasicTransactionNoItems'
      responses:
        '201':
          $ref: '#/components/responses/IN3Transaction'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/in3/v1/transactions/{transactionId}:
    get:
      operationId: getIn3Transaction
      summary: Fetch payment
      tags:
      - in3
      description: Retrieve details for an existing in3 transaction.
      parameters:
      - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          $ref: '#/components/responses/IN3Transaction'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/in3/v1/transactions/{transactionId}/refunds:
    post:
      operationId: createIn3Refund
      summary: Create refund
      tags:
      - in3
      description: 'Create a refund for an existing in3 transaction. The **transactionId** parameter must be the ID of the transaction to be refunded.


        The **amount** field is required and must be a positive value, which is the amount to be refunded.'
      parameters:
      - $ref: '#/components/parameters/TransactionId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refund'
      responses:
        '201':
          $ref: '#/components/responses/RefundResponse'
          description: in3 refund was created successfully.
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
    get:
      operationId: getIn3Refunds
      tags:
      - in3
      summary: Fetch refunds
      description: Retrieve refunds for an existing in3 transaction.
      parameters:
      - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          $ref: '#/components/responses/RefundsResponse'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
components:
  responses:
    UserError:
      description: The user input was incorrect or something illegal was attempted (eg. using a service without having that service configured for the user, or not being authorized)
      content:
        application/json:
          schema:
            type: object
            required:
            - id
            - message
            properties:
              id:
                $ref: '#/components/schemas/Uuid'
              message:
                type: string
                example: no authorization methods provided
    InternalError:
      description: Internal server error. This can be caused by an unresponsive backend
      content:
        application/json:
          schema:
            type: object
            required:
            - id
            - message
            properties:
              id:
                $ref: '#/components/schemas/Uuid'
              message:
                type: string
                example: Service Unavailable
    IN3Transaction:
      description: IN3 transaction details
      headers:
        Digest:
          $ref: '#/components/headers/Digest'
      content:
        application/json:
          schema:
            allOf:
            - type: object
              required:
              - id
              - invoice
              - reference
              - amount
              - consumer
              - description
              - expiresAt
              - items
              - status
              - created
              - updated
              - action
              properties:
                id:
                  $ref: '#/components/schemas/Uuid'
                invoice:
                  type: object
                  required:
                  - reference
                  - description
                  - amount
                  properties:
                    reference:
                      $ref: '#/components/schemas/Reference'
                    amount:
                      $ref: '#/components/schemas/Amount'
                    description:
                      type: string
                      example: Order at yourdomain.tld
                consumer:
                  $ref: '#/components/schemas/Consumer-2'
                expiresAt:
                  $ref: '#/components/schemas/Datetime'
                items:
                  $ref: '#/components/schemas/IN3Items'
                status:
                  description: The status of the transaction.
                  oneOf:
                  - $ref: '#/components/schemas/StatusOpen'
                  - $ref: '#/components/schemas/StatusSuccess'
                  - $ref: '#/components/schemas/StatusCancelled'
                  - $ref: '#/components/schemas/StatusExpired'
                  - $ref: '#/components/schemas/StatusFailure'
                  - $ref: '#/components/schemas/StatusPending'
                action:
                  description: Next action to be performed by merchant (or consumer) to complete the payment.
                  type:
                  - object
                  - 'null'
                  properties:
                    redirect:
                      type: object
                      properties:
                        url:
                          description: URL where consumer should be redirected to by the merchant to perform the payment. This url is only available when a card payment has been started
                          type: string
                          format: url
                          example: https://checkout.tld/redirect/in3
                created:
                  $ref: '#/components/schemas/Datetime'
                updated:
                  $ref: '#/components/schemas/Datetime'
                webhooks:
                  $ref: '#/components/schemas/TransactionWebhooks'
            - $ref: '#/components/schemas/ReturnURLOneOf'
          examples:
            openTransaction:
              $ref: '#/components/examples/BasicTransaction-2'
            openTransactionNoItems:
              $ref: '#/components/examples/BasicTransactionNoItems'
    RefundsResponse:
      description: Details of all refunds belonging to a transaction.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefundsList'
    RefundResponse:
      description: Refund details
      headers:
        Digest:
          $ref: '#/components/headers/Digest'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefundDetails'
  schemas:
    TransactionWebhook:
      allOf:
      - $ref: '#/components/schemas/BaseWebhook'
      - type: object
        properties:
          events:
            items:
              description: '* `STATUS_CHANGE` - Triggered when the status of a transaction changes.

                * `REFUND_STATUS` - Triggered when a transaction receives an update on one of its requested refunds.

                * `FINALSTATUS` - This value is deprecated and shouldn''t be used anymore. Use `STATUS_CHANGE` instead.

                '
              oneOf:
              - $ref: '#/components/schemas/StatusChangeEvent'
              - $ref: '#/components/schemas/RefundStatusEvent'
              - $ref: '#/components/schemas/FinalStatusEvent'
              example: STATUS_CHANGE
    AddressWithStateAndAdditionalData:
      allOf:
      - $ref: '#/components/schemas/AddressWithoutMandatoryCountry'
      - type: object
        properties:
          state:
            description: The state or province of the consumer's billing address associated with the card used for this purchase. The value must be the country subdivision code (e.g., 'NH') or the official state/province name (e.g., 'Noord Holland') as defined in ISO 3166-2.
            type: string
            maxLength: 40
            example: Noord-Holland
          additionalData:
            description: The consumers house number addition.
            type: string
            maxLength: 35
            example: Right-hand portal
    Refund:
      description: Refund an already successfully processed payment.
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
          description: 'Denomination in the smallest currency subunit, as for example euro cents. If empty, the refund amount will be the remaining available amount of the transaction (i.e., total payment amount minus already refunded amounts minus the amounts of the pending refund requests).

            '
        reason:
          $ref: '#/components/schemas/RefundReason'
    Amount:
      description: Denomination in the smallest currency subunit, as for example euro cents.
      type: integer
      minimum: 1
      maximum: 99999999
      example: 1200
    ReturnUrl:
      description: 'URL where the Consumer is redirected to after completing the transaction at its issuing bank or at the chosen payment method.


        With this implementation you are responsible to fetch the payment status and incorporated into your site.'
      type: string
      format: url
      maxLength: 2000
      example: https://yourdomain.tld/order/return?orderID=order123
    Reference:
      description: The clients identifier. This value will be sent in the webhook payload alongside the ID you receive as part of the response of a transaction.
      type: string
      minLength: 1
      maxLength: 255
      example: '20210623130413'
    RefundStatusEvent:
      description: '* `REFUND_STATUS` - Triggered when a transaction receives an update on one of its requested refunds.

        '
      type: string
      enum:
      - REFUND_STATUS
      example: REFUND_STATUS
    ReturnURLOneOf:
      oneOf:
      - type: object
        required:
        - returnUrls
        properties:
          returnUrls:
            $ref: '#/components/schemas/ReturnUrls'
      - type: object
        required:
        - returnUrl
        properties:
          returnUrl:
            $ref: '#/components/schemas/ReturnUrl'
    In3Payment:
      allOf:
      - type: object
        required:
        - invoice
        - consumer
        - items
        properties:
          invoice:
            type: object
            required:
            - reference
            - amount
            - description
            properties:
              reference:
                $ref: '#/components/schemas/Reference'
              amount:
                $ref: '#/components/schemas/Amount'
              description:
                $ref: '#/components/schemas/Description'
          expiresAt:
            allOf:
            - $ref: '#/components/schemas/Datetime'
            - description: ISO 8601 date and time. If left empty, the value defaults to 4 hours.
          consumer:
            $ref: '#/components/schemas/Consumer-2'
          items:
            $ref: '#/components/schemas/IN3Items'
          webhooks:
            $ref: '#/components/schemas/TransactionWebhooks'
      - $ref: '#/components/schemas/ReturnURLOneOf'
    IN3Items:
      description: 'Items included in the order. We request both values ''vatAmount'' and ''vatRate'' to prevent errors.

        '
      type: array
      minItems: 1
      maxItems: 512
      items:
        allOf:
        - $ref: '#/components/schemas/Item'
        - type: object
          required:
          - description
          properties:
            name:
              $ref: '#/components/schemas/ItemName'
            description:
              description: Additional item description.
              maxLength: 100
    Description:
      description: Description of the underlying value or reason of the payment.
      type: string
      maxLength: 255
      example: Order at yourdomain.tld
    StatusOpen:
      description: The transaction is open and can be paid.
      type: string
      format: enum
      enum:
      - OPEN
      example: OPEN
    Country:
      description: Country of the consumer (ISO-3166)
      type: string
      example: NL
      minLength: 2
      maxLength: 2
    Phone:
      description: The phonenumber of the consumer (E.164 format).
      type: string
      maxLength: 16
      example: '+31695613259'
    Item:
      description: 'Item object that can be used to provide details of the items in the order.

        This is only used by payment methods that support it, like Klarna and Riverty.'
      type: object
      required:
      - code
      - unitPrice
      - quantity
      - vatAmount
      - vatRate
      properties:
        code:
          description: Merchant Product identification. Each item code must be unique per transaction.
          type: string
          minLength: 1
          maxLength: 50
          example: SDC4/32GB-2ADP
        description:
          description: A human readable description of the item.
          $ref: '#/components/schemas/Description'
        unitPrice:
          description: Unit price (including VAT) of the item, specified in the smallest currency subunit, as for example euro cents.
          $ref: '#/components/schemas/Amount'
        quantity:
          description: The number of items of this type.
          type: integer
          minimum: 1
          maximum: 1000000000
          example: 2
        vatAmount:
          description: 'Total VAT amount of the orderline, specified in the smallest currency subunit as for example euro cents.

            '
          $ref: '#/components/schemas/Amount'
        vatRate:
          description: 'Percentage of VAT applied.

            Only the first decimal value will be taken into account, the rest will be ignored.

            '
          type: number
          minimum: 0
          maximum: 99.9
          example: 20
          multipleOf: 0.1
    GenderlessConsumer:
      type: object
      properties:
        email:
          $ref: '#/components/schemas/Email'
        phone:
          $ref: '#/components/schemas/Phone'
        dateOfBirth:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: '1990-05-23'
          description: Date of birth in ISO 8601 format (YYYY-MM-DD).
    StatusExpired:
      description: The transaction has expired.
      type: string
      format: enum
      enum:
      - EXPIRED
      example: EXPIRED
    AddressWithoutMandatoryCountry:
      type: object
      description: The consumers address.
      properties:
        street:
          description: The consumers street name.
          type: string
          maxLength: 100
          example: Rustenburgerlaan
        houseNumber:
          description: The consumers house number.
          type: string
          maxLength: 35
          example: '25'
        postalCode:
          description: The consumers postal code.
          type: string
          maxLength: 35
          example: 2012AL
        city:
          description: The consumers city.
          type: string
          maxLength: 35
          example: Haarlem
        countryCode:
          $ref: '#/components/schemas/Country'
    BaseWebhook:
      type: object
      description: A single webhook object consists out of an URL to which we need to send the occurred event together with the event that needs to trigger the webhook call.
      required:
      - url
      - events
      properties:
        url:
          description: The URL the request must be send to.
          type: string
          format: url
          example: https://yourdomain.tld/webhooks?purchaseId=order123
        events:
          description: Type of events that will trigger a webhook.
          type: array
          minItems: 1
          items:
            type: string
    LastName:
      description: Consumer's last name.
      type: string
      maxLength: 35
      example: Doe
    RefundReason:
      description: 'The description for the refund for administrative purpose only. This reason will be visible in the portal.

        '
      type: string
      example: Refund required by consumer.
      maxLength: 255
    RefundsList:
      description: Details of all refunds belonging to a transaction.
      type: object
      required:
      - refunds
      properties:
        refunds:
          type: array
          items:
            $ref: '#/components/schemas/RefundDetails'
    RefundStatus:
      description: '* `SUCCESS`    - Refund has succeeded.

        * `PENDING`    - Refund is waiting to be processed.

        * `FAILURE`    - Refund has failed.

        * `CANCELLED`  - Refund has been cancelled.

        '
      type: string
      enum:
      - SUCCESS
      - PENDING
      - FAILURE
      - CANCELLED
      example: SUCCESS
    Address:
      allOf:
      - $ref: '#/components/schemas/AddressWithStateAndAdditionalData'
      - type: object
        required:
        - countryCode
    StatusSuccess:
      description: The transaction has been successfully paid.
      type: string
      format: enum
      enum:
      - SUCCESS
      example: SUCCESS
    Datetime:
      type: string
      format: date-time
      minLength: 20
      example: '2006-01-02T15:04:05Z'
      description: ISO 8601 date and time.
    StatusCancelled:
      description: The transaction has been cancelled by the consumer.
      type: string
      format: enum
      enum:
      - CANCELLED
      example: CANCELLED
    ReturnUrls:
      type: object
      description: 'URLs where the Consumer is redirected to after completing the transaction at its issuing bank or at the chosen payment method.


        With this object we can redirect consumer to a dedicated page per payment result status. Either this object or the returnUrl field is mandatory.'
      required:
      - success
      - cancelled
      - expired
      - failed
      properties:
        success:
          type: string
          format: url
          maxLength: 2000
          example: https://yourdomain.tld/order/payment-success.html
        cancelled:
          type: string
          format: url
          maxLength: 2000
          example: https://yourdomain.tld/order/payment-cancelled.html
        expired:
          type: string
          format: url
          maxLength: 2000
          example: https://yourdomain.tld/order/payment-expired.html
        failed:
          type: string
          format: url
          maxLength: 2000
          example: https://yourdomain.tld/order/payment-failed.html
    TransactionWebhooks:
      description: 'Array of webhooks that enables receiving a web request once a given event occurs. We won''t do preventive rate-limiting in order to have the highest throughput possible. However, we will honor 429 (Too-many-requests) responses per callback. We use the Retry-After header to retry after a certain period. If the header was not set we use our default exponential delay implementation.

        '
      type: array
      items:
        $ref: '#/components/schemas/TransactionWebhook'
      example:
      - url: https://yourdomain.tld/payment-webhooks?purchaseId=order123
        events:
        - STATUS_CHANGE
    TransactionId:
      description: ID received in the POST transaction response root object, which can be used in up following calls like refunds or cancellations as transactionId.
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      example: 8db1e7fa-ba8a-4189-92fd-67a20217443d
    ItemName:
      description: A human readable name of the item.
      type: string
      maxLength: 50
      example: Kingston microSD 32GB
    Email:
      description: The email address of the consumer.
      type: string
      format: email
      example: john.doe@email.tld
    StatusPending:
      description: The transaction is pending, meaning it could not be completed yet; waiting for something.
      type: string
      format: enum
      enum:
      - PENDING
      example: PENDING
    Consumer-2:
      description: The person initiating the checkout, typically the buyer who places the order.
      allOf:
      - $ref: '#/components/schemas/GenderlessConsumer'
      - type: object
        required:
        - name
        - email
        - phone
        - shippingAddress
        - dateOfBirth
      properties:
        name:
          type: object
          required:
          - lastName
          properties:
            initials:
              description: Consumer's initials.
              type: string
              maxLength: 20
              example: J
            lastName:
              allOf:
              - $ref: '#/components/schemas/LastName'
              - type: string
                maxLength: 250
        shippingAddress:
          $ref: '#/components/schemas/IN3Address'
        invoiceAddress:
          $ref: '#/components/schemas/IN3Address'
        business:
          type: object
          properties:
            name:
              type: string
              maxLength: 35
              example: CM
            cocNumber:
              type: string
              maxLength: 20
              example: '70528500'
    StatusChangeEvent:
      description: '* `STATUS_CHANGE` - Triggered when the status of a transaction changes.

        '
      type: string
      enum:
      - STATUS_CHANGE
      example: STATUS_CHANGE
    RefundDetails:
      description: Details of a refund.
      type: object
      required:
      - id
      - transactionId
      - amount
      - reason
      - status
      - created
      - updated
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        transactionId:
          $ref: '#/components/schemas/Uuid'
        amount:
          $ref: '#/components/schemas/Amount'
        reason:
          $ref: '#/components/schemas/RefundReason'
        status:
          $ref: '#/components/schemas/RefundStatus'
        created:
          $ref: '#/components/schemas/Datetime'
        updated:
          $ref: '#/components/schemas/Datetime'
    IN3Address:
      type: object
      description: The consumers address.
      allOf:
      - $ref: '#/components/schemas/Address'
      - description: 'The address of the consumer.

          It must include all required fields such as street, house number, postal code, city, and country code.

          If the shipping address is different from the billing address, it should be specified in the `shippingAddress` field.'
        type: object
        required:
        - street
        - houseNumber
        - postalCode
        - city
        - countryCode
      properties:
        addressedTo:
          type: string
          maxLength: 250
          example: Scenius
          description: The name or entity which shall accept the package/invoice
        houseNumberSuffix:
          type: string
          maxLength: 25
          example: A
    Uuid:
      description: Unique identifier
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      example: 8db1e7fa-ba8a-4189-92fd-67a20217443d
    FinalStatusEvent:
      description: '* `FINALSTATUS` - This value is deprecated and shouldn''t be used anymore. Use `STATUS_CHANGE` instead.

        '
      type: string
      enum:
      - FINALSTATUS
      example: FINALSTATUS
    StatusFailure:
      description: The transaction has failed.
      type: string
      format: enum
      enum:
      - FAILURE
      example: FAILURE
  headers:
    Digest:
      description: Digest of the whole message body. Follow [RFC 3230](https://datatracker.ietf.org/doc/html/rfc3230) for more information.
      schema:
        type: string
        example: sha-256=OWM5MDc3ODYwNzdjYjE5NjU0Y2NjMDM4MzEyYzMxZTA5MTAzMDBjYWM1Y2I1ODM4NTdlMDU2MzhiMzE1ZDhjNw==
  examples:
    BasicTransactionNoItems:
      summary: Open in3 transaction without items
      value:
        id: 60a4571e-1711-48d5-808c-50739eb652af
        status: OPEN
        webhooks:
        - url: https://yourdomain.tld/payment-webhooks?purchaseId=order123
          events:
          - STATUS_CHANGE
        returnUrls:
          success: https://yourdomain.tld/order/payment-success.html
          cancelled: https://yourdomain.tld/order/payment-cancelled.html
          expired: https://yourdomain.tld/order/payment-expired.html
          failed: https://yourdomain.tld/order/payment-failed.html
        invoice:
          reference: '202106231304112'
          amount: 12000
          description: Order at yourdomain.tld
        consumer:
          name:
            initials: A
            lastName: Lopez
          phone: '+31695613259'
          email: john.doe@email.tld
          dateOfBirth: '1996-12-31'
          shippingAddress:
            addressedTo: Scenius
            street: Rustenburgerlaan
            houseNumber: '25'
            houseNumberSuffix: A
            postalCode: 2012AL
            city: Haarlem
            countryCode: NL
            state: Noord-Holland
          invoiceAddress:
            addressedTo: Scenius
            street: Rustenburgerlaan
            houseNumber: '25'
            houseNumberSuffix: A
            postalCode: 2012AL
            city: Haarlem
            countryCode: NL
            state: Noord-Holland
          business:
            name: CM
            cocNumber: '70528500'
        expiresAt: '2025-09-17T15:04:05Z'
        items: []
        action:
          redirect:
            url: https://in3.ideal.nl/33110K9tcpeNE79SfAp7bcW132GdC8d5633078c543m0x40f
        created: '2025-09-17T09:30:46Z'
        updated: '2025-09-17T09:30:46Z'
    BasicTransaction-2:
      summary: Open in3 transaction
      value:
        id: bf4ca95d-3904-474b-bac2-dc25de3647d2
        status: OPEN
        webhooks:
        - url: https://yourdomain.tld/payment-webhooks?purchaseId=order123
          events:
          - STATUS_CHANGE
        returnUrls:
          success: https://yourdomain.tld/order/payment-success.html
          cancelled: https://yourdomain.tld/order/payment-cancelled.html
          expired: https://yourdomain.tld/order/payment-expired.html
          failed: https://yourdomain.tld/order/payment-failed.html
        invoice:
          reference: '202106231304112'
          amount: 12000
          description: Order at yourdomain.tld
        consumer:
          name:
            initials: A
            lastName: Lopez
          phone: '+31695613259'
          email: john.doe@email.tld
          dateOfBirth: '1996-12-31'
          shippingAddress:
            addressedTo: Scenius
            street: Rustenburgerlaan
            houseNumber: '25'
            houseNumberSuffix: A
            postalCode: 2012AL
            city: Haarlem
            countryCode: NL
            state: Noord-Holland
          invoiceAddress:
            addressedTo: Scenius
            street: Rustenburgerlaan
            houseNumber: '25'
            houseNumberSuffix: A
            postalCode: 2012AL
            city: Haarlem
            countryCode: NL
            state: Noord-Holland
          business:
            name: CM
            cocNumber: '70528500'
        expiresAt: '2025-09-17T15:04:05Z'
        items:
        - code: SDC4/32GB-2ADP
          name: Kingston microSD 32GB
          description: Best seller SD card
          unitPrice: 600
          quantity: 2
          vatAmount: 100
          vatRate: 20
