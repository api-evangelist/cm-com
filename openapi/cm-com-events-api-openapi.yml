  /events/:
    get:
      description: Returns your organisation's active events.
      operationId: ListEvents
      parameters:
      - description: Number of items to skip (default 0)
        in: query
        name: skip
        schema:
          type: integer
      - description: Page size (default 100)
        in: query
        name: take
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.listResponse-handler_eventResponse'
          description: OK
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rest.HttpError'
          description: Your token does not have permission to list events"That
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rest.HttpError'
          description: internal_server_error
      security:
      - SystemTokenAuth: []
      summary: List events
      tags:
      - Events
    post:
      description: 'Creates a new event. `description` and `discount_label` are objects keyed by language code (for example `{"en": "...", "nl": "..."}`); provide them for the languages you list in `languages`.'
      operationId: CreateEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/event.CreateEventRequest'
              description: Event payload
              summary: request
        description: Event payload
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.viewEventResponse'
          description: Created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rest.HttpError'
          description: validation error / timezone_not_found / venue_not_found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rest.HttpError'
          description: internal_server_error
      security:
      - SystemTokenAuth: []
      summary: Create event
      tags:
      - Events
    servers:
    - url: /ticketing/v1
  /events/{event_id}:
    delete:
      description: 'Deactivates an event: it is not removed, but `is_active` becomes `false`. Calling this on an event that is already inactive also returns `204`.'
      operationId: DeleteEvent
      parameters:
      - description: Event ID (UUID)
        in: path
        name: event_id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Event deactivated
        '404':
          content:
            application/json:
