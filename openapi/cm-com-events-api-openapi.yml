      summary: View event
      tags:
      - Events
    put:
      description: 'Replaces all editable fields of an event. This is a full replacement, not a partial update: send the complete event as you want it to be stored. Fields you leave out or set to `null`, and arrays you send empty, are cleared.'
      operationId: EditEvent
      parameters:
