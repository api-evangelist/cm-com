                      error_code:
                        type: integer
                        example: 400305
                        default: 0
                      error_details: {}
      deprecated: false
      tags:
      - Events
      security:
      - sec0: []
    servers:
    - url: https://api.ticketing.cm.com/partnerapi/v1.0
