    - url: /ticketing/v1
  /events/{event_uuid}/reservations/generate:
    post:
      summary: Generate Reservation
      description: This endpoint can be used to generate a reservation in your event. The reservation will be immediately completed and the order with barcodes is returned in the response. Note that this endpoint only generates **free** reservations and can only be used in combination with ticket types that have a price of 0.
      operationId: generate-reservation
      parameters:
      - name: X-TF-PREFERREDLANGUAGEID
        in: header
        description: 'Preferred order language. Will be used to determine the language of the confirmation e-mail. Valid values are: EN/NL/DE/FR'
        schema:
          type: string
          default: EN
      - name: event_uuid
        in: path
        description: 'Uuid of your event. Example: 00000000-0000-0000-0000-000000000000'
        schema:
          type: string
        required: true
      - name: X-TF-DISTRIBUTION-METHOD
        in: header
        description: 'Distribution method, available values: EMAIL/NONE'
        schema:
          type: string
          default: EMAIL
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ticket_types:
                  type: array
                  description: Contains the tickets that will be added to the reservation
                  items:
                    properties:
                      uuid:
                        type: string
                        description: The uuid of your ticket type
                      amount:
                        type: integer
                        description: The amount of tickets that will be added
                        format: int32
                    type: object
                external_batch_id:
                  type: string
                  description: Optional parameter which can be used to provide your own order reference. Max 40 characters. When filled in no confirmation e-mail will be sent out as CM assumes you already handled it in your own system.
                customer_data:
                  type: object
                  description: Contains the customer details of the ticket buyer
                  properties:
                    first_name:
                      type: string
                      description: Required. Max 128 characters.
                    initials:
                      type: string
                      description: Optional. Max 20 characters.
                    last_name:
                      type: string
                      description: Required. Max 128 characters.
                    email:
                      type: string
                      description: Required. Max 255 characters.
                    mobile:
                      type: string
                      description: Optional. Max 32 characters.
                    gender:
                      type: string
                      description: Optional.
                      enum:
                      - M
                      - F
                      - ''
                    address_line_1:
                      type: string
                      description: Optional. Max 255 characters
                    adress_line_1_building_number:
                      type: string
                      description: Optional. Max 20 characters.
                    address_line_2:
                      type: string
                      description: Optional. Max 255 characters.
                    address_line_2_building_number:
                      type: string
                      description: Optional. Max 20 characters.
                    zipcode:
                      type: string
                      description: Optional. Max 20 characters.
                    city:
                      type: string
                      description: Optional. Max 64 characters.
                    state:
                      type: string
                      description: Optional. Max 64 characters.
                    organization_name:
                      type: string
                      description: Optional. Max 128 characters.
                    position_name:
                      type: string
                      description: Optional. Max 128 characters.
                    date_of_birth:
                      type: string
