  /events/{event_uuid}/reservations/create:
    post:
      summary: Create Reservation
      description: This endpoint can be used to create a reservation in your event. This will not directly complete the reservation into an complete order.
      operationId: create-reservation
      parameters:
      - name: X-TF-PREFERREDLANGUAGEID
        in: header
        description: 'Preferred order language. Will be used to determine the language of the confirmation e-mail. Valid values are: EN/NL/DE/FR'
        schema:
          type: string
          default: EN
      - name: event_uuid
        in: path
        description: 'Uuid of your event. Example: 00000000-0000-0000-0000-000000000000'
        schema:
          type: string
        required: true
      - name: X-TF-DISTRIBUTION-METHOD
        in: header
        description: 'Distribution method, available values: EMAIL/NONE'
        schema:
          type: string
          default: EMAIL
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ticket_types:
                  type: array
                  description: Contains the tickets that will be added to the reservation
                  items:
                    properties:
                      uuid:
                        type: string
                        description: The uuid of your ticket type
                      amount:
                        type: integer
                        description: The amount of tickets that will be added
                        format: int32
                    type: object
                external_batch_id:
                  type: string
                  description: Optional parameter which can be used to provide your own order reference. Max 40 characters. When filled in no confirmation e-mail will be sent out as CM assumes you already handled it in your own system.
                customer_data:
                  type: object
                  description: Contains the customer details of the ticket buyer
                  properties:
                    first_name:
                      type: string
                      description: Required. Max 128 characters.
                    initials:
                      type: string
                      description: Optional. Max 20 characters.
                    last_name:
                      type: string
                      description: Required. Max 128 characters.
                    email:
                      type: string
                      description: Required. Max 255 characters.
                    mobile:
                      type: string
                      description: Optional. Max 32 characters.
                    gender:
                      type: string
                      description: Optional.
                      enum:
                      - M
                      - F
                      - ''
                    address_line_1:
                      type: string
                      description: Optional. Max 255 characters
                    adress_line_1_building_number:
                      type: string
                      description: Optional. Max 20 characters.
                    address_line_2:
                      type: string
                      description: Optional. Max 255 characters.
                    address_line_2_building_number:
                      type: string
                      description: Optional. Max 20 characters.
                    zipcode:
                      type: string
                      description: Optional. Max 20 characters.
                    city:
                      type: string
                      description: Optional. Max 64 characters.
                    state:
                      type: string
                      description: Optional. Max 64 characters.
                    organization_name:
                      type: string
                      description: Optional. Max 128 characters.
                    position_name:
                      type: string
                      description: Optional. Max 128 characters.
                    date_of_birth:
                      type: string
                      description: Optional. Format yyyy-mm-dd.
                      format: date
                    custom_field_1:
                      type: string
                      description: Optional. Max 255 characters. Can be used for additional details not covered in other fields.
                    custom_field_2:
                      type: string
                      description: Optional. Max 255 characters. Can be used for additional details not covered in other fields.
                    custom_field_3:
                      type: string
                      description: Optional. Max 255 characters. Can be used for additional details not covered in other fields.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{ \"order_id\": \"V179946815\", \"order_uuid\": \"00000000-0000-0000-0000-000000000000\", \"external_batch_id\": \"1b5d34ae08a0\", \"total_balance_incl_vat\": 0, \"currency_id\": \"EUR\", \"requested_language_id\": \"EN\",\n  \"download_url\": null,    \n\"customer_data\": { \"uuid\": \"00000000-0000-0000-0000-000000000000\", \"first_name\": \"John\", \"last_name\": \"Doe\", \"organisation\": \"CM.com\", \"email\": \"john.doe@example.com\", \"phone_number\": \"+31618895899\", \"custom_field_1\": \"Dietary preference: Vegetarian\", \"custom_field_2\": null, \"custom_field_3\": null }, \"barcodes\": [ { \"uuid\": \"00000000-0000-0000-0000-000000000000\", \"barcode_id\": \"IANEDVJORX\", \"barcode_type_id\": \"QRCODE\",\n      \"external_barcode_id\": null,\n\"price\": 0, \"currency_id\": \"EUR\", \"ticket_type\": { \"uuid\": \"00000000-0000-0000-0000-000000000000\", \"name\": { \"nl\": \"Entree Ticket\", \"en\": \"Entrance Ticket\", \"fr\": \"\", \"de\": \"\" }, \"subtitle\": { \"nl\": \"\", \"en\": \"\", \"fr\": \"\", \"de\": \"\" }, \"ticket_product_sub_type_id\": \"ENTRANCE_TICKET\", \"external_reference_2\": null, \"external_reference_3\": null }, \"customer_data\": {\n        \"uuid\": \"00000000-0000-0000-0000-000000000000\",\n        \"first_name\": \"John\",\n        \"last_name\": \"Doe\",\n        \"organisation\": \"CM.com\",\n        \"email\": \"john.doe@example.com\",\n        \"phone_number\": \"+31618895899\",\n        \"custom_field_1\": \"Dietary preference: Vegetarian\",\n        \"custom_field_2\": null,\n        \"custom_field_3\": null\n} }, { \"uuid\": \"00000000-0000-0000-0000-000000000000\", \"barcode_id\": \"FBCYGOCDES\", \"barcode_type_id\": \"QRCODE\",\n      \"external_barcode_id\": null,\n\"price\": 0, \"currency_id\": \"EUR\", \"ticket_type\": { \"uuid\": \"00000000-0000-0000-0000-000000000000\", \"name\": { \"nl\": \"Entree Ticket\", \"en\": \"Entrance Ticket\", \"fr\": \"\", \"de\": \"\" }, \"subtitle\": { \"nl\": \"\", \"en\": \"\", \"fr\": \"\", \"de\": \"\" }, \"ticket_product_sub_type_id\": \"ENTRANCE_TICKET\", \"external_reference_2\": null, \"external_reference_3\": null }, \"customer_data\": {\n        \"uuid\": \"00000000-0000-0000-0000-000000000000\",\n        \"first_name\": \"John\",\n        \"last_name\": \"Doe\",\n        \"organisation\": \"CM.com\",\n        \"email\": \"john.doe@example.com\",\n        \"phone_number\": \"+31618895899\",\n        \"custom_field_1\": \"Dietary preference: Vegetarian\",\n        \"custom_field_2\": null,\n        \"custom_field_3\": null\n} } ] }"
              schema:
                type: object
                properties:
                  order_id:
                    type: string
                    example: V179946815
