  /events/{event_uuid}/orders/{order_id}/cancel:
    post:
      summary: Cancel Order
      description: Can be used to cancel an existing reservation. This will cancel the entire reservation (including all tickets).
      operationId: cancel-order
      parameters:
      - name: event_uuid
        in: path
        description: 'Uuid of your event. Example: 00000000-0000-0000-0000-000000000000'
        schema:
          type: string
        required: true
      - name: order_id
        in: path
        description: 'Id of the order to cancel. Example: ZR36353102'
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{ "success": { "message": "Successfully canceled order: CM00000001." } }'
              schema:
                type: object
                properties:
                  success:
                    type: object
                    properties:
                      message:
                        type: string
                        example: 'Successfully canceled order: CM00000001.'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
