openapi: 3.2.0
info:
  title: Cm Com Events API
  version: '1.0'
  description: 'Operations tagged Events across 6 of this provider''s published API definitions: cm-com-live-entrance-management-v1-openapi.yml, cm-com-live-entrance-management-v2-openapi.yml, cm-com-live-event-ticketing-v1-openapi.yml, cm-com-live-ga-partner-v1-openapi.yml, cm-com-mobile-marketing-cloud-cdp-events-v1-openapi.yml, cm-com-mobile-marketing-cloud-cdp-profiles-v1-openapi.yml. Each path carries the servers of the definition it was published in.'
