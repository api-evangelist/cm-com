                            name:
                              type: object
                              properties:
                                nl:
                                  type: string
                                  example: Entree Ticket
                                en:
                                  type: string
                                  example: Entrance Ticket
                                fr:
                                  type: string
                                  example: ''
                                de:
                                  type: string
                                  example: ''
                            subtitle:
                              type: object
                              properties:
                                nl:
                                  type: string
                                  example: ''
                                en:
                                  type: string
                                  example: ''
