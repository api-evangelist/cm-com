          type: string
          maxLength: 36
          example: 00000000-0000-0000-0000-000000000000
        name:
          type: string
          maxLength: 255
          example: Main Entrance
        description:
          type: string
          maxLength: 255
          example: Entrance plan for main entrance
        isDefault:
          type: boolean
          description: Marks an entrancePlan as default plan.
        isActive:
          type: boolean
          description: Sets an entrancePlan as active/inactive.
        startAt:
          format: date-time
          type: string
        endAt:
          format: date-time
          type: string
        scanMode:
          type: string
          enum:
          - OFFLINE_SYNC
          - ONLINE
          example: OFFLINE_SYNC
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - NO_RULES
          example: ACTIVE
        children:
          type: array
          items:
            type: object
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        venues:
          type: array
          items:
            $ref: '#/components/schemas/Venue'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        organisation:
          type: object
      required:
      - uuid
      - name
      - isDefault
      - isActive
      - scanMode
    Condition:
      type: object
      properties:
        uuid:
          type: string
          maxLength: 36
          example: 00000000-0000-0000-0000-000000000000
        name:
          type: string
          maxLength: 255
          example: 'Scan Condition: Must be scanned once on entrance plan X'
        subject:
          type: string
          enum:
          - SUCCESS_SCANS_AMOUNT
          - TODAY_SUCCESS_SCANS_AMOUNT
          - IS_CHECKED_IN
          example: SUCCESS_SCANS_AMOUNT
        operator:
          type: string
          enum:
          - EQUALS
          - NOT_EQUALS
          - CONTAINS
          - NOT_CONTAINS
          - GREATER_THAN
          - GREATER_THAN_OR_EQUAL_TO
          - LOWER_THAN
          - LOWER_THAN_OR_EQUAL_TO
          - STARTS_WITH
          - ENDS_WITH
          - IS_BEFORE
          - IS_AFTER
          example: GREATER_THAN
        value:
          description: Value to compare the condition operator to.
          oneOf:
          - type: string
          - type: number
          - type: boolean
          - type: object
          example: 1
        entrancePlanId:
          type: string
          maxLength: 255
          example: 00000000-0000-0000-0000-000000000000
          description: uuid of entrance plan the condition applies to
        ruleId:
          type: string
          maxLength: 255
          example: 00000000-0000-0000-0000-000000000000
          description: uuid of rule the condition applies to
      required:
      - uuid
      - name
      - subject
      - operator
      - value
    PageMetaDto:
      type: object
      properties:
        page:
          type: number
        take:
          type: number
        skip:
          type: number
        itemCount:
          type: number
        pageCount:
          type: number
        hasPreviousPage:
          type: boolean
        hasNextPage:
          type: boolean
      required:
      - page
      - take
      - skip
      - itemCount
      - pageCount
      - hasPreviousPage
      - hasNextPage
    Rule:
      type: object
      properties:
        uuid:
          type: string
          maxLength: 36
          example: 00000000-0000-0000-0000-000000000000
        name:
          type: string
          maxLength: 255
          example: Scanning Rule All VIP tickets scannable twice
        maxValidations:
          type: number
          minimum: 0
          description: Amount a ticket can be validated (successfully scanned) on the rule. When 0 the ticket cannot be scanned.
        maxValidationScope:
          type: string
          enum:
          - UNRESTRICTED
          - DAILY
          - SAME_DAY
          example: UNRESTRICTED
          description: 'Defines the scope of maxValidations. UNRESTRICTED: total limit across entire validity period, DAILY: limit resets each day, SAME_DAY: all scans must occur on the same calendar day.'
        validFrom:
          format: date-time
          type: string
          description: Barcodes can be scanned from this date onwards
        validUntil:
          format: date-time
          type: string
          description: Barcodes can be scanned until this date.
        daysValidAfterPurchase:
          type: number
          description: Amount of days a barcode can be validated after its issued date (whole days, timestamp is not taken into account)
        shouldValidateTimeslotMoment:
          type: boolean
          description: If set to true a barcode with a timeslot can only be scanned on the (whole) day of the timeslot
        minutesBeforeTimeslot:
          type: number
          minimum: 0
          maximum: 120
          description: Minutes before the timeslot moment a barcode may be scanned. When set (together with/or minutesAfterTimeslot) the scan is validated against an exact time window around the timeslot instead of the whole day. Only applies when shouldValidateTimeslotMoment is true.
        minutesAfterTimeslot:
          type: number
          minimum: 0
          maximum: 120
          description: Minutes after the timeslot moment a barcode may be scanned. When set (together with/or minutesBeforeTimeslot) the scan is validated against an exact time window around the timeslot instead of the whole day. Only applies when shouldValidateTimeslotMoment is true.
        shouldValidateOnParent:
          type: boolean
          description: If set to true barcodes will be validated on the top-level parent of the entrance plan.
        scanColour:
          type: string
          default: '#3ddc97'
          description: Colour (hexcode) that is used on scanner display for successful checkins (Default is green).
        scanMessage:
          type: string
          maxLength: 255
          default: Barcode successfully checked in.
          description: Message displayed on successful checkin.
        requiresPhotoVerification:
          type: boolean
          description: If set to true a successful checkin requires staff to verify the visitor against a photo (e.g. Museumpass Belgium) before it is registered.
        requiresConfirmationQuestion:
          type: boolean
          description: If set to true a successful checkin requires staff to answer a confirmation question before it is registered.
        confirmationQuestion:
          type: string
          maxLength: 80
          example: Does this visitor meet the 18+ age requirement?
          description: Question shown to staff when requiresConfirmationQuestion is true.
        eventId:
          type: string
          maxLength: 255
          example: 00000000-0000-0000-0000-000000000000
          description: externalId of event the rule applies to
        venueSectionId:
          type: string
          maxLength: 255
          example: 00000000-0000-0000-0000-000000000000
          description: externalId of venueSection the rule applies to
        productId:
          type: string
          maxLength: 255
          example: 00000000-0000-0000-0000-000000000000
          description: externalId of product the rule applies to
        primaryConstraintId:
          type: string
          maxLength: 255
          example: 00000000-0000-0000-0000-000000000000
          description: externalId of constraint the rule applies to
        secondaryConstraintId:
          type: string
          maxLength: 255
          example: 00000000-0000-0000-0000-000000000000
          description: externalId of constraint the rule applies to
        tertiaryConstraintId:
          type: string
          maxLength: 255
          example: 00000000-0000-0000-0000-000000000000
          description: externalId of constraint the rule applies to
      required:
      - uuid
      - name
      - maxValidations
      - maxValidationScope
      - shouldValidateTimeslotMoment
      - shouldValidateOnParent
      - requiresPhotoVerification
      - requiresConfirmationQuestion
