                    type: string
                    example: 00000000-0000-0000-0000-000000000000
                  external_batch_id:
                    type: string
                    example: 1b5d34ae08a0
                  total_balance_incl_vat:
                    type: integer
                    example: 0
                    default: 0
                  currency_id:
                    type: string
                    example: EUR
                  requested_language_id:
                    type: string
                    example: EN
                  download_url: {}
                  customer_data:
                    type: object
                    properties:
                      uuid:
                        type: string
                        example: 00000000-0000-0000-0000-000000000000
                      first_name:
                        type: string
                        example: John
                      last_name:
                        type: string
                        example: Doe
                      organisation:
                        type: string
