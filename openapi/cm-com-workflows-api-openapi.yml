components:
  schemas:
    CM.Data.Core.Workflows.Api.Models.ApiGoal:
      type: object
      properties:
        eventTypeId:
          type: string
          format: uuid
        propertyName:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
        stopWorkflowWhenGoalIsMet:
          type: boolean
      additionalProperties: false
    CM.Data.Core.Workflows.Api.Models.ApiWorkflowSortOrder:
      enum:
      - 0
      - 1
      - 2
      type: integer
      format: int32
    CM.Data.Core.Workflows.Api.Models.ApiWorkflowFavoriteFilter:
      enum:
      - 0
      - 1
      - 2
      type: integer
      format: int32
    CM.Data.Core.Workflows.Api.Models.ApiWorkflowSearchFilter:
