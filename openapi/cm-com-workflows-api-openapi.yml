          type:
          - string
          - 'null'
          format: uuid
        summary:
          type:
          - string
          - 'null'
      additionalProperties: false
    CM.Data.Core.Workflows.Api.Models.Workflows.ApiWorkflow:
      type: object
      properties:
        jsonType:
          type:
          - string
          - 'null'
          readOnly: true
        id:
          type: string
          format: uuid
        name:
          type:
          - string
          - 'null'
        consentPurposeId:
          type:
          - string
          - 'null'
          format: uuid
        steps:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CM.Data.Core.Workflows.Api.Models.Steps.ApiStep'
        goal:
          $ref: '#/components/schemas/CM.Data.Core.Workflows.Api.Models.ApiGoal'
        enabled:
          type: boolean
        isReady:
          type: boolean
        createdBy:
          type:
          - string
          - 'null'
          format: uuid
        createdOn:
          type:
          - string
          - 'null'
          format: date-time
        modifiedBy:
          type:
          - string
          - 'null'
          format: uuid
        modifiedOn:
          type:
          - string
          - 'null'
          format: date-time
        isFavorite:
