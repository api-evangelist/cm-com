          - 'null'
        enabledStatus:
          $ref: '#/components/schemas/CM.Data.Core.Workflows.Api.Models.ApiWorkflowSearchEnabledStatus'
        sortOn:
          $ref: '#/components/schemas/CM.Data.Core.Workflows.Api.Models.ApiWorkflowSortOrder'
        reverse:
          type:
