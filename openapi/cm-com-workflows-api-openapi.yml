      additionalProperties: false
    CM.Data.Core.Workflows.Api.Models.ApiWorkflowSearchEnabledStatus:
      enum:
      - 0
      - 1
      - 2
      - 3
      type: integer
      format: int32
    CM.Data.Core.Workflows.Api.Models.Steps.ApiStep:
      type: object
      properties:
