openapi: 3.2.0
info:
  title: Cm Com Imports API
  contact: {}
  license:
    name: Proprietary
    url: https://www.cm.com
  version: '1.0'
  description: 'Operations tagged Imports across 2 of this provider''s published API definitions: cm-com-live-entrance-management-v1-openapi.yml, cm-com-live-entrance-management-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.cm.com
security:
- cookie: []
tags:
- name: Imports
  description: Data import operations
paths:
  /entrance/v1.0/organisations/{organisationUuid}/imports:
    get:
      operationId: ImportsController_findAll_v1.0
      parameters:
      - name: order
        required: false
        in: query
        schema:
          default: ASC
          type: string
          enum:
          - ASC
          - DESC
      - name: page
        required: false
        in: query
        schema:
          minimum: 1
          default: 1
          type: number
      - name: take
        required: false
        in: query
        schema:
          minimum: 1
          maximum: 5000
          default: 25
          type: number
      - name: search
        required: false
        in: query
        description: Returns only records that match the search query. Searches in most common fields such as name, description and for tickets all visitor data.
        schema:
          minLength: 1
          maxLength: 255
          type: string
      - name: status
        required: false
        in: query
        description: Comma separated values for import statuses
        schema:
          example: COMPLETED,FAILED
          type: string
      - name: organisationUuid
        required: true
        in: path
        schema: {}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import'
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - cookie: []
      summary: List all imports
      tags:
      - Imports
    servers:
    - url: https://api.cm.com
  /entrance/v1.0/organisations/{organisationUuid}/imports/{importUuid}/csv:
    get:
      operationId: ImportsController_downloadFailedRows_v1.0
      parameters:
      - name: importUuid
        required: true
        in: path
        schema:
          type: string
      - name: organisationUuid
        required: true
        in: path
        schema: {}
      responses:
        '200':
          description: Download a csv file with all records that failed to import
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - cookie: []
      summary: Download failed import rows as CSV
      tags:
      - Imports
    servers:
    - url: https://api.cm.com
  /entrance/v1.0/organisations/{organisationUuid}/imports/ticket/example/csv:
    get:
      operationId: ImportsController_downloadExampleTicketImportCsv_v1.0
      parameters:
      - name: organisationUuid
        required: true
        in: path
        schema: {}
      responses:
        '200':
          description: Returns an example csv file that can be used to import tickets
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - cookie: []
      summary: Download example ticket import CSV
      tags:
      - Imports
    servers:
    - url: https://api.cm.com
  /entrance/v1.0/organisations/{organisationUuid}/imports/{importUuid}:
    delete:
      operationId: ImportsController_remove_v1.0
      parameters:
      - name: importUuid
        required: true
        in: path
        schema:
          type: string
      - name: organisationUuid
        required: true
        in: path
        schema: {}
      responses:
        '204':
          description: ''
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - cookie: []
      summary: Delete an import
      tags:
      - Imports
    servers:
    - url: https://api.cm.com
  /entrance/v1.0/organisations/{organisationUuid}/imports/bulk-delete:
    post:
      operationId: ImportsController_delete_v1.0
      parameters:
      - name: organisationUuid
        required: true
        in: path
        schema: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteImportsDto'
      responses:
        '202':
          description: ''
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - cookie: []
      summary: Bulk delete imports
      tags:
      - Imports
    servers:
    - url: https://api.cm.com
