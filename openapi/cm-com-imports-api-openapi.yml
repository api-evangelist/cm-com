components:
  schemas:
    ErrorDto:
      type: object
      properties:
        errorCode:
          type: number
          example: 400100
          description: Error code specific to the error, consisting of a three digit http status code and a digit application specific code.
        description:
          type: string
          maxLength: 255
          example: Description of the error.
        httpStatus:
          type: number
          enum:
          - 100
          - 101
          - 102
          - 103
          - 200
          - 201
          - 202
          - 203
          - 204
          - 205
          - 206
          - 207
          - 208
          - 210
          - 300
          - 301
          - 302
          - 303
          - 304
          - 307
          - 308
          - 400
          - 401
          - 402
          - 403
          - 404
          - 405
          - 406
          - 407
          - 408
          - 409
          - 410
          - 411
          - 412
          - 413
          - 414
          - 415
          - 416
          - 417
          - 418
          - 421
          - 422
          - 423
          - 424
          - 428
          - 429
          - 456
          - 500
          - 501
          - 502
          - 503
          - 504
          - 505
          - 507
          - 508
          example: 400
      required:
      - errorCode
      - description
      - httpStatus
    Import:
      type: object
      properties:
        uuid:
          type: string
          maxLength: 36
          example: 00000000-0000-0000-0000-000000000000
        name:
          type: string
          maxLength: 255
          example: Import name
        importedRecords:
          type: number
          readOnly: true
        failedRecords:
          type: number
          readOnly: true
        errorDetails:
          readOnly: true
          type: array
          items:
            type: string
        completedAt:
          format: date-time
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
          enum:
          - SCHEDULED
          - RUNNING
          - COMPLETED
          - COMPLETED_WITH_FAILURES
          - FAILED
          example: COMPLETED
        type:
          type: string
          readOnly: true
          enum:
          - TICKET
          - EVENT
          - VENUE
          - PRODUCT
          example: TICKET
        isVisible:
          type: boolean
          description: If set to true the upload will be displayed under imports in the dashboard.
          default: false
      required:
      - uuid
      - name
      - importedRecords
      - failedRecords
      - errorDetails
      - completedAt
      - status
      - type
      - isVisible
    DeleteImportsDto:
      type: object
      properties:
        uuids:
          description: Array of import uuids
          type: array
          items:
            type: array
      required:
      - uuids
  securitySchemes:
    cookie:
      type: apiKey
      in: cookie
      name: connect.sid
