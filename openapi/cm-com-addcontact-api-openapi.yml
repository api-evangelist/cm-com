openapi: 3.2.0
info:
  title: Global Reseller Add Contact API
  version: '1.0'
  description: The Global Reseller API allows API users to pull availability and ticket types for connected clients.
servers:
- url: https://globalreseller.nl/webservices
security:
- {}
tags:
- name: AddContact
paths:
  /addContact:
    post:
      summary: /addContact
      description: 'This functionality is used to add contact information to a reservation. Please add as many customer information as possible for support and aftersale purposes for the users (museums).


        **HMACKey:** `Base64 encode - SHA256(apiKey + customerAddressCity + customerAddressNumber + customerAddressPostalCode + customerAddressStreet + customerCountry + customerEmailAddress + customerFirstName + customerMiddleName + customerPhoneNumber + customerSurname + environment + reservationId + userId)`'
      operationId: addcontact
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - apiKey
              - environment
              - userId
              - reservationId
              - customerFirstName
              - customerSurname
              - customerEmailAddress
              - HMACKey
              properties:
                apiKey:
                  type: string
                  description: Your public apiKey needs to be included in every request
                environment:
                  type: string
                  description: '"test" or "production"'
                  enum:
                  - production
                  - test
                userId:
                  type: integer
                  description: The userId is a reference to the user (museum / attraction). The userId can be requested via getAvailableUsers and can be cached in your application
                  format: int32
                reservationId:
                  type: integer
                  description: Include the reservationId from the createReservation request
                  format: int32
                customerFirstName:
                  type: string
                  description: First name of the customer
                customerMiddleName:
                  type: string
                  description: 'Mostly used in Dutch names. For example: Vincent van Gogh'
                customerSurname:
                  type: string
                  description: Surname of the customer
                customerEmailAddress:
                  type: string
                  description: Email address of the customer
                customerPhoneNumber:
                  type: string
                  description: Telephonenumber of the customer
                customerAddressStreet:
                  type: string
                  description: Street address of the customer
                customerAddressNumber:
                  type: string
                  description: Housenumber of the customer
                customerAddressPostalCode:
                  type: string
                  description: Postal code of the customer
                customerAddressCity:
                  type: string
                  description: City of the customer
                customerCountry:
                  type: string
                  description: Country of the customer according to the ISO 3166-1 (2 letter country code)
                HMACKey:
                  type: string
                  description: The HMACKey is calculated based on the input fields. Base64 encode - SHA256(apiKey + customerAddressCity + customerAddressNumber + customerAddressPostalCode + customerAddressStreet + customerCountry + customerEmailAddress + customerFirstName + customerMiddleName + customerPhoneNumber + customerSurname + environment + reservationId + userId).
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    success: true
                    message: contactInfo add was successfully.
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    default: true
                  message:
                    type: string
                    example: contactInfo add was successfully.
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value:
                    success: false
                    message: contactInfo add failed.
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                    default: true
                  message:
                    type: string
                    example: contactInfo add failed.
      deprecated: false
      tags:
      - AddContact
x-readme:
  headers:
  - key: Cache-Control
    value: no-cache
  explorer-enabled: true
  proxy-enabled: true
x-readme-fauxas: true
