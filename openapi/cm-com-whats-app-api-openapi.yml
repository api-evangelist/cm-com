      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: profileId
        in: path
        description: The profile identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: phoneNumber
        in: query
        description: The phone number.
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Accepted
          content:
            application/json:
