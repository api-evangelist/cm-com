openapi: 3.2.0
info:
  title: Channels WhatsApp API
  description: Check channel availability and manage onboarding for SMS, WhatsApp, RCS, and other supported channels.
  version: v1
  license:
    name: Proprietary
    url: https://www.cm.com
servers:
- url: https://api.cm.com
  description: Production Server
security:
- ProductToken: []
tags:
- name: Whats App
paths:
  /channels/v1/accounts/{accountId}/whatsapp/{channelRequestId}/businessaccount/marketingliteapi/eligibility:
    get:
      tags:
      - Whats App
      summary: Get a WhatsApp business account's marketing lite API eligibility status
      operationId: WhatsApp_GetBusinessAccountMarketingLiteApiEligibilityStatusAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: forceMetaStatusUpdate
        in: query
        description: The force meta status update.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppBusinessAccountMarketingLiteApiEligibility'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppBusinessAccountMarketingLiteApiEligibility'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppBusinessAccountMarketingLiteApiEligibility'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppBusinessAccountMarketingLiteApiEligibility'
  /channels/v1/accounts/{accountId}/whatsapp/{channelRequestId}/businessaccount/marketingliteapi/business/onboard:
    post:
      tags:
      - Whats App
      summary: Start a WhatsApp business account's Meta business marketing lite API onboarding
      operationId: WhatsApp_StartBusinessAccountMarketingLiteApiBusinessOnboardingAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: NoContent
  /channels/v1/accounts/{accountId}/whatsapp/{channelRequestId}/businessaccount/marketingliteapi/eligibility/numbers:
    post:
      tags:
      - Whats App
      summary: Get WhatsApp business account numbers' marketing lite API eligibility status
      operationId: WhatsApp_GetBusinessAccountMarketingLiteApiNumberEligibilityStatusAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppBusinessAccountMarketingLiteApiNumberEligibility'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppBusinessAccountMarketingLiteApiNumberEligibility'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppBusinessAccountMarketingLiteApiNumberEligibility'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppBusinessAccountMarketingLiteApiNumberEligibility'
  /channels/v1/accounts/{accountId}/whatsapp/{channelRequestId}/businessaccount/marketingliteapi/numbers/{numberId}/onboard:
    post:
      tags:
      - Whats App
      summary: Start a WhatsApp business account eligible number's marketing lite API…
      operationId: WhatsApp_StartBusinessAccountMarketingLiteApiEligibleNumberOnboardingAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: numberId
        in: path
        description: The number identifier.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: NoContent
  /channels/v1/accounts/{accountId}/whatsapp/embeddedsignup/accesstoken:
    post:
      tags:
      - Whats App
      summary: Processes an embedded sign up session token
      operationId: WhatsApp_ProcessEmbeddedSignUpSessionTokenAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: userAccessToken
        in: query
        description: The user access token.
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
            text/xml:
              schema:
                type: string
            multipart/form-data:
              schema:
                type: string
  /channels/v1/accounts/{accountId}/whatsapp/embeddedsignup/code:
    post:
      tags:
      - Whats App
      summary: Processes the embedded sign up session code asynchronous
      operationId: WhatsApp_ProcessEmbeddedSignUpSessionCodeAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: sessionCode
        in: query
        description: The session code.
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppBusinessAccountEmbeddedSignupSessionCodeResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppBusinessAccountEmbeddedSignupSessionCodeResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppBusinessAccountEmbeddedSignupSessionCodeResponse'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppBusinessAccountEmbeddedSignupSessionCodeResponse'
  /channels/v1/accounts/{accountId}/whatsapp/{channelRequestId}/businessaccount:
    get:
      tags:
      - Whats App
      summary: Gets a WhatsApp business account
      operationId: WhatsApp_GetBusinessAccountAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppBusinessAccount'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppBusinessAccount'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppBusinessAccount'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppBusinessAccount'
    post:
      tags:
      - Whats App
      summary: Adds the business account asynchronous
      operationId: WhatsApp_AddBusinessAccountAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: facebookId
        in: query
        description: The whats application business account identifier.
        required: false
        schema:
          type: string
      - name: businessIntegrationAccessToken
        in: query
        description: The business integration access token.
        required: false
        schema:
          type: string
      responses:
        '201':
          description: Created
  /channels/v1/accounts/{accountId}/whatsapp/{channelRequestId}/businessaccount/forminput:
    get:
      tags:
      - Whats App
      summary: Gets the business account form input asynchronous
      operationId: WhatsApp_GetBusinessAccountFormInputAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiChannelRequestFormInputResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiChannelRequestFormInputResponse'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiChannelRequestFormInputResponse'
            multipart/form-data:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiChannelRequestFormInputResponse'
  /channels/v1/accounts/{accountId}/whatsapp/{channelRequestId}/businessaccount/{businessAccountId}/forminput:
    put:
      tags:
      - Whats App
      summary: Adds WhatsApp business account form input
      operationId: WhatsApp_AddBusinessAccountFormInputAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: businessAccountId
        in: path
        description: The business account identifier.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        $ref: '#/components/requestBodies/CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequestArray'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppBusinessAccount'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppBusinessAccount'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppBusinessAccount'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppBusinessAccount'
  /channels/v1/accounts/{accountId}/whatsapp/supportedlanguages:
    get:
      tags:
      - Whats App
      summary: Gets the WhatsApp supported languages
      operationId: WhatsApp_GetWhatsAppSupportedLanguagesAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppSupportedLanguage'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppSupportedLanguage'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppSupportedLanguage'
            multipart/form-data:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppSupportedLanguage'
  /channels/v1/accounts/{accountId}/whatsapp/{channelRequestId}/profiles/{profileId}/conversationalcomponents:
    get:
      tags:
      - Whats App
      summary: Get a profile's conversational components
      operationId: WhatsApp_GetProfileConversationalComponentsAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: profileId
        in: path
        description: The profile identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppProfileConversationalComponents'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppProfileConversationalComponents'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppProfileConversationalComponents'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppProfileConversationalComponents'
    put:
      tags:
      - Whats App
      summary: Update a profile's conversational components
      operationId: WhatsApp_UpdateProfileConversationalComponentsAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: profileId
        in: path
        description: The profile identifier.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppProfileConversationalComponents'
          text/json:
            schema:
              $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppProfileConversationalComponents'
          text/xml:
            schema:
              $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppProfileConversationalComponents'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppProfileConversationalComponents'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppProfileConversationalComponents'
        description: The conversational components.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppProfileConversationalComponents'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppProfileConversationalComponents'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppProfileConversationalComponents'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppProfileConversationalComponents'
  /channels/v1/accounts/{accountId}/whatsapp/{channelRequestId}/profiles:
    get:
      tags:
      - Whats App
      summary: Gets all known WhatsApp profiles
      operationId: WhatsApp_GetProfilesAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: q
        in: query
        description: The search query.
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: The status.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - ACTIVE
            - PENDING
            - ELIGIBLE
            - NOT_VALIDATED
            - CUSTOMER_ACTION_REQUIRED
            - EXPIRED
            - REJECTED
            - CANCELLED
            - DELETED
      - name: includeMetaQualityRating
        in: query
        description: if set to true [include meta quality rating].
        required: false
        schema:
          type: boolean
      - name: skip
        in: query
        description: The skip.
        required: false
        schema:
          type: integer
          format: int32
      - name: take
        in: query
        description: The take.
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppProfileBase'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppProfileBase'
    post:
      tags:
      - Whats App
      summary: Adds a WhatsApp profile
      operationId: WhatsApp_AddProfileAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: simulate
        in: query
        description: if set to true [simulate].
        required: false
        schema:
          type: boolean
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppProfile'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppProfile'
  /channels/v1/accounts/{accountId}/whatsapp/{channelRequestId}/profiles/{profileId}:
    get:
      tags:
      - Whats App
      summary: Gets a WhatsApp profile
      operationId: WhatsApp_GetProfileAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: profileId
        in: path
        description: The profile identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: includeMetaSupplierInfo
        in: query
        description: if set to true [include meta supplier information].
        required: false
        schema:
          type: boolean
      - name: syncWithMeta
        in: query
        description: if set to true [synchronize with meta].
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppProfile'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppProfile'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppProfile'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.WhatsApp.ApiWhatsAppProfile'
    delete:
      tags:
      - Whats App
      summary: Deletes a WhatsApp profile
      operationId: WhatsApp_DeleteProfileAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: profileId
        in: path
        description: The profile identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: NoContent
  /channels/v1/accounts/{accountId}/whatsapp/{channelRequestId}/profiles/{profileId}/forminput:
    get:
      tags:
      - Whats App
      summary: Gets a WhatsApp profile's form input
      operationId: WhatsApp_GetProfileFormInputAsync
      parameters:
      - name: accountId
