openapi: 3.2.0
info:
  version: v1
  title: Messages API
servers:
- url: https://api.cm.com
tags:
- name: Messages
paths:
  /messages/v1/accounts/{accountId}/messages:
    get:
      tags:
      - Messages
      summary: Gets campaigns paged
      operationId: Messages_GetMessagesAsync
      parameters:
      - name: accountId
        in: path
        description: The account id.
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        description: Message status id.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: orderby
        in: query
        description: 'Column names (date, price, recipients, name) to order messages. add desc to

          order desc (ex: date desc)'
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: includePreview
        in: query
        description: If true returns the preview as well
        required: false
        schema:
          type: boolean
      - name: isArchived
        in: query
        description: Used to get archived results
        required: false
        schema:
          type: boolean
      - name: skip
        in: query
        description: The skip.
        required: false
        schema:
          type: integer
          format: int32
      - name: take
        in: query
        description: The take.
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageResponse'
    post:
      tags:
      - Messages
      summary: Adds a campaign
      operationId: Messages_AddMessageAsync
      parameters:
      - name: accountId
        in: path
        description: The accountId.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        $ref: '#/components/requestBodies/CM.Platform.Messages.Models.ApiMessageRequest2'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageResponse'
    delete:
      tags:
      - Messages
      summary: Deletes multiple campaigns
      operationId: Messages_DeleteMessagesAsync
      parameters:
      - name: accountId
        in: path
        description: The accountId.
        required: true
        schema:
          type: string
          format: uuid
      - name: messageIds
        in: query
        description: The identifier.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            format: uuid
      responses:
        '204':
          description: NoContent
  /messages/v1/accounts/{accountId}/messages/test:
    post:
      tags:
      - Messages
      summary: Sends a test campaign
      operationId: Messages_SendTestMessageOnTheFlyAsync
      parameters:
      - name: accountId
        in: path
        description: The accountId.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiTestMessageRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiTestMessageRequest'
          text/xml:
            schema:
              $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiTestMessageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiTestMessageRequest'
        description: The Message.
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageResponse'
  /messages/v1/accounts/{accountId}/messages/cost:
    post:
      tags:
      - Messages
      summary: Gets cost estimation for specified campaign
      operationId: Messages_CalculateMessageCostAsync
      parameters:
      - name: accountId
        in: path
        description: The accountId.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        $ref: '#/components/requestBodies/CM.Platform.Messages.Models.ApiMessageRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageCost'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageCost'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageCost'
  /messages/v1/accounts/{accountId}/messages/{messageId}/cancel:
    post:
      tags:
      - Messages
      summary: Cancels a campaign
      operationId: Messages_CancelMessageAsync
      parameters:
      - name: accountId
        in: path
        description: The accountId.
        required: true
        schema:
          type: string
          format: uuid
      - name: messageId
        in: path
        description: The identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageResponse'
  /messages/v1/accounts/{accountId}/messages/{messageId}:
    get:
      tags:
      - Messages
      summary: Gets a campaign by id
      operationId: Messages_GetMessageAsync
      parameters:
      - name: accountId
        in: path
        description: The accountId.
        required: true
        schema:
          type: string
          format: uuid
      - name: messageId
        in: path
        description: The identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: includePreview
        in: query
        description: If true gets the preview as well.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageResponse'
    put:
      tags:
      - Messages
      summary: Updates a campaign
      operationId: Messages_UpdateMessageAsync
      parameters:
      - name: accountId
        in: path
        description: The accountId.
        required: true
        schema:
          type: string
          format: uuid
      - name: messageId
        in: path
        description: The identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: versioned
        in: query
        description: If true message version will be checked before updates
        required: false
        schema:
          type: boolean
      requestBody:
        $ref: '#/components/requestBodies/CM.Platform.Messages.Models.ApiMessageRequest2'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageResponse'
    delete:
      tags:
      - Messages
      summary: Deletes a campaign
      operationId: Messages_DeleteMessageAsync
      parameters:
      - name: accountId
        in: path
        description: The accountId.
        required: true
        schema:
          type: string
          format: uuid
      - name: messageId
        in: path
        description: The identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: NoContent
  /messages/v1/accounts/{accountId}/messages/{messageId}/export:
    get:
      tags:
      - Messages
      summary: Export CSV based on message status
      operationId: Messages_ExportRecipientsCsvAsync
      parameters:
      - name: accountId
        in: path
        description: The account guid.
        required: true
        schema:
          type: string
          format: uuid
      - name: messageId
        in: path
        description: The message id.
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        description: Status of the message can only be delivered, undelivered, converted, unconverted or all.
        required: false
        schema:
          type: string
      - name: fields
        in: query
        description: Custom fields to export
        required: false
        explode: true
        schema:
          type: array
          items:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            text/xml:
              schema:
                type: object
  /messages/v1/accounts/{accountId}/messages/{messageId}/export/addressbook:
    get:
      tags:
      - Messages
      summary: Export to Addressbook based on message status
      operationId: Messages_ExportRecipientsToAddressbookAsync
      parameters:
      - name: accountId
        in: path
        description: The account guid.
        required: true
        schema:
          type: string
          format: uuid
      - name: messageId
        in: path
        description: The message id.
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        description: Status of the message can only be delivered, undelivered, converted, unconverted or all.
        required: false
        schema:
          type: string
      - name: exportId
        in: query
        description: The export id.
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiExportStatus'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiExportStatus'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiExportStatus'
  /messages/v1/accounts/{accountId}/messages/preview:
    post:
      tags:
      - Messages
      summary: Gets preview for specified campaign
      operationId: Messages_GenerateMessagePreviewAsync
      parameters:
      - name: accountId
        in: path
        description: The accountId.
        required: true
        schema:
          type: string
          format: uuid
      - name: previewCode
        in: query
        description: The country or language code for preview
        required: false
        schema:
          type: string
      - name: numberOfPreviews
        in: query
        description: Number of previews to generate, default is 5
        required: false
        schema:
          type: integer
          format: int32
      - name: useFieldNames
        in: query
        description: Uses field names instead of sample data
        required: false
        schema:
          type: boolean
      requestBody:
        $ref: '#/components/requestBodies/CM.Platform.Messages.Models.ApiMessageRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessagePreview'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessagePreview'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessagePreview'
  /messages/v1/accounts/{accountId}/messages/{messageId}/cost:
    get:
      tags:
      - Messages
      summary: Gets cost estimation for specified campaign
      operationId: Messages_GetMessageCostAsync
      parameters:
      - name: accountId
        in: path
        description: The accountId.
        required: true
        schema:
          type: string
          format: uuid
      - name: messageId
        in: path
        description: The group ids to fetch
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageCost'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageCost'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageCost'
  /messages/v1/accounts/{accountId}/messages/{messageId}/preview:
    get:
      tags:
      - Messages
      summary: Gets preview for specified campaign
      operationId: Messages_GetMessagePreviewAsync
      parameters:
      - name: accountId
        in: path
        description: The accountId.
        required: true
        schema:
          type: string
          format: uuid
      - name: messageId
        in: path
        description: The group ids to fetch
        required: true
        schema:
          type: string
          format: uuid
      - name: countryCode
        in: query
        description: The country code
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
            text/json:
              schema:
                type: array
                items:
                  type: string
            text/xml:
              schema:
                type: array
                items:
                  type: string
  /messages/v1/accounts/{accountId}/messages/count:
    get:
      tags:
      - Messages
      summary: Gets campaign counts per status
      operationId: Messages_GetMessageCountAsync
      parameters:
      - name: accountId
        in: path
        description: The account id.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageCount'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageCount'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageCount'
  /messages/v1/accounts/{accountId}/messages/{messageId}/status:
    get:
      tags:
      - Messages
      summary: Provides diagnostic info about campaign
      operationId: Messages_GetMessageStatusAsync
      parameters:
      - name: accountId
        in: path
        description: The account guid.
        required: true
        schema:
          type: string
          format: uuid
      - name: messageId
        in: path
        description: The message id.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
            text/json:
              schema:
                type: object
                additionalProperties:
                  type: string
            text/xml:
              schema:
                type: object
                additionalProperties:
                  type: string
      deprecated: true
  /messages/v1/accounts/{accountId}/messages/{messageId}/pause:
    post:
      tags:
      - Messages
      summary: Pause sending a campaign
      operationId: Messages_PauseMessageAsync
      parameters:
      - name: accountId
        in: path
        description: The accountId.
        required: true
        schema:
          type: string
          format: uuid
      - name: messageId
        in: path
        description: The identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageResponse'
  /messages/v1/accounts/{accountId}/messages/{messageId}/resume:
    post:
      tags:
      - Messages
      summary: Resume sending a campaign
      operationId: Messages_ResumeMessageAsync
      parameters:
      - name: accountId
        in: path
        description: The accountId.
        required: true
        schema:
          type: string
          format: uuid
      - name: messageId
        in: path
        description: The identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageResponse'
  /messages/v1/accounts/{accountId}/messages/search/{term}:
    get:
      tags:
      - Messages
      summary: Search campaigns with specified terms
      operationId: Messages_SearchMessagesAsync
      parameters:
      - name: accountId
        in: path
        description: The accountId.
        required: true
        schema:
          type: string
          format: uuid
      - name: term
        in: path
        description: The search terms
        required: true
        schema:
          type: string
      - name: statuses
        in: query
        description: The message status terms
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: isArchived
        in: query
        description: The message is archived
        required: false
        schema:
          type: boolean
      - name: skip
        in: query
        description: The skip.
        required: false
        schema:
          type: integer
          format: int32
      - name: take
        in: query
        description: The take.
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiMessageResponse'
  /messages/v1/accounts/{accountId}/messages/{messageId}/test:
    post:
      tags:
      - Messages
      summary: Sends a test campaign
      operationId: Messages_SendTestMessageAsync
      parameters:
      - name: accountId
        in: path
        description: The accountId.
        required: true
        schema:
          type: string
          format: uuid
      - name: messageId
        in: path
        description: The identifier.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiRecipient'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiRecipient'
          text/xml:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiRecipient'
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiRecipient'
        description: The test message recipients.
        required: true
      responses:
        '200':
          description: OK
  /messages/v1/accounts/{accountId}/messages/{messageId}/tags:
    get:
      tags:
      - Messages
      summary: Returns array of data tag ids used in a campaign
      operationId: Messages_GetMessageDataTagsAsync
      parameters:
      - name: accountId
        in: path
        description: The accountId.
        required: true
        schema:
          type: string
          format: uuid
      - name: messageId
        in: path
        description: The identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  format: int32
                  type: integer
            text/json:
              schema:
                type: array
                items:
                  format: int32
                  type: integer
            text/xml:
              schema:
                type: array
                items:
                  format: int32
                  type: integer
  /messages/v1/accounts/{accountId}/messages/{messageId}/trigger:
    post:
      tags:
      - Messages
      summary: Sends a triggered campaign
      operationId: Messages_SendTriggeredMessageAsync
      parameters:
      - name: accountId
        in: path
        description: The accountId.
        required: true
        schema:
          type: string
          format: uuid
      - name: messageId
        in: path
        description: The identifier.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiRecipient'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiRecipient'
          text/xml:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiRecipient'
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiRecipient'
        description: The triggered message recipients.
        required: true
      responses:
        '200':
          description: OK
components:
  schemas:
    CM.Platform.Messages.Models.ApiExportStatus:
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        isComplete:
          type: boolean
        groupId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
    CM.Platform.Messages.Models.ApiMessageRequest:
      type: object
      properties:
        isArchived:
          type: boolean
        body:
          type: string
        channels:
          type: array
          items:
            type: string
        countrySpecificSenders:
          type: object
          additionalProperties:
            type: string
        grouping:
          type: string
        ignoreUnsubscribes:
          type: boolean
        name:
          type: string
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiRecipient'
        recurrence:
          type: string
        content:
          type: array
          items:
            $ref: '#/components/schemas/CM.Platform.Messages.Models.Conversation'
        scheduledAtUtc:
          format: date-time
          type: string
        senderPreset:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        senders:
          type: array
          items:
            type: string
        spread:
          $ref: '#/components/schemas/CM.Platform.Messages.Models.ApiSpreadSettings'
        status:
          type: string
        tariff:
          format: int32
          type: integer
        modifiedAtUtc:
          format: date-time
          type: string
        updatedAtUtc:
          type: string
    CM.Platform.Messages.Models.ApiMessageCount:
      type: object
      properties:
        draft:
          format: int32
          type: integer
        template:
          format: int32
          type: integer
        scheduled:
          format: int32
          type: integer
        sent:
          format: int32
          type: integer
        archived:
          format: int32
          type: integer
        triggered:
          format: int32
          type: integer
    CM.Platform.Messages.Models.ApiCountryErrorStats:
      type: object
      properties:
        country:
          type: string
        count:
          format: int32
          type: integer
        errorCode:
          format: int32
          type: integer
    CM.Platform.Messages.Models.ApiMessagePreviewSuggestion:
      type: object
      properties:
        type:
          type: string
        content:
          type: string
    CM.Platform.Messages.Models.ApiCountryStats:
      type: object
      properties:
        country:
          type: string
        accepted:
          format: int32
          type: integer
        converted:
          format: int32
          type: integer
        delivered:
          format: int32
          type: integer
        deliveryTime:
          format: double
          type: number
        dispatched:
          format: int32
          type: integer
        failed:
          format: int32
          type: integer
