openapi: 3.2.0
info:
  title: Mobile Identity Identity Match API
  description: Mobile Identity API
  version: 1.0.0
servers:
- url: https://api.cm.com/mobile-identity/v1
- url: https://api.cm.com/mobile-identity-sandbox/v1
security:
- JWT: []
tags:
- name: Identity Match
  description: Request an Identity Match check
paths:
  /identity-match:
    post:
      operationId: create_identity_match
      summary: Identity Match
      description: Match the provided person details to the given phone number
      tags:
      - Identity Match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityMatchRequest'
      responses:
        '200':
          description: Boolean or score out of 100 per property regarding its match. Response depends on the provided service type request field.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/IdentityMatchMatchResponse'
                - $ref: '#/components/schemas/IdentityMatchScoreResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    NotFound:
      description: Errors related to the request URL
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            message: Not found
            code: 1000
    Unauthorized:
      description: Errors related to the authorization.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 401
            message: Unauthorized
            code: 1000
    InternalServerError:
      description: Errors related to the transaction.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 500
            message: Transaction could not be started
            code: 1002
    BadRequest:
      description: Errors related to the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            message: The phone number field is required
            code: 2001
  schemas:
    IdentityMatchRequest:
      type: object
      properties:
        phoneNumber:
          type: string
          description: The phone number to match the person to. Must be in E.164 format.
          examples:
          - '+31612345678'
        serviceType:
          $ref: '#/components/schemas/IdentityMatchType'
          description: Type of Identity Match response to be retrieved.
          examples:
          - match
        firstName:
          type:
          - string
          - 'null'
          description: The first name of the person to match to
          maxLength: 255
          examples:
          - John
        lastName:
          type:
          - string
          - 'null'
          description: The last name of the person to match to
          maxLength: 255
          examples:
          - Doe
        address:
          type:
          - string
          - 'null'
          description: House number, first line of the address of the person to match to
          maxLength: 255
          examples:
          - Konijnenberg 24
        address2:
          type:
          - string
          - 'null'
          description: Optional additional address line
          maxLength: 255
        address3:
          type:
          - string
          - 'null'
          description: Optional additional address line
          maxLength: 255
        postalCode:
          type:
          - string
          - 'null'
          description: Postal code of the address of the person to match to
          maxLength: 255
          examples:
          - 4825 BD
        dateOfBirth:
          type:
          - string
          - 'null'
          description: The date of birth of the person to match to. In 'YYYY-MM-DD' format.
          format: date
          examples:
          - '1965-03-10'
      required:
      - phoneNumber
      - serviceType
    IdentityMatchScoreResponse:
      type: object
      properties:
        state:
          $ref: '#/components/schemas/ResponseState'
        firstNameScore:
          type: integer
          description: Score of the match of the provided first name to the provided phone number. The value can be `-1` if the data is not available or accessible, or if an unexpected error is returned when retrieving the data from the operator.
          minimum: -1
          maximum: 100
          examples:
          - 100
        lastNameScore:
          type: integer
          description: Score of the match of the provided last name to the provided phone number. The value can be `-1` if the data is not available or accessible, or if an unexpected error is returned when retrieving the data from the operator.
          minimum: -1
          maximum: 100
          examples:
          - 100
        nameScore:
          type: integer
          description: Score of the match of the provided full name to the provided phone number. The value can be `-1` if the data is not available or accessible, or if an unexpected error is returned when retrieving the data from the operator.
          minimum: -1
          maximum: 100
          examples:
          - 100
        addressScore:
          type: integer
          description: Score of the match of the provided address to the provided phone number. The value can be `-1` if the data is not available or accessible, or if an unexpected error is returned when retrieving the data from the operator.
          minimum: -1
          maximum: 100
          examples:
          - 100
        postalCodeScore:
          type: integer
          description: Score of the match of the provided postal code to the provided phone number. The value can be `-1` if the data is not available or accessible, or if an unexpected error is returned when retrieving the data from the operator.
          minimum: -1
          maximum: 100
          examples:
          - 100
        dateOfBirthScore:
          type: integer
          description: Score of the match of the provided date of birth to the provided phone number. The value can be `-1` if the data is not available or accessible, or if an unexpected error is returned when retrieving the data from the operator.
          minimum: -1
          maximum: 100
          examples:
          - 100
    IdentityMatchType:
      type: string
      enum:
      - match
      - score
    IdentityMatchMatchResponse:
      type: object
      properties:
        state:
          $ref: '#/components/schemas/ResponseState'
        firstNameMatch:
          type:
          - boolean
          - 'null'
          description: If the provided first name matched to the provided phone number. The value can be `null` if the data is not available or accessible, or if an unexpected error is returned when retrieving the data from the operator.
          examples:
          - true
        lastNameMatch:
          type:
          - boolean
          - 'null'
          description: If the provided last name matched to the provided phone number. The value can be `null` if the data is not available or accessible, or if an unexpected error is returned when retrieving the data from the operator.
          examples:
          - true
        nameMatch:
          type:
          - boolean
          - 'null'
          description: If the provided full name matched to the provided phone number. The value can be `null` if the data is not available or accessible, or if an unexpected error is returned when retrieving the data from the operator.
          examples:
          - true
        addressMatch:
          type:
          - boolean
          - 'null'
          description: If the provided address matched to the provided phone number. The value can be `null` if the data is not available or accessible, or if an unexpected error is returned when retrieving the data from the operator.
          examples:
          - true
        postalCodeMatch:
          type:
          - boolean
          - 'null'
          description: If the provided postal code matched to the provided phone number. The value can be `null` if the data is not available or accessible, or if an unexpected error is returned when retrieving the data from the operator.
          examples:
          - true
        dateOfBirthMatch:
          type:
          - boolean
          - 'null'
          description: If the provided date of birth matched to the provided phone number. The value can be `null` if the data is not available or accessible, or if an unexpected error is returned when retrieving the data from the operator.
          examples:
          - true
    ErrorResponse:
      title: Error Response
      type: object
      properties:
        status:
          type: integer
          format: int32
          description: Response status code, should match HTTP error code.
          examples:
          - 400
        message:
          type: string
          description: Description of the error that occurred.
          examples:
          - The phone number field is required
        code:
          $ref: '#/components/schemas/ErrorCode'
    ResponseState:
      type: string
      description: State that indicates whether the request was successful or the data could not be retrieved due to unavailability.
      enum:
      - success
      - unavailable
    ErrorCode:
      type: integer
      description: "Error code description:\n\n * 1000 - Unknown error\n * 1001 - Invalid request\n * 1002 - Supplier error\n * 1003 - Unsupported configuration\n * 2000 - Validation error\n * 2001 - Invalid `phoneNumber` field\n * 2002 - Invalid `serviceType` field\n * 2003 - Invalid `firstName` field\n * 2004 - Invalid `lastName` field\n * 2005 - Invalid `address` field\n * 2006 - Invalid `postalCode` field\n * 2007 - Invalid `dateOfBirth` field\n * 2008 - Invalid `callbackUrl` field\n * 3000 - Feature not enabled\n * 3001 - Phone number is not active\n"
      enum:
      - 1000
      - 1001
      - 1002
      - 1003
      - 2000
      - 2001
      - 2002
      - 2003
      - 2004
      - 2005
      - 2006
      - 2007
      - 2008
      - 3000
      - 3001
      examples:
      - 2001
  securitySchemes:
    JWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'In order to authenticate you need to use your credentials to generate a JWT Bearer token. The [JWT token](https://jwt.io/introduction/) has to be generated using the `HS256` algorithm and your credentials. This JWT has to contain the following attributes: `iat`, `nbf`, `exp`  in the payload, as well as the attribute `kid` in the header of the JWT. This `kid` attribute needs to contain the Key Id of your credentials.


        The generated token needs to be passed via the HTTP Authorization header like:


        ```

        Authorization: Bearer GENERATED_TOKEN_HERE

        ```


        There are many libraries available for different programming languages that can help you to generate a JWT. See the Libraries tab on [https://jwt.io](https://jwt.io)

        '
    HMAC:
      type: apiKey
      in: header
      name: Authorization
      description: 'Used on callbacks sent by Mobile Identity to your `callbackUrl`. The header contains the HMAC-SHA256 signature of the request body, calculated with your client secret as the secret key, prefixed with `HMAC `:


        ```

        Authorization: HMAC MIi9ZMyar2v+o7H7LD7oNolO5LrTJaC+8uKvYUGqJvM=

        ```

        '
