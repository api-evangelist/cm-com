components:
  schemas:
    ResetPasswordDto:
      type: object
      properties:
        password:
          type: string
          minLength: 6
          description: Password must contain a minimum of 6 characters
          example: MyStrong3x4mpl3P4ssword!
      required:
      - password
    PasswordResetRequest:
      type: object
      properties:
        uuid:
          type: string
          maxLength: 36
          example: 00000000-0000-0000-0000-000000000000
        expiresAt:
          format: date-time
          type: string
      required:
      - uuid
      - expiresAt
    ResetPasswordRequestDto:
      type: object
      properties:
        email:
          type: string
          description: E-mail address used for your account. If it exists you will receive an e-mail to reset your password.
      required:
      - email
    ErrorDto:
      type: object
      properties:
        errorCode:
          type: number
          example: 400100
          description: Error code specific to the error, consisting of a three digit http status code and a digit application specific code.
        description:
          type: string
          maxLength: 255
          example: Description of the error.
        httpStatus:
          type: number
          enum:
          - 100
          - 101
          - 102
          - 103
          - 200
          - 201
          - 202
          - 203
          - 204
          - 205
          - 206
          - 207
          - 208
