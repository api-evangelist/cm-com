openapi: 3.2.0
info:
  title: Channels Twitter API
  description: Check channel availability and manage onboarding for SMS, WhatsApp, RCS, and other supported channels.
  version: v1
  license:
    name: Proprietary
    url: https://www.cm.com
servers:
- url: https://api.cm.com
  description: Production Server
security:
- ProductToken: []
tags:
- name: Twitter
paths:
  /channels/v1/accounts/{accountId}/twitter/{channelRequestId}/accounts:
    get:
      tags:
      - Twitter
      summary: Gets the accounts asynchronous
      operationId: Twitter_GetTwitterAccountsAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: q
        in: query
        description: The q.
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: The status.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - ACTIVE
            - PENDING
            - ELIGIBLE
            - NOT_VALIDATED
            - CUSTOMER_ACTION_REQUIRED
            - EXPIRED
            - REJECTED
            - CANCELLED
            - DELETED
      - name: skip
        in: query
        description: The skip.
        required: false
        schema:
          type: integer
          format: int32
      - name: take
        in: query
        description: The take.
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Twitter.ApiTwitterAccountBase'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Twitter.ApiTwitterAccountBase'
    post:
      tags:
      - Twitter
      summary: Adds the account asynchronous
      operationId: Twitter_AddTwitterAccountAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: simulate
        in: query
        description: if set to true [simulate].
        required: false
        schema:
          type: boolean
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Twitter.ApiTwitterAccount'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Twitter.ApiTwitterAccount'
  /channels/v1/accounts/{accountId}/twitter/{channelRequestId}/accounts/{twitterAccountId}:
    get:
      tags:
      - Twitter
      summary: Gets the account asynchronous
      operationId: Twitter_GetTwitterAccountAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: twitterAccountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Twitter.ApiTwitterAccount'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Twitter.ApiTwitterAccount'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Twitter.ApiTwitterAccount'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Twitter.ApiTwitterAccount'
    delete:
      tags:
      - Twitter
      summary: Deletes a Twitter account
      operationId: Twitter_DeleteAccountAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: twitterAccountId
        in: path
        description: The twitter account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: NoContent
  /channels/v1/accounts/{accountId}/twitter/{channelRequestId}/accounts/{twitterAccountId}/forminput:
    get:
      tags:
      - Twitter
      summary: Gets the account form input asynchronous
      operationId: Twitter_GetTwitterAccountFormInputAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: twitterAccountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiChannelRequestFormInputResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiChannelRequestFormInputResponse'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiChannelRequestFormInputResponse'
            multipart/form-data:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiChannelRequestFormInputResponse'
    put:
      tags:
      - Twitter
      summary: Adds the account form input asynchronous
      operationId: Twitter_AddTwitterAccountFormInputAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: twitterAccountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        $ref: '#/components/requestBodies/CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequestArray'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Twitter.ApiTwitterAccount'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Twitter.ApiTwitterAccount'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Twitter.ApiTwitterAccount'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Twitter.ApiTwitterAccount'
  /channels/v1/accounts/{accountId}/twitter/oauth/authorize:
    get:
      tags:
      - Twitter
      summary: Get the OAuth url for Twitter authorization
      operationId: Twitter_GetTwitterAccountAuthenticationUrlAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: twitterAccountId
        in: query
        description: The twitter account identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: environment
        in: query
        description: The front-end environment
        required: true
        schema:
          type: string
          enum:
          - TEST
          - BETA
          - PRODUCTION
      responses:
        '200':
          description: OK
  /channels/v1/accounts/{accountId}/twitter/oauth/verify:
    put:
      tags:
      - Twitter
      summary: Finish authorization to verify Twitter account
      operationId: Twitter_VerifyTwitterAccountAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: twitterAccountId
        in: query
        description: The twitter account identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: oAuthToken
        in: query
        description: The oAuth token
        required: true
        schema:
          type: string
      - name: oAuthTokenSecret
        in: query
        description: The oAuth token secret
        required: true
        schema:
          type: string
      - name: oAuthVerifier
        in: query
        description: The oAuth verifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
components:
  schemas:
    CM.Platform.Channels.Models.ChannelTypes.Twitter.ApiTwitterAccount:
      required:
      - id
      - accountId
      - userId
      - screenName
      - isActive
      - isPending
      - isApproved
      - createdOnUtc
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        channelId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        accountId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        channelRequestId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        userId:
          type: string
        screenName:
          type: string
        isActive:
          type: boolean
        isPending:
          type: boolean
        isApproved:
          type: boolean
        fulfilledOnUtc:
          format: date-time
          type: string
        createdOnUtc:
          format: date-time
          type: string
        rejectionReason:
          type: string
        rejectedOnUtc:
          format: date-time
          type: string
        cancelledOnUtc:
          format: date-time
          type: string
        accountBanner:
          type: string
        deletedOnUtc:
          format: date-time
          type: string
        entityStatus:
          enum:
          - ACTIVE
          - PENDING
          - ELIGIBLE
          - NOT_VALIDATED
          - CUSTOMER_ACTION_REQUIRED
          - EXPIRED
          - REJECTED
          - CANCELLED
          - DELETED
          type: string
        accountImage:
          type: string
        location:
          type: string
        description:
          type: string
        name:
          type: string
    CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequest:
      type: object
      properties:
        formElementId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        inputValue:
          type: string
    CM.Platform.Channels.Models.RequestForms.ApiChannelRequestFormInputResponse:
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        channelCategoryRequestID:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        formElementId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        inputValue:
          type: string
        createdOnUtc:
          format: date-time
          type: string
    CM.Platform.Channels.Models.ChannelTypes.Twitter.ApiTwitterAccountBase:
      required:
      - id
      - accountId
      - userId
      - screenName
      - isActive
      - isPending
      - isApproved
      - createdOnUtc
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        accountId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        channelRequestId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        userId:
          type: string
        screenName:
          type: string
        isActive:
          type: boolean
        isPending:
          type: boolean
        isApproved:
          type: boolean
        createdOnUtc:
          format: date-time
          type: string
        rejectedOnUtc:
          format: date-time
          type: string
        cancelledOnUtc:
          format: date-time
          type: string
        deletedOnUtc:
          format: date-time
          type: string
        entityStatus:
          enum:
          - ACTIVE
          - PENDING
          - ELIGIBLE
          - NOT_VALIDATED
          - CUSTOMER_ACTION_REQUIRED
          - EXPIRED
          - REJECTED
          - CANCELLED
          - DELETED
          type: string
  requestBodies:
    CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequestArray:
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequest'
        text/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequest'
        text/xml:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequest'
        multipart/form-data:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequest'
        application/x-www-form-urlencoded:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequest'
      description: The form input.
      required: true
  securitySchemes:
    ProductToken:
      type: apiKey
      description: Product token for authentication. Obtain from your CM.com dashboard under Messaging > Product Tokens.
      name: producttoken
      in: header
