openapi: 3.2.0
info:
  title: Payments Gateway Google Pay API
  description: Common payments API
  version: 1.27.22
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: /api/v1
security:
- oAuth2ClientCredentials: []
tags:
- name: GooglePay
  description: Google Pay is a fast and secure payment method that allows customers to pay online using their Google account.
  externalDocs:
    url: https://developers.google.com/pay/api/web/overview
paths:
  /paymentmethods/google-pay/v1/sessions:
    post:
      description: 'Create/initialize a Google Pay session. Returns a details object containing configuration needed to render the Google Pay button on the checkout UI.

        The **id** field in the response can be used in future calls as **sessionId** to reference this session.'
      tags:
      - GooglePay
      summary: Create/initialize Google Pay session
      operationId: createGooglePaySession
      requestBody:
        description: Create Google Pay Session
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GooglePayInitialize'
            examples:
              createGooglePaySession:
                $ref: '#/components/examples/createGooglePaySession'
      responses:
        '201':
          $ref: '#/components/responses/GooglePaySession'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/google-pay/v1/sessions/{sessionId}:
    get:
      description: Retrieve details for an existing Google Pay session. This endpoint must be used to obtain the status for a session.
      tags:
      - GooglePay
      summary: Fetch Google Pay session
      operationId: getGooglePaySession
      parameters:
      - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/GooglePaySession'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/google-pay/v1/sessions/{sessionId}/transactions:
    post:
      description: 'Authorize a transaction for an existing Google Pay session. When the shopper selected a card, the details are returned as payment data by the Google Pay client. The paymentData.paymentMethodData must be sent here as-is.


        This endpoint creates the actual transaction for the session. A `TRANSACTION_CREATED` webhook will be triggered if subscribed.'
      tags:
      - GooglePay
      summary: Authorize Google Pay transaction
      operationId: createGooglePaySessionTransaction
      parameters:
      - $ref: '#/components/parameters/SessionId'
      requestBody:
        description: Authorize Google Pay Transaction
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeGooglePayTransaction'
            examples:
              authorizeGooglePay:
                $ref: '#/components/examples/authorizeGooglePay'
      responses:
        '201':
          $ref: '#/components/responses/GooglePaySessionTransaction'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
    get:
      description: Retrieve all transactions for an existing Google Pay session.
      tags:
      - GooglePay
      summary: Fetch Google Pay session transactions
      operationId: getGooglePaySessionTransactions
      parameters:
      - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/GooglePaySessionTransactions'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/google-pay/v1/sessions/{sessionId}/transactions/{transactionId}:
    get:
      description: Retrieve a specific transaction for an existing Google Pay session.
      tags:
      - GooglePay
      summary: Fetch Google Pay session transaction
      operationId: getGooglePaySessionTransaction
      parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          $ref: '#/components/responses/GooglePaySessionTransaction'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/google-pay/v1/sessions/{sessionId}/transactions/{transactionId}/refunds:
    post:
      description: 'Create a refund for an existing Google Pay transaction.


        The **transactionId** parameter can be obtained from the `payment` field in the webhook payload sent when the transaction was created.


        The **amount** field is required and must be a positive value, which is the amount to be refunded.'
      tags:
      - GooglePay
      summary: Create refund for transaction
      operationId: createGooglePaySessionTransactionRefund
      parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/TransactionId'
      requestBody:
        description: Create Google Pay Transaction Refund
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refund'
      responses:
        '201':
          $ref: '#/components/responses/RefundResponseWithSessionID'
          description: GooglePay refund was created successfully.
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
    get:
      description: Retrieve refunds for an existing Google Pay transaction of a session.
      tags:
      - GooglePay
      operationId: getGooglePaySessionTransactionRefunds
      summary: Fetch transaction refunds
      parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          $ref: '#/components/responses/RefundsResponseWithSessionID'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    FinalStatusEvent:
      description: '* `FINALSTATUS` - This value is deprecated and shouldn''t be used anymore. Use `STATUS_CHANGE` instead.

        '
      type: string
      enum:
      - FINALSTATUS
      example: FINALSTATUS
    Email:
      description: The email address of the consumer.
      type: string
      format: email
      example: john.doe@email.tld
    RefundDetailsWithSessionID:
      allOf:
      - $ref: '#/components/schemas/RefundDetails'
      - type: object
        required:
        - sessionId
        properties:
          sessionId:
            allOf:
            - $ref: '#/components/schemas/Uuid'
            description: Unique identifier for the session.
            example: bcbb3733-4d3e-4a4d-9254-1ddb90e6e082
    BaseWebhook:
      type: object
      description: A single webhook object consists out of an URL to which we need to send the occurred event together with the event that needs to trigger the webhook call.
      required:
      - url
      - events
      properties:
        url:
          description: The URL the request must be send to.
          type: string
          format: url
          example: https://yourdomain.tld/webhooks?purchaseId=order123
        events:
          description: Type of events that will trigger a webhook.
          type: array
          minItems: 1
          items:
            type: string
    Refund:
      description: Refund an already successfully processed payment.
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
          description: 'Denomination in the smallest currency subunit, as for example euro cents. If empty, the refund amount will be the remaining available amount of the transaction (i.e., total payment amount minus already refunded amounts minus the amounts of the pending refund requests).

            '
        reason:
          $ref: '#/components/schemas/RefundReason'
    TransactionWebhooks:
      description: 'Array of webhooks that enables receiving a web request once a given event occurs. We won''t do preventive rate-limiting in order to have the highest throughput possible. However, we will honor 429 (Too-many-requests) responses per callback. We use the Retry-After header to retry after a certain period. If the header was not set we use our default exponential delay implementation.

        '
      type: array
      items:
        $ref: '#/components/schemas/TransactionWebhook'
      example:
      - url: https://yourdomain.tld/payment-webhooks?purchaseId=order123
        events:
        - STATUS_CHANGE
    RefundStatus:
      description: '* `SUCCESS`    - Refund has succeeded.

        * `PENDING`    - Refund is waiting to be processed.

        * `FAILURE`    - Refund has failed.

        * `CANCELLED`  - Refund has been cancelled.

        '
      type: string
      enum:
      - SUCCESS
      - PENDING
      - FAILURE
      - CANCELLED
      example: SUCCESS
    Consumer:
      allOf:
      - $ref: '#/components/schemas/GenderlessConsumer'
      - type: object
        properties:
          gender:
            $ref: '#/components/schemas/Gender'
    StatusAuthorized:
      description: The transaction has been authorized.
      type: string
      format: enum
      enum:
      - AUTHORIZED
      example: AUTHORIZED
    RefundReason:
      description: 'The description for the refund for administrative purpose only. This reason will be visible in the portal.

        '
      type: string
      example: Refund required by consumer.
      maxLength: 255
    StatusFailure:
      description: The transaction has failed.
      type: string
      format: enum
      enum:
      - FAILURE
      example: FAILURE
    AuthorizeGooglePayTransaction:
      description: The paymentData.paymentMethodData returned by Google Pay that must be sent as-is to the Payment System
      type: object
      properties:
        description:
          description: Google Pay payment description
          type: string
          example: Visa •••• 1111
        info:
          type: object
          properties:
            cardDetails:
              type: string
              example: '1111'
            cardNetwork:
              type: string
              example: VISA
        tokenizationData:
          type: object
          properties:
            token:
              type: string
              example: '{"signature":"MEUCIQDefdlz6PJ6ELqh58JUES8DmVAfCVChP/wd3fm7QfhLIgIgP+xZdKCoL8Wv+smlTHyrtxLmAw4jTZcCU+Oqjj7K0zs\u003d","intermediateSigningKey":{"signedKey":"{\"keyValue\":\"MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEi6ylxFPyYnSNpkQNP11SdTvsf/muVEqEGxy7Zf30mUeh+BEmBzHbrBd4p+ECtOS6kPNnnW8UGWzb7dE8x+L5Fg\\u003d\\u003d\",\"keyExpiration\":\"1683363703676\"}","signatures":["MEUCIC6nmOCKBgprc0iwBumuYe1eEva1i5hPQ4jWIl+Mo2U9AiEAxSx1bEGER3atvKdts9cVlfnFP4jGLsXQnR1iRG4iWSI\u003d"]},"protocolVersion":"ECv2","signedMessage":"{\"encryptedMessage\":\"\\u003d","ephemeralPublicKey":"BEL9y1u7hBWJ621PemcPJg5w+FFhijBKcD/BfGrOtk5W4ZMKzFgcgSQEoNgU1ytAD9iirXl0u4RjzMNPMCyehOo\\u003d","tag":"ohzjZ/wzmjeYcwvrGD1QYGd53jvbiHHXLdVKCy6MKHY\\u003d"}'
            type:
              type: string
              example: PAYMENT_GATEWAY
        type:
          type: string
          example: CARD
    Uuid:
      description: Unique identifier
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      example: 8db1e7fa-ba8a-4189-92fd-67a20217443d
    Reference:
      description: The clients identifier. This value will be sent in the webhook payload alongside the ID you receive as part of the response of a transaction.
      type: string
      minLength: 1
      maxLength: 255
      example: '20210623130413'
    SessionTransactionWebhooks:
      allOf:
      - $ref: '#/components/schemas/BaseWebhook'
      - type: object
        properties:
          events:
            items:
              description: '* `STATUS_CHANGE` - Triggered when the status of a session or a transaction changes.

                * `REFUND_STATUS` - Triggered when a transaction receives an update on one of its requested refunds.

                * `TRANSACTION_CREATED` - Triggered when a new transaction is created for a session.

                '
              oneOf:
              - $ref: '#/components/schemas/StatusChangeEvent'
              - $ref: '#/components/schemas/RefundStatusEvent'
              - $ref: '#/components/schemas/TransactionCreatedEvent'
              example: STATUS_CHANGE
    StatusChangeEvent:
      description: '* `STATUS_CHANGE` - Triggered when the status of a transaction changes.

        '
      type: string
      enum:
      - STATUS_CHANGE
      example: STATUS_CHANGE
    StatusExpired:
      description: The transaction has expired.
      type: string
      format: enum
      enum:
      - EXPIRED
      example: EXPIRED
    RefundStatusEvent:
      description: '* `REFUND_STATUS` - Triggered when a transaction receives an update on one of its requested refunds.

        '
      type: string
      enum:
      - REFUND_STATUS
      example: REFUND_STATUS
    GooglePayInitialize:
      type: object
      required:
      - reference
      - amount
      - description
      - language
      properties:
        reference:
          $ref: '#/components/schemas/Reference'
        description:
          description: 'Description of the underlying value or reason of the session.

            Ultimately appears on the confirmation (statement and confirmation screen).

            '
          type: string
          maxLength: 255
          example: Order at yourdomain.tld
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        expiresAt:
          allOf:
          - $ref: '#/components/schemas/Datetime'
          - description: ISO 8601 date and time. If left empty, the value defaults to 10 mins.
        language:
          $ref: '#/components/schemas/Language'
        consumer:
          $ref: '#/components/schemas/Consumer'
        webhooks:
          $ref: '#/components/schemas/SessionTransactionWebhooks'
        returnUrl:
          $ref: '#/components/schemas/ReturnUrl'
    Currency:
      description: ISO 4217 currency code.
      type: string
      minLength: 3
      maxLength: 3
      default: EUR
      example: EUR
    Gender:
      description: The consumers gender.
      type: string
      format: enum
      enum:
      - m
      - f
      - 'null'
      default: null
    StatusSuccess:
      description: The transaction has been successfully paid.
      type: string
      format: enum
      enum:
      - SUCCESS
      example: SUCCESS
    Language:
      description: Preferred language for the user interface as ISO 639-1 code. If the provided language is not supported the default will be used. Commonly supported languages are Dutch (nl) and English (en).
      type: string
      default: nl
      example: nl
      minLength: 2
      maxLength: 2
    GooglePaySessionObject:
      type: object
      required:
      - id
      - reference
      - amount
      - currency
      - description
      - expiresAt
      - language
      - status
      - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        reference:
          $ref: '#/components/schemas/Reference'
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        description:
          type: string
          example: Order at yourdomain.tld
        expiresAt:
          $ref: '#/components/schemas/Datetime'
        language:
          $ref: '#/components/schemas/Language'
        consumer:
          description: Consumer details. Only returned on session creation (POST). Not available on session retrieval (GET).
          allOf:
          - $ref: '#/components/schemas/Consumer'
        webhooks:
          $ref: '#/components/schemas/TransactionWebhooks'
        status:
          description: The status of the transaction.
          oneOf:
          - $ref: '#/components/schemas/StatusOpen'
          - $ref: '#/components/schemas/StatusSuccess'
          - $ref: '#/components/schemas/StatusCancelled'
          - $ref: '#/components/schemas/StatusExpired'
          - $ref: '#/components/schemas/StatusFailure'
          - $ref: '#/components/schemas/StatusAuthorized'
        action:
          description: 'Contains the details necessary to render the Google Pay button in your own checkout page during the initialize session flow.

            In consequent flows the action object will be null.

            '
          anyOf:
          - type: 'null'
          - type: object
            properties:
              googlePayButton:
                type: object
                properties:
                  merchantCountry:
                    description: The ISO 3166-1 alpha-2 country code where the transaction is processed.
                    type: string
                    example: NL
                  gatewayId:
                    description: Gateway's identifier, which is issued by Google.
                    type: string
                    example: example-gateway
                  environment:
                    description: '* TEST - Dummy payment methods that are suitable for testing.

                      * PRODUCTION - Used to return chargeable payment methods when a valid Google merchant ID is specified and configured for the domain.

                      '
                    type: string
                    enum:
                    - TEST
                    - PRODUCTION
                  merchantId:
                    description: A Google merchant identifier.
                    type: string
                    example: exampleMerchantId
                  merchantName:
                    description: Merchant name encoded as UTF-8. Merchant name is rendered in the payment sheet. In TEST environment, or if a merchant isn't recognized, a "Pay Unverified Merchant" message is displayed in the payment sheet.
                    type: string
                    example: Your Merchant
                  merchantKey:
                    allOf:
                    - $ref: '#/components/schemas/Uuid'
                    - description: Unique identifier for your integration. Should be used as gateway merchant id.
                  allowedCardNetworks:
                    description: One or more card networks supported by Payments Gateway, also supported by the Google Pay API.
                    type: array
                    items:
                      type: string
                      enum:
                      - AMEX
                      - DISCOVER
                      - INTERAC
                      - JCB
                      - MASTERCARD
                      - VISA
                  serverUrl:
                    description: The URL to the Mobile Pay Server.
                    type: string
                    example: https://www.example.com/api/
        createdAt:
          $ref: '#/components/schemas/Datetime'
        returnUrl:
          $ref: '#/components/schemas/ReturnUrl'
    StatusCancelled:
      description: The transaction has been cancelled by the consumer.
      type: string
      format: enum
      enum:
      - CANCELLED
      example: CANCELLED
    Datetime:
      type: string
      format: date-time
      minLength: 20
      example: '2006-01-02T15:04:05Z'
      description: ISO 8601 date and time.
    StatusOpen:
      description: The transaction is open and can be paid.
      type: string
      format: enum
      enum:
      - OPEN
      example: OPEN
    TransactionId:
      description: ID received in the POST transaction response root object, which can be used in up following calls like refunds or cancellations as transactionId.
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      example: 8db1e7fa-ba8a-4189-92fd-67a20217443d
    TransactionWebhook:
      allOf:
      - $ref: '#/components/schemas/BaseWebhook'
      - type: object
        properties:
          events:
            items:
              description: '* `STATUS_CHANGE` - Triggered when the status of a transaction changes.

                * `REFUND_STATUS` - Triggered when a transaction receives an update on one of its requested refunds.

                * `FINALSTATUS` - This value is deprecated and shouldn''t be used anymore. Use `STATUS_CHANGE` instead.

                '
              oneOf:
              - $ref: '#/components/schemas/StatusChangeEvent'
              - $ref: '#/components/schemas/RefundStatusEvent'
              - $ref: '#/components/schemas/FinalStatusEvent'
              example: STATUS_CHANGE
    GenderlessConsumer:
      type: object
      properties:
        email:
          $ref: '#/components/schemas/Email'
        phone:
          $ref: '#/components/schemas/Phone'
        dateOfBirth:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: '1990-05-23'
          description: Date of birth in ISO 8601 format (YYYY-MM-DD).
    TransactionCreatedEvent:
      description: '* `TRANSACTION_CREATED` - Triggered when a new transaction is created.

        '
      type: string
      enum:
      - TRANSACTION_CREATED
      example: TRANSACTION_CREATED
    PaymentMethod:
      description: The payment method used in the transaction.
      type: string
      format: enum
      enum:
      - creditcard
      example: creditcard
    GooglePayTransactionObject:
      type: object
      required:
      - id
      - sessionId
      - expiresAt
      - status
      - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        sessionId:
          $ref: '#/components/schemas/Uuid'
        expiresAt:
          $ref: '#/components/schemas/Datetime'
        webhooks:
          $ref: '#/components/schemas/TransactionWebhooks'
        status:
          description: The status of the transaction.
          oneOf:
          - $ref: '#/components/schemas/StatusOpen'
          - $ref: '#/components/schemas/StatusSuccess'
          - $ref: '#/components/schemas/StatusCancelled'
          - $ref: '#/components/schemas/StatusExpired'
          - $ref: '#/components/schemas/StatusFailure'
          - $ref: '#/components/schemas/StatusAuthorized'
        action:
          description: Next action to be performed by merchant (or consumer) to complete the transaction. Only present when 3DS authentication is required.
          anyOf:
          - type: 'null'
          - type: object
            properties:
              redirect:
                type: object
                properties:
                  url:
                    description: URL where consumer should be redirected to by the merchant to perform the transaction. This url is only available when a card payment has been started
                    type: string
                    format: url
                    example: https://checkout.tld/3ds/v2/creditcard/123
        createdAt:
          $ref: '#/components/schemas/Datetime'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
    Amount:
      description: Denomination in the smallest currency subunit, as for example euro cents.
      type: integer
      minimum: 1
      maximum: 99999999
      example: 1200
    RefundDetails:
      description: Details of a refund.
      type: object
      required:
      - id
      - transactionId
      - amount
      - reason
      - status
      - created
      - updated
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        transactionId:
          $ref: '#/components/schemas/Uuid'
        amount:
          $ref: '#/components/schemas/Amount'
        reason:
          $ref: '#/components/schemas/RefundReason'
        status:
          $ref: '#/components/schemas/RefundStatus'
        created:
          $ref: '#/components/schemas/Datetime'
        updated:
          $ref: '#/components/schemas/Datetime'
    RefundsListWithSessionID:
      description: Details of all refunds belonging to a transaction of a session.
      type: object
      required:
      - refunds
      properties:
        refunds:
          type: array
          items:
            $ref: '#/components/schemas/RefundDetailsWithSessionID'
    ReturnUrl:
      description: 'URL where the Consumer is redirected to after completing the transaction at its issuing bank or at the chosen payment method.


        With this implementation you are responsible to fetch the payment status and incorporated into your site.'
      type: string
      format: url
      maxLength: 2000
      example: https://yourdomain.tld/order/return?orderID=order123
    Phone:
      description: The phonenumber of the consumer (E.164 format).
      type: string
      maxLength: 16
      example: '+31695613259'
  headers:
    Digest:
      description: Digest of the whole message body. Follow [RFC 3230](https://datatracker.ietf.org/doc/html/rfc3230) for more information.
      schema:
        type: string
        example: sha-256=OWM5MDc3ODYwNzdjYjE5NjU0Y2NjMDM4MzEyYzMxZTA5MTAzMDBjYWM1Y2I1ODM4NTdlMDU2MzhiMzE1ZDhjNw==
  responses:
    InternalError:
      description: Internal server error. This can be caused by an unresponsive backend
      content:
        application/json:
          schema:
            type: object
            required:
            - id
            - message
            properties:
              id:
                $ref: '#/components/schemas/Uuid'
              message:
                type: string
                example: Service Unavailable
    GooglePaySessionTransactions:
      description: Google Pay transactions for a session
      headers:
        Digest:
          $ref: '#/components/headers/Digest'
      content:
        application/json:
          schema:
            type: object
            required:
            - transactions
            properties:
              transactions:
                type: array
                items:
                  $ref: '#/components/schemas/GooglePayTransactionObject'
          examples:
            googlePayTransactions:
              summary: Google Pay transactions for a session
              value:
                transactions:
                - id: 33333333-3333-3333-3333-333333333333
                  sessionId: 11111111-1111-1111-1111-111111111111
                  expiresAt: '2025-06-24T12:48:21Z'
                  status: SUCCESS
                  createdAt: '2025-06-23T12:48:24Z'
                  paymentMethod: creditcard
    GooglePaySession:
      description: Google Pay session details
      headers:
        Digest:
          $ref: '#/components/headers/Digest'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GooglePaySessionObject'
          examples:
            initializedGooglePay:
              summary: Initialized Google Pay session (awaiting authorization)
              value:
                id: 11111111-1111-1111-1111-111111111111
                reference: '20240612104501'
                amount: 1200
                currency: EUR
                description: Order at yourdomain.tld
                expiresAt: '2025-06-24T12:48:21Z'
                language: nl
                status: OPEN
                action:
                  googlePayButton:
                    merchantCountry: NL
                    allowedCardNetworks:
                    - MASTERCARD
                    - VISA
                    merchantName: Your Merchant
                    environment: TEST
                createdAt: '2025-06-23T12:48:24Z'
                returnUrl: https://tradename.tld/shop/return/?purchase=PO1234567
    UserError:
      description: The user input was incorrect or something illegal was attempted (eg. using a service without having that service configured for the user, or not being authorized)
      content:
        application/json:
          schema:
            type: object
            required:
            - id
            - message
            properties:
              id:
                $ref: '#/components/schemas/Uuid'
              message:
                type: string
                example: no authorization methods provided
    RefundResponseWithSessionID:
      description: Refund details
      headers:
        Digest:
          $ref: '#/components/headers/Digest'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefundDetailsWithSessionID'
    RefundsResponseWithSessionID:
      description: Details of all refunds belonging to a transaction of a session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefundsListWithSessionID'
    GooglePaySessionTransaction:
      description: Google Pay session transaction
      headers:
        Digest:
          $ref: '#/components/headers/Digest'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GooglePayTransactionObject'
          examples:
            authorizedGooglePay:
              summary: Authorized Google Pay transaction
              value:
                id: 33333333-3333-3333-3333-333333333333
                sessionId: 11111111-1111-1111-1111-111111111111
                expiresAt: '2025-06-24T12:48:21Z'
                status: AUTHORIZED
                action:
                  redirect:
                    url: https://checkout.tld/3ds/v2/creditcard/33333333-3333-3333-3333-333333333333
                createdAt: '2025-06-23T12:48:24Z'
            successfulGooglePay:
              summary: Successful Google Pay transaction
              value:
                id: 33333333-3333-3333-3333-333333333333
                sessionId: 11111111-1111-1111-1111-111111111111
                expiresAt: '2025-06-24T12:48:21Z'
                status: SUCCESS
                createdAt: '2025-06-23T12:48:24Z'
                paymentMethod: creditcard
  examples:
    authorizeGooglePay:
      summary: Authorize Google Pay payment
      value:
        description: Visa •••• 1111
        info:
          cardDetails: '1111'
          cardNetwork: VISA
        tokenizationData:
          token: '{...GooglePaySignedToken...}'
          type: PAYMENT_GATEWAY
        type: CARD
    createGooglePaySession:
      summary: Create Google Pay session
      value:
        reference: '20240612104501'
        amount: 1200
        currency: EUR
        description: Order at yourdomain.tld
        expiresAt: '2025-06-24T12:48:21Z'
        language: nl
        consumer:
          email: consumer@example.com
          address:
            countryCode: NL
        returnUrl: https://tradename.tld/shop/return/?purchase=PO1234567
        webhooks:
        - url: https://yourdomain.tld/order-webhooks?purchaseId=order123
          events:
          - STATUS_CHANGE
          - TRANSACTION_CREATED
          - REFUND_STATUS
  parameters:
    SessionId:
      name: sessionId
      description: ID received in the initialize session response, used to reference the session in subsequent calls.
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TransactionId:
      name: transactionId
      description: ID received in the POST transaction response root object, which can be used in up following calls like refunds or cancellations as transactionId.
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TransactionId'
  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      description: OAuth 2.0 Client Credentials Grant.
      flows:
        clientCredentials:
          tokenUrl: /api/v1/authorization/oauth2/token
          scopes: {}
