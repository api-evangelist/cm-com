      - finger_right_ring
      - finger_right_thumb
      - finger_two_thumbs
      - fingerprint
      - ghost_portrait
      - other
      - portrait
      - portrait_of_child
      - proof_of_citizenship
      - signature
      - stamp
      example: portrait
    TaskFaceMatchDetail:
      allOf:
      - $ref: '#/components/schemas/TaskDetail'
      properties:
        type:
          type: string
          enum:
          - face_match
          example: face_match
        score:
          type: number
          description: Similarity score
          format: float
          minimum: 0
          maximum: 1
          example: 0.99
    TaskResult:
      type: object
      properties:
        type:
          type: string
        state:
          $ref: '#/components/schemas/TaskState'
          readOnly: true
          example: completed
        attempts:
          $ref: '#/components/schemas/Attempts'
        score:
          type: number
          description: Average authenticity score for any side. Returns -1 if no authenticity checkmarks were found on any side of the document.
          format: float
          minimum: 0
          maximum: 1
          example: 0.99
    DocumentScanDetail:
      type: object
      description: Details of a document scan attempt
      properties:
        created:
          type: string
          format: date-time
          description: The date the document scan was executed.
        code:
          oneOf:
          - $ref: '#/components/schemas/DocumentScanErrorCode'
          - type:
            - 'null'
          description: The task error code. The value `null` means that there was no error.
          default: null
        score:
          $ref: '#/components/schemas/AuthenticityScore'
        source:
          $ref: '#/components/schemas/CaptureSource'
        linked:
          type: boolean
          description: Whether the document scan is linked to a previous document scan.
          example: true
        files:
          type: array
          description: Array with stored files. Files are not provided if the transaction has expired.
          items:
            oneOf:
            - $ref: '#/components/schemas/TaskResultDocumentScanFileRawImage'
            - $ref: '#/components/schemas/TaskResultDocumentScanFileDocument'
            - $ref: '#/components/schemas/TaskResultDocumentScanFileImage'
            discriminator:
              propertyName: category
  parameters:
    AuditReportType:
      name: type
      in: query
      schema:
        $ref: '#/components/schemas/AuditReportType'
      required: false
      description: 'Specify the type of audit report. Defaults to `simple`.


        Simple audit report already exists and can always be retrieved.


        Extended audit report can be requested within the ID Scan transaction validity.

        '
    TransactionId:
      name: transactionId
      in: path
      schema:
        type: string
        format: uuid
      required: true
      description: A unique identifier for the transaction.
    ResultId:
      name: resultId
      in: path
      schema:
        type: string
        format: uuid
      required: true
      description: This result ID can be obtained from the `resultId` parameter in the iframe event or query parameter `resultid` in the return url after the user completes the transaction.
  responses:
    NotFound:
      description: The specified resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            message: Not found
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 401
            message: Unauthorized
  securitySchemes:
    JWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'In order to authenticate you need to use your credentials to generate a JWT Bearer token. The [JWT token](https://jwt.io/introduction/) has to be generated using the `HS256` algorithm and your credentials. This JWT has to contain the following attributes: `iat`, `nbf`, `exp`  in the payload, as well as the attribute `kid` in the header of the JWT. This `kid` attribute needs to contain the Key Id of your credentials.


        The generated token needs to be passed via the HTTP Authorization header like:


        ```

        Authorization: Bearer GENERATED_TOKEN_HERE

        ```


        There are many libraries available for different programming languages that can help you to generate a JWT. See the Libraries tab on [https://jwt.io](https://jwt.io)

        '
