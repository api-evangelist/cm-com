openapi: 3.2.0
info:
  version: '1'
  title: ID Scan Transactions API
  description: With ID Scan, you can verify your customer's identity by letting them scan their identity document using a mobile device, like a passport or a driver's license. An advanced OCR engine abstracts data from their document and detects the customer as a living human being via their device's camera.
servers:
- url: https://api.cm.com/id-scan/v1
security:
- JWT: []
tags:
- name: Transactions
  description: Create or get transactions with identification tasks.
paths:
  /transactions:
    post:
      operationId: create_transaction
      description: Create a new transaction. To get notified about status updates, configure a webhook via the `/webhooks` endpoint. For the event structure see the `Webhook Events` section.
      summary: Create a transaction
      tags:
      - Transactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransaction'
            example:
              tasks:
              - document_scan
      responses:
        '201':
          description: The transaction has been created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      operationId: list_transactions
      summary: Get all transactions
      tags:
      - Transactions
      parameters:
      - name: since
        in: query
        required: true
        description: Filter transactions created after this date (inclusive). This date may not be older than 1 year.
        schema:
          description: ISO 8601 date
          type: string
          format: date-time
        example: 2026-01-01 00:00:00+00:00
      - name: until
        in: query
        required: true
        description: Filter transactions created before this date (exclusive).
        schema:
          description: ISO 8601 date
          type: string
          format: date-time
        example: 2026-02-01 00:00:00+00:00
      - name: pageSize
        in: query
        required: false
        description: The number of items per page
        schema:
          type: number
          default: 20
          minimum: 1
          maximum: 100
      - name: cursor
        in: query
        required: false
        description: The pointer to the next item in the data set, returned by the previous request.
        schema:
          type: string
      responses:
        '200':
          description: A page of transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /transactions/{transactionId}:
    get:
      operationId: get_transaction
      description: Retrieve the details of a transaction by its ID.
      summary: Get transaction details
      parameters:
      - name: transactionId
        in: path
        required: true
        description: Unique identifier for the transaction
        schema:
          type: string
      tags:
      - Transactions
      responses:
        '200':
          description: Successfully retrieved transaction details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /transactions/{transactionId}/results/{resultId}:
    parameters:
    - name: includeRawImages
      in: query
      required: false
      description: If set to true, a url to download the raw images will be added to the result
      schema:
        type: boolean
        default: false
      example: true
    - $ref: '#/components/parameters/TransactionId'
    - $ref: '#/components/parameters/ResultId'
    get:
      operationId: get_transaction_result
      description: Retrieve the results for a completed transaction.
      summary: Get transaction results
      tags:
      - Transactions
      responses:
        '200':
          description: The results of the transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /transactions/{transactionId}/report/{resultId}:
    parameters:
    - $ref: '#/components/parameters/TransactionId'
    - $ref: '#/components/parameters/ResultId'
    - $ref: '#/components/parameters/AuditReportType'
    get:
      operationId: get_transaction_report
      description: 'Retrieve an audit report of a completed transaction.


        Can specify the type of report using the `type` query parameter.


        Simple reports are always available to be retrieved.


        Extended audit reports contain all documents and will be sealed, only retrievable within transaction validity.'
      summary: Get transaction report
      tags:
      - Transactions
      responses:
        '200':
          description: Success
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    TaskResultDocumentScanFileRawImage:
      allOf:
      - $ref: '#/components/schemas/TaskResultFile'
      properties:
        category:
          type: string
          description: The file category
          example: document
        type:
          type: string
          description: The type of image
          example: raw_document_image
    CaptureSource:
      type: string
      enum:
      - camera
      - file
      example: camera
      default: camera
    TaskState:
      type: string
      enum:
      - pending
      - completed
      - aborted
      - maximum_attempts_exceeded
    Attempts:
      type: number
      description: The number of attempts made for this task.
      readOnly: true
      minimum: 1
      example: 1
    ValidityStatus:
      type: string
      enum:
      - valid
      - invalid
      - not_checked
      example: valid
      description: The status indicates the validity of the field.
    TaskFaceLivenessDetail:
      allOf:
      - $ref: '#/components/schemas/TaskDetail'
      properties:
        type:
          type: string
          enum:
          - face_liveness
          example: face_liveness
    Locale:
      type: string
      enum:
      - en-US
      - nl-NL
      - fr-FR
      - it-IT
      default: en-US
      description: The language of the ID Scan process. Currently supports English, Dutch, French, and Italian.
    TransactionPage:
      type: object
      properties:
        nextCursor:
          type: string
          description: The cursor pointing to the next page.
          example: 0ETuixXmBflbB8voRanDsw
        nextUrl:
          type: string
          description: The URL to get the next page of transactions. The URL includes all previously provided parameters and the cursor for the next page.
          example: https://api.cm.com/id-scan/v1/transactions?from=2026-01-01T00:00:00Z&until=2026-02-01T00:00:00Z&pageSize=50&cursor=0ETuixXmBflbB8voRanDsw
        data:
          type: array
          items:
            $ref: '#/components/schemas/TransactionPageDetail'
    ErrorResponse:
      title: Error Response
      type: object
      properties:
        status:
          type: integer
          format: int32
          description: Response status code, should match HTTP error code.
          example: 400
        message:
          type: string
          description: High level description of the error that occurred.
          example: The request is invalid
    AuthenticityScore:
      type: number
      description: Authenticity score for image pattern checks. Returns -1 if no authenticity checkmarks are found.
      format: float
      minimum: 0
      maximum: 1
      example: 0.99
    ComparisonStatus:
      type: string
      description: The result of comparing MRZ, barcode and visual field values. If only one field value is available, the status will be `not_performed`.
      enum:
      - match
      - no_match
      - not_performed
      example: match
    TaskDetail:
      type: object
      properties:
        state:
          $ref: '#/components/schemas/TaskState'
          example: pending
        attempts:
          type: number
          description: The number of attempts made for this task.
          minimum: 0
          example: 3
        attemptsInvoiced:
          type: number
          description: The number of attempts that have been invoiced.
          minimum: 0
          example: 1
    TransactionDetailBase:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the transaction
          format: uuid
        state:
          $ref: '#/components/schemas/TransactionState'
        created:
          type: string
          format: date-time
          description: The date the transaction was created.
        expires:
          type: string
          format: date-time
          description: The date the transaction expires.
        completed:
          type:
          - string
          - 'null'
          format: date-time
          description: The date the transaction was completed.
    TaskDocumentScanDetail:
      allOf:
      - $ref: '#/components/schemas/TaskDetail'
      properties:
        type:
          type: string
          enum:
          - document_scan
          example: document_scan
    TaskResultFile:
      type: object
      properties:
        url:
          type:
          - string
          - 'null'
          description: The url to download the image. This url also requires a valid JWT header.
          example: https://example.com/ZUQqP3v0Uq
    TransactionPageDetail:
      allOf:
      - $ref: '#/components/schemas/TransactionDetailBase'
      - type: object
        properties:
          tasks:
            type: array
            items:
              oneOf:
              - $ref: '#/components/schemas/TaskDocumentScanDetail'
              - $ref: '#/components/schemas/TaskFaceLivenessDetail'
              - $ref: '#/components/schemas/TaskFaceMatchDetail'
              discriminator:
                propertyName: type
    TransactionDetail:
      allOf:
      - $ref: '#/components/schemas/TransactionDetailBase'
      - type: object
        properties:
          tasks:
            type: array
            items:
              oneOf:
              - $ref: '#/components/schemas/TaskDocumentScanDetailExtended'
              - $ref: '#/components/schemas/TaskFaceLivenessDetail'
              - $ref: '#/components/schemas/TaskFaceMatchDetail'
              discriminator:
                propertyName: type
    TransactionResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        state:
          $ref: '#/components/schemas/TransactionState'
          readOnly: true
          example: completed
        tasks:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/TaskResultDocumentScan'
            - $ref: '#/components/schemas/TaskResultFaceLiveness'
            - $ref: '#/components/schemas/TaskResultFaceMatch'
            discriminator:
              propertyName: type
    TransactionState:
      type: string
      description: Current state of the transaction
      enum:
      - pending
      - completed
      - failed
    TaskDocumentScanDetailExtended:
      allOf:
      - $ref: '#/components/schemas/TaskDetail'
      properties:
        type:
          type: string
          enum:
          - document_scan
          example: document_scan
        documentScans:
          type: array
          items:
            $ref: '#/components/schemas/DocumentScanDetail'
    TaskResultDocumentScan:
      allOf:
      - $ref: '#/components/schemas/TaskResult'
      properties:
        type:
          type: string
          enum:
          - document_scan
          example: document_scan
        result:
          type: array
          items:
            type: object
            properties:
              field:
                $ref: '#/components/schemas/TextField'
              validity:
                $ref: '#/components/schemas/ValidityStatus'
              comparison:
                $ref: '#/components/schemas/ComparisonStatus'
              locale:
                type:
                - string
                - 'null'
                example: nl-NL
              values:
                type: array
                items:
                  type: object
                  properties:
                    source:
                      $ref: '#/components/schemas/SourceType'
                    value:
                      type: string
                      example: NLD
        files:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/TaskResultDocumentScanFileRawImage'
            - $ref: '#/components/schemas/TaskResultDocumentScanFileDocument'
            - $ref: '#/components/schemas/TaskResultDocumentScanFileImage'
            discriminator:
              propertyName: category
    DocumentScanErrorCode:
      type: string
      enum:
      - age_criteria_not_met
      - back_side_provided_front_side_required
      - expiration_criteria_not_met
      - field_validation_failed
      - front_side_provided_back_side_required
      - image_quality_requirements_not_met
      - processing
      - text_fields_analysis_failed
      - unable_to_determine_age
      - unable_to_determine_date_of_expiry
      - unknown_type_back
      - unknown_type_front
    CreateTransaction:
      allOf:
      - $ref: '#/components/schemas/Transaction'
      properties:
        expiresIn:
          type: integer
          minimum: 3600
          maximum: 86400
          description: The time in seconds after which a transaction should expire.
          default: 3600
    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        state:
          $ref: '#/components/schemas/TransactionState'
          readOnly: true
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskType'
          description: The tasks to be performed by the user. The `face_liveness` task can only be performed when the `document_scan` task is added. For the `face_match` task both the `document_scan` task and `face_liveness` task must be added.
        settings:
          $ref: '#/components/schemas/Settings'
        locale:
          $ref: '#/components/schemas/Locale'
          description: The language of the ID Scan process. Currently supports English, Dutch, French.
          default: en-US
        url:
          type: string
          description: The URL to start the transaction.
          example: https://example.com/en-us/Dtiu9rE2GE
          readOnly: true
        mobileOnly:
          type: boolean
          description: When this is set to true, the user must complete the transaction on their mobile device.
          default: false
        returnUrl:
          type: string
          description: The URL to redirect the user to after the transaction is completed. The `trxid`, `state` and `resultid` will be added as a query parameter. If the URL is not set a default page is shown.
          default: null
        scanReturnUrl:
          type: string
          description: The URL to redirect the user to in case the transaction is transferred to a mobile device (by scanning the QR code) and the transaction is completed. The `trxid` and `state` will be added as a query parameter. If the URL is not set a default page is shown.
          default: null
        expires:
          type: string
          format: date-time
          description: The date the transaction expires.
          readOnly: true
        created:
          type: string
          format: date-time
          description: The date the transaction was created.
          readOnly: true
      required:
      - tasks
    TaskResultDocumentScanFileDocument:
      allOf:
      - $ref: '#/components/schemas/TaskResultFile'
      properties:
        category:
          type: string
          description: The file category
          example: document
        type:
          $ref: '#/components/schemas/DocumentType'
        name:
          type: string
          description: The name of the document.
          example: Netherlands - Driving License (2022)
        score:
          $ref: '#/components/schemas/AuthenticityScore'
    TaskResultFaceLiveness:
      properties:
        type:
          type: string
          enum:
          - face_liveness
          example: face_liveness
        state:
          $ref: '#/components/schemas/TaskState'
          example: completed
        attempts:
          $ref: '#/components/schemas/Attempts'
        files:
          type: array
          items:
            $ref: '#/components/schemas/TaskResultFaceLivenessFile'
    TaskResultFaceMatch:
      allOf:
      - $ref: '#/components/schemas/TaskResult'
      properties:
        type:
          type: string
          enum:
          - face_match
          example: face_match
    TaskResultFaceLivenessFile:
      allOf:
      - $ref: '#/components/schemas/TaskResultFile'
      properties:
        category:
          type: string
          enum:
          - image
          - video
          description: The file category
          example: image
    TaskType:
      type: string
      enum:
      - document_scan
      - face_liveness
      - face_match
    Settings:
      type: object
      properties:
        documentScan:
          properties:
            allowedExpiration:
              type: integer
              description: Change the allowed expiry date of the document. A positive number allows a document to be expired for the specified number of days, a negative number requires a document to be valid for at least the specified number of days.
              example: 90
            captureSources:
              type:
              - array
              - 'null'
              description: The camera capture source allows the user to live capture an ID document. The file capture source allows the user to upload an already captured ID document.
              items:
                $ref: '#/components/schemas/CaptureSource'
              default:
              - camera
              - file
            redactFields:
              type: array
              description: The fields to be masked/blurred on the downloaded ID document.
              items:
                oneOf:
                - $ref: '#/components/schemas/TextField'
                - $ref: '#/components/schemas/GraphicField'
            minimumAge:
              type:
              - integer
              - 'null'
              minimum: 0
              description: Set a minimum age of the user, that will be derived from the document.
              example: 16
            maximumAge:
              type:
              - integer
              - 'null'
              minimum: 0
              description: Set a maximum age of the user, that will be derived from the document.
              example: 80
            requireBothSides:
              type:
              - boolean
              - 'null'
              description: If set to true, the back side of the document will also be requested. Regardless if the personal number is detected on the front side. Unless the document has no other side.
              example: false
            desiredFields:
              type: array
              description: Request availability of specific fields. The other side of the document will be scanned if the desired fields are not available on the front side. The document scan will not fail if the desired fields can't be found on any of the scanned sides.
              items:
                $ref: '#/components/schemas/TextField'
            validateFields:
              type: array
              description: The specified fields must have a valid validity status. A field with a validity status of `not_checked` is also considered valid. If any of the fields have an `invalid` status, the user must attempt to scan again.
              items:
                $ref: '#/components/schemas/TextField'
            extractFields:
              type: array
              description: Specify which fields should be extracted from the document. Only the specified fields will be processed and returned in the response.
              items:
                oneOf:
                - $ref: '#/components/schemas/TextField'
                - $ref: '#/components/schemas/GraphicField'
              example:
              - document_number
              - date_of_birth
              - document_image
              - portrait
    AuditReportType:
      type: string
      enum:
      - simple
      - extended
      default: simple
      description: The type of audit report to be retrieved of a completed ID Scan transaction.
