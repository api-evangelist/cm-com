      description: The data is read from the visual inspection zone, barcode or from the machine readable zone (MRZ).
    TaskResultDocumentScanFileImage:
      allOf:
      - $ref: '#/components/schemas/TaskResultFile'
      properties:
        category:
          type: string
          description: The file category
          example: image
        type:
          type: string
          description: The type of image
          example: portrait
    GraphicField:
      type: string
      enum:
      - bar_code
      - color_dynamic
      - contact_chip
      - document_image
      - document_rear
      - eye
      - finger_left_four_fingers
      - finger_left_index
