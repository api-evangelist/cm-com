openapi: 3.2.0
info:
  title: HALO Analytics Runtime API
  description: Execute analytical operations for HALO platform
  license:
    name: ''
  version: 1.0.0
servers:
- url: /halo
tags:
- name: Runtime
paths:
  /analytics/v2/accounts/{account_id}/conversations/{conversation_id}/items:
    get:
      tags:
      - Runtime
      description: Get conversation items by conversation ID, optionally filtered by interaction ID.
      operationId: get_conversation_items
      parameters:
      - name: account_id
        in: path
        description: Account ID
        required: true
        schema:
          type: string
          format: uuid
      - name: conversation_id
        in: path
        description: Conversation ID
        required: true
        schema:
          type: string
          format: uuid
      - name: interaction_id
        in: query
        description: Optional interaction ID filter
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Conversation items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationItem'
        '404':
          description: Account not found
        '410':
          description: Conversation content redacted after the retention window; body carries the retained non-PII metadata (redacted, created, ended, ai_resolution_status, feedback_status)
      security:
      - X-CM-SSO-ACCOUNTGUID: []
      - {}
      summary: Get conversation items
      x-summary-source: derived
components:
  schemas:
    ConversationItem:
      oneOf:
      - type: object
        required:
        - User
        properties:
          User:
            $ref: '#/components/schemas/UserConversationItem'
      - type: object
        required:
        - Assistant
        properties:
          Assistant:
            $ref: '#/components/schemas/AssistantConversationItem'
      - type: object
        required:
        - Tool
        properties:
          Tool:
            $ref: '#/components/schemas/ToolConversationItem'
      - type: object
        required:
        - ToolInteraction
        properties:
          ToolInteraction:
            $ref: '#/components/schemas/ToolInteractionConversationItem'
      - type: object
        required:
        - Handover
        properties:
          Handover:
            $ref: '#/components/schemas/HandoverConversationItem'
    RagSelectorResult:
      type: object
      required:
      - searchable_ask
      - candidate_chunks
      - best_ids
      properties:
        best_ids:
          type: array
          items:
            type: integer
            format: int64
        candidate_chunks:
          type: array
          items:
            $ref: '#/components/schemas/CandidateChunk'
        request_type:
          type: string
        searchable_ask:
          type: string
        usage:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UsageDetails'
    ToolInteractionType:
      type: string
      enum:
      - user
      - agentic
    HandoverConversationItem:
      type: object
      required:
      - content
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ContentPart'
        from_id:
          type:
          - integer
          - 'null'
          format: int32
        from_type:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/HandoverEntityType'
        id:
          type:
          - string
          - 'null'
        meta:
          $ref: '#/components/schemas/HandoverConversationItemMeta'
        name:
          type:
          - string
          - 'null'
        to_id:
          type:
          - integer
          - 'null'
          format: int32
        to_type:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/HandoverEntityType'
    RagChunk:
      type: object
      description: RAG chunk for knowledge retrieval results
      required:
      - type
      - content
      - chunk_id
      - source_id
      - source_name
      properties:
        chunk_id:
          type: string
        content:
          type: string
        source_id:
          type: integer
          format: int64
        source_name:
          type: string
        type:
          type: string
    AgenticPromptInjectionResult:
      type: object
      required:
      - input
      - staged_output
      - agent_instructions
      - is_safe
      - reasoning
      properties:
        agent_instructions:
          type: string
        input:
          type: string
        is_safe:
          type: boolean
        reasoning:
          type: string
        request_type:
          type: string
        staged_output:
          type: string
        usage:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UsageDetails'
    AssistantConversationItem:
      type: object
      required:
      - content
      properties:
        actor:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Actor'
        content:
          type: array
          items:
            $ref: '#/components/schemas/ContentPart'
        id:
          type:
          - string
          - 'null'
        meta:
          $ref: '#/components/schemas/AssistantConversationItemMeta'
        name:
          type:
          - string
          - 'null'
        parent_tool_use_id:
          type:
          - string
          - 'null'
        tool_uses:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ToolUse'
    ToolUse:
      oneOf:
      - type: object
        required:
        - id
        - name
        - arguments
        - type
        properties:
          arguments:
            type: array
            items:
              $ref: '#/components/schemas/FunctionUseArgument'
          id:
            type: string
          name:
            type: string
          type:
            type: string
            enum:
            - function
      - type: object
        required:
        - id
        - name
        - arguments
        - tool_id
        - type
        properties:
          arguments:
            type: array
            items:
              $ref: '#/components/schemas/FunctionUseArgument'
          id:
            type: string
          name:
            type: string
          tool_id:
            $ref: '#/components/schemas/i32'
          type:
            type: string
            enum:
            - flow_tool
      - type: object
        required:
        - id
        - name
        - arguments
        - mcp_server_id
        - type
        properties:
          arguments:
            type: array
            items:
              $ref: '#/components/schemas/FunctionUseArgument'
          id:
            type: string
          mcp_server_id:
            $ref: '#/components/schemas/i32'
          name:
            type: string
          type:
            type: string
            enum:
            - mcp_tool
      - type: object
        required:
        - id
        - name
        - arguments
        - type
        properties:
          arguments:
            type: array
            items:
              $ref: '#/components/schemas/FunctionUseArgument'
          id:
            type: string
          name:
            type: string
          type:
            type: string
            enum:
            - routing
      - type: object
        required:
        - id
        - name
        - input
        - type
        properties:
          id:
            type: string
          input:
            $ref: '#/components/schemas/Value'
          name:
            type: string
          provider:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Provider'
          type:
            type: string
            enum:
            - server_tool
    FeedbackResult:
      type: object
      required:
      - original_answer
      properties:
        original_answer:
          type: string
        reasoning:
          type:
          - string
          - 'null'
        request_type:
          type: string
        rewritten_answer:
          type:
          - string
          - 'null'
        usage:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UsageDetails'
    AssistantConversationItemMeta:
      type: object
      properties:
        answering_agent_id:
          type:
          - integer
          - 'null'
          format: int32
        audio_interrupted_ms:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        contexts:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Contexts'
        conversation_ended_delay:
          type:
          - integer
          - 'null'
          format: int64
        feedback_reasoning:
          type:
          - string
          - 'null'
        generation_duration_ms:
          type:
          - integer
          - 'null'
          format: int32
        initialized:
          type:
          - string
          - 'null'
        language:
          type:
          - string
          - 'null'
        match:
          type:
          - boolean
          - 'null'
        model_results:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ModelResult'
        origin:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RequestOrigin'
        provider:
          type:
          - string
          - 'null'
        rank:
          type:
          - integer
          - 'null'
          format: int32
        reasoning:
          type:
          - string
          - 'null'
        reasoning_summary:
          type:
          - string
          - 'null'
          description: 'A reasoning model''s concise summary of its own chain-of-thought (e.g.

            OpenAI Responses API `reasoning.summary`), surfaced for observability.

            Deliberately separate from `reasoning`, which elsewhere in the

            orchestrator/analytics stack means why the system took an action

            (fallback trigger, classification, guardrail) — conflating the two

            would surface a model''s internal thinking where a business-logic

            rationale is expected.'
        tokens:
          type:
          - integer
          - 'null'
          format: int32
        used_feedback:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Feedback'
        used_knowledge:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Knowledge'
        used_media:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/MediaContentPart'
    HandoverConversationItemMeta:
      type: object
      properties:
        contexts:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Contexts'
        conversation_ended_delay:
          type:
          - integer
          - 'null'
          format: int64
        handover_details:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/HandoverDetails'
        initialized:
          type:
          - string
          - 'null'
        model_results:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ModelResult'
        origin:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RequestOrigin'
        rank:
          type:
          - integer
          - 'null'
          format: int32
        tokens:
          type:
          - integer
          - 'null'
          format: int32
    ToolOption:
      oneOf:
      - allOf:
        - $ref: '#/components/schemas/FunctionDefinition'
        - type: object
          required:
          - type
          properties:
            type:
              type: string
              enum:
              - function
      - allOf:
        - $ref: '#/components/schemas/FlowToolDefinition'
        - type: object
          required:
          - type
          properties:
            type:
              type: string
              enum:
              - flow_tool
      - allOf:
        - $ref: '#/components/schemas/McpToolDefinition'
        - type: object
          required:
          - type
          properties:
            type:
              type: string
              enum:
              - mcp_tool
      - allOf:
        - $ref: '#/components/schemas/ServerToolDefinition'
        - type: object
          required:
          - type
          properties:
            type:
              type: string
              enum:
              - server_tool
      - allOf:
        - $ref: '#/components/schemas/FunctionDefinition'
        - type: object
          required:
          - type
          properties:
            type:
              type: string
              enum:
              - routing
    Knowledge:
      type: object
      required:
      - id
      - source_id
      - chunk_id
      - content
      - metadata
      - distance
      properties:
        chunk_id:
          type: string
        content:
          type: string
        distance:
          type: number
          format: double
        id:
          $ref: '#/components/schemas/i64'
        metadata:
          type: object
          additionalProperties: {}
          propertyNames:
            type: string
        source:
          type: string
        source_id:
          $ref: '#/components/schemas/i64'
        source_reference:
          type: string
    MediaDataUri:
      type: string
    FunctionOptionParameter:
      type: object
      required:
      - name
      - required
      - schema
      properties:
        name:
          type: string
        required:
          type: boolean
        schema:
          $ref: '#/components/schemas/JsonSchema'
    FlowToolDefinition:
      allOf:
      - $ref: '#/components/schemas/FunctionDefinition'
      - type: object
        required:
        - tool_id
        properties:
          tool_id:
            type: integer
            format: int32
      description: Flow-based tool definition with a mandatory tool ID.
    PromptInjectionResult:
      type: object
      required:
      - input
      - is_safe
      - reasoning
      properties:
        input:
          type: string
        is_safe:
          type: boolean
        reasoning:
          type: string
        request_type:
          type: string
        usage:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UsageDetails'
    HandoverEntityType:
      type: string
      enum:
      - USER_DEFINED_AGENT
      - BUILTIN_AGENT
      - EXTERNAL
    CustomGuardrailResultType:
      type: string
      description: Custom guardrail result type
      enum:
      - continue
      - stop
      - rewrite
    Actor:
      oneOf:
      - type: object
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - msc_user
      - type: object
        required:
        - type
        properties:
          name:
            type:
            - string
            - 'null'
          type:
            type: string
            enum:
            - msc_agent
      - type: object
        required:
        - id
        - name
        - type
        properties:
          id:
            type: string
          name:
            type: string
          type:
            type: string
            enum:
            - teams
      description: 'Identifies the specific participant who authored a `User` or `Assistant`

        conversation item, for conversations with more than one distinct actor

        on that role (e.g. MSC''s end-user/agent distinction, or a Teams channel

        thread). Absent when the item''s role alone identifies the author.


        Serializes as a tagged object (`{"type": "msc_user"}`, `{"type": "teams", ...}`,

        etc). Deserialization additionally accepts the bare strings `"End_User"` /

        `"Customer_Service_Agent"` for `MscUser` / `MscAgent { name: None }` — MSC''s

        legacy `/instruction` and `/suggestion` endpoints have sent exactly those two

        string values on the wire for years, so reading that shape can''t be dropped.

        Nothing produces it anymore; it''s accepted, not emitted.'
    ModelResult:
      oneOf:
      - allOf:
        - $ref: '#/components/schemas/ClassifyInstructionResult'
        - type: object
          required:
          - request_type
          properties:
            request_type:
              type: string
              enum:
              - classify_instruction
      - allOf:
        - $ref: '#/components/schemas/QueryClassificationResult'
        - type: object
          required:
          - request_type
          properties:
            request_type:
              type: string
              enum:
              - query_classification
      - allOf:
        - $ref: '#/components/schemas/PromptInjectionResult'
        - type: object
          required:
          - request_type
          properties:
            request_type:
              type: string
              enum:
              - prompt_injection
      - allOf:
        - $ref: '#/components/schemas/SummarizeConversationResult'
        - type: object
          required:
          - request_type
          properties:
            request_type:
              type: string
              enum:
              - summarize_conversation
      - allOf:
        - $ref: '#/components/schemas/BasicPromptInjectionResult'
        - type: object
          required:
          - request_type
          properties:
            request_type:
              type: string
              enum:
              - basic_prompt_injection
      - allOf:
        - $ref: '#/components/schemas/AgenticPromptInjectionResult'
        - type: object
          required:
          - request_type
          properties:
            request_type:
              type: string
              enum:
              - agentic_prompt_injection
      - allOf:
        - $ref: '#/components/schemas/CustomGuardrailResult'
        - type: object
          required:
          - request_type
          properties:
            request_type:
              type: string
              enum:
              - custom_guardrail
      - allOf:
        - $ref: '#/components/schemas/AnswerStyleResult'
        - type: object
          required:
          - request_type
          properties:
            request_type:
              type: string
              enum:
              - answer_style
      - allOf:
        - $ref: '#/components/schemas/FeedbackResult'
        - type: object
          required:
          - request_type
          properties:
            request_type:
              type: string
              enum:
              - feedback
      - allOf:
        - $ref: '#/components/schemas/DoNotAnswerResult'
        - type: object
          required:
          - request_type
          properties:
            request_type:
              type: string
              enum:
              - do_not_answer
      - allOf:
        - $ref: '#/components/schemas/FallbackAnswerResult'
        - type: object
          required:
          - request_type
          properties:
            request_type:
              type: string
              enum:
              - fallback_answer
      - allOf:
        - $ref: '#/components/schemas/RagRewriteResult'
        - type: object
          required:
          - request_type
          properties:
            request_type:
              type: string
              enum:
              - rag_rewrite
      - allOf:
        - $ref: '#/components/schemas/RagPlannerResult'
        - type: object
          required:
          - request_type
          properties:
            request_type:
              type: string
              enum:
              - rag_planner
      - allOf:
        - $ref: '#/components/schemas/RagRefinerResult'
        - type: object
          required:
          - request_type
          properties:
            request_type:
              type: string
              enum:
              - rag_refiner
      - allOf:
        - $ref: '#/components/schemas/RagSelectorResult'
        - type: object
          required:
          - request_type
          properties:
            request_type:
              type: string
              enum:
              - rag_selector
      - allOf:
        - $ref: '#/components/schemas/AgentAnswerResult'
        - type: object
          required:
          - request_type
          properties:
            request_type:
              type: string
              enum:
              - agent_answer
      - allOf:
        - $ref: '#/components/schemas/RagAnswerResult'
        - type: object
          required:
          - request_type
          properties:
            request_type:
              type: string
              enum:
              - rag_answer
      - allOf:
        - $ref: '#/components/schemas/RagAnswerSubagentResult'
        - type: object
          required:
          - request_type
          properties:
            request_type:
              type: string
              enum:
              - rag_answer_subagent
      - allOf:
        - $ref: '#/components/schemas/LanguageDetectionResult'
        - type: object
          required:
          - request_type
          properties:
            request_type:
              type: string
              enum:
              - language_detection
      - allOf:
        - $ref: '#/components/schemas/LanguageTranslationResult'
        - type: object
          required:
          - request_type
          properties:
            request_type:
              type: string
              enum:
              - language_translation
      description: Model result discriminated union - matches Python ModelResult type
    MessageList:
      type: object
      description: Language translation message
      required:
      - message_id
      - content
      properties:
        content:
          type: string
        message_id:
          type: string
    JsonSchema:
      allOf:
      - type:
        - object
        - 'null'
        description: 'any remaining JSON Schema keywords we don''t model explicitly. catch-all

          for things like `pattern`, `format`, `minLength`, etc. — keywords that

          strict-mode openai rejects and that we deliberately don''t surface as

          typed fields, but pass through for non-strict consumers.'
        additionalProperties:
          $ref: '#/components/schemas/Value'
        propertyNames:
          type: string
      - type: object
        properties:
          $defs:
            type:
            - object
            - 'null'
            description: '`$defs`: named subschemas usable from `$ref`. accepts the legacy

              `definitions` key as an alias on input.'
            additionalProperties:
              $ref: '#/components/schemas/JsonSchema'
            propertyNames:
              type: string
          $ref:
            type:
            - string
            - 'null'
            description: '`$ref`: pointer to a definition (e.g. `#/$defs/Name`).'
          additionalItems:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/JsonSchema'
              description: '`additionalItems`: schema for items beyond the tuple defined by `items`.'
          additionalProperties:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/AdditionalProperties'
              description: 'For objects: allow/deny extra keys'
          anyOf:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/JsonSchema'
            description: '`anyOf`: a tagged union of acceptable schemas.'
          const:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Value'
              description: '`const`: a single allowed value. spec is type-agnostic.'
          description:
            type:
            - string
            - 'null'
          enum:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/Value'
            description: '`enum`: any allowed values. spec is type-agnostic, hence `JsonValue`.'
          exclusiveMaximum:
            type:
            - number
            - 'null'
            format: double
            description: '`exclusiveMaximum`: numbers/integers strictly less than this.'
          exclusiveMinimum:
            type:
            - number
            - 'null'
            format: double
            description: '`exclusiveMinimum`: numbers/integers strictly greater than this.'
          items:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/JsonSchema'
              description: 'For arrays: a schema for the items'
          properties:
            type:
            - object
            - 'null'
            description: 'For objects: property-name -> schema'
            additionalProperties:
              $ref: '#/components/schemas/JsonSchema'
            propertyNames:
              type: string
          required:
            type:
            - array
            - 'null'
            items:
              type: string
            description: 'For objects: names of required properties'
          title:
            type:
            - string
            - 'null'
            description: '`title`: human-readable label.'
          type:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/JsonTypeSpec'
    Feedback:
      type: object
      required:
      - feedback_id
      - profile_id
      - account_id
      - conversation_id
      - interaction_id
      - original_answer
      - feedback
      - distance
      - feedback_reason
      properties:
        account_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        distance:
          type: number
          format: double
        feedback:
          type: string
        feedback_id:
          $ref: '#/components/schemas/i64'
        feedback_reason:
          $ref: '#/components/schemas/FeedbackReason'
        interaction_id:
          type: string
          format: uuid
        original_answer:
          type: string
        profile_id:
          $ref: '#/components/schemas/i64'
    RagPlannerResult:
      type: object
      required:
      - searchable_ask
      - seed_queries
      properties:
        request_type:
          type: string
        searchable_ask:
          type: string
        seed_queries:
          type: array
          items:
            type: string
        usage:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UsageDetails'
    VoiceLoggingHandoverDetails:
      type: object
      description: Voice logging handover details
    BasicPromptInjectionResult:
      type: object
      required:
      - input
      - is_safe
      - reasoning
      properties:
        input:
          type: string
        is_safe:
          type: boolean
        reasoning:
          type: string
        request_type:
          type: string
        usage:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UsageDetails'
    FormattingOption:
      type: string
      description: Formatting option for agent answer
      enum:
      - buttons
      - carousel
      - show_feedback
    TranslationContent:
      oneOf:
      - type: string
      - type: array
        items:
          $ref: '#/components/schemas/MessageList'
      description: Translation input content (either text or message list)
    ToolConversationItemMeta:
      type: object
      properties:
        contexts:
