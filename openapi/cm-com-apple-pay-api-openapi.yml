        amount: 2000
        currency: EUR
        expiresAt: '2025-05-21T14:17:44.491Z'
        language: nl
        consumer:
          address:
            countryCode: NL
          email: john.doe@email.tld
        returnUrl: https://tradename.tld/shop/return/?purchase=PO1234666
        webhooks:
        - url: https://yourdomain.tld/order-webhooks?purchaseId=order123
