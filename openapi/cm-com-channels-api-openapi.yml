          enum:
          - WHATSAPP
          - FACEBOOK
          - INSTAGRAM
      requestBody:
        content:
          application/json:
            schema:
              type: object
          text/json:
            schema:
              type: object
          text/xml:
            schema:
              type: object
          multipart/form-data:
            schema:
              type: object
          application/x-www-form-urlencoded:
            schema:
              type: object
        description: The dialog result.
        required: true
      responses:
        '200':
          description: OK
      security:
      - ProductToken: []
    servers:
    - url: https://api.cm.com
      description: Production Server
