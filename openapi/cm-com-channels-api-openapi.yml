openapi: 3.2.0
info:
  title: Cm Com Channels API
  version: '1.0'
  description: 'Operations tagged Channels across 4 of this provider''s published API definitions: cm-com-live-event-ticketing-v1-openapi.yml, cm-com-messaging-channels-api-v1-2-openapi.yml, cm-com-mobile-marketing-cloud-mmc-campaigns-v1-openapi.yml, cm-com-sign-v1-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /ticketing/v1
- url: https://api.cm.com
  description: Production Server
- url: https://api.cm.com/sign/v1
- url: https://api.cm.com/sign-sandbox/v1
tags:
- name: Channels
paths:
  /events/{event_id}/channels:
    get:
      description: Returns the active sales channels of an event. Each channel has a public shop `url` that you can link your customers to.
      operationId: ListChannels
      parameters:
      - description: Event ID (UUID)
        in: path
        name: event_id
        required: true
        schema:
          type: string
      - description: Number of items to skip (default 0)
        in: query
        name: skip
        schema:
          type: integer
      - description: Page size (default 100)
        in: query
        name: take
        schema:
          type: integer
      - description: Field to sort by
        in: query
        name: sort
        schema:
          enum:
          - created_at
          - slug
          type: string
      - description: Sort direction
        in: query
        name: order
        schema:
          enum:
          - asc
          - desc
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.listResponse-handler_channelListItem'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rest.HttpError'
          description: event_not_found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rest.HttpError'
          description: internal_server_error
      security:
      - SystemTokenAuth: []
      summary: List channels
      tags:
      - Channels
    servers:
    - url: /ticketing/v1
  /channels/v1/accounts/{accountId}/channels/meta/loginforbusiness/attempt:
    post:
      tags:
      - Channels
      summary: Processes a Meta Login for Business attempt
      operationId: Channels_ProcessLoginForBusinessAttemptAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelType
        in: query
        description: Type of the channel.
        required: true
        schema:
          type: string
          enum:
          - WHATSAPP
          - FACEBOOK
          - INSTAGRAM
      responses:
        '200':
          description: OK
      security:
      - ProductToken: []
    servers:
    - url: https://api.cm.com
      description: Production Server
  /channels/v1/accounts/{accountId}/channels/meta/loginforbusiness/attempt/dialogresult:
