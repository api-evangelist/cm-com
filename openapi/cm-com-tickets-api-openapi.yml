          example: 00000000-0000-0000-0000-000000000000
        tertiaryConstraintId:
          type: string
          maxLength: 255
          example: 00000000-0000-0000-0000-000000000000
        upstreamPlatform:
          type: string
          enum:
          - ENMA_SUBSCRIBER
          - GENERAL_ADMISSION
          - SEATED_TICKETING
          - GLOBAL_TICKET
          - INTERSOLVE
          - PUBLIQ
          - YOURTICKETPROVIDER
          - PASS_TEST
          - PASS_NATIONAAL_MILITAIR_MUSEUM
          - PASS_WEC
          - PASS_CENTRAAL_MUSEUM
          - PHOENIX_DES_LUMIERES
          - PORT_DES_LUMIERES
          - SMOOTHR_DEMO_ACCOUNT
          - ENTRANCE_MANAGEMENT
          - STICHTING_KONINKLIJKE_DEFENSIEMUSEA
          - ELECTRIC_IBIZA_ENTERTAINMENT
          - MOMICE_KLM_OPEN
          - CUSTOMER_DATA_PLATFORM
          - GO_CITY
          example: ENTRANCE_MANAGEMENT
        saleOrigin:
          type: string
          enum:
          - GUEST_LIST
          - PARTNER_API
          - SHOP
          - BACKOFFICE_ORDER
          - CM_POS
          - SECONDARY_TICKETING_CM
          - SECONDARY_TICKETING_TICKET_SWAP
          example: SHOP
    PageDto:
      type: object
      properties:
