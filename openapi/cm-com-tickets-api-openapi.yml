openapi: 3.2.0
info:
  title: Cm Com Tickets API
  contact: {}
  license:
    name: Proprietary
    url: https://www.cm.com
  version: '1.0'
  description: 'Operations tagged Tickets across 2 of this provider''s published API definitions: cm-com-live-entrance-management-v1-openapi.yml, cm-com-live-entrance-management-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.cm.com
security:
- cookie: []
tags:
- name: Tickets
  description: Ticket management and lookup
paths:
  /entrance/v1.0/organisations/{organisationUuid}/tickets:
    post:
      operationId: TicketsController_create_v1.0
      parameters:
      - name: organisationUuid
        required: true
        in: path
        schema: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - cookie: []
      summary: Create a ticket
      tags:
      - Tickets
    get:
      operationId: TicketsController_findAll_v1.0
      parameters:
      - name: order
        required: false
        in: query
        schema:
          default: ASC
          type: string
          enum:
          - ASC
          - DESC
      - name: page
        required: false
        in: query
        schema:
          minimum: 1
          default: 1
          type: number
      - name: take
        required: false
        in: query
        schema:
          minimum: 1
          maximum: 5000
          default: 25
          type: number
      - name: search
        required: false
        in: query
        description: Returns only records that match the search query. Searches in most common fields such as name, description and for tickets all visitor data.
        schema:
          minLength: 1
          maxLength: 255
          type: string
      - name: uuids
        required: false
        in: query
        description: Comma separated values for ticket uuid
        schema:
          example: 00000000-0000-0000-0000-000000000000
          type: string
      - name: externalIds
        required: false
        in: query
        description: Comma separated values for ticket externalId
        schema:
          example: 00000000-0000-0000-0000-000000000000
          type: string
      - name: products
        required: false
        in: query
        description: Comma separated values for product externalId
        schema:
          example: 00000000-0000-0000-0000-000000000000
          type: string
      - name: events
        required: false
        in: query
        description: Comma separated values for event externalId
        schema:
          example: 00000000-0000-0000-0000-000000000000
          type: string
      - name: venueSections
        required: false
        in: query
        description: Comma separated values for venueSection externalId
        schema:
          example: 00000000-0000-0000-0000-000000000000
          type: string
      - name: constraints
        required: false
        in: query
        description: Comma separated values for constraint externalId
        schema:
          example: 00000000-0000-0000-0000-000000000000
          type: string
      - name: imports
        required: false
        in: query
        description: Comma separated values for importId
        schema:
          example: 00000000-0000-0000-0000-000000000000
          type: string
      - name: saleOrigins
        required: false
        in: query
        description: Comma separated values for ticket saleOrigin
        schema:
          example: SHOP,GUEST_LIST
          type: string
      - name: scannedAtStart
        required: true
        in: query
        description: scannedAt start date (ISO format)
        schema:
          format: date-time
          example: '2024-12-03T12:00:00.000Z'
          type: string
      - name: scannedAtEnd
        required: true
        in: query
        description: scannedAt end date (ISO format)
        schema:
          format: date-time
          example: '2024-12-03T23:00:00.000Z'
          type: string
      - name: status
        required: false
        in: query
        description: Filter tickets by their derived scan status
        schema:
          type: string
          enum:
          - CHECKED_IN
          - REMAINING
          - ERRORS
      - name: ticketStatus
        required: false
        in: query
        description: Filter tickets by their stored validity status (VALID / INVALID)
        schema:
          type: string
          enum:
          - VALID
          - INVALID
      - name: organisationUuid
        required: true
        in: path
        schema: {}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageDto'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Ticket'
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - cookie: []
      summary: List tickets with pagination
      tags:
      - Tickets
    servers:
    - url: https://api.cm.com
