openapi: 3.2.0
info:
  title: Cm Com Entrance Plans API
  contact: {}
  license:
    name: Proprietary
    url: https://www.cm.com
  version: '1.0'
  description: 'Operations tagged Entrance Plans across 2 of this provider''s published API definitions: cm-com-live-entrance-management-v1-openapi.yml, cm-com-live-entrance-management-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.cm.com
security:
- cookie: []
tags:
- name: Entrance Plans
  description: Entrance plan configuration and assignment
paths:
  /entrance/v1.0/organisations/{organisationUuid}/plans:
    post:
      operationId: EntrancePlansController_create_v1.0
      parameters:
      - name: organisationUuid
        required: true
        in: path
        schema: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEntrancePlanDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntrancePlan'
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - cookie: []
      summary: Create an entrance plan
      tags:
      - Entrance Plans
    get:
      operationId: EntrancePlansController_findAll_v1.0
      parameters:
      - name: order
        required: false
        in: query
        schema:
          default: ASC
          type: string
          enum:
          - ASC
          - DESC
      - name: page
        required: false
        in: query
        schema:
          minimum: 1
          default: 1
          type: number
      - name: take
        required: false
        in: query
        schema:
          minimum: 1
          maximum: 5000
          default: 25
          type: number
      - name: search
        required: false
        in: query
        description: Returns only records that match the search query. Searches in most common fields such as name, description and for tickets all visitor data.
        schema:
          minLength: 1
          maxLength: 255
          type: string
      - name: venues
        required: false
        in: query
        description: Comma separated values for venue ids
        schema:
          example: 00000000-0000-0000-0000-000000000000,00000000-0000-0000-0000-000000000000
          type: string
      - name: events
        required: false
        in: query
        description: Comma separated values for event ids
        schema:
          example: 00000000-0000-0000-0000-000000000000,00000000-0000-0000-0000-000000000000
          type: string
      - name: status
        required: false
        in: query
        description: Comma separated values for status filter
        schema:
          example:
          - ACTIVE
          - NO_RULES
          type: array
          items:
            type: string
            enum:
            - ACTIVE
            - INACTIVE
            - NO_RULES
      - name: onlyParents
        required: false
        in: query
        description: If true will only return top level parent plans without configuration. Default is false.
        schema:
          example: false
          type: boolean
      - name: period
        required: false
        in: query
        description: Filter entrance plans by event date period. FUTURE shows plans with upcoming events or no events, PAST shows plans with only past events.
        schema:
          example: FUTURE
          type: string
          enum:
          - PAST
          - FUTURE
          - ALL
      - name: organisationUuid
        required: true
        in: path
        schema: {}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageDto'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/EntrancePlan'
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - cookie: []
      summary: List all entrance plans
      tags:
      - Entrance Plans
    servers:
    - url: https://api.cm.com
