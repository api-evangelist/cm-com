          type: string
          default: '#3ddc97'
          description: Colour (hexcode) that is used on scanner display for successful checkins (Default is green).
        scanMessage:
          type: string
          maxLength: 255
          default: Barcode successfully checked in.
          description: Message displayed on successful checkin.
        requiresPhotoVerification:
          type: boolean
          description: If set to true a successful checkin requires staff to verify the visitor against a photo (e.g. Museumpass Belgium) before it is registered.
        requiresConfirmationQuestion:
          type: boolean
          description: If set to true a successful checkin requires staff to answer a confirmation question before it is registered.
        confirmationQuestion:
          type: string
          maxLength: 80
          example: Does this visitor meet the 18+ age requirement?
          description: Question shown to staff. Required when requiresConfirmationQuestion is true.
        venueSectionId:
          type: string
          maxLength: 255
          example: 00000000-0000-0000-0000-000000000000
          description: externalId of venueSection the rule applies to
        eventId:
          type: string
          maxLength: 255
          example: 00000000-0000-0000-0000-000000000000
          description: externalId of event the rule applies to
        productId:
          type: string
          maxLength: 255
          example: 00000000-0000-0000-0000-000000000000
          description: externalId of product the rule applies to
        primaryConstraintId:
          type: string
          maxLength: 255
          example: 00000000-0000-0000-0000-000000000000
          description: externalId of constraint the rule applies to
        secondaryConstraintId:
          type: string
          maxLength: 255
          example: 00000000-0000-0000-0000-000000000000
          description: externalId of constraint the rule applies to
        tertiaryConstraintId:
          type: string
          maxLength: 255
          example: 00000000-0000-0000-0000-000000000000
          description: externalId of constraint the rule applies to
    PageDto:
      type: object
      properties:
        data:
