openapi: 3.2.0
info:
  title: Cm Com Scanning Rules API
  contact: {}
  license:
    name: Proprietary
    url: https://www.cm.com
  version: '1.0'
  description: 'Operations tagged Scanning Rules across 2 of this provider''s published API definitions: cm-com-live-entrance-management-v1-openapi.yml, cm-com-live-entrance-management-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.cm.com
security:
- cookie: []
tags:
- name: Scanning Rules
  description: Rules governing scan behaviour
paths:
  /entrance/v1.0/organisations/{organisationUuid}/plans/{entrancePlanUuid}/rules:
    post:
      operationId: RulesController_create_v1.0
      parameters:
      - name: entrancePlanUuid
        required: true
        in: path
        schema:
          type: string
      - name: organisationUuid
        required: true
        in: path
        schema: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRuleDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - cookie: []
      summary: Create a scanning rule
      tags:
      - Scanning Rules
    get:
      operationId: RulesController_findAllByEntrancePlan_v1.0
      parameters:
      - name: entrancePlanUuid
        required: true
        in: path
        schema:
          type: string
      - name: order
        required: false
        in: query
        schema:
          default: ASC
          type: string
          enum:
          - ASC
          - DESC
      - name: page
        required: false
        in: query
        schema:
          minimum: 1
          default: 1
          type: number
      - name: take
        required: false
        in: query
        schema:
          minimum: 1
          maximum: 5000
          default: 25
          type: number
      - name: organisationUuid
        required: true
        in: path
        schema: {}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageDto'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/RuleDto'
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - cookie: []
      summary: List all rules for an entrance plan
      tags:
      - Scanning Rules
    servers:
    - url: https://api.cm.com
