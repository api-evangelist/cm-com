components:
  schemas:
    CreateRulesBulkDto:
      type: object
      properties:
        rules:
          description: Array of scanning rules to create in a single call.
          type: array
          items:
            $ref: '#/components/schemas/CreateRuleDto'
      required:
      - rules
    RuleDto:
      type: object
      properties:
        uuid:
          type: string
          readOnly: true
          example: 00000000-0000-0000-0000-000000000000
        name:
          type: string
          maxLength: 255
          example: Scanning Rule All VIP tickets scannable twice
        maxValidations:
          type: number
          minimum: 0
          description: Amount a ticket can be validated (successfully scanned) on the rule. When 0 the ticket cannot be scanned.
        maxValidationScope:
          type: string
          enum:
          - UNRESTRICTED
          - DAILY
          - SAME_DAY
          example: UNRESTRICTED
          description: 'Defines the scope of maxValidations. UNRESTRICTED: total limit across entire validity period, DAILY: limit resets each day, SAME_DAY: all scans must occur on the same calendar day.'
        validFrom:
          format: date-time
          type: string
          description: Barcodes can be scanned from this date onwards
        validUntil:
          format: date-time
          type: string
          description: Barcodes can be scanned until this date.
        daysValidAfterPurchase:
          type: number
          description: Amount of days a barcode can be validated after its issued date (whole days, timestamp is not taken into account)
        shouldValidateTimeslotMoment:
          type: boolean
          description: If set to true a barcode with a timeslot can only be scanned on the (whole) day of the timeslot
        minutesBeforeTimeslot:
          type: number
          minimum: 0
          maximum: 120
          description: Minutes before the timeslot moment a barcode may be scanned. When set (with or without minutesAfterTimeslot) the scan is validated against an exact time window around the timeslot instead of the whole day. Only applies when shouldValidateTimeslotMoment is true.
        minutesAfterTimeslot:
          type: number
          minimum: 0
          maximum: 120
          description: Minutes after the timeslot moment a barcode may be scanned. When set (with or without minutesBeforeTimeslot) the scan is validated against an exact time window around the timeslot instead of the whole day. Only applies when shouldValidateTimeslotMoment is true.
        shouldValidateOnParent:
          type: boolean
          description: If set to true barcodes will be validated on the top-level parent of the entrance plan.
        scanColour:
          type: string
          default: '#3ddc97'
          description: Colour (hexcode) that is used on scanner display for successful checkins (Default is green).
        scanMessage:
          type: string
          maxLength: 255
          default: Barcode successfully checked in.
          description: Message displayed on successful checkin.
        requiresPhotoVerification:
          type: boolean
          description: If set to true a successful checkin requires staff to verify the visitor against a photo (e.g. Museumpass Belgium) before it is registered.
        requiresConfirmationQuestion:
          type: boolean
          description: If set to true a successful checkin requires staff to answer a confirmation question before it is registered.
        confirmationQuestion:
          type: string
          maxLength: 80
          example: Does this visitor meet the 18+ age requirement?
          description: Question shown to staff. Required when requiresConfirmationQuestion is true.
        venueSectionId:
          type: string
          maxLength: 255
          example: 00000000-0000-0000-0000-000000000000
          description: externalId of venueSection the rule applies to
        eventId:
          type: string
          maxLength: 255
          example: 00000000-0000-0000-0000-000000000000
          description: externalId of event the rule applies to
        productId:
          type: string
          maxLength: 255
          example: 00000000-0000-0000-0000-000000000000
          description: externalId of product the rule applies to
        primaryConstraintId:
          type: string
          maxLength: 255
          example: 00000000-0000-0000-0000-000000000000
          description: externalId of constraint the rule applies to
        secondaryConstraintId:
          type: string
          maxLength: 255
          example: 00000000-0000-0000-0000-000000000000
          description: externalId of constraint the rule applies to
        tertiaryConstraintId:
          type: string
          maxLength: 255
          example: 00000000-0000-0000-0000-000000000000
          description: externalId of constraint the rule applies to
      required:
      - uuid
      - name
      - maxValidations
      - maxValidationScope
      - shouldValidateTimeslotMoment
      - shouldValidateOnParent
      - requiresPhotoVerification
      - requiresConfirmationQuestion
    BulkRuleUuidsDto:
      type: object
      properties:
        ruleUuids:
          description: UUIDs of the rules the operation should be applied to.
          type: array
          items:
            type: array
      required:
      - ruleUuids
    ErrorDto:
      type: object
      properties:
        errorCode:
          type: number
          example: 400100
          description: Error code specific to the error, consisting of a three digit http status code and a digit application specific code.
        description:
          type: string
          maxLength: 255
          example: Description of the error.
        httpStatus:
          type: number
          enum:
          - 100
          - 101
          - 102
          - 103
          - 200
          - 201
          - 202
          - 203
          - 204
          - 205
          - 206
          - 207
          - 208
          - 210
          - 300
          - 301
          - 302
          - 303
          - 304
          - 307
          - 308
          - 400
          - 401
          - 402
          - 403
          - 404
          - 405
          - 406
          - 407
          - 408
          - 409
          - 410
          - 411
          - 412
          - 413
          - 414
          - 415
          - 416
          - 417
          - 418
          - 421
          - 422
          - 423
          - 424
          - 428
          - 429
          - 456
          - 500
          - 501
          - 502
          - 503
          - 504
          - 505
          - 507
          - 508
          example: 400
      required:
      - errorCode
      - description
      - httpStatus
    BulkUpdateRulesDto:
      type: object
      properties:
        ruleUuids:
          description: UUIDs of the rules the operation should be applied to.
          type: array
          items:
            type: array
        changes:
          description: Scan-config changes applied to every rule listed in ruleUuids.
          allOf:
          - $ref: '#/components/schemas/BulkRuleChangesDto'
      required:
      - ruleUuids
      - changes
    UpdateRuleDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          example: Scanning Rule All VIP tickets scannable twice
        maxValidations:
          type: number
          minimum: 0
          description: Amount a ticket can be validated (successfully scanned) on the rule. When 0 the ticket cannot be scanned.
        maxValidationScope:
          type: string
          enum:
          - UNRESTRICTED
          - DAILY
          - SAME_DAY
          example: UNRESTRICTED
          description: 'Defines the scope of maxValidations. UNRESTRICTED: total limit across entire validity period, DAILY: limit resets each day, SAME_DAY: all scans must occur on the same calendar day.'
        validFrom:
          format: date-time
          type: string
          description: Barcodes can be scanned from this date onwards
        validUntil:
          format: date-time
          type: string
          description: Barcodes can be scanned until this date.
        daysValidAfterPurchase:
          type: number
          description: Amount of days a barcode can be validated after its issued date (whole days, timestamp is not taken into account)
        shouldValidateTimeslotMoment:
          type: boolean
          description: If set to true a barcode with a timeslot can only be scanned on the (whole) day of the timeslot
        minutesBeforeTimeslot:
          type: number
          minimum: 0
          maximum: 120
          description: Minutes before the timeslot moment a barcode may be scanned. When set (with or without minutesAfterTimeslot) the scan is validated against an exact time window around the timeslot instead of the whole day. Only applies when shouldValidateTimeslotMoment is true.
