openapi: 3.2.0
info:
  contact:
    email: ticketing@cm.com
    name: CM.com Ticketing
    url: https://www.cm.com
  description: Integrate your own systems with CM.com Ticketing.
  license:
    name: Proprietary
    url: https://www.cm.com
  termsOfService: https://www.cm.com/terms-of-service/
  title: External Ticketing Customer products API
  version: '0.1'
servers:
- url: /ticketing/v1
tags:
- name: Customer products
paths:
  /customer-products:
    get:
      description: Returns all customer products (the individual tickets and other products issued to customers) across all of your events. Accepts the same filters as the event-level list.
      operationId: ListOrganisationCustomerProducts
      parameters:
      - description: Number of items to skip (default 0)
        in: query
        name: skip
        schema:
          type: integer
      - description: Page size (default 100)
        in: query
        name: take
        schema:
          type: integer
      - description: Only return customer products of this product type
        in: query
        name: product_type
        schema:
          type: string
      - description: Only return customer products with this status
        in: query
        name: status
        schema:
          type: string
      - description: Only return customer products of this product (UUID). Repeat the parameter to include several products
        in: query
        name: product_id
        schema:
          items:
            type: string
          type: array
      - description: Only return customer products whose order was completed at or after this time (RFC 3339)
        in: query
        name: issued_at_from
        schema:
          type: string
      - description: Only return customer products whose order was completed at or before this time (RFC 3339)
        in: query
        name: issued_at_to
        schema:
          type: string
      - description: Only return customer products whose order was refunded at or after this time (RFC 3339)
        in: query
        name: refunded_at_from
        schema:
          type: string
      - description: Only return customer products whose order was refunded at or before this time (RFC 3339)
        in: query
        name: refunded_at_to
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.listResponse-handler_customerProductListItem'
          description: OK
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rest.HttpError'
          description: internal_server_error
      security:
      - SystemTokenAuth: []
      summary: List customer products for the organisation
      tags:
      - Customer products
  /events/{event_id}/customer-products:
    get:
      description: Returns all customer products (the individual tickets and other products issued to customers) of one event.
      operationId: ListEventCustomerProducts
      parameters:
      - description: Event ID (UUID)
        in: path
        name: event_id
        required: true
        schema:
          type: string
      - description: Number of items to skip (default 0)
        in: query
        name: skip
        schema:
          type: integer
      - description: Page size (default 100)
        in: query
        name: take
        schema:
          type: integer
      - description: Only return customer products of this product type
        in: query
        name: product_type
        schema:
          type: string
      - description: Only return customer products with this status
        in: query
        name: status
        schema:
          type: string
      - description: Only return customer products of this product (UUID). Repeat the parameter to include several products
        in: query
        name: product_id
        schema:
          items:
            type: string
          type: array
      - description: Only return customer products whose order was completed at or after this time (RFC 3339)
        in: query
        name: issued_at_from
        schema:
          type: string
      - description: Only return customer products whose order was completed at or before this time (RFC 3339)
        in: query
        name: issued_at_to
        schema:
          type: string
      - description: Only return customer products whose order was refunded at or after this time (RFC 3339)
        in: query
        name: refunded_at_from
        schema:
          type: string
      - description: Only return customer products whose order was refunded at or before this time (RFC 3339)
        in: query
        name: refunded_at_to
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.listResponse-handler_customerProductListItem'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rest.HttpError'
          description: event_not_found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rest.HttpError'
          description: internal_server_error
      security:
      - SystemTokenAuth: []
      summary: List customer products for an event
      tags:
      - Customer products
  /events/{event_id}/orders/{order_id}/products:
    get:
      description: Returns the customer products (the individual tickets and other products issued to the customer) of one order. Accepts the same filters as the event-level and organisation-level lists.
      operationId: ListOrderCustomerProducts
      parameters:
      - description: Event ID (UUID)
        in: path
        name: event_id
        required: true
        schema:
          type: string
      - description: Order ID (UUID)
        in: path
        name: order_id
        required: true
        schema:
          type: string
      - description: Number of items to skip (default 0)
        in: query
        name: skip
        schema:
          type: integer
      - description: Page size (default 100)
        in: query
        name: take
        schema:
          type: integer
      - description: Only return customer products of this product type (for example `ENTRANCE_TICKET`)
        in: query
        name: product_type
        schema:
          type: string
      - description: Only return customer products with this status (for example `ISSUED`, `RESERVED` or `REFUNDED`)
        in: query
        name: status
        schema:
          type: string
      - description: Only return customer products of this product (UUID). Repeat the parameter to include several products
        in: query
        name: product_id
        schema:
          items:
            type: string
          type: array
      - description: Only return customer products whose order was completed at or after this time (RFC 3339)
        in: query
        name: issued_at_from
        schema:
          type: string
      - description: Only return customer products whose order was completed at or before this time (RFC 3339)
        in: query
        name: issued_at_to
        schema:
          type: string
      - description: Only return customer products whose order was refunded at or after this time (RFC 3339)
        in: query
        name: refunded_at_from
        schema:
          type: string
      - description: Only return customer products whose order was refunded at or before this time (RFC 3339)
        in: query
        name: refunded_at_to
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.listResponse-handler_customerProductListItem'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rest.HttpError'
          description: event_not_found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rest.HttpError'
          description: internal_server_error
      security:
      - SystemTokenAuth: []
      summary: List customer products for an order
      tags:
      - Customer products
  /events/{event_id}/orders/{order_id}/products/{customer_product_id}:
    get:
      description: 'Returns the details of one customer product (an individual ticket or other product issued to a customer): the customer''s details, the product, the event and venue, the seat (`null` for events without seating), how often and when it was last scanned, and the tracking parameters of the order it belongs to.'
      operationId: ViewCustomerProduct
      parameters:
      - description: Event ID (UUID)
        in: path
        name: event_id
        required: true
        schema:
          type: string
      - description: Order ID (UUID)
        in: path
        name: order_id
        required: true
        schema:
          type: string
      - description: Customer product ID (UUID)
        in: path
        name: customer_product_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.viewCustomerProductResponse'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rest.HttpError'
          description: customer_product_not_found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rest.HttpError'
          description: internal_server_error
      security:
      - SystemTokenAuth: []
      summary: View customer product
      tags:
      - Customer products
  /events/{event_id}/orders/{order_id}/products/{customer_product_id}/cancel:
    put:
      description: Cancels one customer product (an individual ticket or other product issued to a customer). Its barcode can no longer be used for entry and the product's stock is increased by one. The order it belongs to is not changed, and no refund is made. Canceling a customer product that is already canceled returns `409`.
      operationId: CancelCustomerProduct
      parameters:
      - description: Event ID (UUID)
        in: path
        name: event_id
        required: true
        schema:
          type: string
      - description: Order ID (UUID)
        in: path
        name: order_id
        required: true
        schema:
          type: string
      - description: Customer product ID (UUID)
        in: path
        name: customer_product_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.viewCustomerProductResponse'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rest.HttpError'
          description: customer_product_not_found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rest.HttpError'
          description: customer_product_already_canceled
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rest.HttpError'
          description: internal_server_error
      security:
      - SystemTokenAuth: []
      summary: Cancel customer product
      tags:
      - Customer products
components:
  schemas:
    handler.customerProductListItem:
      properties:
        event_id:
          type: string
        id:
          type: string
        order_id:
          type: string
        product_id:
          type: string
        status:
          type: string
      type: object
    handler.viewCustomerProductProduct:
      properties:
        external_id_1:
          type: string
        external_id_2:
          type: string
        external_id_3:
          type: string
        is_checkin_allowed:
          type: boolean
        name:
          additionalProperties:
            type: string
          type: object
        price_incl_vat:
          type: number
        product_type:
          type: string
        sales_from:
          type: string
        sales_until:
          type: string
        uuid:
          type: string
        valid_from:
          type: string
        valid_until:
          type: string
        validation_max_checkins:
          type: integer
      type: object
    handler.viewCustomerProductResponse:
      properties:
        barcode_id:
          type: string
        canceled_at:
          type: string
        created_at:
          type: string
        currency_id:
          type: string
        customer_data:
          $ref: '#/components/schemas/handler.viewCustomerProductCustomerData'
        event:
          $ref: '#/components/schemas/handler.viewCustomerProductEvent'
        expire_at:
          type: string
        external_barcode_id:
          type: string
        last_scanned_at:
          type: string
        order_id:
          type: string
        personalized_at:
          type: string
        price_incl_vat:
          type: number
        price_with_discount_incl_vat:
          type: number
        product:
          $ref: '#/components/schemas/handler.viewCustomerProductProduct'
        scan_count:
          type: integer
        seat:
          $ref: '#/components/schemas/handler.viewCustomerProductSeat'
        status:
          type: string
        tracking_parameters:
          items:
            $ref: '#/components/schemas/handler.viewCustomerProductTrackingParameter'
          type: array
          uniqueItems: false
        used_access_key_id:
          type: string
        used_discount_code_external_id:
          type: string
        used_discount_code_id:
          type: string
        uuid:
          type: string
        venue:
          $ref: '#/components/schemas/handler.viewCustomerProductVenue'
      type: object
    handler.viewCustomerProductSeat:
      properties:
        entrance:
          type: string
        primary_label:
          type: string
        primary_type:
          type: string
        seat_object_id:
          type: string
        secondary_label:
          type: string
        secondary_type:
          type: string
        section:
          type: string
      type: object
    handler.viewCustomerProductVenue:
      properties:
        name:
          type: string
        uuid:
          type: string
      type: object
    handler.viewCustomerProductTrackingParameter:
      properties:
        name:
          type: string
        value:
          type: string
      type: object
    rest.HttpError:
      properties:
        error_code:
          type: string
        error_msg:
          type: string
      type: object
    handler.listResponse-handler_customerProductListItem:
      properties:
        items:
          items:
            $ref: '#/components/schemas/handler.customerProductListItem'
          type: array
          uniqueItems: false
        links:
          properties:
            first:
              type: string
            last:
              type: string
            next:
              type: string
            prev:
              type: string
            self:
              type: string
          type: object
        page_size:
          type: integer
        total_items:
          type: integer
      type: object
    handler.viewCustomerProductEvent:
      properties:
        name:
          type: string
        uuid:
          type: string
      type: object
    handler.viewCustomerProductCustomerData:
      properties:
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        mobile:
          type: string
        uuid:
          type: string
      type: object
  securitySchemes:
    SystemTokenAuth:
      description: Send your organisation's system token in this header.
      in: header
      name: X-CM-SSO-ACCOUNTGUID
      type: apiKey
externalDocs:
  description: ''
  url: ''
