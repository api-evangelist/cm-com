      security:
      - cookie: []
      summary: Update a user
      tags:
      - Users
    delete:
      operationId: UsersController_remove_v1.0
      parameters:
      - name: organisationId
        required: true
        in: query
        description: Uuid of the organisation the claims apply to
        schema:
          example: 00000000-0000-0000-0000-000000000000
          type: string
      - name: entrancePlanId
        required: true
        in: query
        description: Uuid of the entrance plan the claims apply to
        schema:
          example: 00000000-0000-0000-0000-000000000000
          type: string
      - name: userUuid
        required: true
        in: path
        schema:
          type: string
      responses:
        '204':
          description: If user has claims on different organisations only removes claims on organisation. If last organisation deletes user.
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - cookie: []
