components:
  schemas:
    UserOrganisationClaimDto:
      type: object
      properties:
        organisationId:
          type: string
          description: Uuid of the organisation the claims apply to
          example: 00000000-0000-0000-0000-000000000000
        claims:
          type: array
          example:
          - ADMIN
          items:
            type: string
            enum:
            - OBSERVER
            - EDITOR
            - OWNER
            - ADMIN
            - SCAN_USER
            - SCAN_CHECKIN
            - SCAN_CHECKOUT
            - SCAN_CLICKER_CHECKIN
            - SCAN_CLICKER_CHECKOUT
            - SCAN_SEARCH
            - SCAN_VALIDATE
            - SCAN_ANALYTICS
      required:
      - organisationId
      - claims
    GenericResponseDto:
      type: object
      properties:
        message:
          type: string
          readOnly: true
          example: Successfully uploaded file.
        details:
          type: array
          items:
            type: object
          example:
          - file: filename.csv
      required:
      - message
      - details
    UpdateUserDto:
      type: object
      properties:
        firstName:
          type: string
          maxLength: 255
          example: Jane
        lastName:
          type: string
          maxLength: 255
          example: Doe
        username:
          type: string
          description: Either one of username or e-mail is mandatory
          minLength: 6
          maxLength: 255
          example: myUserName
        email:
          type: string
          description: Either one of username or e-mail is mandatory. Should be a valid e-mail.
          maxLength: 255
          example: jane.doe@example.com
        password:
          type: string
          minLength: 6
          description: Password must contain a minimum of 6 characters
          example: MyStrong3x4mpl3P4ssword!
      required:
      - password
    ErrorDto:
      type: object
      properties:
        errorCode:
          type: number
          example: 400100
          description: Error code specific to the error, consisting of a three digit http status code and a digit application specific code.
        description:
          type: string
          maxLength: 255
          example: Description of the error.
        httpStatus:
          type: number
          enum:
          - 100
          - 101
          - 102
          - 103
          - 200
          - 201
          - 202
          - 203
          - 204
          - 205
          - 206
          - 207
          - 208
          - 210
          - 300
          - 301
          - 302
          - 303
          - 304
          - 307
          - 308
          - 400
          - 401
          - 402
          - 403
          - 404
          - 405
          - 406
          - 407
          - 408
          - 409
          - 410
          - 411
          - 412
          - 413
          - 414
          - 415
          - 416
          - 417
          - 418
          - 421
          - 422
          - 423
          - 424
          - 428
          - 429
          - 456
          - 500
          - 501
          - 502
          - 503
          - 504
          - 505
          - 507
          - 508
          example: 400
      required:
      - errorCode
      - description
      - httpStatus
    ClaimsDto:
      type: object
      properties:
        organisationClaims:
          description: Optional object which allows to give a user claims on a certain organisation
          allOf:
          - $ref: '#/components/schemas/UserOrganisationClaimDto'
        entrancePlanClaims:
          description: Optional object which allows to give a user claims on a certain entrance plan
          allOf:
          - $ref: '#/components/schemas/UserEntrancePlanClaimDto'
    UserEntrancePlanClaimDto:
      type: object
      properties:
        entrancePlanId:
          type: string
          description: Uuid of the entrance plan the claims apply to
          example: 00000000-0000-0000-0000-000000000000
        claims:
          type: array
          example:
          - ADMIN
          items:
            type: string
            enum:
            - OBSERVER
            - EDITOR
            - OWNER
            - ADMIN
            - SCAN_USER
            - SCAN_CHECKIN
            - SCAN_CHECKOUT
            - SCAN_CLICKER_CHECKIN
            - SCAN_CLICKER_CHECKOUT
            - SCAN_SEARCH
            - SCAN_VALIDATE
            - SCAN_ANALYTICS
      required:
      - entrancePlanId
      - claims
    CreateUserDto:
      type: object
      properties:
        cmPersonGuid:
          type: string
          minLength: 36
          maxLength: 36
          example: 00000000-0000-0000-0000-000000000000
        firstName:
          type: string
          maxLength: 255
          example: Jane
        lastName:
          type: string
          maxLength: 255
          example: Doe
        username:
          type: string
          description: Either one of username or e-mail is mandatory
          minLength: 6
          maxLength: 255
          example: myUserName
        email:
          type: string
          description: Either one of username or e-mail is mandatory. Should be a valid e-mail.
          maxLength: 255
          example: jane.doe@example.com
        password:
          type: string
          minLength: 6
          description: Password must contain a minimum of 6 characters
          example: MyStrong3x4mpl3P4ssword!
        sendInvitation:
          type: boolean
          description: If set to true user will receive an invitation e-mail which needs to be accepted before access is granted
          default: true
        claims:
          description: Optional object which allows to give a user claims on a certain organisation or entrance plan
          allOf:
          - $ref: '#/components/schemas/ClaimsDto'
      required:
      - password
      - sendInvitation
    UserDto:
      type: object
      properties:
        uuid:
          type: string
          readOnly: true
        cmPersonGuid:
          type: string
          readOnly: true
        firstName:
          type: string
          readOnly: true
        lastName:
          type: string
          readOnly: true
        username:
          type: string
          readOnly: true
        email:
          type: string
          readOnly: true
        entrancePlanClaims:
          type: array
          items:
            type: string
            enum:
            - OBSERVER
            - EDITOR
            - OWNER
            - ADMIN
            - SCAN_USER
            - SCAN_CHECKIN
            - SCAN_CHECKOUT
            - SCAN_CLICKER_CHECKIN
            - SCAN_CLICKER_CHECKOUT
            - SCAN_SEARCH
            - SCAN_VALIDATE
            - SCAN_ANALYTICS
      required:
      - uuid
      - cmPersonGuid
      - firstName
      - lastName
      - username
      - email
      - entrancePlanClaims
  securitySchemes:
    cookie:
      type: apiKey
      in: cookie
      name: connect.sid
