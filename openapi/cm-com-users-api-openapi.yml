        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - cookie: []
      summary: Create a user
      tags:
      - Users
    servers:
    - url: https://api.cm.com
  /entrance/v1.0/users/{userUuid}:
    patch:
      operationId: UsersController_patchUser_v1.0
      parameters:
      - name: userUuid
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserDto'
      responses:
