openapi: 3.2.0
info:
  version: v1
  title: EmailValidation Email Address Validations API
servers:
- url: https://api.cm.com
tags:
- name: EmailAddressValidations
paths:
  /emailvalidation/v1/accounts/{accountID}/emailaddressvalidations:
    post:
      tags:
      - EmailAddressValidations
      summary: Validate an email address
      operationId: EmailAddressValidations_ValidateEmailAddressAsync
      parameters:
      - name: accountID
        in: path
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CM.Email.EmailValidation.Api.Models.ApiEmailAddressValidation'
          text/json:
            schema:
              $ref: '#/components/schemas/CM.Email.EmailValidation.Api.Models.ApiEmailAddressValidation'
          text/xml:
            schema:
              $ref: '#/components/schemas/CM.Email.EmailValidation.Api.Models.ApiEmailAddressValidation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CM.Email.EmailValidation.Api.Models.ApiEmailAddressValidation'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Email.EmailValidation.Api.Models.ApiEmailAddressValidation'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Email.EmailValidation.Api.Models.ApiEmailAddressValidation'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Email.EmailValidation.Api.Models.ApiEmailAddressValidation'
components:
  schemas:
    CM.Email.EmailValidation.Api.Models.ApiEmailAddressValidation:
      type: object
      properties:
        ID:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        EmailAddress:
          type: string
        ValidationResult:
          enum:
          - Valid
          - Invalid
          - AcceptAll
          - Disposable
          - Unknown
          type: string
