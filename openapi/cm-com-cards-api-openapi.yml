openapi: 3.2.0
info:
  title: Payments Gateway Cards API
  description: Common payments API
  version: 1.27.22
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: /api/v1
security:
- oAuth2ClientCredentials: []
tags:
- name: Cards
  description: Creditcard payments allow customers to pay online using their credit or debit cards.
  externalDocs:
    url: https://www.visa.com/ and https://www.mastercard.com/
paths:
  /paymentmethods/creditcard/v1/transactions:
    post:
      operationId: createCardTransaction
      description: Create a new Credit Card payment transaction. After receiving a HTTP status 201 you have to redirect the consumer to the url given in **action.redirect.url**. The **id** field in the response can be used in future calls as **transactionId** to reference this transaction (for instance in a refund).
      tags:
      - Cards
      summary: Create payment
      requestBody:
        description: Create Card Transaction
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardPayment'
            examples:
              standard:
                $ref: '#/components/examples/standard'
      responses:
        '201':
          description: Cards transaction details
          headers:
            Digest:
              $ref: '#/components/headers/Digest'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCardTransaction'
              examples:
                open:
                  $ref: '#/components/examples/openCard'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/creditcard/v1/transactions/{transactionId}:
    get:
      operationId: getCardTransaction
      description: Retrieve details for an existing Credit Card transaction. This endpoint must be used to obtain the status for a transaction.
      tags:
      - Cards
      summary: Fetch payment
      parameters:
      - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: 'The Card transaction was created successfully. The response contains the transaction details and a redirect URL to complete the payment.description: The user input was incorrect or something illegal was attempted (eg. using a service without having that service configured for the user, or not being authorized)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCardTransaction'
              examples:
                open:
                  $ref: '#/components/examples/openCard'
                success:
                  $ref: '#/components/examples/successCard'
                refund:
                  $ref: '#/components/examples/refundCard'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/creditcard/v1/transactions/{transactionId}/refunds:
    post:
      operationId: refundCardPayment
      description: Create a refund for a previous made Credit Card transaction. A payment must be fully processed, captured and there shouldn't exist a chargeback to be able to refund them.
      tags:
      - Cards
      summary: Refund payment
      parameters:
      - $ref: '#/components/parameters/TransactionId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refund'
      responses:
        '201':
          description: The Credit Card refund was created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCardTransaction'
              examples:
                refund:
                  $ref: '#/components/examples/refundCard'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
    get:
      operationId: getCardRefunds
      description: Retrieve refunds for an existing Credit Card transaction.
      tags:
      - Cards
      summary: Fetch refunds
      parameters:
      - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          $ref: '#/components/responses/RefundsResponse'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/creditcard/v1/transactions/{transactionId}/chargebacks:
    get:
      operationId: getCardChargebacks
      description: Retrieve chargebacks for an existing Credit Card transaction.
      tags:
      - Cards
      summary: Fetch chargebacks
      parameters:
      - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          $ref: '#/components/responses/ChargebacksResponse'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/creditcard/v2/transactions:
    post:
      operationId: createCreditCardTransactionV2
      description: 'Create a new Credit Card payment transaction using the v2 API. This version supports enhanced consumer data including billing and shipping addresses for improved fraud prevention.


        The **clientSideEncryptedCard** must be encrypted using the provided CSE javascript library. The **id** field in the response can be used in future calls as **transactionId** to reference this transaction (for instance in a refund).'
      tags:
      - Cards
      summary: Create payment (v2)
      requestBody:
        description: Create Card Transaction V2
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardPaymentV2'
      responses:
        '201':
          description: Cards transaction details
          headers:
            Digest:
              $ref: '#/components/headers/Digest'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCardTransactionV2'
              examples:
                open:
                  $ref: '#/components/examples/openCardV2'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/creditcard/v2/transactions/initialize:
    post:
      operationId: initializeCreditCardTransactionV2
      description: 'Initialize a Credit Card transaction for 3D Secure authentication preparation. This endpoint is used before the actual payment to set up the authentication flow.


        After initialization, you can proceed with the payment by calling the create transaction endpoint with the encrypted card details.'
      tags:
      - Cards
      summary: Initialize payment for 3DS (v2)
      requestBody:
        description: Initialize Card Transaction V2
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardPaymentInitializeV2'
      responses:
        '201':
          description: Cards transaction initialization details
          headers:
            Digest:
              $ref: '#/components/headers/Digest'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCardTransactionV2'
              examples:
                initialized:
                  $ref: '#/components/examples/initializedCardV2'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/creditcard/v2/transactions/{transactionId}:
    get:
      operationId: getCreditCardTransactionV2
      description: Retrieve details for an existing Credit Card v2 transaction. This endpoint must be used to obtain the status for a transaction.
      tags:
      - Cards
      summary: Fetch payment (v2)
      parameters:
      - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: The Card transaction details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCardTransactionV2'
              examples:
                open:
                  $ref: '#/components/examples/openCardV2'
                success:
                  $ref: '#/components/examples/successCardV2'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/creditcard/v2/transactions/{transactionId}/refunds:
    post:
      operationId: createCreditCardRefundV2
      description: Create a refund for a previous made Credit Card v2 transaction. A payment must be fully processed, captured and there shouldn't exist a chargeback to be able to refund them.
      tags:
      - Cards
      summary: Create refund (v2)
      parameters:
      - $ref: '#/components/parameters/TransactionId'
      requestBody:
        description: Create Credit Card Refund V2
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refund'
      responses:
        '201':
          description: The Credit Card refund was created successfully.
          headers:
            Digest:
              $ref: '#/components/headers/Digest'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCardTransactionV2'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
    get:
      operationId: getCreditCardRefundsV2
      description: Retrieve refunds for an existing Credit Card v2 transaction.
      tags:
      - Cards
      summary: Fetch refunds (v2)
      parameters:
      - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          $ref: '#/components/responses/RefundsResponse'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    TransactionWithoutOrderIdLanguageRefundsAndExpiresAt:
      allOf:
      - $ref: '#/components/schemas/TransactionWithoutOrderIdLanguageRefundsCreatedAtAndExpiresAt'
      - type: object
        required:
        - createdAt
        properties:
          createdAt:
            $ref: '#/components/schemas/Datetime'
            description: ISO 8601 date and time when the transaction was created.
    TransactionWebhook:
      allOf:
      - $ref: '#/components/schemas/BaseWebhook'
      - type: object
        properties:
          events:
            items:
              description: '* `STATUS_CHANGE` - Triggered when the status of a transaction changes.

                * `REFUND_STATUS` - Triggered when a transaction receives an update on one of its requested refunds.

                * `FINALSTATUS` - This value is deprecated and shouldn''t be used anymore. Use `STATUS_CHANGE` instead.

                '
              oneOf:
              - $ref: '#/components/schemas/StatusChangeEvent'
              - $ref: '#/components/schemas/RefundStatusEvent'
              - $ref: '#/components/schemas/FinalStatusEvent'
              example: STATUS_CHANGE
    CreditCardConsumerV2:
      type: object
      required:
      - billingAddress
      anyOf:
      - required:
        - email
      - required:
        - mobilePhone
      description: 'Cardholder personal information

        * **Either `email` and/or `MobilePhone` must be provided**

        * `billingAddress` conditional on the market

        '
      properties:
        email:
          type: string
          description: 'Cardholder email address

            '
          example: johndoe@email.com
        mobilePhone:
          type: object
          properties:
            countryCallingCode:
              type: string
              example: '+31'
              description: Phone number country calling code
            number:
              type: string
              example: '0765727000'
              description: Phone number
        billingAddress:
          description: Cardholder billing address.
          allOf:
          - $ref: '#/components/schemas/Address'
        shippingAddress:
          description: Cardholder shipping address.
          allOf:
          - $ref: '#/components/schemas/Address'
    Reference:
      description: The clients identifier. This value will be sent in the webhook payload alongside the ID you receive as part of the response of a transaction.
      type: string
      minLength: 1
      maxLength: 255
      example: '20210623130413'
    Country:
      description: Country of the consumer (ISO-3166)
      type: string
      example: NL
      minLength: 2
      maxLength: 2
    ChargebacksList:
      description: Details of all chargebacks belonging to a transaction.
      type: object
      required:
      - chargebacks
      properties:
        chargebacks:
          type: array
          items:
            $ref: '#/components/schemas/ChargebackDetails'
    GenderlessConsumer:
      type: object
      properties:
        email:
          $ref: '#/components/schemas/Email'
        phone:
          $ref: '#/components/schemas/Phone'
        dateOfBirth:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: '1990-05-23'
          description: Date of birth in ISO 8601 format (YYYY-MM-DD).
    ChargebackStatus:
      description: '* `CHARGED` - The transaction has been charged back by the issuing bank.

        '
      type: string
      enum:
      - CHARGED
      example: CHARGED
    StatusSuccess:
      description: The transaction has been successfully paid.
      type: string
      format: enum
      enum:
      - SUCCESS
      example: SUCCESS
    ReturnUrls:
      type: object
      description: 'URLs where the Consumer is redirected to after completing the transaction at its issuing bank or at the chosen payment method.


        With this object we can redirect consumer to a dedicated page per payment result status. Either this object or the returnUrl field is mandatory.'
      required:
      - success
      - cancelled
      - expired
      - failed
      properties:
        success:
          type: string
          format: url
          maxLength: 2000
          example: https://yourdomain.tld/order/payment-success.html
        cancelled:
          type: string
          format: url
          maxLength: 2000
          example: https://yourdomain.tld/order/payment-cancelled.html
        expired:
          type: string
          format: url
          maxLength: 2000
          example: https://yourdomain.tld/order/payment-expired.html
        failed:
          type: string
          format: url
          maxLength: 2000
          example: https://yourdomain.tld/order/payment-failed.html
    StatusFailure:
      description: The transaction has failed.
      type: string
      format: enum
      enum:
      - FAILURE
      example: FAILURE
    Refund:
      description: Refund an already successfully processed payment.
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
          description: 'Denomination in the smallest currency subunit, as for example euro cents. If empty, the refund amount will be the remaining available amount of the transaction (i.e., total payment amount minus already refunded amounts minus the amounts of the pending refund requests).

            '
        reason:
          $ref: '#/components/schemas/RefundReason'
    PaymentWithoutDescriptionExpiresAtLanguageAndWebhooks:
      allOf:
      - $ref: '#/components/schemas/ReturnURLOneOf'
      - type: object
        required:
        - reference
        - amount
        properties:
          reference:
            $ref: '#/components/schemas/Reference'
          amount:
            $ref: '#/components/schemas/Amount'
          currency:
            $ref: '#/components/schemas/Currency'
    RefundStatusEvent:
      description: '* `REFUND_STATUS` - Triggered when a transaction receives an update on one of its requested refunds.

        '
      type: string
      enum:
      - REFUND_STATUS
      example: REFUND_STATUS
    TransactionWithoutOrderId:
      allOf:
      - $ref: '#/components/schemas/TransactionWithoutOrderIdLanguageRefundsAndExpiresAt'
      - type: object
        required:
        - language
        - expiresAt
        properties:
          language:
            $ref: '#/components/schemas/Language'
          expiresAt:
            $ref: '#/components/schemas/Datetime'
            description: ISO 8601 date and time. If a transaction is not finalized before this time the status becomes **EXPIRED**.
          refunds:
            $ref: '#/components/schemas/Refunds'
    ReturnURLOneOf:
      oneOf:
      - type: object
        required:
        - returnUrls
        properties:
          returnUrls:
            $ref: '#/components/schemas/ReturnUrls'
      - type: object
        required:
        - returnUrl
        properties:
          returnUrl:
            $ref: '#/components/schemas/ReturnUrl'
    Phone:
      description: The phonenumber of the consumer (E.164 format).
      type: string
      maxLength: 16
      example: '+31695613259'
    LastName:
      description: Consumer's last name.
      type: string
      maxLength: 35
      example: Doe
    Transaction:
      allOf:
      - $ref: '#/components/schemas/TransactionWithoutOrderId'
      - type: object
        required:
        - orderId
        properties:
          orderId:
            allOf:
            - deprecated: true
            - $ref: '#/components/schemas/Uuid'
    BrowserInformation:
      type: object
      required:
      - shopperIp
      - accept
      - userAgent
      properties:
        shopperIp:
          $ref: '#/components/schemas/ShopperIP'
        accept:
          type: string
          description: content-type accepted by the client browser
          example: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        userAgent:
          type: string
          description: User-Agent of the consumers browser.
          example: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/70.0.3538.102 Safari/537.36 Edge/18.18363
    RefundStatus:
      description: '* `SUCCESS`    - Refund has succeeded.

        * `PENDING`    - Refund is waiting to be processed.

        * `FAILURE`    - Refund has failed.

        * `CANCELLED`  - Refund has been cancelled.

        '
      type: string
      enum:
      - SUCCESS
      - PENDING
      - FAILURE
      - CANCELLED
      example: SUCCESS
    CardDetails:
      description: Card details like the cardholders name, PAN, CVC and expiry date.
      type: object
      required:
      - cardProvider
      - browserInformation
      - encryptedCardDetails
      properties:
        cardProvider:
          $ref: '#/components/schemas/CardProvider'
        browserInformation:
          $ref: '#/components/schemas/BrowserInformation'
        encryptedCardDetails:
          $ref: '#/components/schemas/EncryptedCardDetails'
    StatusCancelled:
      description: The transaction has been cancelled by the consumer.
      type: string
      format: enum
      enum:
      - CANCELLED
      example: CANCELLED
    ChargebackDetails:
      description: Details of a chargeback.
      type: object
      required:
      - id
      - transactionId
      - amount
      - currency
      - status
      - chargebackDate
      - created
      - updated
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        transactionId:
          $ref: '#/components/schemas/Uuid'
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        reason:
          description: The reason for the chargeback as reported by the issuing bank.
          type: string
          example: Fraudulent transaction
        status:
          $ref: '#/components/schemas/ChargebackStatus'
        chargebackDate:
          $ref: '#/components/schemas/Datetime'
          description: Date and time when the chargeback was registered by the issuing bank.
        created:
          $ref: '#/components/schemas/Datetime'
        updated:
          $ref: '#/components/schemas/Datetime'
    CardPaymentV2:
      allOf:
      - $ref: '#/components/schemas/Payment'
      - type: object
        required:
        - clientSideEncryptedCard
        - consumer
        properties:
          clientSideEncryptedCard:
            type: string
            description: Encrypted cardholder credit card details using the provided CSE javascript library.
            example: 
          consumer:
            $ref: '#/components/schemas/CreditCardConsumerV2'
    ShopperIP:
      type: string
      minLength: 1
      maxLength: 39
      description: IPv4 or IPv6 address for the consumer
      example: 1.1.1.1
    TransactionWebhookWithChargeback:
      allOf:
      - $ref: '#/components/schemas/BaseWebhook'
      - type: object
        properties:
          events:
            items:
              description: '* `STATUS_CHANGE` - Triggered when the status of a transaction changes.

                * `REFUND_STATUS` - Triggered when a transaction receives an update on one of its requested refunds.

                * `CHARGEBACK_STATUS` - Triggered when a transaction receives an update on one of its chargebacks.

                * `FINALSTATUS` - This value is deprecated and shouldn''t be used anymore. Use `STATUS_CHANGE` instead.

                '
              oneOf:
              - $ref: '#/components/schemas/StatusChangeEvent'
              - $ref: '#/components/schemas/RefundStatusEvent'
              - $ref: '#/components/schemas/ChargebackStatusEvent'
              - $ref: '#/components/schemas/FinalStatusEvent'
              example: STATUS_CHANGE
    Language:
      description: Preferred language for the user interface as ISO 639-1 code. If the provided language is not supported the default will be used. Commonly supported languages are Dutch (nl) and English (en).
      type: string
      default: nl
      example: nl
      minLength: 2
      maxLength: 2
    AddressWithStateAndAdditionalData:
      allOf:
      - $ref: '#/components/schemas/AddressWithoutMandatoryCountry'
      - type: object
        properties:
          state:
            description: The state or province of the consumer's billing address associated with the card used for this purchase. The value must be the country subdivision code (e.g., 'NH') or the official state/province name (e.g., 'Noord Holland') as defined in ISO 3166-2.
            type: string
            maxLength: 40
            example: Noord-Holland
          additionalData:
            description: The consumers house number addition.
            type: string
            maxLength: 35
            example: Right-hand portal
    CardProvider:
      type: string
      format: enum
      enum:
      - mastercard
      - visa
      - amex
      - maestro
      description: The card scheme the card belongs to.
      example: mastercard
    Payment:
      allOf:
      - $ref: '#/components/schemas/PaymentWithoutDescriptionAndExpiresAt'
      - type: object
        required:
        - description
        properties:
          description:
            $ref: '#/components/schemas/Description'
          expiresAt:
            $ref: '#/components/schemas/Datetime'
            description: ISO 8601 date and time. If a transaction is not finalized before this time the status becomes **EXPIRED**.
    Amount:
      description: Denomination in the smallest currency subunit, as for example euro cents.
      type: integer
      minimum: 1
      maximum: 99999999
      example: 1200
    ReturnUrl:
      description: 'URL where the Consumer is redirected to after completing the transaction at its issuing bank or at the chosen payment method.


        With this implementation you are responsible to fetch the payment status and incorporated into your site.'
      type: string
      format: url
      maxLength: 2000
      example: https://yourdomain.tld/order/return?orderID=order123
    ChargebackStatusEvent:
      description: '* `CHARGEBACK_STATUS` - Triggered when a transaction receives an update on one of its chargebacks.

        '
      type: string
      enum:
      - CHARGEBACK_STATUS
      example: CHARGEBACK_STATUS
    Description:
      description: Description of the underlying value or reason of the payment.
      type: string
      maxLength: 255
      example: Order at yourdomain.tld
    StatusExpired:
      description: The transaction has expired.
      type: string
      format: enum
      enum:
      - EXPIRED
      example: EXPIRED
    PaymentWithoutDescriptionAndExpiresAt:
      allOf:
      - $ref: '#/components/schemas/PaymentWithoutDescriptionExpiresAtAndWebhooks'
      - type: object
        properties:
          webhooks:
            $ref: '#/components/schemas/TransactionWebhooks'
    AddressWithoutMandatoryCountry:
      type: object
      description: The consumers address.
      properties:
        street:
          description: The consumers street name.
          type: string
          maxLength: 100
          example: Rustenburgerlaan
        houseNumber:
          description: The consumers house number.
          type: string
          maxLength: 35
          example: '25'
        postalCode:
          description: The consumers postal code.
          type: string
          maxLength: 35
          example: 2012AL
        city:
          description: The consumers city.
          type: string
          maxLength: 35
          example: Haarlem
        countryCode:
          $ref: '#/components/schemas/Country'
    BaseWebhook:
      type: object
      description: A single webhook object consists out of an URL to which we need to send the occurred event together with the event that needs to trigger the webhook call.
      required:
      - url
      - events
      properties:
        url:
          description: The URL the request must be send to.
          type: string
          format: url
          example: https://yourdomain.tld/webhooks?purchaseId=order123
        events:
          description: Type of events that will trigger a webhook.
          type: array
          minItems: 1
          items:
            type: string
    ConsumerBase:
      allOf:
      - $ref: '#/components/schemas/Consumer'
      - type: object
        properties:
          name:
            $ref: '#/components/schemas/Name'
          address:
            $ref: '#/components/schemas/Address'
          businessName:
            description: The consumers company name.
            type: string
            maxLength: 35
            example: CM
    TransactionWithoutOrderIdLanguageRefundsCreatedAtAndExpiresAt:
      allOf:
      - $ref: '#/components/schemas/ReturnURLOneOf'
      - type: object
        required:
        - id
        - reference
        - amount
        - currency
        - status
        - description
        properties:
          id:
            $ref: '#/components/schemas/TransactionId'
          reference:
            $ref: '#/components/schemas/Reference'
          amount:
            $ref: '#/components/schemas/Amount'
          currency:
            $ref: '#/components/schemas/Currency'
          webhooks:
            $ref: '#/components/schemas/TransactionWebhooks'
          description:
            $ref: '#/components/schemas/Description'
    RefundReason:
      description: 'The description for the refund for administrative purpose only. This reason will be visible in the portal.

        '
      type: string
      example: Refund required by consumer.
      maxLength: 255
    RefundsList:
      description: Details of all refunds belonging to a transaction.
      type: object
      required:
      - refunds
      properties:
        refunds:
          type: array
          items:
            $ref: '#/components/schemas/RefundDetails'
    Address:
      allOf:
      - $ref: '#/components/schemas/AddressWithStateAndAdditionalData'
      - type: object
        required:
        - countryCode
    TransactionId:
      description: ID received in the POST transaction response root object, which can be used in up following calls like refunds or cancellations as transactionId.
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      example: 8db1e7fa-ba8a-4189-92fd-67a20217443d
    StatusPending:
      description: The transaction is pending, meaning it could not be completed yet; waiting for something.
      type: string
      format: enum
      enum:
      - PENDING
      example: PENDING
    StatusChangeEvent:
      description: '* `STATUS_CHANGE` - Triggered when the status of a transaction changes.

        '
      type: string
      enum:
      - STATUS_CHANGE
      example: STATUS_CHANGE
    RefundDetails:
      description: Details of a refund.
      type: object
      required:
      - id
      - transactionId
      - amount
      - reason
      - status
      - created
      - updated
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        transactionId:
          $ref: '#/components/schemas/Uuid'
        amount:
          $ref: '#/components/schemas/Amount'
        reason:
          $ref: '#/components/schemas/RefundReason'
        status:
          $ref: '#/components/schemas/RefundStatus'
        created:
          $ref: '#/components/schemas/Datetime'
        updated:
          $ref: '#/components/schemas/Datetime'
    Uuid:
      description: Unique identifier
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      example: 8db1e7fa-ba8a-4189-92fd-67a20217443d
    PaymentWithoutDescriptionExpiresAtAndWebhooks:
      allOf:
      - $ref: '#/components/schemas/PaymentWithoutDescriptionExpiresAtLanguageAndWebhooks'
      - type: object
        properties:
          language:
            $ref: '#/components/schemas/Language'
    FinalStatusEvent:
      description: '* `FINALSTATUS` - This value is deprecated and shouldn''t be used anymore. Use `STATUS_CHANGE` instead.

        '
      type: string
      enum:
      - FINALSTATUS
      example: FINALSTATUS
    Gender:
      description: The consumers gender.
      type: string
      format: enum
      enum:
      - m
      - f
      - 'null'
      default: null
    TransactionWebhooksWithChargeback:
      description: 'Array of webhooks that enables receiving a web request once a given event occurs. We won''t do preventive rate-limiting in order to have the highest throughput possible. However, we will honor 429 (Too-many-requests) responses per callback. We use the Retry-After header to retry after a certain period. If the header was not set we use our default exponential delay implementation.

        '
      type: array
      items:
        $ref: '#/components/schemas/TransactionWebhookWithChargeback'
      example:
      - url: https://yourdomain.tld/payment-webhooks?purchaseId=order123
        events:
        - STATUS_CHANGE
    CreditCardTransactionV2:
      allOf:
      - $ref: '#/components/schemas/Transaction'
      - type: object
        required:
        - country
        - status
        - action
        properties:
          status:
            description: The status of the transaction.
            oneOf:
            - $ref: '#/components/schemas/StatusOpen'
            - $ref: '#/components/schemas/StatusSuccess'
            - $ref: '#/components/schemas/StatusCancelled'
            - $ref: '#/components/schemas/StatusExpired'
            - $ref: '#/components/schemas/StatusFailure'
            - $ref: '#/components/schemas/StatusPending'
          action:
            anyOf:
            - type: object
              description: Next action to be performed by merchant (or consumer) to complete the payment.
              properties:
                redirect:
                  $ref: '#/components/schemas/RedirectAction'
            - type: 'null'
          country:
            $ref: '#/components/schemas/Country'
    CardPaymentInitializeV2:
      allOf:
      - $ref: '#/components/schemas/Payment'
      - type: object
        required:
        - consumer
        properties:
          consumer:
            $ref: '#/components/schemas/CreditCardConsumerV2'
    RedirectAction:
      description: URL where consumer should be redirected to by the merchant to perform the payment.
      type: object
      required:
      - url
      properties:
        url:
          description: URL where consumer should be redirected to by the merchant to perform the payment.
          type: string
          format: url
          example: https://issuer.tld/ideal/start?trxid=213981209381209390821&random=wreq0dq90vgq0ew923123
    StatusOpen:
      description: The transaction is open and can be paid.
      type: string
      format: enum
      enum:
      - OPEN
      example: OPEN
    StatusAuthorized:
      description: The transaction has been authorized.
      type: string
      format: enum
      enum:
      - AUTHORIZED
      example: AUTHORIZED
    CreditCardTransaction:
      allOf:
      - $ref: '#/components/schemas/Transaction'
      - type: object
        required:
        - country
        - status
        - action
        - cardProvider
        properties:
          status:
            description: The status of the transaction.
            oneOf:
            - $ref: '#/components/schemas/StatusOpen'
            - $ref: '#/components/schemas/StatusSuccess'
            - $ref: '#/components/schemas/StatusCancelled'
            - $ref: '#/components/schemas/StatusExpired'
            - $ref: '#/components/schemas/StatusFailure'
            - $ref: '#/components/schemas/StatusAuthorized'
          action:
            type: object
            description: Next action to be performed by merchant (or consumer) to complete the payment.
            properties:
              redirect:
                $ref: '#/components/schemas/RedirectAction'
          country:
            $ref: '#/components/schemas/Country'
          cardProvider:
            $ref: '#/components/schemas/CardProvider'
    Name:
      description: Consumer's name.
      type: object
      required:
      - firstName
      - lastName
      properties:
        firstName:
          description: Consumer's first name.
          type: string
          maxLength: 35
          example: John
        lastName:
          $ref: '#/components/schemas/LastName'
        middleName:
          description: Consumer's middle name.
          type: string
          maxLength: 35
          example: A
    Currency:
      description: ISO 4217 currency code.
      type: string
      minLength: 3
      maxLength: 3
      default: EUR
      example: EUR
    Datetime:
      type: string
      format: date-time
      minLength: 20
      example: '2006-01-02T15:04:05Z'
      description: ISO 8601 date and time.
    TransactionWebhooks:
      description: 'Array of webhooks that enables receiving a web request once a given event occurs. We won''t do preventive rate-limiting in order to have the highest throughput possible. However, we will honor 429 (Too-many-requests) responses per callback. We use the Retry-After header to retry after a certain period. If the header was not set we use our default exponential delay implementation.

        '
      type: array
      items:
        $ref: '#/components/schemas/TransactionWebhook'
      example:
      - url: https://yourdomain.tld/payment-webhooks?purchaseId=order123
        events:
        - STATUS_CHANGE
    Email:
      description: The email address of the consumer.
      type: string
      format: email
      example: john.doe@email.tld
    CardPayment:
      allOf:
      - $ref: '#/components/schemas/Payment'
      - type: object
        required:
        - description
        - language
        - consumer
        - cardDetails
        properties:
          expiresAt:
            allOf:
            - $ref: '#/components/schemas/Datetime'
            - description: ISO 8601 date and time. If a transaction is not finalized before this time the status becomes EXPIRED. If left empty, the value defaults to 30 mins.
          webhooks:
            $ref: '#/components/schemas/TransactionWebhooksWithChargeback'
          consumer:
            allOf:
            - $ref: '#/components/schemas/ConsumerBase'
            - type: object
              required:
              - email
              - address
              properties:
                address:
                  allOf:
                  - $ref: '#/components/schemas/Address'
                  - type: object
                    required:
                    - countryCode
          cardDetails:
            $ref: '#/components/schemas/CardDetails'
    EncryptedCardDetails:
      type: object
      required:
      - data
      properties:
        data:
          type: string
          description: 'The card data that need to be encrypted (cardHolderName, cardNumber, expiryMonth, expiryYear, securityCode).


            Use the library from `/paymentmethods/library/cse`. This contains a JS library with an exported function called `cseEncrypt`.

            `let encrypted = cseEncrypt(cardHolderName, cardNumber, expiryMonth, expiryYear, securityCode);`

            '
    Consumer:
      allOf:
      - $ref: '#/components/schemas/GenderlessConsumer'
      - type: object
        properties:
          gender:
            $ref: '#/components/schemas/Gender'
    Refunds:
      description: Details of refunds for a transaction
      type: object
      required:
      - refundedAmount
      - refundedPendingAmount
      properties:
        refundedAmount:
          description: Amount in the smallest currency subunit, as for example euro cents, that has already been refunded.
          type: integer
          minimum: 0
          maximum: 99999999
          example: 300
        refundedPendingAmount:
          description: Amount in the smallest currency subunit, as for example euro cents, that has been requested to be refunded.
          type: integer
          minimum: 1
          maximum: 99999999
          example: 100
  responses:
    UserError:
      description: The user input was incorrect or something illegal was attempted (eg. using a service without having that service configured for the user, or not being authorized)
      content:
        application/json:
          schema:
            type: object
            required:
            - id
            - message
            properties:
              id:
                $ref: '#/components/schemas/Uuid'
              message:
                type: string
                example: no authorization methods provided
    ChargebacksResponse:
      description: Details of all chargebacks belonging to a transaction.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChargebacksList'
    InternalError:
      description: Internal server error. This can be caused by an unresponsive backend
      content:
        application/json:
          schema:
            type: object
            required:
            - id
            - message
            properties:
              id:
                $ref: '#/components/schemas/Uuid'
              message:
                type: string
                example: Service Unavailable
    RefundsResponse:
      description: Details of all refunds belonging to a transaction.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefundsList'
