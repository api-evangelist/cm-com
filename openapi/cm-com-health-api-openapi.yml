                      additionalProperties: true
                  details:
                    type: object
                    example:
                      database:
                        status: up
                      redis:
                        status: down
                        message: Could not connect
                    additionalProperties:
                      type: object
                      required:
                      - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      summary: Check API health status
      tags:
      - Health
      security:
      - cookie: []
    servers:
    - url: https://api.cm.com
  /healthz:
    get:
      operationId: getHealth
      summary: Health check
      description: Returns the health status of the Mobile Appmiral Ticketing API.
      tags:
      - Health
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse_3'
        '503':
          description: Service is unavailable
    servers:
    - url: https://api.cm.com/ticketing/v1
      description: Production
  /v1.0/message/health:
    get:
      tags:
      - Health
      summary: Health check
      description: Verify that the Messaging API is reachable and your credentials are valid.
      operationId: messaging-health-check
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse_10'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
      security:
      - ProductToken: []
    servers:
    - url: https://gw.cmtelecom.com
      description: Production Server
components:
  schemas:
    ErrorResponse:
      title: Error Response
      description: Standard error response
      required:
      - message
      properties:
        message:
          description: Human-readable error message
          type: string
          example: Unauthorized
      type: object
    HealthResponse:
      title: Health Response
      description: Standard health check response
      required:
      - status
      - service
      - version
      properties:
        status:
          description: Service health status
          type: string
          example: ok
        service:
          description: Service name
          type: string
          example: conversational-ai
        version:
          description: API version
          type: string
          example: v1
      type: object
    HealthResponse_2:
      title: Health Response
      description: Standard health check response
      required:
      - status
      - service
      - version
      properties:
        status:
          description: Service health status
          type: string
          example: ok
        service:
          description: Service name
          type: string
          example: customer-engagement
        version:
          description: API version
          type: string
          example: v1
      type: object
    ErrorDto:
      type: object
      properties:
        errorCode:
          type: number
          example: 400100
          description: Error code specific to the error, consisting of a three digit http status code and a digit application specific code.
        description:
          type: string
          maxLength: 255
          example: Description of the error.
        httpStatus:
          type: number
          enum:
          - 100
          - 101
          - 102
          - 103
          - 200
          - 201
          - 202
          - 203
          - 204
          - 205
          - 206
          - 207
          - 208
          - 210
          - 300
          - 301
          - 302
          - 303
          - 304
          - 307
          - 308
          - 400
          - 401
          - 402
          - 403
          - 404
          - 405
          - 406
          - 407
          - 408
          - 409
          - 410
          - 411
          - 412
          - 413
          - 414
          - 415
          - 416
          - 417
          - 418
          - 421
          - 422
          - 423
          - 424
          - 428
          - 429
          - 456
          - 500
          - 501
          - 502
          - 503
          - 504
          - 505
          - 507
          - 508
          example: 400
      required:
      - errorCode
      - description
      - httpStatus
    HealthResponse_3:
      type: object
      properties:
        status:
          type: string
          enum:
          - healthy
          example: healthy
        service:
          type: string
          example: ticketing-mobile-appmiral
        version:
          type: string
          example: 1.0.0
    HealthResponse_4:
      type: object
      properties:
        status:
          type: string
          enum:
          - healthy
          example: healthy
        service:
          type: string
          example: cdp-integration
        version:
          type: string
          example: 1.0.0
    HealthResponse_5:
