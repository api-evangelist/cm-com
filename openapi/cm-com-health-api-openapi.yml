openapi: 3.2.0
info:
  title: Cm Com Health API
  version: '1.0'
  description: 'Operations tagged Health across 12 of this provider''s published API definitions: cm-com-conversational-ai-v1-openapi.yml, cm-com-customer-engagement-v1-openapi.yml, cm-com-live-entrance-management-v1-openapi.yml, cm-com-live-entrance-management-v2-openapi.yml, cm-com-live-event-apps-v1-openapi.yml, cm-com-marketplace-cdp-integration-v1-openapi.yml, cm-com-marketplace-cms-integrations-v1-openapi.yml, cm-com-marketplace-crm-integrations-v1-openapi.yml…'
servers:
- url: https://api.cm.com
  description: Production Server
- url: https://api.cm.com/ticketing/v1
  description: Production
- url: https://api.cm.com/marketplace/cdp-integration/v1
