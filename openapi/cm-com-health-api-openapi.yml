      type: object
  responses:
    UnauthorizedResponse:
      description: Unauthorized - invalid or missing credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    BearerAuth:
      type: http
      description: API authentication using Bearer tokens from your Conversational AI dashboard.
      bearerFormat: API Token
      scheme: bearer
    cookie:
      type: apiKey
      in: cookie
      name: connect.sid
    ProductToken:
      type: apiKey
      description: Product token for authentication. Obtain from your CM.com dashboard under Messaging > Product Tokens.
      name: producttoken
      in: header
