openapi: 3.1.0
info:
  title: Marketplace - Internal Comms Integrations
  version: 1.0.0
  description: |
    Connect internal communication platforms to CM Marketplace so team notifications and events cascade to every enabled CM product.
  license:
    name: Proprietary
    identifier: LicenseRef-CM.com-Proprietary

servers:
  - url: https://api.cm.com/marketplace/internal-comms-integrations/v1
    description: Production

tags:
  - name: Health
    description: Service health

security:
  - BearerAuth: []

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Health check
      description: Returns the health status of the Internal Comms Integrations API.
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is unavailable

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy]
          example: healthy
        service:
          type: string
          example: internal-comms-integrations
        version:
          type: string
          example: 1.0.0
