  /events/{event_uuid}/orders/{order_id}/cancel:
    post:
      summary: Cancel Order
      description: Can be used to cancel an existing reservation. This will cancel the entire reservation (including all tickets).
      operationId: cancel-order
      parameters:
        - name: event_uuid
          in: path
          description: 'Uuid of your event. Example: 00000000-0000-0000-0000-000000000000'
          schema:
            type: string
          required: true
        - name: order_id
          in: path
          description: 'Id of the order to cancel. Example: ZR36353102'
          schema:
            type: string
          required: true
      responses:
        "200":
          description: "200"
          content:
            application/json:
              examples:
                Result:
                  value: >-
                    {
                    "success": {
                    "message": "Successfully canceled order: CM00000001."
                    }
                    }
              schema:
                type: object
                properties:
                  success:
                    type: object
                    properties:
                      message:
                        type: string
                        example: 'Successfully canceled order: CM00000001.'
        "400":
          description: "400"
          content:
            application/json:
              examples:
                Result:
                  value: >-
                    {
                    "error": {
                    "message": "Order can not be canceled, order is already canceled.",
                    "error_code": 400305,
                    "error_details": null
                    }
                    }
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Order can not be canceled, order is already canceled.
                      error_code:
                        type: integer
                        example: 400305
                        default: 0
                      error_details: {}
      deprecated: false
  /events/{event_uuid}/orders/{order_id}/barcodes/{barcode_id}/cancel:
    post:
      summary: Cancel Barcode
      description: Use this endpoint to cancel a single barcode in an order. Note that if you cancel the last remaining valid barcode, the entire order will also receive a canceled status.
      operationId: cancel-barcode
      parameters:
        - name: event_uuid
          in: path
          description: 'Your event uuid. Example: 00000000-0000-0000-0000-000000000000'
          schema:
            type: string
          required: true
        - name: order_id
          in: path
          description: 'The id of the order. Example: ZR36353102'
          schema:
            type: string
          required: true
        - name: barcode_id
          in: path
          description: 'The barcode you wish to cancel. Example: N7CUFEZ5BW'
          schema:
            type: string
          required: true
      responses:
        "201":
          description: "201"
          content:
            application/json:
              examples:
                Result:
                  value: >-
                    {
                    "success": {
                    "message": "Successfully canceled barcode: N7CUFEZ5BW."
                    }
                    }
              schema:
                type: object
                properties:
                  success:
                    type: object
                    properties:
                      message:
                        type: string
                        example: 'Successfully canceled barcode: N7CUFEZ5BW.'
        "400":
          description: "400"
          content:
            application/json:
              examples:
                Result:
                  value: >-
                    {
                    "error": {
                    "message": "Can not cancel barcode: barcode already canceled.",
                    "error_code": 400284,
                    "error_details": {
                    "barcode_id": "N7CUFEZ5BW"
                    }
                    }
                    }
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        example: 'Can not cancel barcode: barcode already canceled.'
                      error_code:
                        type: integer
                        example: 400284
                        default: 0
                      error_details:
                        type: object
                        properties:
                          barcode_id:
                            type: string
                            example: N7CUFEZ5BW
      deprecated: false
