    post:
      summary: Create Discount Campaign (Product - Single Discount Code)
      description: This endpoint can be used to create a discount campaign using a single custom discount code. This discount campaign will create the discount code on product level and can have a MONETARY rate type only. When the MAX_USAGE is null, the code can be used unlimited.
      operationId: create-discount-campaign-product-single-discount-code
      parameters:
        - name: event_uuid
          in: path
          description: 'Uuid of your event. Example: 00000000-0000-0000-0000-000000000000'
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Discount Campaign Name
                max_usage:
                  type: number
                  description: Can be an integer or null (when null the discount code can be used an unlimited amount times)
                  format: float
                online_from:
                  type: string
                  description: ISO date - discount can be used from a moment in time
                online_till:
                  type: string
                  description: ISO date - discount can be used until a moment in time
                currency_id:
                  type: string
