  /events/{event_uuid}/discountcampaigns/order/singlediscountcode:
    post:
      summary: Create Discount Campaign (Order - Single Discount Code)
      description: This endpoint can be used to create a discount campaign using a single custom discount code. This discount campaign will create the discount code on order level and can have a MONETARY or a PERCENTAGE rate type. When the MAX_USAGE is null, the code can be used unlimited.
      operationId: create-discount-campaign-order-single-discount-code
      parameters:
        - name: event_uuid
          in: path
          description: 'Uuid of your event. Example: 00000000-0000-0000-0000-000000000000'
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Discount Campaign Name
                discount_code:
                  type: string
                  description: DISCOUNTCODE-_123
                max_usage:
                  type: number
                  description: Can be an integer or null (when null the discount code can be used an unlimited amount times)
                  format: float
                online_from:
                  type: string
                  description: ISO date - discount can be used from a moment in time
                online_till:
                  type: string
                  description: ISO date - discount can be used until a moment in time
                rate:
                  type: number
                  description: Is either a fixed rate or a percentage rate
                  format: float
                rate_type_id:
                  type: string
                  enum:
                    - MONETARY
                    - PERCENTAGE
                currency_id:
                  type: string
            examples:
              Request Example:
                value:
                  name: Discount Campaign Name
                  discount_code: DISCOUNTCODE-_123
                  max_usage:
                  online_from: 2025-03-24T09:34:35+00:00
                  online_till: 2025-03-28T09:34:35+00:00
                  rate: 3
                  rate_type_id: MONETARY
                  currency_id: EUR
      responses:
        "200":
          description: "200"
          content:
            application/json:
              examples:
                Result:
                  value: >-
                    {
                        "uuid": "00000000-0000-0000-0000-000000000000",
                        "name": "Discount Campaign Name",
                        "online_from": "2025-03-24T09:34:35+00:00",
                        "online_till": "2025-03-28T09:34:35+00:00",
                        "discount_codes_amount": 1,
                        "discount_codes_amount_used": 0,
                        "max_usage": null,
                        "rate": 3,
                        "rate_type_id": "MONETARY",
                        "currency_id": "EUR",
                        "discount_type_id": "DISCOUNT_ORDER",
                        "created_at": "2025-03-24T12:03:03+00:00",
                        "updated_at": "2025-03-24T12:03:03+00:00",
                        "discount_campaign_products": null
                    }
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    example: 00000000-0000-0000-0000-000000000000
                  name:
                    type: string
                    example: Discount Campaign Name
