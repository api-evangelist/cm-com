                        application/json:
                            schema:
                                $ref: '#/components/schemas/handler.listResponse-handler_customerProductListItem'
                    description: OK
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rest.HttpError'
                    description: event_not_found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rest.HttpError'
                    description: internal_server_error
            security:
                - SystemTokenAuth: []
            summary: List customer products for an order
            tags:
                - Customer products
    /events/{event_id}/orders/{order_id}/products/{customer_product_id}:
        get:
            description: 'Returns the details of one customer product (an individual ticket or other product issued to a customer): the customer''s details, the product, the event and venue, the seat (`null` for events without seating), how often and when it was last scanned, and the tracking parameters of the order it belongs to.'
            operationId: ViewCustomerProduct
            parameters:
                - description: Event ID (UUID)
                  in: path
                  name: event_id
                  required: true
                  schema:
                    type: string
                - description: Order ID (UUID)
                  in: path
                  name: order_id
                  required: true
                  schema:
                    type: string
                - description: Customer product ID (UUID)
                  in: path
                  name: customer_product_id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/handler.viewCustomerProductResponse'
                    description: OK
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rest.HttpError'
                    description: customer_product_not_found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rest.HttpError'
                    description: internal_server_error
            security:
                - SystemTokenAuth: []
            summary: View customer product
            tags:
                - Customer products
    /events/{event_id}/orders/{order_id}/products/{customer_product_id}/cancel:
        put:
            description: Cancels one customer product (an individual ticket or other product issued to a customer). Its barcode can no longer be used for entry and the product's stock is increased by one. The order it belongs to is not changed, and no refund is made. Canceling a customer product that is already canceled returns `409`.
            operationId: CancelCustomerProduct
            parameters:
                - description: Event ID (UUID)
                  in: path
                  name: event_id
                  required: true
                  schema:
                    type: string
                - description: Order ID (UUID)
                  in: path
                  name: order_id
                  required: true
                  schema:
                    type: string
                - description: Customer product ID (UUID)
                  in: path
                  name: customer_product_id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/handler.viewCustomerProductResponse'
                    description: OK
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rest.HttpError'
                    description: customer_product_not_found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rest.HttpError'
                    description: customer_product_already_canceled
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rest.HttpError'
                    description: internal_server_error
            security:
                - SystemTokenAuth: []
            summary: Cancel customer product
            tags:
                - Customer products
    /events/{event_id}/payment-methods:
        get:
            description: Returns the payment methods that are enabled for an event and available to online customers. Box-office-only payment methods are not included.
            operationId: ListPaymentMethods
            parameters:
                - description: Event ID (UUID)
                  in: path
                  name: event_id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/handler.paymentMethodResponse'
                                type: array
                    description: OK
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rest.HttpError'
                    description: event_not_found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rest.HttpError'
                    description: internal_server_error
            security:
                - SystemTokenAuth: []
            summary: List payment methods
            tags:
                - Payment methods
    /events/{event_id}/products:
        get:
            description: Returns the active products (for example tickets) of an event, with their name in each language and their price.
            operationId: ListProducts
            parameters:
                - description: Event ID (UUID)
                  in: path
                  name: event_id
                  required: true
                  schema:
                    type: string
                - description: Number of items to skip (default 0)
                  in: query
                  name: skip
                  schema:
                    type: integer
                - description: Page size (default 100)
                  in: query
                  name: take
                  schema:
                    type: integer
                - description: Field to sort by
                  in: query
                  name: sort
                  schema:
                    enum:
                        - display_order
                        - name
                        - created_at
                    type: string
                - description: Sort direction
                  in: query
                  name: order
                  schema:
                    enum:
                        - asc
                        - desc
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/handler.listResponse-handler_productListItem'
                    description: OK
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rest.HttpError'
                    description: event_not_found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rest.HttpError'
                    description: internal_server_error
            security:
                - SystemTokenAuth: []
            summary: List products
            tags:
                - Products
    /events/{event_id}/products/{product_id}:
        get:
            description: Returns the details of one product, including its remaining `stock` (reported as 0 when `has_unlimited_stock` is `true`) and the `capacity` of the pool it draws from, which can be shared with other products.
            operationId: ViewProduct
            parameters:
                - description: Event ID (UUID)
                  in: path
                  name: event_id
                  required: true
                  schema:
                    type: string
                - description: Product ID (UUID)
                  in: path
                  name: product_id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/handler.productResponse'
                    description: OK
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rest.HttpError'
                    description: product_not_found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rest.HttpError'
                    description: internal_server_error
            security:
                - SystemTokenAuth: []
            summary: View product
            tags:
                - Products
servers:
    - url: /ticketing/v1
webhooks:
    customer_product.canceled:
        post:
            description: Sent when a customer product (an individual ticket) is canceled, either on its own or as part of an order cancellation. Retrieve it with `GET /events/{event_id}/orders/{order_id}/products/{customer_product_id}`.
            operationId: WebhookCustomerProductCanceled
            parameters:
                - description: Always `customer_product.canceled`
                  in: header
                  name: X-Message-Type
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/handler.webhookMessagePayload'
                            description: Message payload
                            summary: payload
                description: Message payload
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                    description: Any 2xx response is treated as a successful delivery
                "500":
                    description: Any other response, or no response within 10 seconds, counts as a failed delivery and is retried
            summary: Webhook — customer_product.canceled
            tags:
                - Webhooks
            security: []
    order.canceled:
        post:
            description: Sent when an order is canceled, followed by a `customer_product.canceled` message for each ticket in the order.
            operationId: WebhookOrderCanceled
            parameters:
                - description: Always `order.canceled`
                  in: header
                  name: X-Message-Type
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/handler.webhookMessagePayload'
                            description: Message payload
                            summary: payload
                description: Message payload
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                    description: Any 2xx response is treated as a successful delivery
                "500":
                    description: Any other response, or no response within 10 seconds, counts as a failed delivery and is retried
            summary: Webhook — order.canceled
            tags:
                - Webhooks
            security: []
    order.completed:
        post:
            description: Sent when an order is completed. Retrieve it with `GET /events/{event_id}/orders/{order_id}`.
            operationId: WebhookOrderCompleted
            parameters:
                - description: Always `order.completed`
                  in: header
                  name: X-Message-Type
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/handler.webhookMessagePayload'
                            description: Message payload
                            summary: payload
                description: Message payload
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                    description: Any 2xx response is treated as a successful delivery
                "500":
                    description: Any other response, or no response within 10 seconds, counts as a failed delivery and is retried
            summary: Webhook — order.completed
            tags:
                - Webhooks
            security: []
