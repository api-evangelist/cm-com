info:
    contact:
        email: ticketing@cm.com
        name: CM.com Ticketing
        url: https://www.cm.com
    description: |-
        Integrate your own systems with CM.com Ticketing. Use this API to manage your events, read products, channels and payment methods, create and complete orders, look up the tickets issued to your customers, and set up discount campaigns and marketing trackers.

        **Authentication.** Every request must carry your system token in the `X-CM-SSO-ACCOUNTGUID` header. A request with a missing or unknown token is answered with `401`; a token that is not allowed to perform the request is answered with `403`. You only ever see and change data that belongs to your own organisation.

        **Rate limiting.** Each organisation may send up to 120 requests per minute, with short bursts of up to 30 requests. Requests over the limit are answered with `429` and the error code `rate_limit_exceeded`; wait a moment and retry.

        **Pagination.** List endpoints accept `skip` and `take` (default `take` is 100) and return `items`, `total_items`, `page_size` and `links` (`self`, `first`, `prev`, `next`, `last`) so you can walk through the results.

        **Errors.** Errors from the API itself are returned as JSON with a machine-readable `error_code` and a human-readable `error_msg`; switch on `error_code` in your code, as `error_msg` may change. (Authentication failures, `401` and `403`, are returned as plain text.)

        **Webhooks.** Register webhook endpoints, and choose which message types they receive, in the CM.com Ticketing dashboard. Messages are sent as a JSON `POST` with the message type in the `X-Message-Type` header, and identify the resource that changed; fetch its current state from this API. Respond with `2xx` within 10 seconds. Failed deliveries are retried, so the same message may arrive more than once.
    license:
        name: Proprietary
        url: https://www.cm.com
    termsOfService: https://www.cm.com/terms-of-service/
    title: External Ticketing API
    version: "0.1"
openapi: 3.1.0
paths:
    /customer-products:
        get:
            description: Returns all customer products (the individual tickets and other products issued to customers) across all of your events. Accepts the same filters as the event-level list.
            operationId: ListOrganisationCustomerProducts
            parameters:
                - description: Number of items to skip (default 0)
                  in: query
                  name: skip
                  schema:
                    type: integer
                - description: Page size (default 100)
                  in: query
                  name: take
                  schema:
                    type: integer
                - description: Only return customer products of this product type
                  in: query
                  name: product_type
                  schema:
                    type: string
                - description: Only return customer products with this status
                  in: query
                  name: status
                  schema:
                    type: string
                - description: Only return customer products of this product (UUID). Repeat the parameter to include several products
                  in: query
                  name: product_id
                  schema:
                    items:
                        type: string
                    type: array
                - description: Only return customer products whose order was completed at or after this time (RFC 3339)
                  in: query
                  name: issued_at_from
                  schema:
                    type: string
                - description: Only return customer products whose order was completed at or before this time (RFC 3339)
                  in: query
                  name: issued_at_to
                  schema:
                    type: string
                - description: Only return customer products whose order was refunded at or after this time (RFC 3339)
                  in: query
                  name: refunded_at_from
                  schema:
                    type: string
                - description: Only return customer products whose order was refunded at or before this time (RFC 3339)
                  in: query
                  name: refunded_at_to
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/handler.listResponse-handler_customerProductListItem'
                    description: OK
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rest.HttpError'
                    description: internal_server_error
            security:
                - SystemTokenAuth: []
            summary: List customer products for the organisation
            tags:
                - Customer products
    /events/:
        get:
            description: Returns your organisation's active events.
            operationId: ListEvents
            parameters:
                - description: Number of items to skip (default 0)
                  in: query
                  name: skip
                  schema:
                    type: integer
                - description: Page size (default 100)
                  in: query
                  name: take
                  schema:
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/handler.listResponse-handler_eventResponse'
                    description: OK
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rest.HttpError'
                    description: Your token does not have permission to list events"That
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rest.HttpError'
                    description: internal_server_error
            security:
                - SystemTokenAuth: []
            summary: List events
            tags:
                - Events
        post:
            description: 'Creates a new event. `description` and `discount_label` are objects keyed by language code (for example `{"en": "...", "nl": "..."}`); provide them for the languages you list in `languages`.'
            operationId: CreateEvent
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/event.CreateEventRequest'
                            description: Event payload
                            summary: request
                description: Event payload
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
