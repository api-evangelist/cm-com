      deprecated: false
  /addContact:
    post:
      summary: /addContact
      description: |-
        This functionality is used to add contact information to a reservation. Please add as many customer information as possible for support and aftersale purposes for the users (museums).

        **HMACKey:** `Base64 encode - SHA256(apiKey + customerAddressCity + customerAddressNumber + customerAddressPostalCode + customerAddressStreet + customerCountry + customerEmailAddress + customerFirstName + customerMiddleName + customerPhoneNumber + customerSurname + environment + reservationId + userId)`
      operationId: addcontact
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - apiKey
                - environment
                - userId
                - reservationId
                - customerFirstName
                - customerSurname
                - customerEmailAddress
                - HMACKey
              properties:
                apiKey:
                  type: string
                  description: Your public apiKey needs to be included in every request
                environment:
                  type: string
                  description: '"test" or "production"'
                  enum:
                    - production
                    - test
