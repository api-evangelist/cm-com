          nullable: true
        displayValue:
          type: string
          description: The value to display
          nullable: true
      additionalProperties: false
      description: The status of a porting request
    ApiRequestRestrictions:
      title: Request Restrictions
      type: object
      properties:
        countryCode:
          type: string
          description: The country code in ISO 3166-1 alpha-2 format.
          nullable: true
          example: NL
        numberType:
          type: string
          description: The phone number type (Local, National, TollFree).
          nullable: true
          example: Local
        supportedRangeSizes:
          type: array
          items:
            type: integer
