        description: Unique identifier of the Logical Account or Voice Account.
        required: true
        schema:
          type: string
          format: uuid
        example: 00000000-0000-0000-0000-000000000000
      - name: orderId
        in: path
        description: Unique identifier of the porting request order.
        required: true
        schema:
          type: string
      requestBody:
        description: Document upload information
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiUploadPortingRequestDocument'
          text/json:
            schema:
              $ref: '#/components/schemas/ApiUploadPortingRequestDocument'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ApiUploadPortingRequestDocument'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPortingRequestDocument'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
  /voice-phonenumberrequestapi/v1/{accountGuid}/portingrequests/{orderId}/documents/{documentType}:
    delete:
      tags:
      - Porting Requests
      summary: Delete Porting Request Document
      description: Delete a document from a porting request
      parameters:
      - name: accountGuid
        in: path
        description: Unique identifier of the Logical Account or Voice Account.
        required: true
        schema:
          type: string
          format: uuid
        example: 00000000-0000-0000-0000-000000000000
      - name: orderId
        in: path
        description: Unique identifier of the porting request order.
        required: true
        schema:
          type: string
      - name: documentType
        in: path
        description: Type of document to delete (LoA, TelcoInvoice, Other)
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
