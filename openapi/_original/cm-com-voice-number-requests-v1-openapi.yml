          nullable: true
          example:
          - 1
          - 10
          - 100
          - 1000
        maxNumbersPerRequest:
          type: integer
          description: The maximum amount of numbers that can be requested in a single request, can be null if there is no limit
          format: int32
          nullable: true
          example: 1000
      additionalProperties: false
      description: Restrictions for number requests
    ApiRequiredField:
      title: Required Field
      type: object
      properties:
        field:
          type: string
          description: The name of the required field.
          nullable: true
          example: btw_number
        exampleValue:
          type: string
          description: Example value that shows the format we expect the value of the field to be in.
          nullable: true
          example: BE0999999999
      additionalProperties: false
      description: A country specific required field containing additional required information for either a number or porting request.
    ApiRequirement:
      title: Requirement
      type: object
      properties:
        key:
          type: string
          description: The key of the requirement.
          nullable: true
          example: proof_of_company_address
        type:
          $ref: '#/components/schemas/ApiRequirementType'
        downloadLink:
          type: string
          description: URL where the requirement can be downloaded if it's a document that needs to be signed (Type = 4).
          nullable: true
          example: https://api.cm.com/resources/v2/public/00000000-0000-0000-0000-000000000000/content
        isForReseller:
          type: boolean
          description: Determines whether the requirement is specifically for resellers
      additionalProperties: false
      description: A country specific rule or regulation that a request must meet. This can for example be a certain document that must be provided.
    ApiRequirementType:
      title: Requirement Type
      enum:
      - Document
      - CompanyRule
      - NumberRule
      - SignedDocument
      type: string
      description: The type of the requirement where `1` = document, `2` = requirement for a company, `3` = requirement for a number request and `4` = signed document..
    ApiRequirementsPerCountry:
      title: Requirements Per Country
      type: object
      properties:
        countryCode:
          type: string
          description: The country code (2 letters, ISO 3166).
          nullable: true
        countryName:
          type: string
          description: The English country name.
          nullable: true
        requirementsPerNumberType:
          type: array
          items:
            $ref: '#/components/schemas/ApiRequirementsPerNumberType'
