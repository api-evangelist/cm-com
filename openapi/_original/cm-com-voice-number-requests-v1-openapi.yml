      title: Upload Porting Request Document
      required:
      - documentGuid
      - documentType
      type: object
      properties:
        documentType:
          minLength: 1
          type: string
          description: Type of document (LoA, TelcoInvoice, Other)
          example: LoA
        documentGuid:
          minLength: 1
          type: string
          description: Unique identifier of the document from the documents API
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
      additionalProperties: false
      description: Document upload information for porting requests
    ContractTermination:
      title: Contract Termination
      enum:
      - Default
      - EarlyTermination
      - NoTermination
      type: string
      description: When a porting request contract needs to be terminated
    Error:
      title: Error
      type: object
      properties:
        code:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
      additionalProperties: false
    ErrorCollection:
      title: Error Collection
      type: object
      properties:
        requestId:
          type: string
          nullable: true
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
          nullable: true
      additionalProperties: false
