    ApiPortingRequestOrder:
      title: Porting Request Order
      type: object
      properties:
        id:
          type: string
          description: Unique identifier
          format: uuid
        orderId:
          type: string
          description: The order id
          nullable: true
        createdOn:
          type: string
          description: Date and time of creation
          format: date-time
        portingData:
          $ref: '#/components/schemas/ApiPortingRequest'
