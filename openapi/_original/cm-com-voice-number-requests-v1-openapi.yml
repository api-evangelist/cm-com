    ApiPortingRequestDocument:
      title: Porting Request Document
      type: object
      properties:
        documentType:
          type: string
          description: Type of document (LoA, TelcoInvoice, Other)
          nullable: true
          example: LoA
        documentGuid:
          type: string
          description: Unique identifier of the document
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        uploadedAt:
          type: string
          description: Date and time when the document was uploaded
          format: date-time
        status:
          type: string
