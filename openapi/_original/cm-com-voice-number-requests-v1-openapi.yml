  /voice-phonenumberrequestapi/v1/regulations/country-requirements:
    get:
      tags:
      - Regulations
      summary: Get Number Request Requirements
      description: Retrieve all rules and regulations, ordered by country and phone number type. Be aware that every request also requires contact information (first & last name, email address), company representative contact information (first & last name, phone number) and company information (name, registration number, address).
      parameters:
      - name: CountryCodes
        in: query
        description: Country codes to filter on, separated by a comma. (ISO 3166-1 alpha-2 format)
        schema:
          type: string
          example: NL,BE
        example: NL,BE
      - name: PhoneNumberTypes
        in: query
        description: Phone number types to filter on, separated by a comma.
        schema:
          type: string
          example: Local,National,TollFree
        example: Local,National,TollFree
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiRequirementsPerCountry'
  /voice-phonenumberrequestapi/v1/{countryCode}/requiredfields:
    get:
      tags:
      - Requests
      summary: Get Required Fields
      description: "Because of different rules and regulations in different countries, we may need certain additional information along with your request depending on the country related to the request. These required fields can be fetched with this endpoint, together with an example value describing the format in which it should be supplied.\r\n\r\nIf the response contains only an empty array, it means the country that the request is bound to does not require any required fields to be added."
      parameters:
      - name: countryCode
        in: path
        description: Country code to retrieve the required fields for in ISO 3166 alpha-2 format.
        required: true
        schema:
          type: string
        example: NL
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiRequiredField'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
  /voice-phonenumberrequestapi/v1/blocked-countries:
    get:
      tags:
      - Requests
      summary: Get Blocked Countries
      description: Get a list of countries that are currently unavailable for phone number requests and phone number porting.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiBlockedCountry'
components:
  schemas:
    ApiAvailableNumbers:
      title: Available Numbers
      type: object
      properties:
        quantity:
          type: integer
          description: The amount of number blocks.
          format: int32
          example: 25
        rangeSize:
          type: integer
          description: The size of the number blocks.
          format: int32
          example: 10
        countryCode:
          type: string
          description: The country code in ISO 3166-1 alpha-2 format.
          nullable: true
          example: NL
        numberType:
          type: string
          description: The phone number type (Local, National, TollFree).
          nullable: true
          example: Local
        areaCode:
          type: string
          description: The area code.
          nullable: true
          example: '76'
        city:
          type: string
          description: The city or town.
          nullable: true
          example: Amsterdam
        region:
          type: string
          description: The region or state, only for NANPA.
          nullable: true
          example: Alabama
        hasAvailableNumbers:
          type: boolean
          description: If true, the phone numbers to request are available
          example: true
        immediatelyAvailable:
          type: boolean
          description: If true, the numbers are available for immediate provisioning, otherwise there may be a delay
          example: false
      additionalProperties: false
      description: Result of checking for number availability
    ApiBlockedCountry:
      title: Blocked Country
      type: object
      properties:
        code:
          type: string
          description: The country code (ISO 2-char)
          nullable: true
        name:
          type: string
          description: English name of the country.
          nullable: true
        reason:
          type: string
          description: The reason why the country is blocked. Can be null.
          nullable: true
      additionalProperties: false
      description: Country that is blocked for number requests and porting requests.
    ApiCountryRequirement:
      title: Country Requirement
      type: object
      properties:
        key:
          type: string
          description: Unique key for this requirement.
          nullable: true
        description:
          type: string
          description: Description of the requirement.
          nullable: true
        type:
          type: string
          description: The type of requirement.
          nullable: true
        resourceLink:
          type: string
          description: Download link to the resource that is needed for this requirement.
          nullable: true
        isForReseller:
          type: boolean
          description: This requirement ONLY applies to resellers.
      additionalProperties: false
      description: Requirement for requests (under a number type and country combination)
    ApiCreateNumberRequest:
      title: Create Number Request
      type: object
      properties:
        companyProfileGuid:
          type: string
          description: Unique identifier of the company profile that will be operating the requested numbers.
          format: uuid
          example: 11111111-1111-1111-1111-111111111111
        quantity:
          maximum: 1000
          minimum: 1
          type: integer
          description: The quantity of numbers to be requested.
          format: int32
          example: 25
        rangeSize:
          type: integer
          description: "The size of the range to be requested. **Only required if a range of numbers is requested.\r\nRequires number ranges to be supported. See the order restrictions endpoint for the allowed ranges**"
          format: int32
          example: 10
        numberType:
          $ref: '#/components/schemas/ApiNumberType'
        areaCode:
          type: string
          description: "The area code to request numbers for. Required when city is not provided.\r\nIf the city is also provided, this will be used in combination with city."
          nullable: true
          example: '76'
        city:
          type: string
          description: "City to request numbers for. Required when area code is not provided.\r\nIf the area code is also provided, this will be used in combination with area code."
          nullable: true
          example: Amsterdam
        region:
          type: string
          description: Region to request numbers for. Only required for NANPA.
          nullable: true
          example: Alabama
        comment:
          maxLength: 500
          type: string
          description: Additional comment for customers to for example add a distribution group or IP address.
          nullable: true
          example: Room for extra comments or requests regarding this phone number request
        callbackUrl:
          type: string
          description: URL that we'll send a POST request to when the status of the request has been updated. The body of this post request will contain the entire number request order including the updated status.
          nullable: true
          example: https://www.example.com
      additionalProperties: false
      description: Request model for requesting new phone numbers.
    ApiCreatePortingRequest:
      title: Create Porting Request
      required:
      - providerCompanyName
      type: object
      properties:
        phoneNumbers:
          type: array
          items:
            $ref: '#/components/schemas/ApiPortingPhoneNumber'
          description: Phone numbers to be ported over.
          nullable: true
        providerCompanyName:
          minLength: 1
          type: string
          description: Company name of the current number provider.
          example: T-Mobile
        preferredPortingDateTime:
          type: string
          description: '**Only used for porting non-dutch numbers.** Preferred date and time to port the phone number(s) in UTC time. Will be picked up between 6:00 and 20:00 UTC time. Should be null when the porting request should be handled as soon as possible.'
          format: date-time
          nullable: true
        companyProfileGuid:
          type: string
          description: Unique identifier of the company profile that will be operating the ported numbers.
          format: uuid
        comment:
          maxLength: 500
          type: string
          description: Additional comment for customers to for example add a distribution group or IP address.
          nullable: true
          example: Room for extra comments or requests regarding this phone number request
        callbackUrl:
          type: string
          description: URL that we'll send a POST request to when the status of the request has been updated. The body of this post request will contain the entire porting request order including the updated status.
          nullable: true
          example: https://www.example.com
        documents:
          type: array
          items:
            $ref: '#/components/schemas/ApiUploadPortingRequestDocument'
          description: Optional documents to upload with the porting request (LoA, Telco Invoice, etc.)
          nullable: true
      additionalProperties: false
      description: A porting requests that allows you to port you phone numbers from your current provider to the CM.com platform.
    ApiLocaleOptions:
      title: Locale Options
      type: object
      properties:
        countryCode:
          type: string
          description: The country code in ISO 3166-1 alpha-2 format.
          nullable: true
          example: NL
        nanpaCity:
          type: string
          description: City to filter regions on when requesting NANPA numbers, the result will contain only regions that have numbers available in this city.
          nullable: true
          example: Los Angeles
        nanpaRegion:
          type: string
          description: Region to filter cities on when requesting NANPA numbers, the result will contain only cities that have numbers available in this region.
          nullable: true
          example: California
        cities:
          type: array
          items:
            type: string
          description: List of cities to choose from for requesting a number
          nullable: true
        regions:
          type: array
          items:
            type: string
          description: List of regions to choose from for requesting a number, only for NANPA
          nullable: true
      additionalProperties: false
      description: Locale options when requesting numbers for a specific country and number type
    ApiNumberRequest:
      title: Number Request
      type: object
      properties:
        companyProfileGuid:
          type: string
          description: Unique identifier of the company profile that will be operating the requested numbers.
          format: uuid
          example: 11111111-1111-1111-1111-111111111111
        quantity:
          type: integer
          description: The requested quantity. **Only required if no requested ranges are supplied.**
          format: int32
          example: 25
        rangeSize:
          type: integer
          description: The size of the range to be requested. **Only required if number blocks are supported. See the order restrictions endpoint for allowed ranges**
          format: int32
        countryCode:
          type: string
          description: The country code in ISO 3166-1 alpha-2 format.
          nullable: true
          example: NL
        numberType:
          type: string
          description: The type of the number, either Local, National, or TollFree.
          nullable: true
          example: Local
        areaCode:
          type: string
          description: The area code (prefix) of the requested numbers.
          nullable: true
          example: '76'
        city:
          type: string
          description: "City to request numbers for. Required when area code is not provided.\r\nIf the area code is also provided, this will be used in combination with area code."
          nullable: true
          example: Breda
        region:
          type: string
          description: Region to request numbers for. Only required for NANPA.
          nullable: true
          example: Alabama
        comment:
          type: string
          description: Additional comment for customers to for example add a distribution group or IP address.
          nullable: true
          example: Room for extra comments or requests regarding this phone number request
        callbackUrl:
          type: string
          description: URL that we'll send a POST request to when the status of the request has been updated. The body of this post request will contain the entire number request order including the updated status.
          nullable: true
          example: https://www.example.com
      additionalProperties: false
      description: Request model for requesting new phone numbers.
    ApiNumberRequestOrder:
      title: Number Request Order
      type: object
      properties:
        id:
          type: string
          description: Unique identifier
          format: uuid
          example: 11111111-1111-1111-1111-111111111111
        orderId:
          type: integer
          description: The order id
          format: int32
          example: 250101001
        createdOn:
          type: string
          description: Date and time of creation
          format: date-time
          example: '2025-01-01T00:00:00'
        requestData:
          $ref: '#/components/schemas/ApiNumberRequest'
        status:
          type: string
          description: The status key of the phone number request
          nullable: true
          example: InProgress
        comment:
          type: string
          description: Optional comment describing the reason for the current status of the phone number request
          nullable: true
          example: Your request is currently in progress.
      additionalProperties: false
      description: Request model for a phone number request order
    ApiNumberRequestOrderStatus:
      title: Number Request Order Status
      type: object
      properties:
        key:
          type: string
          description: Status key
          nullable: true
          example: InProgress
        displayValue:
          type: string
          description: The value to display
          nullable: true
          example: In Progress
      additionalProperties: false
      description: The status of a phone numbers request order
    ApiNumberType:
      title: Number Type
      enum:
      - Local
      - National
      - TollFree
      type: string
      description: Phone number type
    ApiPhoneNumberRange:
      title: Phone Number Range
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the phone number range.
          nullable: true
          example: 11111111-1111-1111-1111-111111111111
        start:
          type: integer
          description: The starting phone number in a range.
          format: int64
          nullable: true
          example: 311234567890
        size:
          type: integer
          description: The size of the range.
          format: int32
          example: 10
        countryCode:
          type: string
          description: The country code in ISO 3166-1 alpha-2 format.
          nullable: true
          example: NL
        voiceAccountGuid:
          type: string
          description: Unique identifier of the Voice Account.
          nullable: true
          example: 11111111-1111-1111-1111-111111111111
        validFrom:
          type: string
          description: Date and time the range is assigned to, and in use by the Voice Account.
          format: date-time
          nullable: true
          example: '2025-01-01T00:00:00'
        validTo:
          type: string
          description: Date and time the range is no longer assigned to, nor in use by the Voice Account.
          format: date-time
          nullable: true
          example: '2025-01-01T00:00:00'
        orderId:
          type: string
          description: Unique identifier of the order in which the range was requested.
          nullable: true
          example: '250101001'
      additionalProperties: false
