# x-archived-from: cm-com-voice-number-requests-v1-openapi.yml
# x-archived-on: 2026-10-13
openapi: 3.0.1
info:
  title: Phone Number Request API
  version: v1
servers:
- url: https://api.cm.com
paths:
  /voice-phonenumberrequestapi/v1/{accountGuid}/numberrequests:
    get:
      tags:
      - Number Requests
      summary: Get Number Requests
      description: Get all number request orders for the given Account.
      parameters:
      - name: accountGuid
        in: path
        description: Unique identifier of the Logical Account or Voice Account.
        required: true
        schema:
          type: string
          format: uuid
        example: 00000000-0000-0000-0000-000000000000
      - name: skip
        in: query
        description: Amount of items being skipped.
        schema:
          type: integer
          format: int32
          default: 0
        example: 0
      - name: take
        in: query
        description: Amount of items being retrieved.
        schema:
          type: integer
          format: int32
          default: 30
        example: 30
      - name: q
        in: query
        description: Search for order ID.
        schema:
          type: string
          default: ''
      - name: statuses
        in: query
        description: Filter on given statusses.
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Success
          headers:
            X-CM-PAGINATION-SKIP:
              description: The amount of items that have been skipped
              schema:
                type: number
            X-CM-PAGINATION-TAKE:
              description: The amount of items that have been taken
              schema:
                type: number
            X-CM-PAGINATION-TOTAL:
              description: The total amount of available items
              schema:
                type: number
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiNumberRequestOrder'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
    post:
      tags:
      - Number Requests
      summary: Create Number Request
      description: "This endpoint allows you to request one or more phone numbers for use in our platform. The prices bound to purchasing new numbers can be found in the voice management App.\r\n\r\nIf the requested numbers are directly available, they will be immediately assigned to the specified voice account. If they are not directly available, your order may take some time to complete. We will keep you informed on the status of your order via the supplied email address and (if given) via the supplied callback URL."
      parameters:
      - name: accountGuid
        in: path
        description: Unique identifier of the Logical Account or Voice Account.
        required: true
        schema:
          type: string
          format: uuid
        example: 00000000-0000-0000-0000-000000000000
      requestBody:
        description: Request data for new phone number ranges
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiCreateNumberRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ApiCreateNumberRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ApiCreateNumberRequest'
      responses:
        '200':
          description: If the numbers are not directly assignable, the `id`, `start`, `validFrom` and `validTo` fields will be null.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiPhoneNumberRange'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
  /voice-phonenumberrequestapi/v1/{accountGuid}/numberrequests/{orderId}:
    get:
      tags:
      - Number Requests
      summary: Get Number Request
      description: Get a specific phone number request based on the given order ID.
      parameters:
      - name: accountGuid
        in: path
        description: Unique identifier of the Logical Account or Voice Account.
        required: true
        schema:
          type: string
          format: uuid
        example: 00000000-0000-0000-0000-000000000000
      - name: orderId
        in: path
        description: Unique identifier of the number request order, this can be found in your confirmation email or the Voice Management App.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiNumberRequestOrder'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
  /voice-phonenumberrequestapi/v1/numberrequests/statuses:
    get:
      tags:
      - Number Requests
      summary: Get Number Request Statuses
      description: A phone number request goes through a set of predefined statuses during its lifespan. With this request you can retrieve all possible statuses.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiNumberRequestOrderStatus'
  /voice-phonenumberrequestapi/v1/numberrequests/{countryCode}/requirements:
    get:
      tags:
      - Number Requests
      summary: Get Country Requirements
      description: "Because of different rules and regulation in different countries, we may need additional information (for example documents) after your request has been created. The required information will be checked by our support staff. Necessary documents can later be requested via email. With this endpoint you can retrieve the additional information based on the country related to the request.\r\n\r\nIf the response contains only an empty array, it means the country that the request is bound to does not require any information."
      parameters:
      - name: countryCode
        in: path
        description: Country code to retrieve the required fields for in ISO 3166 alpha-2 format.
        required: true
        schema:
          type: string
        example: NL
      - name: numberType
        in: query
        description: Optional type of phone number to filter requirements on
        schema:
          $ref: '#/components/schemas/ApiNumberType'
        example: Local
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiRequirement'
  /voice-phonenumberrequestapi/v1/numberrequests/restrictions:
    get:
      tags:
      - Number Requests
      summary: Get Request Restrictions
      description: Get restrictions on the number request for the given country code and number type combination. (e.g. maximum amount of numbers per request, supported range sizes)
      parameters:
      - name: CountryCode
        in: query
        description: The country code in ISO 3166-1 alpha-2 format.
        schema:
          type: string
          example: NL
        example: NL
      - name: NumberType
        in: query
        description: The phone number type (Local, National, TollFree).
        schema:
          $ref: '#/components/schemas/ApiNumberType'
        example: Local
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRequestRestrictions'
  /voice-phonenumberrequestapi/v1/{accountGuid}/numberrequests/availability:
    get:
      tags:
      - Number Requests
      summary: Get Availability
      description: Check the availability of phone numbers based on the provided request details.
      parameters:
      - name: accountGuid
        in: path
        description: Unique identifier of the Logical Account or Voice Account.
        required: true
        schema:
          type: string
          format: uuid
        example: 00000000-0000-0000-0000-000000000000
      - name: Quantity
        in: query
        description: The quantity of numbers to check availability for.
        schema:
          type: integer
          format: int32
          example: 25
        example: 25
      - name: RangeSize
        in: query
        description: "The size of the range to check availability for. **Only required if a range of numbers is requested.\r\nRequires number ranges to be supported. See the order restrictions endpoint for the allowed ranges**"
        schema:
          type: integer
          format: int32
          example: 10
        example: 10
      - name: CountryCode
        in: query
        description: The country code in ISO 3166-1 alpha-2 format.
        schema:
          type: string
          example: NL
        example: NL
      - name: NumberType
        in: query
        description: The type of the number, either Local, National, or TollFree.
        schema:
          $ref: '#/components/schemas/ApiNumberType'
        example: Local
      - name: AreaCode
        in: query
        description: "The area code to check availability for. Required when city is not provided.\r\nIf the city is also provided, this will be used in combination with city."
        schema:
          type: string
          example: '76'
        example: '76'
      - name: City
        in: query
        description: "City to check availability for. Required when area code is not provided.\r\nIf the area code is also provided, this will be used in combination with area code."
        schema:
          type: string
          example: Amsterdam
        example: Amsterdam
      - name: Region
        in: query
        description: The region the city is located in (only required for Nanpa).
        schema:
          type: string
          example: Alabama
        example: Alabama
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAvailableNumbers'
        '401':
          description: Unauthorized
  /voice-phonenumberrequestapi/v1/numberrequests/locale-options:
    get:
      tags:
      - Number Requests
      summary: Get Locale Options
      description: Get locale options when requesting numbers for a specific country.
      parameters:
      - name: CountryCode
        in: query
        description: The country code in ISO 3166-1 alpha-2 format.
        schema:
          type: string
          example: NL
        example: NL
      - name: NanpaCity
        in: query
        description: City to filter regions on when requesting NANPA numbers, the result will contain only regions that have numbers available in this city.
        schema:
          type: string
          example: Los Angeles
        example: Los Angeles
      - name: NanpaRegion
        in: query
        description: Region to filter cities on when requesting NANPA numbers, the result will contain only cities that have numbers available in this region.
        schema:
          type: string
          example: California
        example: California
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiLocaleOptions'
  /voice-phonenumberrequestapi/v1/{accountGuid}/portingrequests:
    get:
      tags:
      - Porting Requests
      summary: Get Porting Requests
      description: Get all porting request orders for the given Account.
      parameters:
      - name: accountGuid
        in: path
        description: Unique identifier of the Logical Account or Voice Account.
        required: true
        schema:
          type: string
          format: uuid
        example: 00000000-0000-0000-0000-000000000000
      - name: skip
        in: query
        description: Amount of items being skipped.
        schema:
          type: integer
          format: int32
          default: 0
        example: 0
      - name: take
        in: query
        description: Amount of items being retrieved.
        schema:
          type: integer
          format: int32
          default: 30
        example: 30
      - name: q
        in: query
        description: Search for order ID.
        schema:
          type: string
          default: ''
      - name: statuses
        in: query
        description: Filter on given statusses.
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Success
          headers:
            X-CM-PAGINATION-SKIP:
              description: The amount of items that have been skipped
              schema:
                type: number
            X-CM-PAGINATION-TAKE:
              description: The amount of items that have been taken
              schema:
                type: number
            X-CM-PAGINATION-TOTAL:
              description: The total amount of available items
              schema:
                type: number
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiPortingRequestOrder'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
    post:
      tags:
      - Porting Requests
      summary: Create Porting Request
      description: "This endpoint allows you to request one or more phone numbers to be ported from your current number provider, to CM.com.\r\n\r\nAfter your porting request has been created, we will keep you informed on the status of your order via the supplied email address and (if given) via the supplied callback URL. If your porting request has been completed, the phone numbers will be directly available for use inside our platform."
      parameters:
      - name: accountGuid
        in: path
        description: Unique identifier of the Logical Account or Voice Account.
        required: true
        schema:
          type: string
          format: uuid
        example: 00000000-0000-0000-0000-000000000000
      requestBody:
        description: CM.Voice.PhoneNumberRequestApi.Models.Api.PortingRequest.ApiCreatePortingRequest
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiCreatePortingRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ApiCreatePortingRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ApiCreatePortingRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPortingRequestOrder'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCollection'
  /voice-phonenumberrequestapi/v1/{accountGuid}/portingrequests/{orderId}:
    get:
      tags:
      - Porting Requests
      summary: Get Porting Request
      description: Get a specific porting request based on the given order ID.
      parameters:
      - name: accountGuid
        in: path
        description: Unique identifier of the Logical Account or Voice Account.
        required: true
        schema:
          type: string
          format: uuid
        example: 00000000-0000-0000-0000-000000000000
      - name: orderId
        in: path
        description: Unique identifier of the porting request order, this can be found in your confirmation email or the Voice Management App.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPortingRequestOrder'
        '400':
