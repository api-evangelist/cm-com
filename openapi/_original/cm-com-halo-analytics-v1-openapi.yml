# x-archived-from: cm-com-halo-analytics-v1-openapi.yml
# x-archived-on: 2026-10-13
openapi: 3.1.0
info:
  title: HALO Analytics API
  description: Execute analytical operations for HALO platform
  license:
    name: ""
  version: 1.0.0
servers:
  - url: /halo
paths:
  /analytics/v1/accounts/{account_id}/logging/feedback-scores:
    post:
      tags:
        - Analytics
      description: |-
        Create a feedback score for a conversation interaction.

        Required permission: `HALO.Analytics_Logging_FeedbackScores`
      operationId: create_feedback_score_external
      parameters:
        - name: account_id
          in: path
          description: The account ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackScoreRequest"
        required: true
      responses:
        "200":
          description: Feedback score created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackScoreResponse"
        "400":
          description: Bad request - invalid input
        "404":
          description: Account not found
      security:
        - X-CM-SSO-ACCOUNTGUID: []
        - {}
  /analytics/v1/accounts/{account_id}/metrics:
    get:
      tags:
        - Analytics
      description: |-
        Get conversation metrics for an account.

        Required permission: `HALO.Analytics_API`
      operationId: get_metrics
      parameters:
        - name: account_id
          in: path
          description: The account ID
          required: true
          schema:
            type: string
            format: uuid
        - name: from_date
          in: query
          description: Start date for metrics calculation (ISO 8601 format, UTC expected). Defaults to 30 days ago.
          required: false
          schema:
            type: string
            format: date-time
        - name: until_date
          in: query
          description: End date for metrics calculation (ISO 8601 format, UTC expected). Defaults to now.
          required: false
          schema:
            type: string
            format: date-time
        - name: profile_id
          in: query
          description: Optional profile ID to filter metrics
          required: false
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: Metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsData"
        "400":
          description: Bad request - invalid query parameters
        "404":
          description: Account not found
        "422":
          description: Validation error - invalid date range
      security:
        - X-CM-SSO-ACCOUNTGUID: []
        - {}
  /analytics/v2/accounts/{account_id}/conversations:
    get:
      tags:
        - Conversations
      description: |-
        List conversations for a profile with filtering and pagination.

        Required permission: `HALO.Analytics_Conversations_Read`
      operationId: get_conversations
      parameters:
        - name: account_id
          in: path
          description: The account ID
          required: true
          schema:
            type: string
            format: uuid
        - name: profile_id
          in: query
          description: Optional profile ID to filter conversations (if not provided, returns all conversations for the account)
          required: false
          schema:
            type: integer
            format: int32
        - name: duration_filter_in_days
          in: query
          description: Number of days to filter (alternative to from_date/until_date)
          required: false
          schema:
            type: integer
            format: int64
        - name: from_date
          in: query
          description: Start date for filtering (ISO 8601 format, UTC)
          required: false
          schema:
            type: string
            format: date-time
        - name: until_date
          in: query
          description: End date for filtering (ISO 8601 format, UTC)
          required: false
          schema:
            type: string
            format: date-time
        - name: languages
          in: query
          description: Filter by languages (comma-separated)
          required: false
          schema:
            type: string
        - name: channels
          in: query
          description: Filter by channels (comma-separated)
          required: false
          schema:
            type: string
        - name: products
          in: query
          description: Filter by products (comma-separated)
          required: false
          schema:
            type: string
        - name: excluded_products
          in: query
          description: Exclude products while retaining conversations whose product is missing (comma-separated)
          required: false
          schema:
            type: string
        - name: resolutions
          in: query
          description: Filter by resolutions (comma-separated)
          required: false
          schema:
            type: string
        - name: feedbacks
          in: query
          description: Filter by feedbacks (comma-separated)
          required: false
          schema:
            type: string
        - name: search_query
          in: query
          description: Search query for conversation content
          required: false
          schema:
            type: string
        - name: min_recognition_rate_percentage
          in: query
          description: Minimum recognition rate percentage (0-100)
          required: false
          schema:
            type: number
            format: double
        - name: max_recognition_rate_percentage
          in: query
          description: Maximum recognition rate percentage (0-100)
          required: false
          schema:
            type: number
            format: double
        - name: agent_ids
          in: query
          description: Filter by agent IDs (comma-separated integers)
          required: false
          schema:
            type: string
        - name: tool_ids
          in: query
          description: Filter by tool IDs (comma-separated integers)
          required: false
          schema:
            type: string
        - name: topic_ids
          in: query
          description: Filter by topic IDs (comma-separated integers, -1 = pending)
          required: false
          schema:
            type: string
        - name: conversation_product
          in: query
          description: "Filter by conversation product (comma-separated: HALO,AICLOUD,FAQ)"
          required: false
          schema:
            type: string
        - name: has_feedback
          in: query
          description: Filter by whether conversations have feedback (true = only with feedback, false = only without)
          required: false
          schema:
            type: boolean
        - name: optimise_suggestion_id
          in: query
          description: |-
            Filter to only conversations belonging to a specific Optimise suggestion (its suggestion_id).
            Requires `profile_id`. An unknown or pruned id yields an empty result.
          required: false
          schema:
            type: string
            format: uuid
        - name: page_size
          in: query
          description: "Page size (default: 1000, max: 1000)"
          required: false
          schema:
            type: integer
            format: int64
        - name: page_index
          in: query
          description: "Page index (0-based, default: 0)"
          required: false
          schema:
            type: integer
            format: int64
        - name: sort_order
          in: query
          description: 'Sort order: "asc" or "desc" (default: "desc")'
          required: false
          schema:
            type: string
        - name: sort_by
          in: query
          description: 'Sort by field: "started", "ended", or "recognition_rate" (default: "started")'
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Conversations list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationsResponse"
        "404":
          description: Account or profile not found
      security:
        - X-CM-SSO-ACCOUNTGUID: []
        - {}
  /analytics/v2/accounts/{account_id}/conversations/{conversation_id}:
    get:
      tags:
        - Conversations
      description: |-
        Retrieve a conversation by ID with calculated analytics.

        Required permission: `HALO.Analytics_Conversations_Read`
      operationId: get_conversation
      parameters:
        - name: account_id
          in: path
          description: The account ID
          required: true
          schema:
            type: string
            format: uuid
        - name: conversation_id
          in: path
          description: The conversation ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "404":
          description: Conversation not found
        "410":
          description: Conversation content redacted after the retention window; body carries the retained non-PII metadata (redacted, created, ended, ai_resolution_status, feedback_status)
      security:
        - X-CM-SSO-ACCOUNTGUID: []
        - {}
  /analytics/v2/accounts/{account_id}/conversations/{conversation_id}/items:
    get:
      tags:
        - Runtime
      description: Get conversation items by conversation ID, optionally filtered by interaction ID.
      operationId: get_conversation_items
      parameters:
        - name: account_id
          in: path
          description: Account ID
          required: true
          schema:
            type: string
            format: uuid
        - name: conversation_id
          in: path
          description: Conversation ID
          required: true
          schema:
            type: string
            format: uuid
        - name: interaction_id
          in: query
          description: Optional interaction ID filter
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Conversation items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationItem"
        "404":
          description: Account not found
        "410":
          description: Conversation content redacted after the retention window; body carries the retained non-PII metadata (redacted, created, ended, ai_resolution_status, feedback_status)
      security:
        - X-CM-SSO-ACCOUNTGUID: []
        - {}
  /analytics/v2/accounts/{account_id}/conversations/{conversation_id}/recording:
    get:
      tags:
        - Conversations
      description: |-
        Download the voice call recording of a conversation as `audio/ogg`.

        Required permission: `HALO.Analytics_Conversations_Read`
      operationId: get_conversation_recording
      parameters:
        - name: account_id
          in: path
          description: The account ID
          required: true
          schema:
            type: string
            format: uuid
        - name: conversation_id
          in: path
          description: The conversation ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Voice call recording
          content:
            audio/ogg: {}
        "404":
          description: Conversation or recording not found
        "410":
          description: Conversation content redacted after the retention window
      security:
        - X-CM-SSO-ACCOUNTGUID: []
        - {}
components:
  schemas:
    Actor:
      oneOf:
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - msc_user
        - type: object
          required:
            - type
          properties:
            name:
              type:
                - string
                - "null"
            type:
              type: string
              enum:
                - msc_agent
        - type: object
          required:
            - id
            - name
            - type
          properties:
            id:
              type: string
            name:
              type: string
            type:
              type: string
              enum:
                - teams
      description: |-
        Identifies the specific participant who authored a `User` or `Assistant`
        conversation item, for conversations with more than one distinct actor
        on that role (e.g. MSC's end-user/agent distinction, or a Teams channel
        thread). Absent when the item's role alone identifies the author.

        Serializes as a tagged object (`{"type": "msc_user"}`, `{"type": "teams", ...}`,
        etc). Deserialization additionally accepts the bare strings `"End_User"` /
        `"Customer_Service_Agent"` for `MscUser` / `MscAgent { name: None }` — MSC's
        legacy `/instruction` and `/suggestion` endpoints have sent exactly those two
        string values on the wire for years, so reading that shape can't be dropped.
        Nothing produces it anymore; it's accepted, not emitted.
    AdditionalProperties:
      oneOf:
        - type: boolean
        - $ref: "#/components/schemas/JsonSchema"
    AgentAnswerResult:
      type: object
      required:
        - temperature
        - top_p
        - tools
        - tool_choice_required
        - formatting_options
        - agent_prompt
      properties:
        agent_prompt:
          type: string
        content:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/ContentPart"
        formatting_options:
          type: array
          items:
            $ref: "#/components/schemas/FormattingOption"
        model:
          type:
            - string
            - "null"
        request_type:
          type: string
        temperature:
          type: number
          format: double
        tool_choice_required:
          type: boolean
        tool_uses:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/ToolUse"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/ToolOption"
        top_p:
          type: number
          format: double
        usage:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/UsageDetails"
    AgentHandoverDetails:
      type: object
      description: Agent handover details
      required:
        - stop_status
      properties:
        from_agent_name:
          type:
            - string
            - "null"
        from_agent_version_id:
          type:
            - integer
            - "null"
          format: int32
        reasoning:
          type:
            - string
            - "null"
        stop_status:
          $ref: "#/components/schemas/AgentInteractionState"
        to_agent_name:
          type:
            - string
            - "null"
        to_agent_version_id:
          type:
            - integer
            - "null"
          format: int32
    AgentInteractionState:
      type: string
      description: Agent interaction state
      enum:
        - active
        - completed
        - breakout
        - handover
    AgentResult:
      type: object
      description: Agent execution result
      properties:
        agent_id:
          type:
            - integer
            - "null"
          format: int64
        agent_name:
          type:
            - string
            - "null"
        agent_version_id:
          type:
            - integer
            - "null"
          format: int64
        handover_reasoning:
          type:
            - string
            - "null"
        tool_results:
          type: array
          items:
            $ref: "#/components/schemas/ToolResult"
        tool_uses:
          type: array
          items:
            $ref: "#/components/schemas/ToolUse"
    AgenticParkPayload:
      type: object
      description: Park payload for agentic activity
      properties:
        agent_response:
          type:
            - string
            - "null"
          description: Agent's response to show the user
        conversation_id:
          type:
            - string
            - "null"
          format: uuid
          description: Conversation ID for continuing multi-turn conversations
        dialog_options:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/ConversationOption"
          description: Selectable buttons to show alongside the response
        image_carousel:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/CarouselResponse"
              description: Image carousel to show alongside the response
    AgenticPromptInjectionResult:
      type: object
      required:
        - input
        - staged_output
        - agent_instructions
        - is_safe
        - reasoning
      properties:
        agent_instructions:
          type: string
        input:
          type: string
        is_safe:
          type: boolean
        reasoning:
          type: string
        request_type:
          type: string
        staged_output:
          type: string
        usage:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/UsageDetails"
    AgenticUnparkPayload:
      type: object
      description: Unpark payload for agentic activity - user continues conversation via orchestrator
      required:
        - query
      properties:
        query:
          $ref: "#/components/schemas/UserResponse"
          description: User's query to continue the conversation
    AiCloudItemMeta:
      type: object
      description: AI Cloud-specific metadata for a conversation message
      required:
        - customer_key
        - project_key
        - culture
      properties:
        article_ids:
          type:
            - array
            - "null"
          items:
            type: string
        context_variables: {}
        conversation_variables: {}
        culture:
          type: string
        customer_key:
          type: string
        entity_matches: {}
        intent_info: {}
        is_fallback:
          type:
            - boolean
            - "null"
        main_interaction_type:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/MainInteractionType"
        pages:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Pages"
        project_key:
          type: string
        recognition_quality:
          type:
            - number
            - "null"
          format: double
        recognition_type:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/RecognitionType"
        stop_words: {}
        translation:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/TranslationDetails"
    AiCloudMessage:
      allOf:
        - type: object
          description: Base fields shared by all message types
          properties:
            actor:
              oneOf:
                - type: "null"
                - $ref: "#/components/schemas/Actor"
                  description: The participant who authored this item, when the role alone is ambiguous.
            content:
              type:
                - array
                - "null"
              items:
                $ref: "#/components/schemas/MessageContentPart"
            interaction_id:
              type:
                - string
                - "null"
              format: uuid
            is_message_before_halo:
              type: boolean
            timestamp:
              type:
                - string
                - "null"
              format: date-time
              description: |-
                Time at which the conversation item was first produced. Legacy items
                without valid initialization metadata fall back to their logging time.
        - type: object
          properties:
            aicloud_meta:
              oneOf:
                - type: "null"
                - $ref: "#/components/schemas/AiCloudItemMeta"
            tool_results:
              type: array
              items:
                $ref: "#/components/schemas/ToolResult"
            tool_uses:
              type: array
              items:
                $ref: "#/components/schemas/ToolUse"
      description: AI Cloud message
    AnswerStyleResult:
      type: object
      required:
        - original_answer
        - language
      properties:
        language:
          type: string
        original_answer:
          type: string
        request_type:
          type: string
        rewritten_answer:
          type:
            - string
            - "null"
        usage:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/UsageDetails"
    AssistantConversationItem:
      type: object
      required:
        - content
      properties:
        actor:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Actor"
        content:
          type: array
          items:
            $ref: "#/components/schemas/ContentPart"
        id:
          type:
            - string
            - "null"
        meta:
          $ref: "#/components/schemas/AssistantConversationItemMeta"
        name:
          type:
            - string
            - "null"
        parent_tool_use_id:
          type:
            - string
            - "null"
        tool_uses:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/ToolUse"
    AssistantConversationItemMeta:
      type: object
      properties:
        answering_agent_id:
          type:
            - integer
            - "null"
          format: int32
        audio_interrupted_ms:
          type:
            - integer
            - "null"
          format: int32
          minimum: 0
        contexts:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Contexts"
        conversation_ended_delay:
          type:
            - integer
            - "null"
          format: int64
        feedback_reasoning:
          type:
            - string
            - "null"
        generation_duration_ms:
          type:
            - integer
            - "null"
          format: int32
        initialized:
          type:
            - string
            - "null"
        language:
          type:
            - string
            - "null"
        match:
          type:
            - boolean
            - "null"
        model_results:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/ModelResult"
        origin:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/RequestOrigin"
        provider:
          type:
            - string
            - "null"
        rank:
          type:
            - integer
            - "null"
          format: int32
        reasoning:
          type:
            - string
            - "null"
        reasoning_summary:
          type:
            - string
            - "null"
          description: |-
            A reasoning model's concise summary of its own chain-of-thought (e.g.
            OpenAI Responses API `reasoning.summary`), surfaced for observability.
            Deliberately separate from `reasoning`, which elsewhere in the
            orchestrator/analytics stack means why the system took an action
            (fallback trigger, classification, guardrail) — conflating the two
            would surface a model's internal thinking where a business-logic
            rationale is expected.
        tokens:
          type:
            - integer
            - "null"
          format: int32
        used_feedback:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/Feedback"
        used_knowledge:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/Knowledge"
        used_media:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/MediaContentPart"
    AssistantMessage:
      allOf:
        - type: object
          description: Base fields shared by all message types
          properties:
            actor:
              oneOf:
                - type: "null"
                - $ref: "#/components/schemas/Actor"
                  description: The participant who authored this item, when the role alone is ambiguous.
            content:
              type:
                - array
                - "null"
              items:
                $ref: "#/components/schemas/MessageContentPart"
            interaction_id:
              type:
                - string
                - "null"
              format: uuid
            is_message_before_halo:
              type: boolean
            timestamp:
              type:
                - string
                - "null"
              format: date-time
              description: |-
                Time at which the conversation item was first produced. Legacy items
                without valid initialization metadata fall back to their logging time.
        - type: object
          properties:
            aicloud_meta:
              oneOf:
                - type: "null"
                - $ref: "#/components/schemas/AiCloudItemMeta"
            source:
              type:
                - string
                - "null"
      description: Generic assistant message
    BasicPromptInjectionResult:
      type: object
      required:
        - input
        - is_safe
        - reasoning
      properties:
        input:
          type: string
        is_safe:
          type: boolean
        reasoning:
          type: string
        request_type:
          type: string
        usage:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/UsageDetails"
    CandidateChunk:
      type: object
      description: Candidate chunk for RAG refiner/selector
      required:
        - content
      properties:
        content:
          type: string
        distance:
          type: number
          format: double
        id:
          type: integer
          format: int64
    CarouselItem:
      type: object
      required:
        - image_src
        - image_alt
      properties:
        buttons:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/CarouselItemButton"
        description:
          type:
            - string
            - "null"
        image_alt:
          type: string
        image_src:
          type: string
        title:
          type:
            - string
            - "null"
        url:
          type:
            - string
            - "null"
    CarouselItemButton:
      type: object
      required:
        - text
        - value
      properties:
        text:
          type: string
        value:
          type: string
    CarouselResponse:
      type: object
      properties:
        carousel:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/CarouselItem"
    ClassifyInstructionResult:
      type: object
      required:
        - input
        - is_instruction
      properties:
        input:
          type: string
        is_instruction:
          type: boolean
        request_type:
          type: string
        usage:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/UsageDetails"
    ContentPart:
      oneOf:
        - type: object
          required:
            - text
            - type
          properties:
            text:
              type: string
            type:
              type: string
              enum:
                - text
        - type: object
          required:
            - text
            - type
          properties:
            redacted:
              type: boolean
            signature:
              type:
                - string
                - "null"
            text:
              type: string
            type:
              type: string
              enum:
                - thinking
        - type: object
          required:
            - json_value
            - type
          properties:
            json_value:
              $ref: "#/components/schemas/Value"
            type:
              type: string
              enum:
                - json
        - allOf:
