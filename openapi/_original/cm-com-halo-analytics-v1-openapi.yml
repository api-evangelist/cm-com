              description: The product source where the feedback was submitted
        profile_id:
          type:
            - integer
            - "null"
          format: int32
          description: The profile ID associated with this feedback (optional)
        score:
          type: integer
          format: int32
          description: The feedback score (0-4 range, will be normalized to 1-5 for storage)
