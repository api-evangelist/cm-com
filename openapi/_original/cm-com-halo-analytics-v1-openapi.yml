          properties:
            actor:
              oneOf:
                - type: "null"
                - $ref: "#/components/schemas/Actor"
                  description: The participant who authored this item, when the role alone is ambiguous.
            content:
              type:
                - array
                - "null"
              items:
                $ref: "#/components/schemas/MessageContentPart"
            interaction_id:
              type:
                - string
                - "null"
              format: uuid
            is_message_before_halo:
              type: boolean
            timestamp:
              type:
                - string
                - "null"
              format: date-time
              description: |-
                Time at which the conversation item was first produced. Legacy items
                without valid initialization metadata fall back to their logging time.
        - type: object
          required:
            - is_safe
            - do_not_answer
          properties:
            custom_guardrail_results:
              type:
                - array
                - "null"
              items:
                $ref: "#/components/schemas/CustomGuardrailResult"
            do_not_answer:
              type: boolean
            is_recognized:
              type:
                - boolean
                - "null"
            is_safe:
              type: boolean
      description: User message
    UserResponse:
      oneOf:
        - type: string
        - $ref: "#/components/schemas/MediaContentPart"
        - type: array
          items:
            $ref: "#/components/schemas/ContentPart"
          description: |-
            Mixed content (e.g. user replied with both text and an image).
            Carries the full ordered list of content parts so the agentic LLM
            can reason over both the text query and the media together.
      description: User response in an unpark payload`.
    Value: {}
    VisitedAgent:
      type: object
      description: Agent info for visited agents
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    VisitedTool:
      type: object
      description: Tool info for visited tools
      required:
        - id
        - name
      properties:
        description:
          type:
            - string
            - "null"
        id:
          type: integer
          format: int64
        name:
          type: string
    VoiceCustomHandoverDetails:
      type: object
      description: Voice custom handover details
      required:
        - custom_type
        - custom_config
      properties:
        custom_config:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        custom_type:
          type: string
    VoiceForwardHandoverDetails:
      type: object
      description: Voice forward handover details
      required:
        - callee_id
      properties:
        anonymous:
          type:
            - boolean
            - "null"
        callee_id:
          type: string
        caller_id:
          type:
            - string
            - "null"
    VoiceLoggingHandoverDetails:
      type: object
      description: Voice logging handover details
    VoiceMscHandoverDetails:
      type: object
      description: Voice MSC handover details
      required:
        - environment
        - web_store_referrer
        - routing_keywords
      properties:
        environment:
          type: string
        routing_keywords:
          type: array
          items:
            type: string
        web_store_referrer:
          type: string
    VoiceTransferHandoverDetails:
      type: object
      description: Voice transfer handover details
      required:
        - distribution_group
        - distribution_group_algorithm
      properties:
        cm_context_variables:
          type:
            - object
            - "null"
          additionalProperties: {}
          propertyNames:
            type: string
        distribution_group:
          type: string
        distribution_group_algorithm:
          type: integer
          format: int32
    i32:
      type: integer
      format: int32
    i64:
      type: integer
      format: int64
  securitySchemes:
    X-CM-SSO-ACCOUNTGUID:
      type: apiKey
      in: header
      name: X-CM-SSO-ACCOUNTGUID
