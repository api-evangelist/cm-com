components:
  schemas:
    ApiDistributionGroup:
      title: Distribution Group
      type: object
      properties:
        guid:
          type: string
          description: Unique identifier of the Distribution Group.
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        name:
          maxLength: 128
          type: string
          description: Name of the Distribution Group.
          nullable: true
          example: My Distribution Group
        createdOn:
          type: string
          description: Date and time the Distribution Group was created.
          format: date-time
          example: '2022-01-01T00:00:00.000Z'
        updatedOn:
          type: string
          description: Date and time the Distribution Group was last updated.
          format: date-time
          example: '2022-01-01T00:00:00.000Z'
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/ApiEndpoint'
          description: List of linked Distribution Group Endpoints.
          nullable: true
      additionalProperties: false
      description: A Distribution Group is a collection of Endpoints that can be grouped together.
    ApiEndpoint:
      title: Endpoint
      type: object
      properties:
        guid:
          type: string
          description: Unique identifier of the Endpoint.
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        name:
          type: string
          description: Name of the Endpoint.
          nullable: true
          example: My Endpoint
        ipAddress:
          type: string
          description: External IP address of the Endpoint.
          nullable: true
          example: 0.0.0.0
        port:
          type: integer
          description: 'The port to be configured that is supported by CM. Supported ports: 5060-5100.'
          format: int32
          example: 5060
        priority:
          minimum: 1
          type: integer
          description: Determines the Round-Robin order of the endpoint. Each endpoint inside a Distribution Group must have a unique priority.
          format: int32
          example: 1
        isActive:
          type: boolean
          description: Determines whether the Endpoint should be active or not.
          example: true
        tlsEnabled:
          type: boolean
          description: Determines whether this endpoint receives SIP traffic via TLS.
        attributes:
          type: object
          additionalProperties:
            type: string
            nullable: true
          description: "Key/Value Pairs of attributes configured to an Endpoint.\r\nAttributes are extra settings that can be configured to an Endpoint, for example: media encryption.\r\n            \r\nExample:\r\n{\r\n    \"medianenc\": \"SRTP\"\r\n}"
          nullable: true
      additionalProperties: false
      description: Endpoint of a Distribution Group where calls can be routed to.
    DistributionGroupQuery:
      title: Distribution Group Query
      type: object
      properties:
        skip:
          maximum: 2147483647
          minimum: 0
          type: integer
          description: Amount of items being skipped.
          format: int32
          nullable: true
          example: 0
        take:
          maximum: 200
          minimum: 0
          type: integer
          description: Amount of items being retrieved.
          format: int32
          nullable: true
          example: 50
        searchQuery:
          type: string
          description: Search for Distribution Group name.
          nullable: true
      additionalProperties: false
      description: Details of a distribution group endpoint.
    Error:
      title: Error
      type: object
      properties:
        code:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
      additionalProperties: false
    ErrorCollection:
      title: Error Collection
      type: object
      properties:
        requestId:
          type: string
          nullable: true
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
          nullable: true
      additionalProperties: false
  securitySchemes:
    X-CM-PRODUCTTOKEN:
      type: apiKey
      description: Your producttoken
      name: X-CM-PRODUCTTOKEN
      in: header
security:
- X-CM-PRODUCTTOKEN: []
