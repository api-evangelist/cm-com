      type: object
      properties:
        uuid:
          type: string
          maxLength: 36
          example: 00000000-0000-0000-0000-000000000000
        externalId:
          type: string
          maxLength: 255
          example: 00000000-0000-0000-0000-000000000000
        barcode:
          type: string
          maxLength: 255
          example: CMLQFLGRPA
