openapi: 3.1.1
info:
  title: Payments Gateway API
  description: Common payments API
  version: 1.27.22
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /api/v1
security:
  - oAuth2ClientCredentials: []
tags:
  - name: Authorization
    description: OAuth2.0 Authorization Framework
    externalDocs:
      url: https://tools.ietf.org/html/rfc6749#section-4.4.2
  - name: Checkout
    description: Checkout endpoints for using the CM hosted checkout.
    externalDocs:
      url: https://developers.cm.com/payments-platform
  - name: Bancontact
    description: Bancontact is a popular payment method in Belgium, allowing customers to pay online using their Bancontact card.
    externalDocs:
      url: https://www.bancontact.com/en
  - name: Cards
    description: Creditcard payments allow customers to pay online using their credit or debit cards.
    externalDocs:
      url: https://www.visa.com/ and https://www.mastercard.com/
  - name: iDEAL
    description: iDEAL is a widely used online payment method in the Netherlands, allowing customers to pay directly from their bank accounts.
    externalDocs:
      url: https://www.ideal.nl/en/
  - name: iDEAL-QR
    description: iDEAL-QR codes can be used to initiate a predefined iDEAL transaction by scanning the QR-code by a Consumer mobile device.
    externalDocs:
      url: https://www.ideal.nl/en/
  - name: in3
    description: in3 is a Dutch BNPL method where customers pay in 3 installments, at no extra cost and without having to register with the Bureau Krediet Registratie (BKR). in3 guarantees settlement after receiving the first installment.
    externalDocs:
      url: https://payin3.eu/
  - name: Klarna
    description: Klarna is a payment method that allows customers to pay for their purchases later, either in installments or at a later date.
    externalDocs:
      url: https://www.klarna.com/
  - name: Paymentmethods
    description: Payment methods available in the API.
  - name: PayPal
    description: PayPal is a widely used online payment system that allows customers to pay for goods and services using their PayPal account.
    externalDocs:
      url: https://www.paypal.com/
  - name: Riverty
    description: Riverty is a payment method that allows customers to pay for their purchases in installments or at a later date.
    externalDocs:
      url: https://docs.riverty.com/bnpl
  - name: ApplePay
    description: Apple Pay is a mobile payment and digital wallet service that allows customers to make secure, contactless payments in stores (using NFC), within iOS apps, and on the web.
    externalDocs:
      url: https://www.apple.com/apple-pay/
  - name: GooglePay
    description: Google Pay is a fast and secure payment method that allows customers to pay online using their Google account.
    externalDocs:
      url: https://developers.google.com/pay/api/web/overview
  - name: BelfiusPayButton
    description: Belfius Pay Button is a Belgian online payment method that allows customers to pay securely using their Belfius bank account.
    externalDocs:
      url: https://www.belfius.be/
  - name: SepaDirectDebit
    description: SEPA Direct Debit allows merchants to collect payments directly from customer bank accounts within the SEPA zone.
    externalDocs:
      url: https://www.europeanpaymentscouncil.eu/
  - name: BankTransfer
    description: Bank Transfer payment method allows customers to pay by transferring funds directly from their bank account.
  - name: Utils
    description: Utility endpoints for health checks and other functionalities.
paths:
  /authorization/oauth2/token:
    post:
      tags:
        - Authorization
      summary: Obtain access token using OAuth 2.0.
      externalDocs:
        description: RFC 6749 - The OAuth2.0 Authorization Framework
        url: https://tools.ietf.org/html/rfc6749#section-4.4.2
      operationId: obtainAccessTokenViaClientCredentialsGrant
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - client_id
                - client_secret
                - grant_type
              properties:
                client_id:
                  description: Client id that was provided for authentication
                  type: string
                  example: 904c5037ad72ec1d1d99a5d14e04d7e0
                client_secret:
                  description: Client secret that was provided for authentication
                  type: string
                  example: 543d8f8b5d6b4c6a8643bbf9a3ba0682
                grant_type:
                  description: Authorization grant type. The only supported value is `client_credentials`.
                  type: string
                  enum:
                    - client_credentials
                  example: client_credentials
      responses:
        '200':
          description: |-
            Successful Response.
            [The OAuth2.0 Authorization Framework - 5.1. Successful Response](https://tools.ietf.org/html/rfc6749#section-5.1)
            The authorization server issues an access token and optional refresh token, and constructs the response by adding the following parameters to the entity-body of the HTTP response with a 200 (OK) status code.
          content:
            application/json:
              schema:
                title: Token
                description: |-
                  Access Token
                  [The OAuth2.0 Authorization Framework - 1.4. Access Token](https://tools.ietf.org/html/rfc6749#section-1.4)
                  Access tokens are credentials used to access protected resources.  An access token is a string representing an authorization issued to the client.  The string is usually opaque to the client.  Tokens represent specific scopes and durations of access, granted by the resource owner, and enforced by the resource server and authorization server.
                type: object
                required:
                  - access_token
                  - token_type
                properties:
                  access_token:
                    description: The access token issued by the authorization server.
                    type: string
                    example: 2YotnFZFEjr1zCsicMWpAA
                  token_type:
                    description: The type of the token issued as described in [Section 7.1](https://tools.ietf.org/html/rfc6749#section-7.1).  Value is case insensitive.
                    type: string
                    example: Bearer
                  expires_in:
                    description: The lifetime in seconds of the access token.  For example, the value "3600" denotes that the access token will expire in one hour from the time the response was generated. If omitted, the authorization server SHOULD provide the expiration time via other means or document the default value.
                    type: integer
                    example: 3600
        4XX:
          description: |-
            Error Response.
            [The OAuth2.0 Authorization Framework - 5.2. Error Response](https://tools.ietf.org/html/rfc6749#section-5.2)
            The authorization server responds with an HTTP 400 (Bad Request) status code (unless specified otherwise) and includes the following parameters with the response.
            Values for the "error" parameter **MUST NOT** include characters outside the set %x20-21 / %x23-5B / %x5D-7E.
          content:
            application/json:
              schema:
                title: TokenError
                description: '[The OAuth2.0 Authorization Framework - 5.2. Error Response](https://tools.ietf.org/html/rfc6749#section-5.2)'
                type: object
                required:
                  - error
                properties:
                  error:
                    description: |-
                      A single ASCII [[USASCII](https://tools.ietf.org/html/rfc6749#ref-USASCII)] error code from the following:
                      | Error Code| Description |
                      |-----------|-------------|
                      | invalid_request | The request is missing a required parameter, includes an unsupported parameter value (other than grant type), repeats a parameter, includes multiple credentials, utilizes more than one mechanism for authenticating the client, or is otherwise malformed. |
                      | invalid_client | Client authentication failed (e.g., unknown client, no client authentication included, or unsupported authentication method).  The authorization server MAY return an HTTP 401 (Unauthorized) status code to indicate which HTTP authentication schemes are supported.  If the client attempted to authenticate via the "Authorization" request header field, the authorization server MUST respond with an HTTP 401 (Unauthorized) status code and include the "WWW-Authenticate" response header field matching the authentication scheme used by the client. |
                      | invalid_grant | The provided authorization grant (e.g., authorization code, resource owner credentials) or refresh token is invalid, expired, revoked, does not match the redirection URI used in the authorization request, or was issued to another client. |
                      | unauthorized_client | The authenticated client is not authorized to use this authorization grant type. |
                      | unsupported_grant_type | The authorization grant type is not supported by the authorization server. |
                      | invalid_scope | The requested scope is invalid, unknown, malformed, or exceeds the scope granted by the resource owner. |
                    type: string
                    enum:
                      - invalid_request
                      - invalid_client
                      - invalid_grant
                      - unauthorized_client
                      - unsupported_grant_type
                      - invalid_scope
                    example: invalid_client
                  error_description:
                    description: Human-readable ASCII [[USASCII](https://tools.ietf.org/html/rfc6749#ref-USASCII)] text providing additional information, used to assist the client developer in understanding the error that occurred.
                    type: string
                    example: Client authentication failed
                  error_uri:
                    description: A URI identifying a human-readable web page with information about the error, used to provide the client developer with additional information about the error.
                    type: string
                    example: http://example.test/client_authentication_failed.html
      security: []
  /paymentmethods:
    get:
      summary: Get an array of all available payment methods.
      description: |-
        Receive a list of all available payments which can be rendered in your checkout. 

        Note: this list is **not** context aware and is only a list of your activated payment methods.
      tags:
        - Paymentmethods
      operationId: getPaymentMethods
      responses:
        '200':
          description: List of available payment methods for the authenticated merchant.
          headers:
            Digest:
              $ref: '#/components/headers/Digest'
          content:
            application/json:
              schema:
                type: array
                minItems: 0
                items:
                  type: string
                example:
                  - bancontact
                  - creditcard
                  - ideal
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/bancontact/v1/transactions:
    post:
      operationId: createBancontactTransaction
      description: |-
        Create a new Bancontact transaction (order), that can be paid later with card details or via QR code / Intent URL.
        The **id** field in the response can be used in future calls as **transactionId** to reference this transaction.
      tags:
        - Bancontact
      summary: Create transaction
      requestBody:
        description: Create Bancontact Transaction
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BancontactPayment'
      responses:
        '201':
          description: |-
            The bancontact transaction was created successfully. 

            To handle the payment further one could:
            - On mobile devices redirect the user to the intent URL provided in the response.
            - On desktop devices display the QR code provided in the response.
            - If the user is not able to use the intent URL or QR code, they can continue by entering their card data manually.
          headers:
            Digest:
              $ref: '#/components/headers/Digest'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BanContactTransaction'
              examples:
                openBancontact:
                  $ref: '#/components/examples/openBancontact'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/bancontact/v1/transactions/{transactionId}/start:
    post:
      operationId: startBancontactCardPayment
      description: |-
        Start a Bancontact Card payment transaction. Use the **id** field from the former made create transaction response.

        This endpoint is used to start a Bancontact payment with card details that are encrypted using the CSE library.

        The `encryptedCardDetails` object must be created using the CSE library, which is available at `/paymentmethods/library/cse`.
        The `browserInformation` object is required to provide information about the consumer's browser.

        If the user is not able to use the intent URL or QR code, they can continue by entering their card data manually.
      summary: Start payment with encrypted card details
      tags:
        - Bancontact
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      requestBody:
        description: Start Bancontact Card transaction with encrypted card details
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BancontactCardPayment'
      responses:
        '201':
          description: |-
            The Bancontact Card transaction was started successfully. 

            The response contains the transaction details and a redirect URL to which the consumer needs to be redirected.
          headers:
            Digest:
              $ref: '#/components/headers/Digest'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BancontactStartTransaction'
              examples:
                openBancontact:
                  $ref: '#/components/examples/openBancontactCard'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/bancontact/v1/transactions/{transactionId}:
    get:
      operationId: getBancontactTransaction
      description: Retrieve details for an existing Bancontact transaction, either created in the API directly or through a Bancontact QR-code. This endpoint must be used to obtain the status for a transaction.
      tags:
        - Bancontact
      summary: Fetch transaction
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: Returns the transaction details for the Bancontact transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BanContactFetchTransaction'
              examples:
                openBancontact:
                  $ref: '#/components/examples/openBancontact'
                successBancontact:
                  $ref: '#/components/examples/successBancontact'
                cancelledBancontact:
                  $ref: '#/components/examples/cancelledBancontact'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/bancontact/v1/transactions/{transactionId}/payments/{paymentId}/refunds:
    post:
      description: |-
        Create a refund for an existing Bancontact payment.

        The **paymentId** parameter can be obtained from:
        - The `id` field in the response of the "Start payment with encrypted card details" endpoint.
        - The `payment` field in the webhook payload sent when the payment was made via QR code or intent URL.

        The **amount** field is required and must be a positive value, which is the amount to be refunded.
      tags:
        - Bancontact
      summary: Create refund for payment
      operationId: createBancontactPaymentRefund
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/PaymentId'
      requestBody:
        description: Create Bancontact Payment Refund
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refund'
      responses:
        '201':
          description: The Bancontact payment refund was created successfully. The response contains the refund details.
          headers:
            Digest:
              $ref: '#/components/headers/Digest'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BanContactFetchTransaction'
              examples:
                successBancontactRefund:
                  $ref: '#/components/examples/successBancontactRefund'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
    get:
      description: Retrieve refunds for an existing Bancontact payment.
      tags:
        - Bancontact
      operationId: getBancontactRefunds
      summary: Fetch payment refunds
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Details of all refunds belonging to a Bancontact payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BancontactRefundsResponse'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/bancontact/v1/transactions/{transactionId}/payments/{paymentId}/chargebacks:
    get:
      description: Retrieve chargebacks for an existing Bancontact payment.
      tags:
        - Bancontact
      operationId: getBancontactChargebacks
      summary: Fetch payment chargebacks
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Details of all chargebacks belonging to a Bancontact payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BancontactChargebacksResponse'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/bancontact/v1/transactions/{transactionId}/refunds:
    post:
      deprecated: true
      description: |-
        **This endpoint is deprecated and will be removed in a future release. Please use the payment refunds endpoint
        instead, indicating the specific payment to be refunded.**

        Create a refund for an existing Bancontact transaction. The **transactionId** parameter must be the ID of the
        transaction to be refunded.

        The **amount** field is required and must be a positive value, which is the amount to be refunded.
      tags:
        - Bancontact
      summary: Create refund
      operationId: createBancontactRefund
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      requestBody:
        description: Create Bancontact Refund
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refund'
      responses:
        '201':
          description: The Bancontact refund was created successfully. The response contains the refund details.
          headers:
            Digest:
              $ref: '#/components/headers/Digest'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BanContactFetchTransaction'
              examples:
                successBancontactRefund:
                  $ref: '#/components/examples/successBancontactRefund'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
    get:
      deprecated: true
      tags:
        - Bancontact
      operationId: getBancontactRefundsDeprecated
      summary: Fetch refunds
      description: |-
        **This endpoint is deprecated and will be removed in a future release. Please use the get payment refunds
        endpoint instead, indicating the specific payment for which you wish to list the refunds.**

        Retrieve refunds for an existing Bancontact transaction.
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          $ref: '#/components/responses/RefundsResponse'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/bancontact/v1/transactions/{transactionId}/payments:
    get:
      tags:
        - Bancontact
      operationId: getBancontactTransactionPayments
      description: Retrieve a paginated list of payments for an existing BanContact transaction (order).
      summary: Fetch payments
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - name: pageSize
          in: query
          schema:
            $ref: '#/components/schemas/PaymentPageSize'
        - name: after
          in: query
          schema:
            $ref: '#/components/schemas/After'
      responses:
        '200':
          description: Paginated list of payments for a BanContact transaction was returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BancontactPaymentsPaginated'
              examples:
                bancontactTransactionPayments:
                  $ref: '#/components/examples/bancontactTransactionPaymentsPaginated'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/google-pay/v1/sessions:
    post:
      description: |-
        Create/initialize a Google Pay session. Returns a details object containing configuration needed to render the Google Pay button on the checkout UI.
        The **id** field in the response can be used in future calls as **sessionId** to reference this session.
      tags:
        - GooglePay
      summary: Create/initialize Google Pay session
      operationId: createGooglePaySession
      requestBody:
        description: Create Google Pay Session
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GooglePayInitialize'
            examples:
              createGooglePaySession:
                $ref: '#/components/examples/createGooglePaySession'
      responses:
        '201':
          $ref: '#/components/responses/GooglePaySession'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/google-pay/v1/sessions/{sessionId}:
    get:
      description: Retrieve details for an existing Google Pay session. This endpoint must be used to obtain the status for a session.
      tags:
        - GooglePay
      summary: Fetch Google Pay session
      operationId: getGooglePaySession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/GooglePaySession'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/google-pay/v1/sessions/{sessionId}/transactions:
    post:
      description: |-
        Authorize a transaction for an existing Google Pay session. When the shopper selected a card, the details are returned as payment data by the Google Pay client. The paymentData.paymentMethodData must be sent here as-is.

        This endpoint creates the actual transaction for the session. A `TRANSACTION_CREATED` webhook will be triggered if subscribed.
      tags:
        - GooglePay
      summary: Authorize Google Pay transaction
      operationId: createGooglePaySessionTransaction
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        description: Authorize Google Pay Transaction
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeGooglePayTransaction'
            examples:
              authorizeGooglePay:
                $ref: '#/components/examples/authorizeGooglePay'
      responses:
        '201':
          $ref: '#/components/responses/GooglePaySessionTransaction'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
    get:
      description: Retrieve all transactions for an existing Google Pay session.
      tags:
        - GooglePay
      summary: Fetch Google Pay session transactions
      operationId: getGooglePaySessionTransactions
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/GooglePaySessionTransactions'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/google-pay/v1/sessions/{sessionId}/transactions/{transactionId}:
    get:
      description: Retrieve a specific transaction for an existing Google Pay session.
      tags:
        - GooglePay
      summary: Fetch Google Pay session transaction
      operationId: getGooglePaySessionTransaction
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          $ref: '#/components/responses/GooglePaySessionTransaction'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/google-pay/v1/sessions/{sessionId}/transactions/{transactionId}/refunds:
    post:
      description: |-
        Create a refund for an existing Google Pay transaction.

        The **transactionId** parameter can be obtained from the `payment` field in the webhook payload sent when the transaction was created.

        The **amount** field is required and must be a positive value, which is the amount to be refunded.
      tags:
        - GooglePay
      summary: Create refund for transaction
      operationId: createGooglePaySessionTransactionRefund
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/TransactionId'
      requestBody:
        description: Create Google Pay Transaction Refund
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refund'
      responses:
        '201':
          $ref: '#/components/responses/RefundResponseWithSessionID'
          description: GooglePay refund was created successfully.
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
    get:
      description: Retrieve refunds for an existing Google Pay transaction of a session.
      tags:
        - GooglePay
      operationId: getGooglePaySessionTransactionRefunds
      summary: Fetch transaction refunds
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          $ref: '#/components/responses/RefundsResponseWithSessionID'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/creditcard/v1/transactions:
    post:
      operationId: createCardTransaction
      description: Create a new Credit Card payment transaction. After receiving a HTTP status 201 you have to redirect the consumer to the url given in **action.redirect.url**. The **id** field in the response can be used in future calls as **transactionId** to reference this transaction (for instance in a refund).
      tags:
        - Cards
      summary: Create payment
      requestBody:
        description: Create Card Transaction
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardPayment'
            examples:
              standard:
                $ref: '#/components/examples/standard'
      responses:
        '201':
          description: Cards transaction details
          headers:
            Digest:
              $ref: '#/components/headers/Digest'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCardTransaction'
              examples:
                open:
                  $ref: '#/components/examples/openCard'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/creditcard/v1/transactions/{transactionId}:
    get:
      operationId: getCardTransaction
      description: Retrieve details for an existing Credit Card transaction. This endpoint must be used to obtain the status for a transaction.
      tags:
        - Cards
      summary: Fetch payment
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: 'The Card transaction was created successfully. The response contains the transaction details and a redirect URL to complete the payment.description: The user input was incorrect or something illegal was attempted (eg. using a service without having that service configured for the user, or not being authorized)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCardTransaction'
              examples:
                open:
                  $ref: '#/components/examples/openCard'
                success:
                  $ref: '#/components/examples/successCard'
                refund:
                  $ref: '#/components/examples/refundCard'
        4XX:
          $ref: '#/components/responses/UserError'
