                            - NotSet
                            - ParcelLocker
                            - ServicePoint
                            - NeighbourhoodPoint
                            - CarrierDepot
                          example: ParcelLocker
                        name:
                          type: string
                          description: Name of the pickup point
                          maxLength: 255
