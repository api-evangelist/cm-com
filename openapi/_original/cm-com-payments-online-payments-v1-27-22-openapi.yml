            productUrl:
              type: string
              description: URL to the product page
              format: url
              example: https://example.com/product-page
    RivertyItems:
      description: Array of order items. Maximum allowed 500 items.
      type: array
      minItems: 1
      maxItems: 500
      items:
        $ref: '#/components/schemas/RivertyItem'
    RivertyWebhooks:
      allOf:
        - $ref: '#/components/schemas/BaseWebhook'
        - type: object
          properties:
            events:
              items:
                description: |
                  * `STATUS_CHANGE` - Triggered when the status of a transaction changes.
                allOf:
                  - $ref: '#/components/schemas/StatusChangeEvent'
                example: STATUS_CHANGE
    RivertyPayment:
      allOf:
        - $ref: '#/components/schemas/PaymentWithoutDescriptionExpiresAtAndWebhooks'
        - type: object
          required:
            - orderNumber
            - type
            - netAmount
            - consumer
            - items
          properties:
            orderNumber:
              description: |
                Order number. Unique order number provided by the merchant. A valid order number can include alphanumeric characters, dashes and underscores.
              type: string
              maxLength: 50
              example: order123
            amount:
              $ref: '#/components/schemas/Amount-2'
            currency:
              $ref: '#/components/schemas/Currency-2'
            language:
              description: |
                The language code used for client communication. If not provided, Riverty will default to the language configured for the client.
              format: enum
              enum:
                - 'no'
                - sv
                - fi
                - da
                - en
                - de
                - nl
                - fr
            type:
              type: string
              format: enum
              description: The type of the Riverty payment method.
              enum:
                - Invoice
              example: Invoice
            netAmount:
              $ref: '#/components/schemas/NetAmount'
            merchantImageURL:
              description: |
                Image URL for the merchants brand. This image is shown at the top of the order page in Riverty. Supported image formats are: gif, jpeg (jpg), png, webp.
              type: string
              format: url
              example: https://merchant.tld/images/logo.png
            additionalMerchantData:
              type: string
              maxLength: 4096
              description: |
                Additional information about the merchant Format: Base64 encoded JSON
            consumer:
              $ref: '#/components/schemas/Consumer-3'
            items:
              $ref: '#/components/schemas/RivertyItems'
            webhooks:
              $ref: '#/components/schemas/RivertyWebhooks'
    RivertyTransaction:
      allOf:
        - $ref: '#/components/schemas/PaymentWithoutDescriptionExpiresAtAndWebhooks'
        - type: object
          required:
            - id
            - status
            - orderNumber
            - type
            - netAmount
            - created
            - updated
            - action
          properties:
            id:
              $ref: '#/components/schemas/TransactionId'
            status:
              description: The status of the transaction.
              oneOf:
                - $ref: '#/components/schemas/StatusSuccess'
                - $ref: '#/components/schemas/StatusCancelled'
                - $ref: '#/components/schemas/StatusExpired'
                - $ref: '#/components/schemas/StatusFailure'
                - $ref: '#/components/schemas/StatusPending'
            orderNumber:
              description: Order number. Unique order number provided by the merchant.
              type: string
              maxLength: 50
              example: order123
            type:
              type: string
              format: enum
              description: The type of the Riverty payment method.
              enum:
                - Invoice
              example: Invoice
            netAmount:
              $ref: '#/components/schemas/NetAmount'
            created:
              $ref: '#/components/schemas/Datetime'
              description: ISO 8601 date and time when the transaction was created.
            updated:
              $ref: '#/components/schemas/Datetime'
              description: ISO 8601 date and time when the transaction was last updated.
            merchantImageURL:
              description: |
                Image URL for the merchants brand. This image is shown at the top of the order page in Riverty. Supported image formats are: gif, jpeg (jpg), png, webp.
              type: string
              format: url
              example: https://merchant.tld/images/logo.png
            additionalMerchantData:
              type: string
              maxLength: 4096
              description: 'Additional information about the merchant Format: Base64 encoded JSON'
            consumer:
              $ref: '#/components/schemas/Consumer-3'
            items:
              $ref: '#/components/schemas/RivertyItems'
            webhooks:
              $ref: '#/components/schemas/RivertyWebhooks'
            action:
              description: Next action to be performed by merchant (or consumer) to complete the payment.
              type: object
              properties:
                redirect:
                  $ref: '#/components/schemas/RedirectAction'
    RivertyCapture:
