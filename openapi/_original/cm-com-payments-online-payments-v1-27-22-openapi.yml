  parameters:
    TransactionId:
      name: transactionId
      description: ID received in the POST transaction response root object, which can be used in up following calls like refunds or cancellations as transactionId.
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TransactionId'
    PaymentId:
      description: ID received in the POST transaction response root object, which can be used in up following calls like refunds as paymentId.
      name: paymentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SessionId:
      name: sessionId
      description: ID received in the initialize session response, used to reference the session in subsequent calls.
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IdealPayFastUserToken:
      name: userToken
      description: iDEAL Pay Fast User Token as generated by iDEAL, which is received in the response of a Create iDEAL Transaction when the field `"requestUserToken"` is set to `true`.
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdealPayFastUserToken'
