      operationId: getRivertyTransaction
      description: Retrieve details for an existing Riverty transaction. This endpoint must be used to obtain the status for a transaction.
      tags:
        - Riverty
      summary: Fetch Riverty payment
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: Returns the transaction details for the Riverty transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RivertyTransaction'
              examples:
                standardRiverty:
                  $ref: '#/components/examples/successAuthorization'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/riverty/v1/transactions/{transactionId}/captures:
    post:
      operationId: createRivertyCapture
      description: |-
        **Important:** This endpoint isn't available for customers who enabled auto capture in their Riverty account.

        Create a capture for an existing Riverty transaction. The **transactionId** parameter must be the ID of the transaction to be captured.

        For an amount equal to the full amount of the transaction, **items** is optional, otherwise it has to be provided.
        The amount cannot exceed the remaining uncaptured amount of the transaction.
      tags:
        - Riverty
      summary: Create a Riverty capture
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RivertyCapture-2'
            examples:
              fullCapture:
                $ref: '#/components/examples/fullCapture'
              partialCapture:
                $ref: '#/components/examples/partialCapture'
      responses:
        '201':
          description: The Riverty capture was created successfully. Money will be transferred to the merchant's account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RivertyCapture'
              examples:
                fullCaptureResponse:
                  $ref: '#/components/examples/fullCapture-2'
                partialCaptureResponse:
                  $ref: '#/components/examples/partialCapture-2'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
    get:
      operationId: getRivertyCaptures
      tags:
        - Riverty
      summary: Fetch Riverty transaction captures
      description: Retrieve captures for an existing Riverty transaction.
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: A list of captures for the specified Riverty transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RivertyCaptures'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/riverty/v1/transactions/{transactionId}/cancellations:
    post:
      operationId: createRivertyCancellation
      description: |-
        Cancel an existing Riverty transaction. The **transactionId** parameter must be the ID of the transaction to be cancelled.

        **Important:** A transaction cannot be cancelled if it has already been partially or fully captured. Cancellation is only possible for authorized transactions that have not yet been captured.

        Leaving the amount field empty will cancel the full amount of the transaction. If an amount is specified, it must be a positive value and not exceed the remaining uncancelled amount of the transaction.
      tags:
        - Riverty
      summary: Cancel an authorization
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RivertyCancellation'
            examples:
              fullCancellation:
                $ref: '#/components/examples/fullCancellation'
              partialCancellation:
                $ref: '#/components/examples/partialCancellation'
      responses:
        '201':
          description: The Riverty cancellation was created successfully. Money will be transferred back to the consumers account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RivertyCancellation-2'
              examples:
                fullCancellation:
                  $ref: '#/components/examples/fullCancellation-2'
                partialCancellation:
                  $ref: '#/components/examples/partialCancellation-2'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/riverty/v1/transactions/{transactionId}/refunds:
    post:
      operationId: createRivertyRefund
      description: |-
        Create a refund for a specific capture within an existing Riverty transaction.

        The **captureId** field is required for transactions with multiple captures, and optional for transactions with a single capture.

        The **items** field is optional. If omitted, all items of the capture will be refunded.
      tags:
        - Riverty
      summary: Create Riverty refund
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - in: header
          name: X-Idempotency-Key
          description: |-
            A unique client-supplied key to safely retry a request without creating a duplicate operation.

            Can include letters, numbers, hyphens and underscores, up to 50 characters long.
          required: false
          schema:
            type: string
            maxLength: 50
            pattern: ^[A-Za-z0-9_-]+$
          example: refund-2024-06-01-a1b2c3
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RivertyRefund-2'
            examples:
              fullRefundSingleCapture:
                $ref: '#/components/examples/fullRefundSingleCapture'
              fullRefundMultiCapture:
                $ref: '#/components/examples/fullRefundMultiCapture'
              partialRefundSingleCapture:
                $ref: '#/components/examples/partialRefundSingleCapture'
              partialRefundMultiCapture:
                $ref: '#/components/examples/partialRefundMultiCapture'
      responses:
        '201':
          description: The Riverty refund was created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RivertyRefund'
              examples:
                fullRefund:
                  $ref: '#/components/examples/refund'
                partialRefund:
                  $ref: '#/components/examples/partialRefund'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
    get:
      operationId: getRivertyRefunds
      tags:
        - Riverty
      summary: Fetch Riverty transaction refunds
      description: Retrieve refunds for an existing Riverty transaction.
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: A list of refunds for the specified Riverty transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RivertyRefunds'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /health:
    head:
      operationId: headHealthCheck
      security: []
      description: Health check status endpoint to check the API's operational status.
      tags:
        - Utils
      summary: Check API health status
      responses:
        '200':
          description: API is operational and healthy
        '503':
          description: API is currently fully or partially unavailable. All or some services is/are not working properly.
        4XX:
          $ref: '#/components/responses/UserError'
  /paymentmethods/library/cse:
    get:
      operationId: getCSELibrary
      tags:
        - Utils
      description: |
        This endpoint is for documentation purposes. When you call this endpoint the response contains an URL specific to your account. This url can be used to access the Client-Side Encryption library. This is a JavaScript library made to be used in the front-end. The library must be used to encrypt the Card Details of your consumer in their browser.The library MUST NOT be cached since the encryption keys are rotated automatically.
      summary: Get Client-Side Encryption library
      responses:
        '200':
          description: Client side encryption libraries for BanContact and Credit Card transactions
          headers:
            Digest:
              $ref: '#/components/headers/Digest'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSideEncryption'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/checkout/v1/transactions:
    post:
      operationId: createCheckout
      description: Create a new checkout. After receiving a HTTP status 201 you have to redirect the consumer to the url given in **action.redirect.url**. The **id** field in the response can be used in future calls as **transactionId** to reference this transaction (for instance in a refund).
      tags:
        - Checkout
      summary: Create checkout
      requestBody:
        description: Create checkout
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckout'
            examples:
              standardCheckout:
                $ref: '#/components/examples/standardCheckout'
              checkoutSinglePaymentmethod:
                $ref: '#/components/examples/checkoutSinglePaymentmethod'
              checkoutWithWebhook:
                $ref: '#/components/examples/standardCheckoutWithWebhook'
              klarnaCheckout:
                $ref: '#/components/examples/klarnaCheckout'
      responses:
        '201':
          description: The iDEAL transaction was created successfully. The response contains the transaction details and a redirect URL to complete the payment.
          headers:
            Digest:
              $ref: '#/components/headers/Digest'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCheckout-2'
              examples:
                standardCheckout:
                  $ref: '#/components/examples/standardCheckout-2'
                standardCheckoutWithWebhook:
                  $ref: '#/components/examples/standardCheckoutWithWebhook-2'
                klarnaCheckout:
                  $ref: '#/components/examples/klarnaCheckout-2'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/checkout/v1/transactions/{transactionId}:
    get:
      operationId: getCheckout
      description: Retrieve details for an existing Checkout transaction. This endpoint must be used to obtain the status for a transaction.
      tags:
        - Checkout
      summary: Fetch payment
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: The Checkout was created successfully. The response contains the transaction details and a redirect URL to load checkout.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CreateCheckout-2'
                  - $ref: '#/components/schemas/CheckoutPayments'
              examples:
                open:
                  $ref: '#/components/examples/standardCheckout-2'
                multipleAttempts:
                  $ref: '#/components/examples/standardCheckoutMultipleAttempts'
                klarnaSuccess:
                  $ref: '#/components/examples/klarnaSuccessCheckout'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/checkout/v1/transactions/{transactionId}/refunds:
    post:
      operationId: createCheckoutRefund
      description: Create a refund for a previous made Credit Card transaction. A payment must be fully processed, captured and there shouldn't exist a chargeback to be able to refund them.
      tags:
        - Checkout
      summary: Refund payment
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refund'
      responses:
        '201':
          description: The Checkout refund was created successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CreateCheckout-2'
                  - $ref: '#/components/schemas/CheckoutPayments'
              examples:
                refund:
                  $ref: '#/components/examples/refundCheckout'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
    get:
      operationId: getCheckoutRefund
      tags:
        - Checkout
      summary: Fetch checkout refund
      description: Retrieve refunds for a Checkout transaction.
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          $ref: '#/components/responses/RefundsResponse'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
  /paymentmethods/checkout/v1/transactions/{transactionId}/chargebacks:
    get:
      operationId: getCheckoutChargebacks
      description: Retrieve chargebacks for an existing Checkout transaction.
      tags:
        - Checkout
      summary: Fetch chargebacks
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          $ref: '#/components/responses/ChargebacksResponse'
        4XX:
          $ref: '#/components/responses/UserError'
        5XX:
          $ref: '#/components/responses/InternalError'
webhooks:
  transactionEvent:
    post:
      operationId: createTransactionEvent
      summary: Webhook event for a transaction.
      description: |-
        Webhook that will be called if requested in the initial create transaction request.

        Implement this webhook when you want to receive a notification when a given event occurs. This will give you the advantage of not having to poll the payment method specific `GET` endpoint for status updates.
      tags:
        - Utils
      requestBody:
        description: Transaction event
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionEvent'
            examples:
              statusChanged:
                summary: Payment status change event
                value:
                  transaction: 72149cbf-d4a1-4309-9872-6ec19fa782cc
                  event: STATUS_CHANGE
                  reference: bcbb3733-4d3e-4a4d-9254-1ddb90e6e081
                  createdAt: '2006-01-02T15:04:05Z'
              refundUpdated:
                summary: Refund status change event
                value:
                  transaction: 72149cbf-d4a1-4309-9872-6ec19fa782cc
                  event: REFUND_STATUS
                  reference: bcbb3733-4d3e-4a4d-9254-1ddb90e6e081
                  createdAt: '2006-01-02T15:04:05Z'
                  refundID: 193cb243-283a-4760-9c56-8a6444d588b7
              chargebackUpdated:
                summary: Chargeback status change event
                value:
                  transaction: 72149cbf-d4a1-4309-9872-6ec19fa782cc
                  event: CHARGEBACK_STATUS
                  reference: bcbb3733-4d3e-4a4d-9254-1ddb90e6e081
                  createdAt: '2006-01-02T15:04:05Z'
                  chargebackID: 193cb243-283a-4760-9c56-8a6444d588b7
      responses:
        '200':
          description: The webhook has been received.
  iDEALQRPaymentEvent:
    post:
      operationId: createiDEALQRPaymentEvent
      summary: Webhook event for a transaction for an iDEAL-QR payment.
      description: |-
        Webhook that will be called if requested in the initial create transaction request.

        Implement this webhook when you want to receive a notification when a given event occurs. This will give you the advantage of not having to poll the payment method specific `GET` endpoint for status updates.
      tags:
        - Utils
      requestBody:
        description: Transaction event
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/iDEALQRPaymentEvent'
            examples:
              statusChanged:
                summary: Payment status change event
                value:
                  transaction: 72149cbf-d4a1-4309-9872-6ec19fa782cc
                  event: QR_PAYMENT_CREATED
                  reference: bcbb3733-4d3e-4a4d-9254-1ddb90e6e081
                  createdAt: '2006-01-02T15:04:05Z'
                  payment: 193cb243-283a-4760-9c56-8a6444d588b2
      responses:
        '200':
          description: The webhook has been received.
  bancontactPaymentEvent:
    post:
      operationId: createBancontactPaymentEvent
      summary: Webhook event for a BanContact payment.
      description: |-
        Webhook that will be called if requested in the initial create transaction request.

        Implement this webhook when you want to receive a notification when a new payment is created for a BanContact order. This will give you the advantage of not having to poll the payment method specific `GET` endpoint for status updates.
      tags:
        - Utils
      requestBody:
        description: Transaction event
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BancontactPaymentEvent'
            examples:
              paymentCreated:
                summary: Payment created event
                value:
                  transaction: 72149cbf-d4a1-4309-9872-6ec19fa782cc
                  event: PAYMENT_CREATED
                  reference: bcbb3733-4d3e-4a4d-9254-1ddb90e6e081
                  createdAt: '2006-01-02T15:04:05Z'
                  payment: 193cb243-283a-4760-9c56-8a6444d588b2
      responses:
        '200':
          description: The webhook has been received.
  sessionEvent:
    post:
      operationId: createSessionEvent
      summary: Webhook event for a session-based payment (Google Pay, Apple Pay).
      description: |-
        Webhook that will be called if requested in the initial create session request.

        Implement this webhook when you want to receive a notification when a given event occurs on a
        session-based payment flow. Unlike the standard transaction event, this payload uses a `sessionID`
        to identify the session and a `transactionID` to identify the individual transaction within it.
      tags:
        - Utils
      requestBody:
        description: Session event
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionEvent'
            examples:
              sessionCreated:
                summary: Transaction created within a session
                value:
                  sessionID: 72149cbf-d4a1-4309-9872-6ec19fa782cc
                  transactionID: 193cb243-283a-4760-9c56-8a6444d588b2
                  event: TRANSACTION_CREATED
                  reference: bcbb3733-4d3e-4a4d-9254-1ddb90e6e081
                  createdAt: '2006-01-02T15:04:05Z'
              statusChanged:
                summary: Session transaction status change
                value:
                  sessionID: 72149cbf-d4a1-4309-9872-6ec19fa782cc
                  transactionID: 193cb243-283a-4760-9c56-8a6444d588b2
                  event: STATUS_CHANGE
                  reference: bcbb3733-4d3e-4a4d-9254-1ddb90e6e081
                  createdAt: '2006-01-02T15:04:05Z'
              refundUpdated:
                summary: Session transaction status change
                value:
                  sessionID: 72149cbf-d4a1-4309-9872-6ec19fa782cc
                  transactionID: 193cb243-283a-4760-9c56-8a6444d588b2
                  event: REFUND_STATUS
                  reference: bcbb3733-4d3e-4a4d-9254-1ddb90e6e081
                  createdAt: '2006-01-02T15:04:05Z'
                  refundID: 193cb243-283a-4760-9c56-8a6444d588b7
      responses:
        '200':
          description: The webhook has been received.
components:
  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      description: OAuth 2.0 Client Credentials Grant.
      flows:
        clientCredentials:
          tokenUrl: /api/v1/authorization/oauth2/token
          scopes: {}
  headers:
    Digest:
      description: Digest of the whole message body. Follow [RFC 3230](https://datatracker.ietf.org/doc/html/rfc3230) for more information.
      schema:
        type: string
        example: sha-256=OWM5MDc3ODYwNzdjYjE5NjU0Y2NjMDM4MzEyYzMxZTA5MTAzMDBjYWM1Y2I1ODM4NTdlMDU2MzhiMzE1ZDhjNw==
  schemas:
    Uuid:
      description: Unique identifier
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      example: 8db1e7fa-ba8a-4189-92fd-67a20217443d
    ReturnUrls:
      type: object
      description: |-
        URLs where the Consumer is redirected to after completing the transaction at its issuing bank or at the chosen payment method.

        With this object we can redirect consumer to a dedicated page per payment result status. Either this object or the returnUrl field is mandatory.
      required:
        - success
        - cancelled
        - expired
        - failed
      properties:
        success:
          type: string
          format: url
          maxLength: 2000
          example: https://yourdomain.tld/order/payment-success.html
        cancelled:
          type: string
          format: url
          maxLength: 2000
          example: https://yourdomain.tld/order/payment-cancelled.html
        expired:
          type: string
          format: url
          maxLength: 2000
          example: https://yourdomain.tld/order/payment-expired.html
        failed:
          type: string
          format: url
          maxLength: 2000
          example: https://yourdomain.tld/order/payment-failed.html
    ReturnUrl:
      description: |-
        URL where the Consumer is redirected to after completing the transaction at its issuing bank or at the chosen payment method.

        With this implementation you are responsible to fetch the payment status and incorporated into your site.
      type: string
      format: url
      maxLength: 2000
      example: https://yourdomain.tld/order/return?orderID=order123
    ReturnURLOneOf:
      oneOf:
        - type: object
          required:
            - returnUrls
          properties:
            returnUrls:
              $ref: '#/components/schemas/ReturnUrls'
        - type: object
          required:
            - returnUrl
          properties:
            returnUrl:
              $ref: '#/components/schemas/ReturnUrl'
    Reference:
      description: The clients identifier. This value will be sent in the webhook payload alongside the ID you receive as part of the response of a transaction.
      type: string
      minLength: 1
      maxLength: 255
      example: '20210623130413'
    Amount:
      description: Denomination in the smallest currency subunit, as for example euro cents.
      type: integer
      minimum: 1
      maximum: 99999999
      example: 1200
    Currency:
      description: ISO 4217 currency code.
      type: string
      minLength: 3
      maxLength: 3
      default: EUR
      example: EUR
    PaymentWithoutDescriptionExpiresAtLanguageAndWebhooks:
      allOf:
        - $ref: '#/components/schemas/ReturnURLOneOf'
        - type: object
          required:
            - reference
            - amount
          properties:
            reference:
              $ref: '#/components/schemas/Reference'
            amount:
              $ref: '#/components/schemas/Amount'
            currency:
              $ref: '#/components/schemas/Currency'
    Language:
      description: Preferred language for the user interface as ISO 639-1 code. If the provided language is not supported the default will be used. Commonly supported languages are Dutch (nl) and English (en).
      type: string
      default: nl
      example: nl
      minLength: 2
      maxLength: 2
    PaymentWithoutDescriptionExpiresAtAndWebhooks:
      allOf:
        - $ref: '#/components/schemas/PaymentWithoutDescriptionExpiresAtLanguageAndWebhooks'
        - type: object
          properties:
            language:
              $ref: '#/components/schemas/Language'
    BaseWebhook:
      type: object
      description: A single webhook object consists out of an URL to which we need to send the occurred event together with the event that needs to trigger the webhook call.
      required:
        - url
        - events
      properties:
        url:
          description: The URL the request must be send to.
          type: string
          format: url
          example: https://yourdomain.tld/webhooks?purchaseId=order123
        events:
          description: Type of events that will trigger a webhook.
          type: array
          minItems: 1
          items:
            type: string
    StatusChangeEvent:
      description: |
        * `STATUS_CHANGE` - Triggered when the status of a transaction changes.
      type: string
      enum:
        - STATUS_CHANGE
      example: STATUS_CHANGE
    RefundStatusEvent:
      description: |
        * `REFUND_STATUS` - Triggered when a transaction receives an update on one of its requested refunds.
      type: string
      enum:
        - REFUND_STATUS
      example: REFUND_STATUS
    FinalStatusEvent:
      description: |
        * `FINALSTATUS` - This value is deprecated and shouldn't be used anymore. Use `STATUS_CHANGE` instead.
      type: string
      enum:
        - FINALSTATUS
      example: FINALSTATUS
    TransactionWebhook:
      allOf:
        - $ref: '#/components/schemas/BaseWebhook'
        - type: object
          properties:
            events:
              items:
                description: |
                  * `STATUS_CHANGE` - Triggered when the status of a transaction changes.
                  * `REFUND_STATUS` - Triggered when a transaction receives an update on one of its requested refunds.
                  * `FINALSTATUS` - This value is deprecated and shouldn't be used anymore. Use `STATUS_CHANGE` instead.
                oneOf:
                  - $ref: '#/components/schemas/StatusChangeEvent'
                  - $ref: '#/components/schemas/RefundStatusEvent'
                  - $ref: '#/components/schemas/FinalStatusEvent'
                example: STATUS_CHANGE
    TransactionWebhooks:
      description: |
        Array of webhooks that enables receiving a web request once a given event occurs. We won't do preventive rate-limiting in order to have the highest throughput possible. However, we will honor 429 (Too-many-requests) responses per callback. We use the Retry-After header to retry after a certain period. If the header was not set we use our default exponential delay implementation.
      type: array
      items:
        $ref: '#/components/schemas/TransactionWebhook'
      example:
        - url: https://yourdomain.tld/payment-webhooks?purchaseId=order123
          events:
            - STATUS_CHANGE
    PaymentWithoutDescriptionAndExpiresAt:
      allOf:
        - $ref: '#/components/schemas/PaymentWithoutDescriptionExpiresAtAndWebhooks'
        - type: object
          properties:
            webhooks:
              $ref: '#/components/schemas/TransactionWebhooks'
    Description:
      description: Description of the underlying value or reason of the payment.
      type: string
      maxLength: 255
      example: Order at yourdomain.tld
    Datetime:
      type: string
      format: date-time
      minLength: 20
      example: '2006-01-02T15:04:05Z'
      description: ISO 8601 date and time.
    Payment:
      allOf:
        - $ref: '#/components/schemas/PaymentWithoutDescriptionAndExpiresAt'
        - type: object
          required:
            - description
          properties:
            description:
              $ref: '#/components/schemas/Description'
            expiresAt:
              $ref: '#/components/schemas/Datetime'
              description: ISO 8601 date and time. If a transaction is not finalized before this time the status becomes **EXPIRED**.
    ChargebackStatusEvent:
      description: |
        * `CHARGEBACK_STATUS` - Triggered when a transaction receives an update on one of its chargebacks.
      type: string
      enum:
        - CHARGEBACK_STATUS
      example: CHARGEBACK_STATUS
    TransactionWebhookWithChargeback:
      allOf:
        - $ref: '#/components/schemas/BaseWebhook'
        - type: object
          properties:
            events:
              items:
                description: |
                  * `STATUS_CHANGE` - Triggered when the status of a transaction changes.
                  * `REFUND_STATUS` - Triggered when a transaction receives an update on one of its requested refunds.
                  * `CHARGEBACK_STATUS` - Triggered when a transaction receives an update on one of its chargebacks.
                  * `FINALSTATUS` - This value is deprecated and shouldn't be used anymore. Use `STATUS_CHANGE` instead.
                oneOf:
                  - $ref: '#/components/schemas/StatusChangeEvent'
                  - $ref: '#/components/schemas/RefundStatusEvent'
                  - $ref: '#/components/schemas/ChargebackStatusEvent'
                  - $ref: '#/components/schemas/FinalStatusEvent'
                example: STATUS_CHANGE
    TransactionWebhooksWithChargeback:
      description: |
        Array of webhooks that enables receiving a web request once a given event occurs. We won't do preventive rate-limiting in order to have the highest throughput possible. However, we will honor 429 (Too-many-requests) responses per callback. We use the Retry-After header to retry after a certain period. If the header was not set we use our default exponential delay implementation.
      type: array
      items:
        $ref: '#/components/schemas/TransactionWebhookWithChargeback'
      example:
        - url: https://yourdomain.tld/payment-webhooks?purchaseId=order123
          events:
            - STATUS_CHANGE
    Email:
      description: The email address of the consumer.
      type: string
      format: email
      example: john.doe@email.tld
    Phone:
      description: The phonenumber of the consumer (E.164 format).
      type: string
      maxLength: 16
      example: '+31695613259'
    GenderlessConsumer:
      type: object
      properties:
        email:
          $ref: '#/components/schemas/Email'
        phone:
          $ref: '#/components/schemas/Phone'
        dateOfBirth:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: '1990-05-23'
          description: Date of birth in ISO 8601 format (YYYY-MM-DD).
    Gender:
      description: The consumers gender.
      type: string
      format: enum
      enum:
        - m
        - f
        - 'null'
      default: null
    Consumer:
      allOf:
        - $ref: '#/components/schemas/GenderlessConsumer'
        - type: object
          properties:
            gender:
              $ref: '#/components/schemas/Gender'
    LastName:
      description: Consumer's last name.
      type: string
      maxLength: 35
      example: Doe
    Name:
      description: Consumer's name.
      type: object
      required:
        - firstName
        - lastName
      properties:
        firstName:
          description: Consumer's first name.
          type: string
          maxLength: 35
          example: John
        lastName:
          $ref: '#/components/schemas/LastName'
        middleName:
          description: Consumer's middle name.
          type: string
          maxLength: 35
          example: A
    Country:
      description: Country of the consumer (ISO-3166)
      type: string
      example: NL
      minLength: 2
      maxLength: 2
    AddressWithoutMandatoryCountry:
      type: object
      description: The consumers address.
      properties:
        street:
          description: The consumers street name.
          type: string
          maxLength: 100
          example: Rustenburgerlaan
        houseNumber:
          description: The consumers house number.
          type: string
          maxLength: 35
          example: '25'
        postalCode:
          description: The consumers postal code.
          type: string
          maxLength: 35
          example: 2012AL
        city:
          description: The consumers city.
          type: string
          maxLength: 35
          example: Haarlem
        countryCode:
          $ref: '#/components/schemas/Country'
    AddressWithStateAndAdditionalData:
      allOf:
        - $ref: '#/components/schemas/AddressWithoutMandatoryCountry'
        - type: object
          properties:
            state:
              description: The state or province of the consumer's billing address associated with the card used for this purchase. The value must be the country subdivision code (e.g., 'NH') or the official state/province name (e.g., 'Noord Holland') as defined in ISO 3166-2.
              type: string
              maxLength: 40
              example: Noord-Holland
            additionalData:
              description: The consumers house number addition.
              type: string
              maxLength: 35
              example: Right-hand portal
    Address:
      allOf:
        - $ref: '#/components/schemas/AddressWithStateAndAdditionalData'
        - type: object
          required:
            - countryCode
    ConsumerBase:
      allOf:
        - $ref: '#/components/schemas/Consumer'
        - type: object
          properties:
            name:
              $ref: '#/components/schemas/Name'
            address:
              $ref: '#/components/schemas/Address'
            businessName:
              description: The consumers company name.
              type: string
              maxLength: 35
              example: CM
    BancontactPayment:
      allOf:
        - $ref: '#/components/schemas/Payment'
        - type: object
          required:
            - language
            - consumer
          properties:
            expiresAt:
              allOf:
                - $ref: '#/components/schemas/Datetime'
                - description: ISO 8601 date and time. If a transaction is not finalized before this time the status becomes EXPIRED. If left empty, the value defaults to 1 hour.
            webhooks:
              $ref: '#/components/schemas/TransactionWebhooksWithChargeback'
            consumer:
              allOf:
                - $ref: '#/components/schemas/ConsumerBase'
                - type: object
                  required:
                    - email
                    - address
                  properties:
                    address:
                      allOf:
                        - $ref: '#/components/schemas/Address'
                        - type: object
                          required:
                            - countryCode
    TransactionId:
      description: ID received in the POST transaction response root object, which can be used in up following calls like refunds or cancellations as transactionId.
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      example: 8db1e7fa-ba8a-4189-92fd-67a20217443d
    TransactionWithoutOrderIdLanguageRefundsCreatedAtAndExpiresAt:
      allOf:
        - $ref: '#/components/schemas/ReturnURLOneOf'
        - type: object
          required:
            - id
            - reference
            - amount
            - currency
            - status
            - description
          properties:
            id:
              $ref: '#/components/schemas/TransactionId'
            reference:
              $ref: '#/components/schemas/Reference'
            amount:
              $ref: '#/components/schemas/Amount'
            currency:
              $ref: '#/components/schemas/Currency'
            webhooks:
              $ref: '#/components/schemas/TransactionWebhooks'
            description:
              $ref: '#/components/schemas/Description'
    TransactionWithoutOrderIdLanguageRefundsAndExpiresAt:
      allOf:
        - $ref: '#/components/schemas/TransactionWithoutOrderIdLanguageRefundsCreatedAtAndExpiresAt'
        - type: object
          required:
            - createdAt
          properties:
            createdAt:
              $ref: '#/components/schemas/Datetime'
              description: ISO 8601 date and time when the transaction was created.
    Refunds:
      description: Details of refunds for a transaction
      type: object
      required:
        - refundedAmount
        - refundedPendingAmount
      properties:
        refundedAmount:
          description: Amount in the smallest currency subunit, as for example euro cents, that has already been refunded.
          type: integer
          minimum: 0
          maximum: 99999999
          example: 300
        refundedPendingAmount:
          description: Amount in the smallest currency subunit, as for example euro cents, that has been requested to be refunded.
          type: integer
          minimum: 1
          maximum: 99999999
          example: 100
    TransactionWithoutOrderId:
      allOf:
        - $ref: '#/components/schemas/TransactionWithoutOrderIdLanguageRefundsAndExpiresAt'
        - type: object
          required:
            - language
            - expiresAt
          properties:
            language:
              $ref: '#/components/schemas/Language'
            expiresAt:
              $ref: '#/components/schemas/Datetime'
              description: ISO 8601 date and time. If a transaction is not finalized before this time the status becomes **EXPIRED**.
            refunds:
              $ref: '#/components/schemas/Refunds'
    Transaction:
      allOf:
        - $ref: '#/components/schemas/TransactionWithoutOrderId'
        - type: object
          required:
            - orderId
          properties:
            orderId:
              allOf:
                - deprecated: true
                - $ref: '#/components/schemas/Uuid'
    StatusOpen:
      description: The transaction is open and can be paid.
      type: string
      format: enum
      enum:
        - OPEN
      example: OPEN
    StatusSuccess:
      description: The transaction has been successfully paid.
      type: string
      format: enum
      enum:
        - SUCCESS
      example: SUCCESS
    StatusCancelled:
      description: The transaction has been cancelled by the consumer.
      type: string
      format: enum
      enum:
        - CANCELLED
      example: CANCELLED
    StatusExpired:
      description: The transaction has expired.
      type: string
      format: enum
      enum:
        - EXPIRED
      example: EXPIRED
    StatusFailure:
      description: The transaction has failed.
      type: string
      format: enum
      enum:
        - FAILURE
      example: FAILURE
    StatusAuthorized:
      description: The transaction has been authorized.
      type: string
      format: enum
      enum:
        - AUTHORIZED
      example: AUTHORIZED
    QRCodeAction:
      type: object
      required:
        - url
      description: |
        Action to be performed by the consumer to complete the payment. This action is only available when a payment using the card details was not started.
      properties:
        url:
          description: URL to QR code image to be scanned by consumer to perform the payment. Unavailable when a payment using the card details was started.
          type: string
          format: url
          example: https://qrbackend.tld/images/213981209381209390821.png
    IntentURLAction:
      type: object
      required:
        - url
      description: |
        Action to be performed by the consumer to complete the payment. This action is only available when a payment using the card details was not started.
      properties:
        url:
          description: Intent URL which can be opened by the BanContact by Payconic application on mobile devices. Unavailable when a payment using the card details was started.
          type: string
          format: url
          example: https://docdata.tld/pay?order=123
    BancontactAction:
      type: object
      description: Next action to be performed by the merchant (or consumer) to complete the payment.
      required:
        - qrcode
        - intent
      properties:
        qrcode:
          $ref: '#/components/schemas/QRCodeAction'
        intent:
          $ref: '#/components/schemas/IntentURLAction'
    BanContactTransaction:
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          required:
            - country
            - action
            - status
          properties:
            status:
              description: The status of the transaction.
              oneOf:
                - $ref: '#/components/schemas/StatusOpen'
                - $ref: '#/components/schemas/StatusSuccess'
                - $ref: '#/components/schemas/StatusCancelled'
                - $ref: '#/components/schemas/StatusExpired'
                - $ref: '#/components/schemas/StatusFailure'
                - $ref: '#/components/schemas/StatusAuthorized'
            country:
              $ref: '#/components/schemas/Country'
            action:
              $ref: '#/components/schemas/BancontactAction'
    ShopperIP:
      type: string
      minLength: 1
      maxLength: 39
      description: IPv4 or IPv6 address for the consumer
      example: 1.1.1.1
    BrowserInformation:
      type: object
      required:
        - shopperIp
        - accept
        - userAgent
      properties:
        shopperIp:
          $ref: '#/components/schemas/ShopperIP'
        accept:
          type: string
          description: content-type accepted by the client browser
          example: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        userAgent:
          type: string
          description: User-Agent of the consumers browser.
          example: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/70.0.3538.102 Safari/537.36 Edge/18.18363
    EncryptedCardDetails:
      type: object
      required:
        - data
      properties:
        data:
          type: string
          description: |
            The card data that need to be encrypted (cardHolderName, cardNumber, expiryMonth, expiryYear, securityCode).

            Use the library from `/paymentmethods/library/cse`. This contains a JS library with an exported function called `cseEncrypt`.
            `let encrypted = cseEncrypt(cardHolderName, cardNumber, expiryMonth, expiryYear, securityCode);`
    BancontactCardPayment:
      allOf:
        - type: object
          required:
            - browserInformation
            - encryptedCardDetails
          properties:
            browserInformation:
              $ref: '#/components/schemas/BrowserInformation'
            encryptedCardDetails:
              $ref: '#/components/schemas/EncryptedCardDetails'
    RedirectAction:
      description: URL where consumer should be redirected to by the merchant to perform the payment.
      type: object
      required:
        - url
      properties:
        url:
          description: URL where consumer should be redirected to by the merchant to perform the payment.
          type: string
          format: url
          example: https://issuer.tld/ideal/start?trxid=213981209381209390821&random=wreq0dq90vgq0ew923123
    BancontactCardAction:
      type: object
      description: Next action to be performed by the merchant (or consumer) to complete the payment.
      required:
        - redirect
      properties:
        redirect:
          $ref: '#/components/schemas/RedirectAction'
    BancontactStartTransaction:
      type: object
      required:
        - id
        - action
      properties:
        id:
          $ref: '#/components/schemas/TransactionId'
        action:
          $ref: '#/components/schemas/BancontactCardAction'
    BanContactFetchTransaction:
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          required:
            - country
            - action
            - status
          properties:
            status:
              description: The status of the transaction.
              oneOf:
                - $ref: '#/components/schemas/StatusOpen'
                - $ref: '#/components/schemas/StatusSuccess'
                - $ref: '#/components/schemas/StatusCancelled'
                - $ref: '#/components/schemas/StatusExpired'
                - $ref: '#/components/schemas/StatusFailure'
                - $ref: '#/components/schemas/StatusAuthorized'
            country:
              $ref: '#/components/schemas/Country'
            action:
              type: object
              description: Next action to be performed by the merchant (or consumer) to complete the payment.
              properties:
                qrcode:
                  $ref: '#/components/schemas/QRCodeAction'
                intent:
                  $ref: '#/components/schemas/IntentURLAction'
                redirect:
                  $ref: '#/components/schemas/RedirectAction'
    RefundReason:
      description: |
        The description for the refund for administrative purpose only. This reason will be visible in the portal.
      type: string
      example: Refund required by consumer.
      maxLength: 255
    RefundStatus:
      description: |
        * `SUCCESS`    - Refund has succeeded.
        * `PENDING`    - Refund is waiting to be processed.
        * `FAILURE`    - Refund has failed.
        * `CANCELLED`  - Refund has been cancelled.
      type: string
      enum:
        - SUCCESS
        - PENDING
        - FAILURE
        - CANCELLED
      example: SUCCESS
    RefundDetails:
      description: Details of a refund.
      type: object
      required:
        - id
        - transactionId
        - amount
        - reason
        - status
        - created
        - updated
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        transactionId:
          $ref: '#/components/schemas/Uuid'
        amount:
          $ref: '#/components/schemas/Amount'
        reason:
          $ref: '#/components/schemas/RefundReason'
        status:
          $ref: '#/components/schemas/RefundStatus'
        created:
          $ref: '#/components/schemas/Datetime'
        updated:
          $ref: '#/components/schemas/Datetime'
    RefundDetailsWithPaymentID:
      allOf:
        - $ref: '#/components/schemas/RefundDetails'
        - type: object
          required:
            - paymentId
          properties:
            paymentId:
              allOf:
                - $ref: '#/components/schemas/Uuid'
              description: Unique identifier for the payment that is being refunded.
    BancontactRefundsResponse:
      type: object
      required:
        - refunds
      properties:
        refunds:
          type: array
          items:
            $ref: '#/components/schemas/RefundDetailsWithPaymentID'
    Refund:
      description: Refund an already successfully processed payment.
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
          description: |
            Denomination in the smallest currency subunit, as for example euro cents. If empty, the refund amount will be the remaining available amount of the transaction (i.e., total payment amount minus already refunded amounts minus the amounts of the pending refund requests).
        reason:
          $ref: '#/components/schemas/RefundReason'
    ChargebackStatus:
      description: |
        * `CHARGED` - The transaction has been charged back by the issuing bank.
      type: string
      enum:
        - CHARGED
      example: CHARGED
    ChargebackDetails:
      description: Details of a chargeback.
      type: object
      required:
        - id
        - transactionId
        - amount
        - currency
        - status
        - chargebackDate
        - created
        - updated
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        transactionId:
          $ref: '#/components/schemas/Uuid'
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        reason:
          description: The reason for the chargeback as reported by the issuing bank.
          type: string
          example: Fraudulent transaction
        status:
          $ref: '#/components/schemas/ChargebackStatus'
        chargebackDate:
          $ref: '#/components/schemas/Datetime'
          description: Date and time when the chargeback was registered by the issuing bank.
        created:
          $ref: '#/components/schemas/Datetime'
        updated:
          $ref: '#/components/schemas/Datetime'
    ChargebackDetailsWithPaymentID:
      allOf:
        - $ref: '#/components/schemas/ChargebackDetails'
        - type: object
          required:
            - paymentId
          properties:
            paymentId:
              allOf:
                - $ref: '#/components/schemas/Uuid'
              description: Unique identifier for the payment that was charged back.
    BancontactChargebacksResponse:
      type: object
      required:
        - chargebacks
      properties:
        chargebacks:
          type: array
          items:
            $ref: '#/components/schemas/ChargebackDetailsWithPaymentID'
    RefundsList:
      description: Details of all refunds belonging to a transaction.
      type: object
      required:
        - refunds
      properties:
        refunds:
          type: array
          items:
            $ref: '#/components/schemas/RefundDetails'
    PaymentPageSize:
      description: The number of elements to be returned in the response
      type: integer
      minimum: 10
      maximum: 100
      example: 20
    After:
      allOf:
        - $ref: '#/components/schemas/Datetime'
        - description: Return the elements that were created after this date
        - example: '2022-10-13T14:21:30.478935Z'
    BancontactPayment-2:
      type: object
      required:
        - id
        - orderId
        - status
        - paidAmount
        - createdAt
        - expiresAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        orderId:
          $ref: '#/components/schemas/Uuid'
        status:
          description: The status of the payment.
          oneOf:
            - $ref: '#/components/schemas/StatusOpen'
            - $ref: '#/components/schemas/StatusSuccess'
            - $ref: '#/components/schemas/StatusCancelled'
            - $ref: '#/components/schemas/StatusExpired'
            - $ref: '#/components/schemas/StatusFailure'
            - $ref: '#/components/schemas/StatusAuthorized'
        paidAmount:
          allOf:
            - $ref: '#/components/schemas/Amount'
            - description: Amount paid in the smallest currency subunit, as for example euro cents.
        createdAt:
          $ref: '#/components/schemas/Datetime'
        expiresAt:
          $ref: '#/components/schemas/Datetime'
    BancontactPaymentsPaginated:
      type: object
      required:
        - total
        - pageSize
        - payments
      properties:
        total:
          description: The total number of payments that the order has
          type: integer
          example: 6
        pageSize:
          $ref: '#/components/schemas/PaymentPageSize'
        payments:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/BancontactPayment-2'
    TransactionCreatedEvent:
      description: |
        * `TRANSACTION_CREATED` - Triggered when a new transaction is created.
      type: string
      enum:
        - TRANSACTION_CREATED
      example: TRANSACTION_CREATED
    SessionTransactionWebhooks:
      allOf:
        - $ref: '#/components/schemas/BaseWebhook'
        - type: object
          properties:
            events:
              items:
                description: |
                  * `STATUS_CHANGE` - Triggered when the status of a session or a transaction changes.
                  * `REFUND_STATUS` - Triggered when a transaction receives an update on one of its requested refunds.
                  * `TRANSACTION_CREATED` - Triggered when a new transaction is created for a session.
                oneOf:
                  - $ref: '#/components/schemas/StatusChangeEvent'
                  - $ref: '#/components/schemas/RefundStatusEvent'
                  - $ref: '#/components/schemas/TransactionCreatedEvent'
                example: STATUS_CHANGE
    GooglePayInitialize:
      type: object
      required:
        - reference
        - amount
        - description
        - language
      properties:
        reference:
          $ref: '#/components/schemas/Reference'
        description:
          description: |
            Description of the underlying value or reason of the session.
            Ultimately appears on the confirmation (statement and confirmation screen).
          type: string
          maxLength: 255
          example: Order at yourdomain.tld
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/Datetime'
            - description: ISO 8601 date and time. If left empty, the value defaults to 10 mins.
        language:
          $ref: '#/components/schemas/Language'
        consumer:
          $ref: '#/components/schemas/Consumer'
        webhooks:
          $ref: '#/components/schemas/SessionTransactionWebhooks'
        returnUrl:
          $ref: '#/components/schemas/ReturnUrl'
    GooglePaySessionObject:
      type: object
      required:
        - id
        - reference
        - amount
        - currency
        - description
        - expiresAt
        - language
        - status
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        reference:
          $ref: '#/components/schemas/Reference'
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        description:
          type: string
          example: Order at yourdomain.tld
        expiresAt:
          $ref: '#/components/schemas/Datetime'
        language:
          $ref: '#/components/schemas/Language'
        consumer:
          description: Consumer details. Only returned on session creation (POST). Not available on session retrieval (GET).
          allOf:
            - $ref: '#/components/schemas/Consumer'
        webhooks:
          $ref: '#/components/schemas/TransactionWebhooks'
        status:
          description: The status of the transaction.
          oneOf:
            - $ref: '#/components/schemas/StatusOpen'
            - $ref: '#/components/schemas/StatusSuccess'
            - $ref: '#/components/schemas/StatusCancelled'
            - $ref: '#/components/schemas/StatusExpired'
            - $ref: '#/components/schemas/StatusFailure'
            - $ref: '#/components/schemas/StatusAuthorized'
        action:
          description: |
            Contains the details necessary to render the Google Pay button in your own checkout page during the initialize session flow.
            In consequent flows the action object will be null.
          anyOf:
            - type: 'null'
            - type: object
              properties:
                googlePayButton:
                  type: object
                  properties:
                    merchantCountry:
                      description: The ISO 3166-1 alpha-2 country code where the transaction is processed.
                      type: string
                      example: NL
                    gatewayId:
                      description: Gateway's identifier, which is issued by Google.
                      type: string
                      example: example-gateway
                    environment:
                      description: |
                        * TEST - Dummy payment methods that are suitable for testing.
                        * PRODUCTION - Used to return chargeable payment methods when a valid Google merchant ID is specified and configured for the domain.
                      type: string
                      enum:
                        - TEST
                        - PRODUCTION
                    merchantId:
                      description: A Google merchant identifier.
                      type: string
                      example: exampleMerchantId
                    merchantName:
                      description: Merchant name encoded as UTF-8. Merchant name is rendered in the payment sheet. In TEST environment, or if a merchant isn't recognized, a "Pay Unverified Merchant" message is displayed in the payment sheet.
                      type: string
                      example: Your Merchant
                    merchantKey:
                      allOf:
                        - $ref: '#/components/schemas/Uuid'
                        - description: Unique identifier for your integration. Should be used as gateway merchant id.
                    allowedCardNetworks:
                      description: One or more card networks supported by Payments Gateway, also supported by the Google Pay API.
                      type: array
                      items:
                        type: string
                        enum:
                          - AMEX
                          - DISCOVER
                          - INTERAC
                          - JCB
                          - MASTERCARD
                          - VISA
                    serverUrl:
                      description: The URL to the Mobile Pay Server.
                      type: string
                      example: https://www.example.com/api/
        createdAt:
          $ref: '#/components/schemas/Datetime'
        returnUrl:
          $ref: '#/components/schemas/ReturnUrl'
    PaymentMethod:
      description: The payment method used in the transaction.
      type: string
      format: enum
      enum:
        - creditcard
      example: creditcard
    GooglePayTransactionObject:
      type: object
      required:
        - id
        - sessionId
        - expiresAt
        - status
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        sessionId:
          $ref: '#/components/schemas/Uuid'
        expiresAt:
          $ref: '#/components/schemas/Datetime'
        webhooks:
          $ref: '#/components/schemas/TransactionWebhooks'
        status:
          description: The status of the transaction.
          oneOf:
            - $ref: '#/components/schemas/StatusOpen'
            - $ref: '#/components/schemas/StatusSuccess'
            - $ref: '#/components/schemas/StatusCancelled'
            - $ref: '#/components/schemas/StatusExpired'
            - $ref: '#/components/schemas/StatusFailure'
            - $ref: '#/components/schemas/StatusAuthorized'
        action:
          description: Next action to be performed by merchant (or consumer) to complete the transaction. Only present when 3DS authentication is required.
          anyOf:
            - type: 'null'
            - type: object
              properties:
                redirect:
                  type: object
                  properties:
                    url:
                      description: URL where consumer should be redirected to by the merchant to perform the transaction. This url is only available when a card payment has been started
                      type: string
                      format: url
                      example: https://checkout.tld/3ds/v2/creditcard/123
        createdAt:
          $ref: '#/components/schemas/Datetime'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
    AuthorizeGooglePayTransaction:
      description: The paymentData.paymentMethodData returned by Google Pay that must be sent as-is to the Payment System
      type: object
      properties:
        description:
          description: Google Pay payment description
          type: string
          example: Visa •••• 1111
        info:
          type: object
          properties:
            cardDetails:
              type: string
              example: '1111'
            cardNetwork:
              type: string
              example: VISA
        tokenizationData:
          type: object
          properties:
            token:
              type: string
              example: '{"signature":"MEUCIQDefdlz6PJ6ELqh58JUES8DmVAfCVChP/wd3fm7QfhLIgIgP+xZdKCoL8Wv+smlTHyrtxLmAw4jTZcCU+Oqjj7K0zs\u003d","intermediateSigningKey":{"signedKey":"{\"keyValue\":\"MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEi6ylxFPyYnSNpkQNP11SdTvsf/muVEqEGxy7Zf30mUeh+BEmBzHbrBd4p+ECtOS6kPNnnW8UGWzb7dE8x+L5Fg\\u003d\\u003d\",\"keyExpiration\":\"1683363703676\"}","signatures":["MEUCIC6nmOCKBgprc0iwBumuYe1eEva1i5hPQ4jWIl+Mo2U9AiEAxSx1bEGER3atvKdts9cVlfnFP4jGLsXQnR1iRG4iWSI\u003d"]},"protocolVersion":"ECv2","signedMessage":"{\"encryptedMessage\":\"\\u003d","ephemeralPublicKey":"BEL9y1u7hBWJ621PemcPJg5w+FFhijBKcD/BfGrOtk5W4ZMKzFgcgSQEoNgU1ytAD9iirXl0u4RjzMNPMCyehOo\\u003d","tag":"ohzjZ/wzmjeYcwvrGD1QYGd53jvbiHHXLdVKCy6MKHY\\u003d"}'
            type:
              type: string
              example: PAYMENT_GATEWAY
        type:
          type: string
          example: CARD
    RefundDetailsWithSessionID:
      allOf:
        - $ref: '#/components/schemas/RefundDetails'
        - type: object
          required:
            - sessionId
          properties:
            sessionId:
              allOf:
                - $ref: '#/components/schemas/Uuid'
              description: Unique identifier for the session.
              example: bcbb3733-4d3e-4a4d-9254-1ddb90e6e082
    RefundsListWithSessionID:
      description: Details of all refunds belonging to a transaction of a session.
      type: object
      required:
        - refunds
      properties:
        refunds:
          type: array
          items:
            $ref: '#/components/schemas/RefundDetailsWithSessionID'
    CardProvider:
      type: string
      format: enum
      enum:
        - mastercard
        - visa
        - amex
        - maestro
      description: The card scheme the card belongs to.
      example: mastercard
    CardDetails:
      description: Card details like the cardholders name, PAN, CVC and expiry date.
      type: object
      required:
        - cardProvider
        - browserInformation
        - encryptedCardDetails
      properties:
        cardProvider:
          $ref: '#/components/schemas/CardProvider'
        browserInformation:
          $ref: '#/components/schemas/BrowserInformation'
        encryptedCardDetails:
          $ref: '#/components/schemas/EncryptedCardDetails'
    CardPayment:
      allOf:
        - $ref: '#/components/schemas/Payment'
        - type: object
          required:
            - description
            - language
            - consumer
            - cardDetails
          properties:
            expiresAt:
              allOf:
                - $ref: '#/components/schemas/Datetime'
                - description: ISO 8601 date and time. If a transaction is not finalized before this time the status becomes EXPIRED. If left empty, the value defaults to 30 mins.
            webhooks:
              $ref: '#/components/schemas/TransactionWebhooksWithChargeback'
            consumer:
              allOf:
                - $ref: '#/components/schemas/ConsumerBase'
                - type: object
                  required:
                    - email
                    - address
                  properties:
                    address:
                      allOf:
                        - $ref: '#/components/schemas/Address'
                        - type: object
                          required:
                            - countryCode
            cardDetails:
              $ref: '#/components/schemas/CardDetails'
    CreditCardTransaction:
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          required:
            - country
            - status
            - action
            - cardProvider
          properties:
            status:
              description: The status of the transaction.
              oneOf:
                - $ref: '#/components/schemas/StatusOpen'
                - $ref: '#/components/schemas/StatusSuccess'
                - $ref: '#/components/schemas/StatusCancelled'
                - $ref: '#/components/schemas/StatusExpired'
                - $ref: '#/components/schemas/StatusFailure'
                - $ref: '#/components/schemas/StatusAuthorized'
            action:
              type: object
              description: Next action to be performed by merchant (or consumer) to complete the payment.
              properties:
                redirect:
                  $ref: '#/components/schemas/RedirectAction'
            country:
              $ref: '#/components/schemas/Country'
            cardProvider:
              $ref: '#/components/schemas/CardProvider'
    ChargebacksList:
      description: Details of all chargebacks belonging to a transaction.
      type: object
      required:
        - chargebacks
      properties:
        chargebacks:
          type: array
          items:
            $ref: '#/components/schemas/ChargebackDetails'
    PurchaseID:
      description: |-
        Unique identification of the order within the Merchant's system. This value
        appears on the bank statement of the Consumer.

        The purchaseID can only contain letters and numbers.
      type: string
      minLength: 1
      maxLength: 35
      pattern: ^[A-Za-z0-9]{1,35}$
      example: PO1234567
    IDEALDescription:
      maxLength: 35
      description: |
        Description of the underlying value or reason of the payment.

        Ultimately appears on the payment statement and confirmation screen.
    IdealCheckout:
      description: |-
        An iDEAL payment with iDEAL Checkout allow users to centrally manage their shipping, invoice and contact details in an iDEAL profile and provide these to a Merchant as part of the iDEAL payment.

        Use this object to enable the iDEAL Checkout flow and specify the shipping costs and the consumer details to be returned after a successful payment.
      type: object
      properties:
        shippingCost:
          description: |-
            Shipping costs in euro cents.

            This value must be less or equal to the total transaction amount, which includes these shipping costs.
          type: integer
          example: 100
          minimum: 0
          maximum: 99999999
        requestedDetails:
          description: According to GDPR, the merchant is responsible for requesting what is meant 'good enough' data fields for them in order to finalize the order and deliver the goods.
          type: object
          properties:
            debtorContactDetails:
              type: object
              title: DebtorContactDetailsRequestData
              description: With the Debtor Contact Details, you (the merchant) can indicate which data you want to retrieve from iDEAL Checkout in the Create Transaction response.
              properties:
                firstName:
                  type: boolean
                  description: Request to provide the first name of the consumer
                  default: false
                lastName:
                  type: boolean
                  description: Request to provide the last name of the consumer
                  default: false
                phoneNumber:
                  type: boolean
                  description: Request to provide the phone number of the consumer in E.164 format
                  default: false
                email:
                  type: boolean
                  description: Request to provide the e-mail address of the consumer
                  default: false
            shippingAddress:
              type: boolean
              description: Request to provide the shipping address of the consumer
              default: false
            invoiceAddress:
              type: boolean
              description: Request to provide the invoice address of the consumer
              default: false
      required:
        - shippingCost
        - requestedDetails
    IdealPayFastRequestUserToken:
      description: |-
        Requests a User Token for future Pay Fast transactions with the same Consumer.

        When enabled and the Consumer consents, a User Token will be generated that enables push notifications in future transactions.

        Only request User Tokens for Consumers who have established accounts with your service and can be reliably identified on return visits.
      type: boolean
      default: false
    IdealPayFastUserToken:
      description: iDEAL Pay Fast User Token as generated by iDEAL, which is received in the response of a Create iDEAL Transaction when the field `"requestUserToken"` is set to `true`.
      type: string
      minLength: 1
      maxLength: 128
      example: Z7xmaEJlB3rDLpmln9xbUlaQ
    IdealPayFastExpectedDebtor:
      type: object
      description: |-
        If the Merchant is in possession of a User Token, obtained through a previous transaction, and the Consumer has indicated that he wants to reuse the bank account that was displayed after retrieving it from the `getDebtorPreferences`-endpoint, the User Token and browsers user-agent can be provided to enable the enhanced flow.

        The Consumer for which a User Token is used MUST hold an account with the merchant. The Merchant MUST only use the iDEAL User Token that was received in the last transaction for the Consumer.
      required:
        - userToken
      properties:
        userToken:
          $ref: '#/components/schemas/IdealPayFastUserToken'
        userAgent:
          type: string
          description: The User-Agent contains a characteristic string that allows the network protocol peers to identify the application type, operating system, software vendor, or software version of the requesting software user agent.
          minLength: 0
          maxLength: 500
    IdealPayment:
      allOf:
        - $ref: '#/components/schemas/Payment'
        - type: object
          required:
            - purchaseId
            - description
          properties:
            expiresAt:
              allOf:
                - $ref: '#/components/schemas/Datetime'
                - description: ISO 8601 date and time. If a transaction is not finalized before this time the status becomes EXPIRED. If left empty, the value defaults to 30 mins.
            purchaseId:
              $ref: '#/components/schemas/PurchaseID'
            description:
              $ref: '#/components/schemas/IDEALDescription'
            checkout:
              $ref: '#/components/schemas/IdealCheckout'
            requestUserToken:
              $ref: '#/components/schemas/IdealPayFastRequestUserToken'
            expectedDebtor:
              $ref: '#/components/schemas/IdealPayFastExpectedDebtor'
    BIC:
      description: Bank Identification Code
      deprecated: true
      type: string
      minLength: 8
      maxLength: 11
      example: RABONL2U
    IdealAddress:
      type: object
      title: Address
      properties:
        firstName:
          type: string
          description: The first name of the consumer
          example: John
          minLength: 1
        lastName:
          type: string
          description: The last name of the consumer
          example: Doe
          minLength: 1
        companyName:
          type: string
          description: The company name of the consumer
          example: Cookie factory
          minLength: 1
        postalCode:
          type: string
          description: The postal code of the address without spaces
          example: 1234AB
          minLength: 1
        houseNumber:
          type: string
          description: The house number of the address
          example: '100'
          minLength: 1
        addition:
          type: string
          description: The addition of the address
          example: 2B
          minLength: 1
        street:
          type: string
          description: The street of the address
          example: Bankastraat
          minLength: 1
        city:
          type: string
          description: The city of the address
          example: Amsterdam
          minLength: 1
        countryName:
          type: string
          description: Name of the country
          example: Netherlands
          minLength: 1
    IdealConsumer:
      description: contains the Name and IBAN that were used by the consumer that completed the payment. This field is null until the payment is completed.
      type: object
      properties:
        name:
          description: Name of the consumer
          type: string
          example: John
        bic:
          $ref: '#/components/schemas/BIC'
        iban:
          description: IBAN of the consumer
          type: string
          example: NL24RABO8487376045
        checkoutDetails:
          description: |-
            The checkout details defined by the consumer before completing the transaction.

            By default, the invoice address will be the same as the shipping address unless it is explicitly changed by the
            consumer.

            This field is only available if the transaction status is `SUCCESS` and checkout data was requested.
          type: object
          properties:
            contactDetails:
              type: object
              title: DebtorContactDetails
              properties:
                firstName:
                  type: string
                  description: The first name of the consumer (can be different from the first name in the contact details)
                  example: Edsger
                  minLength: 1
                lastName:
                  type: string
                  description: The last name of the consumer (can be different from the last name in the contact details)
                  example: Dijkstra
                  minLength: 1
                phoneNumber:
                  type: string
                  description: The phone number of the consumer in E.164 format
                  pattern: ^\+[1-9][0-9]{1,14}$
                  example: '+31612345678'
                email:
                  type: string
                  description: The e-mail address of the consumer
                  format: email
                  example: edsger@domain.nl
                  minLength: 1
            shippingAddress:
              $ref: '#/components/schemas/IdealAddress'
            invoiceAddress:
              $ref: '#/components/schemas/IdealAddress'
    IdealTransactionId:
      description: |-
        The 16-digit transaction ID within the iDEAL scheme as known by the acquirer and issuing bank, and
        used in the credit transfer. The value can have leading zeros.
        This value is `null` if the status `FAILURE`.
      type:
        - string
        - 'null'
      minLength: 16
      maxLength: 16
      example: '1234567890123456'
    IdealTransaction:
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          required:
            - purchaseId
            - action
            - idealTransactionId
            - status
          properties:
            description:
              $ref: '#/components/schemas/IDEALDescription'
            status:
              description: |-
                The status of the transaction.

                **Note:** `AUTHORIZED` is a transient, non-final status that should not occur for iDEAL, since iDEAL is an instant payment method with no separate authorization step. In rare cases, it may briefly be observed before the status resolves to its final value. It should not be relied upon and does not indicate a final outcome.
              oneOf:
                - $ref: '#/components/schemas/StatusOpen'
                - $ref: '#/components/schemas/StatusSuccess'
                - $ref: '#/components/schemas/StatusCancelled'
                - $ref: '#/components/schemas/StatusExpired'
                - $ref: '#/components/schemas/StatusFailure'
                - $ref: '#/components/schemas/StatusAuthorized'
            purchaseId:
              $ref: '#/components/schemas/PurchaseID'
            action:
              type: object
              description: Next action to be performed by merchant (or consumer) to complete the payment.
              properties:
                redirect:
                  $ref: '#/components/schemas/RedirectAction'
            issuer:
              $ref: '#/components/schemas/BIC'
            requestUserToken:
              $ref: '#/components/schemas/IdealPayFastRequestUserToken'
            expectedDebtor:
              $ref: '#/components/schemas/IdealPayFastExpectedDebtor'
            notificationResult:
              type: string
              format: enum
              enum:
                - PUSH_SENT_SHOW_WAITING_SCREEN
                - REDIRECT
              description: |-
                The value `PUSH_SENT_SHOW_WAITING_SCREEN` indicates the issuer attempted to send the notification, and the Merchant should show a "waiting for notification"-screen to the Consumer. The value `REDIRECT` indicates the Consumer should be redirected to the `checkoutUrl` as with the normal iDEAL flow.

                This field is only returned when the Pay Fast flow was initiated using the `expectedDebtor`-field.
            consumer:
              $ref: '#/components/schemas/IdealConsumer'
            idealTransactionId:
              $ref: '#/components/schemas/IdealTransactionId'
    IdealPayFastUserToken-2:
      type: object
      required:
        - transactionId
        - userToken
      properties:
        transactionId:
          $ref: '#/components/schemas/TransactionId'
        userToken:
          $ref: '#/components/schemas/IdealPayFastUserToken'
    IDealPayFastDebtorPreferences:
      type: object
      required:
        - issuerName
        - issuerLogoUrl
        - maskedIban
      properties:
        issuerName:
          description: The name of the issuer bank.
          type: string
          minLength: 1
          maxLength: 36
          example: Test Bank
        issuerLogoUrl:
          description: The logo URL of the issuer bank.
          type: string
          format: uri
          example: https://ideal.ext/logos/issuer.png
        maskedIban:
          description: The masked consumer IBAN.
          type: string
          example: NL44RABO******6789
          minLength: 1
    AmountChangeable:
      description: Contains the minimum and maximum values for the amount of a QR code that a consumer can set themselves after scanning the code.
      type: object
      properties:
        min:
          description: Minimum of the amount. Must be higher than 0
          type: integer
          example: 1
        max:
          description: Maximum of the amount. Must be higher than the minimum and lower than 5000000.
          type: integer
          example: 50000
    IDEALQRReusable:
      description: Indicates the QR code's ability to accept multiple successful payments.
      type: boolean
      default: false
      example: false
    DefaultPageSize:
      $ref: '#/components/schemas/PaymentPageSize'
      minimum: 100
      maximum: 2000
      example: 200
    TransactionWebhookQREvents:
      description: |
        * `STATUS_CHANGE` - When the status of the transaction changes to any other value.
        * `QR_PAYMENT_CREATED` - When a new payment is created using the qr code.
        * `REFUND_STATUS` - Invoke webhook when a transaction receives an update on one of its requested refunds.
      type: string
      enum:
        - STATUS_CHANGE
        - QR_PAYMENT_CREATED
        - REFUND_STATUS
      example: STATUS_CHANGE
    TransactionWebhooksQR:
      $ref: '#/components/schemas/TransactionWebhooks'
      items:
        allOf:
          - type: object
            required:
              - url
              - events
            properties:
              url:
                description: The URL the request must be send to.
                type: string
                format: url
                example: https://yourdomain.tld/webhooks?purchaseId=order123
              events:
                description: The events when this URL must be requested.
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/TransactionWebhookQREvents'
    IdealQRPayment:
      allOf:
        - $ref: '#/components/schemas/Payment'
        - type: object
          required:
            - size
          properties:
            amountChangeable:
              $ref: '#/components/schemas/AmountChangeable'
            purchaseId:
              $ref: '#/components/schemas/PurchaseID'
            description:
              $ref: '#/components/schemas/IDEALDescription'
            reusable:
              $ref: '#/components/schemas/IDEALQRReusable'
            size:
              $ref: '#/components/schemas/DefaultPageSize'
            webhooks:
              $ref: '#/components/schemas/TransactionWebhooksQR'
    IdealQRTransaction:
      allOf:
        - type: object
          required:
            - id
            - reference
            - amount
            - currency
            - purchaseId
            - description
            - size
            - expiresAt
            - status
            - action
            - createdAt
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            amountChangeable:
              $ref: '#/components/schemas/AmountChangeable'
            reference:
              $ref: '#/components/schemas/Reference'
            amount:
              $ref: '#/components/schemas/Amount'
            currency:
              $ref: '#/components/schemas/Currency'
            purchaseId:
              $ref: '#/components/schemas/PurchaseID'
            description:
              $ref: '#/components/schemas/IDEALDescription'
            size:
              type: integer
              example: 200
            expiresAt:
              $ref: '#/components/schemas/Datetime'
            reusable:
              $ref: '#/components/schemas/IDEALQRReusable'
            language:
              $ref: '#/components/schemas/Language'
            webhooks:
              $ref: '#/components/schemas/TransactionWebhooksQR'
            status:
              description: The status of the transaction.
              oneOf:
                - $ref: '#/components/schemas/StatusOpen'
                - $ref: '#/components/schemas/StatusSuccess'
                - $ref: '#/components/schemas/StatusExpired'
            action:
              description: Next action to be performed by merchant (or consumer) to complete the payment.
              type: object
              properties:
                qrcode:
                  type: object
                  properties:
                    id:
                      description: ID of the QR Code known by the iDEAL QR Backend of CM.
                      type: string
                    url:
                      description: URL to QR code image to be scanned by consumer to perform the payment.
                      type: string
                      format: url
                      example: https://qrbackend.tld/images/213981209381209390821.png
                    href:
                      description: URL to which the QR code redirects to perform the payment.
                      type: string
                      format: url
                      example: https://payment-processing-platform.tld/pay/b6d53423-f45c-4e2a-93fd-5c43d351e389
            createdAt:
              $ref: '#/components/schemas/Datetime'
        - $ref: '#/components/schemas/ReturnURLOneOf'
    IdealQRPayment-2:
      type: object
      required:
        - payment
        - transaction
        - idealTransactionId
        - status
        - createdAt
      properties:
        payment:
          $ref: '#/components/schemas/Uuid'
        transaction:
          $ref: '#/components/schemas/Uuid'
        idealTransactionId:
          $ref: '#/components/schemas/IdealTransactionId'
          description: |-
            The 16-digit transaction ID within the iDEAL-QR scheme as known by the acquirer and issuing bank, and 
            used in the credit transfer. The value can have leading zeros.
            This value is `null` if the status `FAILURE`.
        status:
          oneOf:
            - $ref: '#/components/schemas/StatusFailure'
            - $ref: '#/components/schemas/StatusExpired'
            - $ref: '#/components/schemas/StatusCancelled'
            - $ref: '#/components/schemas/StatusSuccess'
        createdAt:
          $ref: '#/components/schemas/Datetime'
        amount:
          allOf:
            - $ref: '#/components/schemas/Amount'
            - description: |
                Denomination in the smallest currency subunit, as for example eurocents.
                Only present in successful payments.
        consumerName:
          description: Name of the consumer. Only present in successful payments.
          type: string
          example: John
        consumerBic:
          allOf:
            - $ref: '#/components/schemas/BIC'
            - description: Bank Identification Code. Only present in successful payments.
        consumerIban:
          description: IBAN of the consumer. Only present in successful payments.
          type: string
          example: NL24RABO8487376045
    IdealQRTransactionPaymentsPaginated:
      type: object
      required:
        - total
        - pageSize
        - payments
      properties:
        total:
          description: The total of payments that the order has
          type: integer
          example: 150
        pageSize:
          $ref: '#/components/schemas/PaymentPageSize'
        payments:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/IdealQRPayment-2'
    IdealQRTransactionPaymentsSummary:
      description: iDEAL-QR payments summary
      type: object
      properties:
        status:
          oneOf:
            - $ref: '#/components/schemas/StatusOpen'
            - $ref: '#/components/schemas/StatusSuccess'
            - $ref: '#/components/schemas/StatusFailure'
            - $ref: '#/components/schemas/StatusExpired'
            - $ref: '#/components/schemas/StatusCancelled'
        count:
          type: integer
          description: Number of payments with this status for the given transaction
          example: 2
        amount:
          allOf:
            - $ref: '#/components/schemas/Amount'
            - description: |
                Denomination in the smallest currency subunit, as for example eurocents.
                Only present in successful payments.
            - example: 1200
    IdealQRPaymentRefund:
      allOf:
        - $ref: '#/components/schemas/IdealQRPayment-2'
        - type: object
          properties:
            refunds:
              $ref: '#/components/schemas/Refunds'
    BulkDefaults:
      $ref: '#/components/schemas/IdealQRPayment'
      description: Contains default values to create an iDEAL-QR transaction in a bulk operation.
    BulkQrCodeItemInRequest:
      $ref: '#/components/schemas/IdealQRPayment'
      description: Contains values that will overwrite defaults when creating a set of iDEAL-QR transactions in a bulk operation.
    BulkQrCodesRequest:
      description: Array of qr code objects with values to overwrite defaults
      maximum: 100
      minimum: 1
      type: array
      items:
        $ref: '#/components/schemas/BulkQrCodeItemInRequest'
    QRCodeTransactionInBulkResponseItem:
      description: Details of the created iDEAL-QR transaction
      type: object
      properties:
        created:
          type: boolean
          default: true
        transaction:
          type: object
          required:
            - id
            - action
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
              description: ID of the transaction. It can be used to retrieve the details of an iDEAL-QR transaction by using it in combination with other endpoints provided in this API.
            action:
              description: Next action to be performed by merchant (or consumer) to complete the payment.
              type: object
              properties:
                qrcode:
                  type: object
                  properties:
                    id:
                      description: ID of the QR Code known by the iDEAL-QR backend of CM.com.
                      type: string
                    url:
                      description: URL to the iDEAL-QR code image to be scanned by the consumer to perform the payment.
                      type: string
                      format: url
                      example: https://qrbackend.tld/images/213981209381209390821.png
    BulkIdealQRCodeErrorResponseItem:
      description: provides details on errors while creating qr codes in bulk
      type: object
      properties:
        error:
          description: contains the details of an error
          type: object
          required:
            - id
            - message
          properties:
            id:
              type: string
              description: ID of the error
              example: 51365d8a-d3c1-4c5f-9556-e8d7ff383eee
            message:
              type: string
              description: message indicating details of the error
              example: Invalid request message
    ErrorInBulkResponseItem:
      allOf:
        - $ref: '#/components/schemas/BulkIdealQRCodeErrorResponseItem'
        - description: Details of the error about why the requested iDEAL-QR transaction could not be created in the bulk operation.
        - type: object
          properties:
            created:
              type: boolean
              default: false
    BulkIdealQRCodesInResponseItem:
      description: Contains details of an iDEAL-QR transaction created in bulk. In case of an error, in case of an error, it contains details of the error that prevented it from being created correctly.
      anyOf:
        - $ref: '#/components/schemas/QRCodeTransactionInBulkResponseItem'
        - $ref: '#/components/schemas/ErrorInBulkResponseItem'
    BulkIdealQRCodesResponseItem:
      description: provides details qr codes (created or not) in bulk
      type: object
      properties:
        qrcodes:
          description: Array that contains the details of the iDEAL-QR transactions in a bulk operation (created or not).
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/BulkIdealQRCodesInResponseItem'
    IN3Address:
      type: object
      description: The consumers address.
      allOf:
        - $ref: '#/components/schemas/Address'
        - description: |-
            The address of the consumer.
            It must include all required fields such as street, house number, postal code, city, and country code.
            If the shipping address is different from the billing address, it should be specified in the `shippingAddress` field.
          type: object
          required:
            - street
            - houseNumber
            - postalCode
            - city
            - countryCode
      properties:
        addressedTo:
          type: string
          maxLength: 250
          example: Scenius
          description: The name or entity which shall accept the package/invoice
        houseNumberSuffix:
          type: string
          maxLength: 25
          example: A
    Consumer-2:
      description: The person initiating the checkout, typically the buyer who places the order.
      allOf:
        - $ref: '#/components/schemas/GenderlessConsumer'
        - type: object
          required:
            - name
            - email
            - phone
            - shippingAddress
            - dateOfBirth
      properties:
        name:
          type: object
          required:
            - lastName
          properties:
            initials:
              description: Consumer's initials.
              type: string
              maxLength: 20
              example: J
            lastName:
              allOf:
                - $ref: '#/components/schemas/LastName'
                - type: string
                  maxLength: 250
        shippingAddress:
          $ref: '#/components/schemas/IN3Address'
        invoiceAddress:
          $ref: '#/components/schemas/IN3Address'
        business:
          type: object
          properties:
            name:
              type: string
              maxLength: 35
              example: CM
            cocNumber:
              type: string
              maxLength: 20
              example: '70528500'
    Item:
      description: |-
        Item object that can be used to provide details of the items in the order.
        This is only used by payment methods that support it, like Klarna and Riverty.
      type: object
      required:
        - code
        - unitPrice
        - quantity
        - vatAmount
        - vatRate
      properties:
        code:
          description: Merchant Product identification. Each item code must be unique per transaction.
          type: string
          minLength: 1
          maxLength: 50
          example: SDC4/32GB-2ADP
        description:
          description: A human readable description of the item.
          $ref: '#/components/schemas/Description'
        unitPrice:
          description: Unit price (including VAT) of the item, specified in the smallest currency subunit, as for example euro cents.
          $ref: '#/components/schemas/Amount'
        quantity:
          description: The number of items of this type.
          type: integer
          minimum: 1
          maximum: 1000000000
          example: 2
        vatAmount:
          description: |
            Total VAT amount of the orderline, specified in the smallest currency subunit as for example euro cents.
          $ref: '#/components/schemas/Amount'
        vatRate:
          description: |
            Percentage of VAT applied.
            Only the first decimal value will be taken into account, the rest will be ignored.
          type: number
          minimum: 0
          maximum: 99.9
          example: 20
          multipleOf: 0.1
    ItemName:
      description: A human readable name of the item.
      type: string
      maxLength: 50
      example: Kingston microSD 32GB
    IN3Items:
      description: |
        Items included in the order. We request both values 'vatAmount' and 'vatRate' to prevent errors.
      type: array
      minItems: 1
      maxItems: 512
      items:
        allOf:
          - $ref: '#/components/schemas/Item'
          - type: object
            required:
              - description
            properties:
              name:
                $ref: '#/components/schemas/ItemName'
              description:
                description: Additional item description.
                maxLength: 100
    In3Payment:
      allOf:
        - type: object
          required:
            - invoice
            - consumer
            - items
          properties:
            invoice:
              type: object
              required:
                - reference
                - amount
                - description
              properties:
                reference:
                  $ref: '#/components/schemas/Reference'
                amount:
                  $ref: '#/components/schemas/Amount'
                description:
                  $ref: '#/components/schemas/Description'
            expiresAt:
              allOf:
                - $ref: '#/components/schemas/Datetime'
                - description: ISO 8601 date and time. If left empty, the value defaults to 4 hours.
            consumer:
              $ref: '#/components/schemas/Consumer-2'
            items:
              $ref: '#/components/schemas/IN3Items'
            webhooks:
              $ref: '#/components/schemas/TransactionWebhooks'
        - $ref: '#/components/schemas/ReturnURLOneOf'
    StatusPending:
      description: The transaction is pending, meaning it could not be completed yet; waiting for something.
      type: string
      format: enum
      enum:
        - PENDING
      example: PENDING
    KlarnaDescription:
      maxLength: 100
    Items:
      description: |
        Items included in the order. We request both values 'vatAmount' and 'vatRate' to prevent errors.
      type: array
      minItems: 1
      maxItems: 512
      items:
        allOf:
          - $ref: '#/components/schemas/Item'
          - type: object
            properties:
              name:
                $ref: '#/components/schemas/ItemName'
              description:
                $ref: '#/components/schemas/KlarnaDescription'
              type:
                description: |
                  The type of order line item. Used by Klarna to classify the order line.
                type: string
                format: enum
                enum:
                  - PHYSICAL
                  - DIGITAL
                  - DISCOUNT
                  - GIFT_CARD
                  - STORE_CREDIT
                  - SHIPPING_FEE
                  - SALES_TAX
                  - SURCHARGE
                example: PHYSICAL
    KlarnaPayment:
      allOf:
        - $ref: '#/components/schemas/Payment'
        - type: object
          required:
            - language
            - items
            - consumer
          properties:
            expiresAt:
              allOf:
                - $ref: '#/components/schemas/Datetime'
                - description: ISO 8601 date and time. If a transaction is not finalized before this time the status becomes EXPIRED. If left empty, the value defaults to 48 hours.
            items:
              $ref: '#/components/schemas/Items'
            consumer:
              allOf:
                - $ref: '#/components/schemas/ConsumerBase'
                - type: object
                  required:
                    - name
                    - email
                    - address
                  properties:
                    address:
                      allOf:
                        - $ref: '#/components/schemas/Address'
                        - type: object
                          required:
                            - street
                            - houseNumber
                            - postalCode
                            - city
                            - countryCode
    KlarnaTransaction:
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          required:
            - country
            - items
            - action
            - status
          properties:
            status:
              oneOf:
                - $ref: '#/components/schemas/StatusOpen'
                - $ref: '#/components/schemas/StatusSuccess'
                - $ref: '#/components/schemas/StatusCancelled'
                - $ref: '#/components/schemas/StatusExpired'
                - $ref: '#/components/schemas/StatusFailure'
                - $ref: '#/components/schemas/StatusAuthorized'
            country:
              $ref: '#/components/schemas/Country'
            items:
              $ref: '#/components/schemas/Items'
            action:
              type: object
              description: Next action to be performed by merchant (or consumer) to complete the payment.
              properties:
                redirect:
                  $ref: '#/components/schemas/RedirectAction'
    AppleInitialize:
      type: object
      required:
        - reference
        - amount
        - description
        - language
      properties:
        reference:
          $ref: '#/components/schemas/Reference'
        description:
          description: |
            Description of the underlying value or reason of the session.
            Ultimately appears on the confirmation (statement and confirmation screen).
          type: string
          maxLength: 255
          example: Order at yourdomain.tld
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/Datetime'
            - description: ISO 8601 date and time. If left empty, the value defaults to 10 mins.
        language:
          $ref: '#/components/schemas/Language'
        consumer:
          $ref: '#/components/schemas/Consumer'
        webhooks:
          $ref: '#/components/schemas/SessionTransactionWebhooks'
        returnUrl:
          $ref: '#/components/schemas/ReturnUrl'
    ApplePaySessionObject:
      type: object
      required:
        - id
        - reference
        - amount
        - currency
        - description
        - expiresAt
        - language
        - status
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        reference:
          $ref: '#/components/schemas/Reference'
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        description:
          type: string
          example: Some Apple Pay session
        expiresAt:
          $ref: '#/components/schemas/Datetime'
        language:
          $ref: '#/components/schemas/Language'
        consumer:
          description: Consumer details. Only returned on session creation (POST). Not available on session retrieval (GET).
          allOf:
            - $ref: '#/components/schemas/Consumer'
        webhooks:
          $ref: '#/components/schemas/TransactionWebhooks'
        status:
          description: The status of the transaction.
          oneOf:
            - $ref: '#/components/schemas/StatusOpen'
            - $ref: '#/components/schemas/StatusSuccess'
            - $ref: '#/components/schemas/StatusCancelled'
            - $ref: '#/components/schemas/StatusExpired'
            - $ref: '#/components/schemas/StatusFailure'
            - $ref: '#/components/schemas/StatusAuthorized'
        action:
          description: |
            Contains the details necessary to render the Apple Pay button in your own checkout page during the initialize session flow.
            In consequent flows the action object will be null.
          anyOf:
            - type: 'null'
            - type: object
              properties:
                applePayButton:
                  type: object
                  properties:
                    merchantCountry:
                      description: The ISO 3166-1 alpha-2 country code where the transaction is processed.
                      type: string
                      example: NL
                    serverUrl:
                      description: The URL to the Mobile Pay Server.
                      type: string
                      example: https://www.example.com/api/
                    allowedCardNetworks:
                      description: The supported card networks for Payment via Apple Pay.
                      type: array
                      items:
                        type: string
                        enum:
                          - VISA
                          - MAESTRO
                          - MASTERCARD
                    merchantName:
                      description: The name to display on the payment sheet.
                      type: string
                      example: Your Merchant
        createdAt:
          $ref: '#/components/schemas/Datetime'
        returnUrl:
          $ref: '#/components/schemas/ReturnUrl'
    StartApplePaySession:
      type: object
      properties:
        validationUrl:
          description: The validation URL that is generated by the Apple device.
          type: string
          example: https://apple-pay-gateway-cert.apple.com/paymentservices/startSession
        displayName:
          description: The name to display on the payment sheet. You get this information from the initialize endpoint.
          type: string
          example: My merchant commercial name
        domainName:
          description: The domain of the website on which the session will occur. The value must match the domain from which the request is started. If there is a mismatch between this field and the domain that the Apple device determined, then the Apple Pay session will be terminated by the Apple device (with a generic error message or nothing happens).
          type: string
          example: https://app-domain.tld
    ApplePayTransactionObject:
      type: object
      required:
        - id
        - sessionId
        - expiresAt
        - status
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        sessionId:
          $ref: '#/components/schemas/Uuid'
        expiresAt:
          $ref: '#/components/schemas/Datetime'
        webhooks:
          $ref: '#/components/schemas/TransactionWebhooks'
        status:
          description: The status of the transaction.
          oneOf:
            - $ref: '#/components/schemas/StatusOpen'
            - $ref: '#/components/schemas/StatusSuccess'
            - $ref: '#/components/schemas/StatusCancelled'
            - $ref: '#/components/schemas/StatusExpired'
            - $ref: '#/components/schemas/StatusFailure'
            - $ref: '#/components/schemas/StatusAuthorized'
        action:
          description: Next action to be performed by merchant (or consumer) to complete the transaction. Only present when 3DS authentication is required.
          anyOf:
            - type: 'null'
            - type: object
              properties:
                redirect:
                  type: object
                  properties:
                    url:
                      description: URL where consumer should be redirected to by the merchant to perform the transaction. This url is only available when a card payment has been started
                      type: string
                      format: url
                      example: https://checkout.tld/3ds/v2/creditcard/123
        createdAt:
          $ref: '#/components/schemas/Datetime'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
    AuthorizeApplePayTransaction:
      type: object
      properties:
