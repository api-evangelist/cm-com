          $ref: '#/components/schemas/RefundReason'
        items:
          $ref: '#/components/schemas/RivertyItems'
    ClientSideEncryptionElement:
      type: object
      properties:
        cseUrl:
          description: The URL that contains the script to encrypt the user payment data in your site.
          type: string
          example: https://app-domain.tld/libraries/ps/cse/80117cdb-be80-425f-954d-9696102efa60
        upstream:
          type: string
          example: ps
    ClientSideEncryption:
      description: Client side encryption libraries per payment method.
      type: object
      properties:
        bancontact:
          $ref: '#/components/schemas/ClientSideEncryptionElement'
        creditcard:
          $ref: '#/components/schemas/ClientSideEncryptionElement'
    MerchantOrderReference:
      type: string
      maxLength: 35
      description: Unique identifier, as known by the merchant. This value will end up in the payments portal.
    CheckoutConsumer:
      allOf:
        - $ref: '#/components/schemas/Consumer'
        - type: object
          properties:
            givenName:
              type: string
              maxLength: 35
              description: First name of the consumer.
            middleName:
              type: string
              maxLength: 35
              description: Middle name of the consumer.
            familyName:
              type: string
              maxLength: 35
              description: Last name of the consumer.
            address:
              $ref: '#/components/schemas/AddressWithStateAndAdditionalData'
    MaxRetries:
      description: |
        Maximum number of payment attempts allowed for this checkout order.
        **Values:**
        - **null or omitted**: Defaults to 0 (no retry limit, skip UI with single payment method)
        - **0**: No retry limit enforcement. When combined with a single payment method, the hosted checkout will skip the payment method selection screen and redirect the customer directly to the payment method (e.g., iDEAL, PayPal). Useful for external integrations that have their own checkout UI.
        - **1-255**: Enforces retry limit. After exceeding this number of failed payment attempts, the checkout will be locked out with status `LOCKED_OUT`. The payment method selection screen will be shown normally, even with a single payment method.

        **Use Cases:**
        - **External integrations**: Set to 0 to enable seamless redirect from external checkout to payment provider
        - **Fraud prevention**: Set to 3-5 to limit retry attempts and prevent abuse
        - **Standard checkout**: Set to 10-255 for generous retry limits with fraud protection

        **Important**: `maxRetries=0` does NOT mean "lock out immediately". It means "allow unlimited retries without lockout enforcement".
      type: integer
      minimum: 0
      maximum: 255
      example: 10
    PaymentMethods:
      type: array
      description: List of payment methods used in the checkout. If not provided all available payment methods will be shown.
      items:
        type: string
        enum:
          - apple_pay
          - bancontact
          - bank_transfer
          - creditcard
          - google_pay
          - ideal
          - klarna
          - paypal
          - in3
    OrderItems:
      $ref: '#/components/schemas/Items'
      description: 'Items included in the order. Required field for the following payment methods: Klarna, Riverty. We request both values ''vatAmount'' and ''vatRate'' to prevent errors.'
    CreateCheckout:
      allOf:
        - $ref: '#/components/schemas/Payment'
        - type: object
          required:
            - description
            - merchantOrderReference
            - language
          properties:
            expiresAt:
              allOf:
                - $ref: '#/components/schemas/Datetime'
                - description: ISO 8601 date and time. If a transaction is not finalized before this time the status becomes EXPIRED. If left empty, the value defaults to 30 mins.
            amount:
              description: |-
                Denomination in the smallest currency subunit, as for example eurocents.
                Ignored (although required) for requests that include items (e.g. Klarna). In this cases the total amount is calculated internally using item prices.
            merchantOrderReference:
              $ref: '#/components/schemas/MerchantOrderReference'
            consumer:
              $ref: '#/components/schemas/CheckoutConsumer'
            maxRetries:
              $ref: '#/components/schemas/MaxRetries'
            paymentMethods:
              $ref: '#/components/schemas/PaymentMethods'
            orderItems:
              $ref: '#/components/schemas/OrderItems'
            webhooks:
              $ref: '#/components/schemas/TransactionWebhooksWithChargeback'
            description:
              maxLength: 35
    CheckoutQRCodeAction:
      type: object
      required:
        - url
      description: Action to be performed by the consumer to complete the payment by scanning a QR code that leads to the same hosted checkout session as the redirect action.
      properties:
        url:
          description: URL to a QR code image encoding the hosted checkout session URL, to be scanned by the consumer. Append a `.png`, `.jpg`, or `.svg` extension to select the image output format; if omitted or unrecognized, `png` is returned.
          type: string
          format: url
          example: https://checkout.gateway.acceptance.cmpayments.nl/checkout/qr/1da50859-59ad-4d7d-a6ac-8554a2f981bc
    CreateCheckout-2:
      allOf:
        - $ref: '#/components/schemas/TransactionWithoutOrderId'
        - type: object
          required:
            - status
            - action
            - expiresAt
            - merchantOrderReference
          properties:
            merchantOrderReference:
              $ref: '#/components/schemas/MerchantOrderReference'
            consumer:
              $ref: '#/components/schemas/CheckoutConsumer'
            status:
              description: The status of the transaction.
              oneOf:
                - $ref: '#/components/schemas/StatusOpen'
                - $ref: '#/components/schemas/StatusSuccess'
                - $ref: '#/components/schemas/StatusCancelled'
                - $ref: '#/components/schemas/StatusExpired'
                - $ref: '#/components/schemas/StatusFailure'
                - $ref: '#/components/schemas/StatusAuthorized'
                - $ref: '#/components/schemas/StatusPending'
            action:
              type: object
              description: Next action to be performed by merchant (or consumer) to complete the payment.
              properties:
                redirect:
                  $ref: '#/components/schemas/RedirectAction'
                qrcode:
                  $ref: '#/components/schemas/CheckoutQRCodeAction'
            paymentMethods:
              $ref: '#/components/schemas/PaymentMethods'
            orderItems:
              $ref: '#/components/schemas/OrderItems'
            maxRetries:
              $ref: '#/components/schemas/MaxRetries'
            refunds:
              $ref: '#/components/schemas/Refunds'
    CheckoutPayments:
      type: object
      properties:
        payments:
          type: array
          description: List of payments created for this checkout.
          items:
            type: object
            description: Payment details. Multiple payment attempts will be returned.
            required:
              - id
              - type
              - status
              - createdAt
            properties:
              id:
                $ref: '#/components/schemas/TransactionId'
              type:
                type: string
                description: The payment method used for this payment attempt.
                enum:
                  - apple_pay
                  - bancontact
                  - bank_transfer
                  - creditcard
                  - google_pay
                  - ideal
                  - klarna
                  - paypal
                  - in3
              status:
                description: The status of the payment attempt.
                oneOf:
                  - $ref: '#/components/schemas/StatusOpen'
                  - $ref: '#/components/schemas/StatusSuccess'
                  - $ref: '#/components/schemas/StatusCancelled'
                  - $ref: '#/components/schemas/StatusExpired'
                  - $ref: '#/components/schemas/StatusFailure'
                  - $ref: '#/components/schemas/StatusAuthorized'
                  - $ref: '#/components/schemas/StatusPending'
              createdAt:
                $ref: '#/components/schemas/Datetime'
    TransactionWebhookEvent:
      description: |
        * `STATUS_CHANGE` - When the status of the transaction changes to any other value.
        * `PAYMENT_CREATED` - When a new payment is created for the transaction.
        * `TRANSACTION_CREATED` - When a new transaction is created for a session (used by Google Pay and Apple Pay).
        * `REFUND_STATUS` - Invoke webhook when a transaction receives an update on one of its requested refunds.
        * `CHARGEBACK_STATUS` - Invoke webhook when a transaction receives an update on one of its chargebacks.
        * `FINALSTATUS` - This value is deprecated and shouldn't be used anymore. Use `STATUS_CHANGE` instead.
      type: string
      enum:
        - STATUS_CHANGE
        - PAYMENT_CREATED
        - TRANSACTION_CREATED
        - REFUND_STATUS
        - CHARGEBACK_STATUS
        - FINALSTATUS
      example: STATUS_CHANGE
    TransactionEvent:
      description: Event send by CM.com after a change on a transaction.
      type: object
      required:
        - transaction
        - event
        - reference
        - createdAt
      properties:
        transaction:
          $ref: '#/components/schemas/TransactionId'
        event:
          $ref: '#/components/schemas/TransactionWebhookEvent'
        reference:
          $ref: '#/components/schemas/Reference'
        createdAt:
          $ref: '#/components/schemas/Datetime'
          description: Time when the event occurred.
        refundID:
          $ref: '#/components/schemas/Uuid'
          description: Unique identifier of the refund the event relates to. Only present on `REFUND_STATUS` events.
        chargebackID:
          $ref: '#/components/schemas/Uuid'
          description: Unique identifier of the chargeback the event relates to. Only present on `CHARGEBACK_STATUS` events.
    iDEALQRPaymentEvent:
      allOf:
        - $ref: '#/components/schemas/TransactionEvent'
        - type: object
          properties:
            event:
              $ref: '#/components/schemas/TransactionWebhookQREvents'
            payment:
              $ref: '#/components/schemas/Uuid'
              description: Unique identifier for an iDEAL-QR payment.
      description: Event send by CM.com after a change on an iDEAL-QR transaction.
    TransactionWebhookBancontactEvents:
      description: |
        * `STATUS_CHANGE` - When the status of the transaction changes to any other value.
        * `PAYMENT_CREATED` - When a new payment is created for the BanContact order.
        * `REFUND_STATUS` - Invoke webhook when a transaction receives an update on one of its requested refunds.
        * `FINALSTATUS` - This value is deprecated and shouldn't be used anymore. Use `STATUS_CHANGE` instead.
      type: string
      enum:
        - STATUS_CHANGE
        - PAYMENT_CREATED
        - REFUND_STATUS
        - FINALSTATUS
      example: STATUS_CHANGE
    BancontactPaymentEvent:
      allOf:
        - $ref: '#/components/schemas/TransactionEvent'
        - type: object
          properties:
            event:
              $ref: '#/components/schemas/TransactionWebhookBancontactEvents'
            payment:
              $ref: '#/components/schemas/Uuid'
              description: Unique identifier for a BanContact payment.
      description: Event sent by CM.com after a payment is created on a BanContact transaction.
    SessionEvent:
      description: 'Event sent by CM.com for session-based payment flows (Google Pay, Apple Pay). In this model a session groups one or more payment transactions: `sessionID` identifies the checkout session (order) and `transactionID` identifies the individual payment within it.'
      type: object
      required:
        - sessionID
        - event
        - reference
        - createdAt
      properties:
        sessionID:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Unique identifier for the session. Present for `TRANSACTION_CREATED`, `STATUS_CHANGE`, and `PAYMENT_CREATED` events.
        event:
          $ref: '#/components/schemas/TransactionWebhookEvent'
        reference:
          $ref: '#/components/schemas/Reference'
        createdAt:
          $ref: '#/components/schemas/Datetime'
