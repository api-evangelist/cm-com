  /entrance/v2.0/scan/{entrancePlanUuid}/analytics/logs:
    get:
      operationId: ScanAnalyticsController_getScanLogs_v2.0
      parameters:
      - name: order
        required: false
        in: query
        schema:
          default: ASC
          type: string
          enum:
          - ASC
          - DESC
      - name: page
        required: false
        in: query
        schema:
          minimum: 1
          default: 1
          type: number
      - name: take
        required: false
        in: query
        schema:
          minimum: 1
          maximum: 5000
          default: 25
          type: number
      - name: search
        required: false
        in: query
        description: Returns only records that match the search query. Searches in most common fields such as name, description and for tickets all visitor data.
        schema:
          minLength: 1
          maxLength: 255
          type: string
      - name: statusCodes
        required: false
        in: query
        description: Comma separated values for scan status codes
        schema:
          example: 200,401
          type: string
      - name: entrancePlanIds
        required: false
        in: query
        description: Comma separated values for entrance plan uuids
        schema:
          example: 00000000-0000-0000-0000-000000000000,00000000-0000-0000-0000-000000000000
          type: string
      - name: deviceIds
        required: false
        in: query
        description: Comma separated values for device ids
        schema:
          example: 872HA,AH84A
          type: string
      - name: ticketIds
        required: false
        in: query
        description: Comma separated values for ticket ids
        schema:
          example: 00000000-0000-0000-0000-000000000000,00000000-0000-0000-0000-000000000000
          type: string
      - name: orderIds
        required: false
        in: query
        description: Comma separated values for order ids
        schema:
          example: CM12345678,CM0000001
          type: string
      - name: productIds
        required: false
        in: query
        description: Comma separated values for product ids
        schema:
          example: 00000000-0000-0000-0000-000000000000,00000000-0000-0000-0000-000000000000
          type: string
      - name: eventIds
        required: false
        in: query
        description: Comma separated values for event ids
        schema:
          example: 00000000-0000-0000-0000-000000000000,00000000-0000-0000-0000-000000000000
          type: string
      - name: scannedAtStart
        required: true
        in: query
        description: scannedAt start date (ISO format)
        schema:
          format: date-time
          example: '2024-12-03T12:00:00.000Z'
          type: string
      - name: scannedAtEnd
        required: true
        in: query
        description: scannedAt end date (ISO format)
        schema:
          format: date-time
          example: '2024-12-03T23:00:00.000Z'
          type: string
      - name: includeRelatedEntrancePlans
        required: false
        in: query
        description: When true, include scan logs from the entire entrance plan collection the requested plan belongs to (its related plans across the collection) instead of only the requested entrance plan. Only affects entrance-plan-scoped requests; ignored for organisation-scoped requests.
        schema:
          example: true
          type: boolean
      - name: entrancePlanUuid
        required: true
        in: path
        schema: {}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageDto'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ScanLog'
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - cookie: []
      summary: List scan logs for an entrance plan
      tags:
      - Scanning
    servers:
    - url: https://api.cm.com
components:
  schemas:
    AnalyticsWidgetResponseDto:
      type: object
      properties:
        currentVisitors:
          type: number
          readOnly: true
        totalVisitors:
          type: number
          readOnly: true
        totalCheckouts:
          type: number
          readOnly: true
        showUpPercentage:
          type: number
          readOnly: true
        totalTickets:
          type: number
          readOnly: true
        otherTickets:
          type: number
          readOnly: true
      required:
      - currentVisitors
      - totalVisitors
      - totalCheckouts
      - showUpPercentage
      - totalTickets
      - otherTickets
    OrderScanResultTicketDto:
      type: object
      properties:
        barcode:
          type: string
          readOnly: true
          example: CMLQFLGRPA
        ulid:
          type: string
          readOnly: true
          example: 01J96A3A77SVXJKRZNGV386Q7G
        outcome:
          type: string
          enum:
          - COMMITTED
          - SKIPPED
          - FAILED
          example: COMMITTED
        scanStatusCode:
          type: number
          enum:
          - 100
          - 200
          - 201
          - 300
          - 301
          - 400
          - 401
          - 402
          - 403
          - 404
          - 405
          - 406
          - 407
          - 408
          - 409
          - 410
          - 411
          - 412
          - 413
          example: 200
        scanMessage:
          type: string
          readOnly: true
          example: Successfully checked in.
        scanColour:
          type: string
          readOnly: true
          example: '#3ddc97'
        name:
          type: string
          readOnly: true
          example: Jane Doe
        productName:
          type: string
          readOnly: true
          example: VIP Ticket
        venueSectionName:
          type: string
          readOnly: true
          example: Northside Stand
      required:
      - barcode
      - ulid
      - outcome
      - scanStatusCode
      - scanMessage
      - scanColour
      - name
      - productName
      - venueSectionName
    OrderScanResultSummaryDto:
      type: object
      properties:
        total:
          type: number
          example: 4
        committed:
          type: number
          example: 3
        skipped:
          type: number
          example: 1
        failed:
          type: number
          example: 0
      required:
      - total
      - committed
      - skipped
      - failed
    OrderScanPreviewDto:
      type: object
      properties:
        orderId:
          type: string
          readOnly: true
          example: ORDER-12345
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/OrderScanTicketDto'
        summary:
          $ref: '#/components/schemas/OrderScanSummaryDto'
      required:
      - orderId
      - tickets
      - summary
    PageMetaDto:
      type: object
      properties:
        page:
          type: number
        take:
          type: number
        skip:
          type: number
        itemCount:
          type: number
        pageCount:
          type: number
        hasPreviousPage:
          type: boolean
        hasNextPage:
          type: boolean
      required:
      - page
      - take
      - skip
      - itemCount
      - pageCount
      - hasPreviousPage
      - hasNextPage
    OrderScanResultDto:
      type: object
      properties:
        orderId:
          type: string
          readOnly: true
          example: ORDER-12345
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/OrderScanResultTicketDto'
        summary:
          $ref: '#/components/schemas/OrderScanResultSummaryDto'
      required:
      - orderId
      - tickets
      - summary
    Condition:
      type: object
      properties:
        uuid:
          type: string
          maxLength: 36
          example: 00000000-0000-0000-0000-000000000000
        name:
          type: string
          maxLength: 255
          example: 'Scan Condition: Must be scanned once on entrance plan X'
        subject:
          type: string
          enum:
          - SUCCESS_SCANS_AMOUNT
          - TODAY_SUCCESS_SCANS_AMOUNT
          - IS_CHECKED_IN
          example: SUCCESS_SCANS_AMOUNT
        operator:
          type: string
          enum:
          - EQUALS
          - NOT_EQUALS
          - CONTAINS
          - NOT_CONTAINS
          - GREATER_THAN
          - GREATER_THAN_OR_EQUAL_TO
          - LOWER_THAN
          - LOWER_THAN_OR_EQUAL_TO
          - STARTS_WITH
          - ENDS_WITH
          - IS_BEFORE
          - IS_AFTER
          example: GREATER_THAN
        value:
          description: Value to compare the condition operator to.
          oneOf:
          - type: string
          - type: number
          - type: boolean
          - type: object
          example: 1
        entrancePlanId:
          type: string
          maxLength: 255
          example: 00000000-0000-0000-0000-000000000000
          description: uuid of entrance plan the condition applies to
        ruleId:
          type: string
          maxLength: 255
          example: 00000000-0000-0000-0000-000000000000
          description: uuid of rule the condition applies to
      required:
      - uuid
      - name
      - subject
      - operator
      - value
    CreateCheckOutDto:
      type: object
      properties:
        ulid:
          type: string
          maxLength: 26
          example: 01J96A3A77SVXJKRZNGV386Q7G
          description: Unique (ULID) identifier of a scan
        scannedValue:
          type: string
          maxLength: 255
          example: CMLQFLGRPA
          description: Value (barcode) to be validated in the scan api
        deviceId:
          type: string
          maxLength: 5
          example: 9UY8H
          description: Generated identifier of the device
        deviceLabel:
          type: string
          maxLength: 25
          example: Entrance Scanner 1
          description: Custom label of the device
        revalidate:
          type: boolean
          example: true
          default: false
          description: Boolean to determine whether the barcode is valid again after checkout (default false).
      required:
      - ulid
      - scannedValue
      - deviceId
      - deviceLabel
      - revalidate
    EntrancePlan:
      type: object
      properties:
        uuid:
          type: string
          maxLength: 36
          example: 00000000-0000-0000-0000-000000000000
        name:
          type: string
          maxLength: 255
          example: Main Entrance
        description:
          type: string
          maxLength: 255
          example: Entrance plan for main entrance
        isDefault:
          type: boolean
          description: Marks an entrancePlan as default plan.
        isActive:
          type: boolean
          description: Sets an entrancePlan as active/inactive.
        startAt:
          format: date-time
          type: string
        endAt:
          format: date-time
          type: string
        scanMode:
          type: string
          enum:
          - OFFLINE_SYNC
          - ONLINE
          example: OFFLINE_SYNC
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - NO_RULES
          example: ACTIVE
        children:
          type: array
          items:
            type: object
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        venues:
          type: array
          items:
            $ref: '#/components/schemas/Venue'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        organisation:
          type: object
      required:
      - uuid
      - name
      - isDefault
      - isActive
      - scanMode
    Product:
      type: object
      properties:
        uuid:
          type: string
          maxLength: 36
          example: 00000000-0000-0000-0000-000000000000
        externalId:
          type: string
          maxLength: 255
          example: 00000000-0000-0000-0000-000000000000
        name:
          type: string
          maxLength: 255
          example: Entrance Ticket
        productType:
          type: string
          enum:
          - REGULAR
          - BOX_OFFICE
          - GUEST_LIST
          - NON_ENTRY_PRODUCT
          example: REGULAR
      required:
      - uuid
      - externalId
      - name
      - productType
    ScanResultDto:
      type: object
      properties:
        ulid:
          type: string
          readOnly: true
          example: 01J96GHPJP8TKGTHCYP6V6HVAR
        scannedValue:
          type: string
          readOnly: true
          example: CMLQFLGRPA
        scannedAt:
          format: date-time
          type: string
          readOnly: true
        scanStatusCode:
          type: number
          description: Result of the scan
          enum:
          - 100
          - 200
          - 201
          - 300
          - 301
          - 400
          - 401
          - 402
          - 403
          - 404
          - 405
          - 406
          - 407
          - 408
          - 409
          - 410
          - 411
          - 412
          - 413
          example: 200
        scanMessage:
          type: string
          readOnly: true
          example: Barcode successfully checked in
        errorDetails:
          type: object
          readOnly: true
        scanColour:
          type: string
          description: Hex colour code to be used for the checkin
          example: '#3ddc97'
        deviceId:
          type: string
          description: Generated identifier of the device
          example: 9UY8G
        deviceLabel:
          type: string
          description: Custom label of the device
          example: Scanner Entrance 1
        name:
          type: string
          readOnly: true
          example: Jane Doe
        productName:
          type: string
          readOnly: true
          example: VIP Ticket
        venueSectionName:
          type: string
          readOnly: true
