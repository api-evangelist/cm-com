openapi: 3.2.0
info:
  title: Cm Com Scanning API
  contact: {}
  license:
    name: Proprietary
    url: https://www.cm.com
  version: '1.0'
  description: 'Operations tagged Scanning across 2 of this provider''s published API definitions: cm-com-live-entrance-management-v1-openapi.yml, cm-com-live-entrance-management-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.cm.com
security:
- cookie: []
tags:
- name: Scanning
  description: Scan API for barcode scanning, validate, check-in, and check-out operations
paths:
  /entrance/v1.0/scan/plans:
    get:
      operationId: ScanController_findAllByUser_v1.0
      parameters:
      - name: order
        required: false
        in: query
        schema:
          default: ASC
          type: string
          enum:
          - ASC
          - DESC
      - name: page
        required: false
        in: query
        schema:
          minimum: 1
          default: 1
          type: number
      - name: take
        required: false
        in: query
        schema:
          minimum: 1
          maximum: 5000
          default: 25
          type: number
      - name: search
        required: false
        in: query
        description: Returns only records that match the search query. Searches in most common fields such as name, description and for tickets all visitor data.
        schema:
          minLength: 1
          maxLength: 255
          type: string
      - name: includePastEntrancePlans
        required: false
        in: query
        description: If true, includes entrance plans whose events have all ended. Default is false (past entrance plans are excluded).
        schema:
          example: false
          type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageDto'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/EntrancePlan'
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - cookie: []
      summary: List entrance plans for the current user
      tags:
      - Scanning
    servers:
    - url: https://api.cm.com
  /entrance/v1.0/scan/plans/{entrancePlanUuid}:
    get:
      operationId: ScanController_findPlan_v1.0
      parameters:
      - name: entrancePlanUuid
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntrancePlan'
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - cookie: []
      summary: Get an entrance plan by UUID
      tags:
      - Scanning
    servers:
    - url: https://api.cm.com
