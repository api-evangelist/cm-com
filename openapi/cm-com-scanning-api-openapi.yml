          minimum: 1
          maximum: 5000
          default: 25
          type: number
      - name: search
        required: false
        in: query
        description: Returns only records that match the search query. Searches in most common fields such as name, description and for tickets all visitor data.
        schema:
          minLength: 1
          maxLength: 255
          type: string
      - name: uuids
        required: false
        in: query
        description: Comma separated values for ticket uuid
        schema:
          example: 00000000-0000-0000-0000-000000000000
          type: string
      - name: externalIds
        required: false
        in: query
        description: Comma separated values for ticket externalId
        schema:
          example: 00000000-0000-0000-0000-000000000000
          type: string
      - name: products
        required: false
        in: query
        description: Comma separated values for product externalId
        schema:
          example: 00000000-0000-0000-0000-000000000000
          type: string
      - name: events
        required: false
        in: query
        description: Comma separated values for event externalId
        schema:
          example: 00000000-0000-0000-0000-000000000000
          type: string
      - name: venueSections
        required: false
        in: query
        description: Comma separated values for venueSection externalId
        schema:
          example: 00000000-0000-0000-0000-000000000000
          type: string
      - name: constraints
        required: false
        in: query
        description: Comma separated values for constraint externalId
        schema:
          example: 00000000-0000-0000-0000-000000000000
          type: string
      - name: imports
        required: false
        in: query
        description: Comma separated values for importId
        schema:
          example: 00000000-0000-0000-0000-000000000000
          type: string
      - name: saleOrigins
        required: false
        in: query
        description: Comma separated values for ticket saleOrigin
        schema:
          example: SHOP,GUEST_LIST
          type: string
      - name: scannedAtStart
        required: true
        in: query
        description: scannedAt start date (ISO format)
        schema:
          format: date-time
          example: '2024-12-03T12:00:00.000Z'
          type: string
      - name: scannedAtEnd
        required: true
        in: query
        description: scannedAt end date (ISO format)
        schema:
          format: date-time
          example: '2024-12-03T23:00:00.000Z'
          type: string
      - name: status
        required: false
        in: query
        description: Filter tickets by their derived scan status
        schema:
          type: string
          enum:
          - CHECKED_IN
          - REMAINING
          - ERRORS
      - name: ticketStatus
        required: false
        in: query
        description: Filter tickets by their stored validity status (VALID / INVALID)
        schema:
          type: string
          enum:
          - VALID
          - INVALID
      - name: entrancePlanUuid
        required: true
        in: path
        schema: {}
      responses:
        '200':
