          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - cookie: []
      summary: Get organisation details
      tags:
      - Organisations
    patch:
      operationId: OrganisationsController_patch_v1.0
      parameters:
      - name: organisationUuid
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganisationDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organisation'
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - cookie: []
      summary: Update an organisation
      tags:
      - Organisations
    delete:
      operationId: OrganisationsController_remove_v1.0
      parameters:
      - name: organisationUuid
        required: true
        in: path
        schema:
          type: string
      responses:
        '204':
          description: ''
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - cookie: []
      summary: Delete an organisation
      tags:
      - Organisations
    servers:
    - url: https://api.cm.com
  /entrance/v1.0/organisations/{organisationUuid}/features:
    get:
      operationId: OrganisationsController_findFeatures_v1.0
      parameters:
      - name: organisationUuid
        required: true
        in: path
