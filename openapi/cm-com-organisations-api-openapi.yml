          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureStateDto'
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - cookie: []
      summary: Enable or disable a feature for an organisation
      tags:
      - Organisations
    servers:
    - url: https://api.cm.com
