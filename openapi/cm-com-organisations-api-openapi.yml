        schema:
          enum:
          - INTERSOLVE
          - PUBLIQ
          - GLOBAL_TICKET
          - CHECK_IN_ENTIRE_ORDER
          - TIMESLOTS
          - ANALYTICS_REPORT
          - OFFLINE_SYNC_TODAYS_TIMESLOTS
          - VENUE_LINKING
          - TICKET_IMPORT
          - GO_CITY
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFeatureDto'
      responses:
