components:
  schemas:
    OrganisationWithConfigDto:
      type: object
      properties:
        uuid:
          type: string
          readOnly: true
          example: 00000000-0000-0000-0000-000000000000
        cmAccountGuid:
          type: string
          readOnly: true
          example: 00000000-0000-0000-0000-000000000000
        cmTicketingTechnicalLinkUuid:
          type: string
          readOnly: true
          example: 00000000-0000-0000-0000-000000000000
        name:
          type: string
          readOnly: true
          example: CM.com NV
        email:
          type: string
          readOnly: true
          example: myOrganisation@cm.com
        upstreamPlatform:
          type: string
          readOnly: true
          enum:
          - ENMA_SUBSCRIBER
          - GENERAL_ADMISSION
          - SEATED_TICKETING
          - GLOBAL_TICKET
          - INTERSOLVE
          - PUBLIQ
          - YOURTICKETPROVIDER
          - PASS_TEST
          - PASS_NATIONAAL_MILITAIR_MUSEUM
          - PASS_WEC
          - PASS_CENTRAAL_MUSEUM
          - PHOENIX_DES_LUMIERES
          - PORT_DES_LUMIERES
          - SMOOTHR_DEMO_ACCOUNT
          - ENTRANCE_MANAGEMENT
          - STICHTING_KONINKLIJKE_DEFENSIEMUSEA
          - ELECTRIC_IBIZA_ENTERTAINMENT
          - MOMICE_KLM_OPEN
          - CUSTOMER_DATA_PLATFORM
          - GO_CITY
          example: GLOBAL_TICKET
        claims:
          type: array
          example:
          - EDITOR
          - ADMIN
          items:
            type: string
            enum:
            - OBSERVER
            - EDITOR
            - OWNER
            - ADMIN
            - SCAN_USER
            - SCAN_CHECKIN
            - SCAN_CHECKOUT
            - SCAN_CLICKER_CHECKIN
            - SCAN_CLICKER_CHECKOUT
            - SCAN_SEARCH
            - SCAN_VALIDATE
            - SCAN_ANALYTICS
        features:
          type: array
          example:
          - INTERSOLVE
          items:
            type: string
            enum:
            - INTERSOLVE
            - PUBLIQ
            - GLOBAL_TICKET
            - CHECK_IN_ENTIRE_ORDER
            - TIMESLOTS
            - ANALYTICS_REPORT
            - OFFLINE_SYNC_TODAYS_TIMESLOTS
            - VENUE_LINKING
            - TICKET_IMPORT
            - GO_CITY
        settings:
          example:
          - key: SWA_ANALYTICS_PRESET
            config:
              filterDateOption: TODAY
              filterPreset:
                filterTimeslots: true
          type: array
          items:
            $ref: '#/components/schemas/OrganisationSettingDto'
        configurations:
          readOnly: true
          type: array
          items:
            type: string
      required:
      - configurations
    UserDto:
      type: object
      properties:
        uuid:
          type: string
          readOnly: true
        cmPersonGuid:
          type: string
          readOnly: true
        firstName:
          type: string
          readOnly: true
        lastName:
          type: string
          readOnly: true
        username:
          type: string
          readOnly: true
        email:
          type: string
          readOnly: true
        entrancePlanClaims:
          type: array
          items:
            type: string
            enum:
            - OBSERVER
            - EDITOR
            - OWNER
            - ADMIN
            - SCAN_USER
            - SCAN_CHECKIN
            - SCAN_CHECKOUT
            - SCAN_CLICKER_CHECKIN
            - SCAN_CLICKER_CHECKOUT
            - SCAN_SEARCH
            - SCAN_VALIDATE
            - SCAN_ANALYTICS
      required:
      - uuid
      - cmPersonGuid
      - firstName
      - lastName
      - username
      - email
      - entrancePlanClaims
    UpstreamPlatformEnum:
      type: string
      enum:
      - ENMA_SUBSCRIBER
      - GENERAL_ADMISSION
      - SEATED_TICKETING
      - GLOBAL_TICKET
      - INTERSOLVE
      - PUBLIQ
      - YOURTICKETPROVIDER
      - PASS_TEST
      - PASS_NATIONAAL_MILITAIR_MUSEUM
      - PASS_WEC
      - PASS_CENTRAAL_MUSEUM
      - PHOENIX_DES_LUMIERES
      - PORT_DES_LUMIERES
      - SMOOTHR_DEMO_ACCOUNT
      - ENTRANCE_MANAGEMENT
      - STICHTING_KONINKLIJKE_DEFENSIEMUSEA
      - ELECTRIC_IBIZA_ENTERTAINMENT
      - MOMICE_KLM_OPEN
      - CUSTOMER_DATA_PLATFORM
      - GO_CITY
      description: The upstream platform for which this configuration is intended
    ErrorDto:
      type: object
      properties:
        errorCode:
          type: number
          example: 400100
          description: Error code specific to the error, consisting of a three digit http status code and a digit application specific code.
        description:
          type: string
          maxLength: 255
          example: Description of the error.
        httpStatus:
          type: number
          enum:
          - 100
          - 101
          - 102
          - 103
          - 200
          - 201
          - 202
          - 203
          - 204
          - 205
          - 206
          - 207
          - 208
          - 210
          - 300
          - 301
          - 302
          - 303
          - 304
          - 307
          - 308
          - 400
          - 401
          - 402
          - 403
          - 404
          - 405
          - 406
          - 407
          - 408
          - 409
          - 410
          - 411
          - 412
          - 413
          - 414
          - 415
          - 416
          - 417
          - 418
          - 421
          - 422
          - 423
          - 424
          - 428
          - 429
          - 456
          - 500
          - 501
          - 502
          - 503
          - 504
          - 505
          - 507
          - 508
          example: 400
      required:
      - errorCode
      - description
      - httpStatus
    UpdateFeatureDto:
      type: object
      properties:
        enabled:
          type: boolean
          example: true
          description: Enable or disable the feature for the organisation.
        config:
          type: object
          additionalProperties: true
          description: Free-form configuration for the feature. When omitted, any existing config is preserved.
      required:
      - enabled
