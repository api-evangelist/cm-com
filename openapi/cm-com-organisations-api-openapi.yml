openapi: 3.2.0
info:
  title: Cm Com Organisations API
  contact: {}
  license:
    name: Proprietary
    url: https://www.cm.com
  version: '1.0'
  description: 'Operations tagged Organisations across 2 of this provider''s published API definitions: cm-com-live-entrance-management-v1-openapi.yml, cm-com-live-entrance-management-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.cm.com
security:
- cookie: []
tags:
- name: Organisations
  description: Organisation management
paths:
  /entrance/v1.0/organisations:
    post:
      operationId: OrganisationsController_create_v1.0
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganisationDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organisation'
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - cookie: []
      summary: Create a new organisation
      tags:
      - Organisations
    get:
      operationId: OrganisationsController_findAllByUser_v1.0
      parameters:
      - name: order
        required: false
        in: query
        schema:
          default: ASC
          type: string
          enum:
          - ASC
          - DESC
      - name: page
        required: false
        in: query
        schema:
          minimum: 1
          default: 1
          type: number
      - name: take
        required: false
        in: query
        schema:
          minimum: 1
          maximum: 5000
          default: 25
          type: number
      - name: search
        required: false
        in: query
        description: Returns only records that match the search query. Searches in most common fields such as name, description and for tickets all visitor data.
        schema:
          minLength: 1
          maxLength: 255
          type: string
      - name: cmAccountGuids
        required: false
        in: query
        description: Comma separated values for CM Account Id
        schema:
          example: 00000000-0000-0000-0000-000000000000
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageDto'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Organisation'
        4XX:
          description: The request could not be processed. The body contains a standardized error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - cookie: []
      summary: List organisations for current user
      tags:
      - Organisations
    servers:
    - url: https://api.cm.com
  /entrance/v1.0/organisations/{organisationUuid}:
    get:
      operationId: OrganisationsController_findOne_v1.0
      parameters:
      - name: organisationUuid
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationWithConfigDto'
        4XX:
