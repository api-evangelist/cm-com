        required: false
        in: query
        description: Include users with claims on entrance plans (only) in the resultset
        schema:
          type: boolean
      - name: claims
        required: false
        in: query
        description: Comma separated values for claims
        schema:
          example:
          - OBSERVER
          - EDITOR
          type: array
          items:
            type: string
            enum:
            - OBSERVER
            - EDITOR
            - OWNER
            - ADMIN
            - SCAN_USER
            - SCAN_CHECKIN
            - SCAN_CHECKOUT
            - SCAN_CLICKER_CHECKIN
            - SCAN_CLICKER_CHECKOUT
            - SCAN_SEARCH
            - SCAN_VALIDATE
            - SCAN_ANALYTICS
      - name: invitationStatus
        required: false
        in: query
        description: Comma separated values for invitation status
        schema:
          example:
          - INVITED
          type: array
          items:
            type: string
            enum:
            - ACCEPTED
            - INVITED
            - REVOKED
            - EXPIRED
      - name: organisationUuid
        required: true
        in: path
        schema: {}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageDto'
                - properties:
