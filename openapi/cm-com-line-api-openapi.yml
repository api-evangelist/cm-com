openapi: 3.2.0
info:
  title: Channels Line API
  description: Check channel availability and manage onboarding for SMS, WhatsApp, RCS, and other supported channels.
  version: v1
  license:
    name: Proprietary
    url: https://www.cm.com
servers:
- url: https://api.cm.com
  description: Production Server
security:
- ProductToken: []
tags:
- name: Line
paths:
  /channels/v1/accounts/{accountId}/line/{channelRequestId}/account:
    get:
      tags:
      - Line
      summary: Get a Line account
      operationId: Line_GetLineAccountAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineAccount'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineAccount'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineAccount'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineAccount'
    post:
      tags:
      - Line
      summary: Adds a Line account
      operationId: Line_AddLineAccountAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Created
  /channels/v1/accounts/{accountId}/line/{channelRequestId}/account/forminput:
    get:
      tags:
      - Line
      summary: Get a Line account's form input
      operationId: Line_GetLineAccountFormInputAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiChannelRequestFormInputResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiChannelRequestFormInputResponse'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiChannelRequestFormInputResponse'
            multipart/form-data:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiChannelRequestFormInputResponse'
  /channels/v1/accounts/{accountId}/line/{channelRequestId}/account/{lineAccountId}/forminput:
    put:
      tags:
      - Line
      summary: Adds the Line account form input asynchronous
      operationId: Line_AddLineAccountFormInputAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: lineAccountId
        in: path
        description: The line account identifier.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        $ref: '#/components/requestBodies/CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequestArray'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineAccount'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineAccount'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineAccount'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineAccount'
  /channels/v1/accounts/{accountId}/line/{channelRequestId}/notifyServices:
    get:
      tags:
      - Line
      summary: Gets the line notify services asynchronous
      operationId: Line_GetLineNotifyServicesAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: q
        in: query
        description: The q.
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: The status.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - ACTIVE
            - PENDING
            - ELIGIBLE
            - NOT_VALIDATED
            - CUSTOMER_ACTION_REQUIRED
            - EXPIRED
            - REJECTED
            - CANCELLED
            - DELETED
      - name: skip
        in: query
        description: The skip.
        required: false
        schema:
          type: integer
          format: int32
      - name: take
        in: query
        description: The take.
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineNotifyServiceBase'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineNotifyServiceBase'
    post:
      tags:
      - Line
      summary: Adds the line notify service asynchronous
      operationId: Line_AddLineNotifyServiceAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        $ref: '#/components/requestBodies/CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineNotifyServiceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineNotifyService'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineNotifyService'
  /channels/v1/accounts/{accountId}/line/{channelRequestId}/notifyServices/{notifyServiceId}:
    get:
      tags:
      - Line
      summary: Gets the line notify service asynchronous
      operationId: Line_GetLineNotifyServiceAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: notifyServiceId
        in: path
        description: The notify service identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineNotifyService'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineNotifyService'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineNotifyService'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineNotifyService'
    put:
      tags:
      - Line
      summary: Updates the line notify service asynchronous
      operationId: Line_UpdateLineNotifyServiceAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: notifyServiceId
        in: path
        description: The notify service identifier.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        $ref: '#/components/requestBodies/CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineNotifyServiceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineNotifyService'
            text/json:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineNotifyService'
            text/xml:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineNotifyService'
            multipart/form-data:
              schema:
                $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineNotifyService'
    delete:
      tags:
      - Line
      summary: Deletes the line notify service asynchronous
      operationId: Line_DeleteLineNotifyServiceAsync
      parameters:
      - name: accountId
        in: path
        description: The account identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: channelRequestId
        in: path
        description: The channel request identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: notifyServiceId
        in: path
        description: The notify service identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: NoContent
components:
  schemas:
    CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineNotifyServiceBase:
      required:
      - id
      - accountId
      - gmoStoreId
      - isActive
      - isPending
      - approvedOnUtc
      - createdOnUtc
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        accountId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        notifyServiceID:
          format: int32
          type: integer
        notifyServiceName:
          type: string
        gmoStoreId:
          format: int32
          type: integer
        isActive:
          type: boolean
        entityStatus:
          enum:
          - ACTIVE
          - PENDING
          - ELIGIBLE
          - NOT_VALIDATED
          - CUSTOMER_ACTION_REQUIRED
          - EXPIRED
          - REJECTED
          - CANCELLED
          - DELETED
          type: string
        isPending:
          type: boolean
        approvedOnUtc:
          format: date-time
          type: string
        createdOnUtc:
          format: date-time
          type: string
        rejectedOnUtc:
          format: date-time
          type: string
        cancelledOnUtc:
          format: date-time
          type: string
        deletedOnUtc:
          format: date-time
          type: string
    CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequest:
      type: object
      properties:
        formElementId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        inputValue:
          type: string
    CM.Platform.Channels.Models.RequestForms.ApiChannelRequestFormInputResponse:
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        channelCategoryRequestID:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        formElementId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        inputValue:
          type: string
        createdOnUtc:
          format: date-time
          type: string
    CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineNotifyServiceRequest:
      required:
      - gmoStoreId
      type: object
      properties:
        notifyServiceID:
          format: int32
          type: integer
        notifyServiceName:
          type: string
        gmoStoreId:
          format: int32
          type: integer
    CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineNotifyService:
      required:
      - id
      - accountId
      - gmoStoreId
      - isActive
      - isPending
      - approvedOnUtc
      - createdOnUtc
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        channelId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        accountId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        notifyServiceID:
          format: int32
          type: integer
        notifyServiceName:
          type: string
        gmoStoreId:
          format: int32
          type: integer
        isActive:
          type: boolean
        entityStatus:
          enum:
          - ACTIVE
          - PENDING
          - ELIGIBLE
          - NOT_VALIDATED
          - CUSTOMER_ACTION_REQUIRED
          - EXPIRED
          - REJECTED
          - CANCELLED
          - DELETED
          type: string
        isPending:
          type: boolean
        approvedOnUtc:
          format: date-time
          type: string
        createdOnUtc:
          format: date-time
          type: string
        rejectedOnUtc:
          format: date-time
          type: string
        cancelledOnUtc:
          format: date-time
          type: string
        deletedOnUtc:
          format: date-time
          type: string
        rejectionReason:
          type: string
    CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineAccount:
      required:
      - id
      - accountId
      - channelRequestId
      - isPending
      - createdOnUtc
      type: object
      properties:
        id:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        accountId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        channelRequestId:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        isPending:
          type: boolean
        cancelledOnUtc:
          format: date-time
          type: string
        fulfilledOnUtc:
          format: date-time
          type: string
        createdOnUtc:
          format: date-time
          type: string
        entityStatus:
          enum:
          - ACTIVE
          - PENDING
          - ELIGIBLE
          - NOT_VALIDATED
          - CUSTOMER_ACTION_REQUIRED
          - EXPIRED
          - REJECTED
          - CANCELLED
          - DELETED
          type: string
  requestBodies:
    CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequestArray:
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequest'
        text/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequest'
        text/xml:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequest'
        multipart/form-data:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequest'
        application/x-www-form-urlencoded:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CM.Platform.Channels.Models.RequestForms.ApiRequestFormInputRequest'
      description: The form input.
      required: true
    CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineNotifyServiceRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineNotifyServiceRequest'
        text/json:
          schema:
            $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineNotifyServiceRequest'
        text/xml:
          schema:
            $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineNotifyServiceRequest'
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineNotifyServiceRequest'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/CM.Platform.Channels.Models.ChannelTypes.Line.ApiLineNotifyServiceRequest'
      description: The line notify service.
      required: true
  securitySchemes:
    ProductToken:
      type: apiKey
      description: Product token for authentication. Obtain from your CM.com dashboard under Messaging > Product Tokens.
      name: producttoken
      in: header
